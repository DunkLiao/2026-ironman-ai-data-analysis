<!DOCTYPE html>
<html lang="zh-TW" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Day25 - 問答複習卡</title>
  <!-- KaTeX for LaTeX rendering -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
  <style>
    :root {
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --primary-light: #eff6ff;
      --border-color: #e2e8f0;
      --success: #10b981;
      --success-light: #ecfdf5;
      --accent: #f59e0b;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
      --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.08), 0 2px 4px -2px rgba(0,0,0,0.05);
      --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.1), 0 4px 6px -4px rgba(0,0,0,0.05);
      --radius: 12px;
    }

    html[data-theme="dark"] {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #60a5fa;
      --primary-hover: #3b82f6;
      --primary-light: #1e3a8a33;
      --border-color: #334155;
      --success: #34d399;
      --success-light: #064e3b33;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans TC", sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      line-height: 1.6;
      padding-bottom: 60px;
    }

    /* Navigation / Header */
    header {
      background: var(--card-bg);
      border-bottom: 1px solid var(--border-color);
      position: sticky;
      top: 0;
      z-index: 50;
      box-shadow: var(--shadow-sm);
    }

    .header-container {
      max-width: 900px;
      margin: 0 auto;
      padding: 14px 20px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .nav-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 8px;
      background: var(--primary-light);
      color: var(--primary);
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      transition: all 0.2s;
    }

    .back-btn:hover {
      background: var(--primary);
      color: #fff;
    }

    .page-title {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .view-toggles {
      display: flex;
      background: var(--bg-color);
      padding: 3px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
    }

    .header-actions {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: flex-end;
    }

    .toggle-btn {
      padding: 6px 14px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .toggle-btn.active {
      background: var(--card-bg);
      color: var(--primary);
      box-shadow: var(--shadow-sm);
    }

    .theme-toggle {
      padding: 7px 12px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      background: var(--card-bg);
      color: var(--text-main);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: var(--shadow-sm);
      transition: border-color 0.2s, color 0.2s, background 0.2s;
    }

    .theme-toggle:hover {
      border-color: var(--primary);
      color: var(--primary);
    }

    /* Main Container */
    main {
      max-width: 900px;
      margin: 24px auto;
      padding: 0 20px;
    }

    /* Toolbar */
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 20px;
      align-items: center;
      justify-content: space-between;
    }

    .search-box {
      flex: 1;
      min-width: 240px;
      position: relative;
    }

    .search-box input {
      width: 100%;
      padding: 10px 14px 10px 38px;
      border-radius: 10px;
      border: 1px solid var(--border-color);
      background: var(--card-bg);
      color: var(--text-main);
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-box input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-light);
    }

    .search-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 14px;
    }

    .action-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background: var(--card-bg);
      color: var(--text-main);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn:hover {
      background: var(--border-color);
    }

    .btn.active-filter {
      background: var(--primary-light);
      border-color: var(--primary);
      color: var(--primary);
    }

    /* Stats bar */
    .stats-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      font-size: 14px;
      color: var(--text-muted);
    }

    .progress-bar-container {
      flex: 1;
      height: 8px;
      background: var(--border-color);
      border-radius: 99px;
      margin: 0 16px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: var(--success);
      width: 0%;
      transition: width 0.3s ease;
    }

    /* List View Cards */
    .qa-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .qa-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      box-shadow: var(--shadow-sm);
      overflow: hidden;
      transition: box-shadow 0.2s, border-color 0.2s;
    }

    .qa-card:hover {
      box-shadow: var(--shadow-md);
      border-color: #cbd5e1;
    }

    .qa-card.mastered {
      border-left: 4px solid var(--success);
    }

    .qa-header {
      padding: 16px 20px;
      display: flex;
      align-items: flex-start;
      gap: 12px;
      cursor: pointer;
      user-select: none;
    }

    .qa-id {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 28px;
      height: 28px;
      background: var(--primary-light);
      color: var(--primary);
      border-radius: 6px;
      font-size: 13px;
      font-weight: 700;
      margin-top: 2px;
      flex-shrink: 0;
    }

    .qa-question {
      flex: 1;
      font-size: 15px;
      font-weight: 600;
      color: var(--text-main);
      padding-top: 2px;
    }

    .qa-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .master-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 18px;
      padding: 4px;
      border-radius: 6px;
      transition: transform 0.15s, color 0.15s;
    }

    .master-btn:hover {
      transform: scale(1.15);
    }

    .master-btn.is-mastered {
      color: var(--accent);
    }

    .expand-icon {
      color: var(--text-muted);
      font-size: 14px;
      transition: transform 0.2s ease;
    }

    .qa-card.open .expand-icon {
      transform: rotate(180deg);
    }

    .qa-answer {
      display: none;
      padding: 16px 20px 18px 60px;
      background: var(--bg-color);
      border-top: 1px dashed var(--border-color);
      font-size: 15px;
      color: var(--text-main);
      line-height: 1.7;
    }

    .qa-card.open .qa-answer {
      display: block;
      animation: fadeIn 0.2s ease-in;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Flashcard Mode */
    .flashcard-container {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      padding: 10px 0;
    }

    .flashcard-wrapper {
      perspective: 1000px;
      width: 100%;
      max-width: 640px;
      min-height: 340px;
      cursor: pointer;
    }

    .flashcard-inner {
      position: relative;
      width: 100%;
      height: 100%;
      min-height: 340px;
      text-align: center;
      transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
      transform-style: preserve-3d;
      border-radius: 16px;
      box-shadow: var(--shadow-lg);
    }

    .flashcard-wrapper.flipped .flashcard-inner {
      transform: rotateY(180deg);
    }

    .flashcard-face {
      position: absolute;
      width: 100%;
      height: 100%;
      min-height: 340px;
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 30px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      box-sizing: border-box;
    }

    .flashcard-back {
      transform: rotateY(180deg);
      background: var(--card-bg);
      border: 2px solid var(--primary);
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      color: var(--text-muted);
    }

    .card-badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 99px;
      font-weight: 600;
      font-size: 12px;
    }

    .badge-q {
      background: var(--primary-light);
      color: var(--primary);
    }

    .badge-a {
      background: var(--success-light);
      color: var(--success);
    }

    .card-body {
      margin: auto 0;
      padding: 20px 10px;
      font-size: 18px;
      font-weight: 600;
      line-height: 1.6;
    }

    .card-hint {
      font-size: 12px;
      color: var(--text-muted);
    }

    .flashcard-controls {
      display: flex;
      gap: 12px;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 640px;
    }

    .flashcard-controls .btn {
      padding: 10px 20px;
      font-size: 14px;
      font-weight: 600;
    }

    .btn-primary {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    .btn-primary:hover {
      background: var(--primary-hover);
    }

    .shortcuts-hint {
      font-size: 12px;
      color: var(--text-muted);
      text-align: center;
      margin-top: 8px;
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
      background: var(--card-bg);
      border-radius: var(--radius);
      border: 1px dashed var(--border-color);
    }
  </style>
</head>
<body>
  <header>
    <div class="header-container">
      <div class="nav-left">
        <a href="index.html" class="back-btn" title="回目錄">← 目錄</a>
        <h1 class="page-title">Day25 問答卡</h1>
      </div>
      <div class="header-actions">
        <button class="theme-toggle" id="themeToggleBtn" type="button" onclick="toggleTheme()" aria-label="切換為深色模式">深色模式</button>
        <div class="view-toggles">
          <button id="listViewBtn" class="toggle-btn active" onclick="switchMode('list')">📋 列表模式</button>
          <button id="cardViewBtn" class="toggle-btn" onclick="switchMode('card')">🎴 翻卡測驗</button>
        </div>
      </div>
    </div>
  </header>

  <main>
    <div class="toolbar">
      <div class="search-box">
        <span class="search-icon">🔍</span>
        <input type="text" id="searchInput" placeholder="搜尋問題或答案關鍵字..." oninput="handleSearch()">
      </div>
      <div class="action-buttons">
        <button class="btn" id="filterMasteredBtn" onclick="toggleFilterMastered()">⭐ 只看未掌握</button>
        <button class="btn" id="expandAllBtn" onclick="toggleExpandAll()">展開全部</button>
        <button class="btn" onclick="shuffleCards()">🔀 隨機洗牌</button>
        <button class="btn" onclick="resetOrder()">🔄 恢復順序</button>
      </div>
    </div>

    <div class="stats-bar">
      <span id="statsCount">總計 0 題</span>
      <div class="progress-bar-container">
        <div id="progressFill" class="progress-fill"></div>
      </div>
      <span id="statsMastered">掌握率 0%</span>
    </div>

    <!-- List View -->
    <div id="qaList" class="qa-list"></div>

    <!-- Flashcard Mode View -->
    <div id="flashcardContainer" class="flashcard-container">
      <div class="flashcard-wrapper" id="flashcardWrapper" onclick="flipCard()">
        <div class="flashcard-inner">
          <!-- Front Face -->
          <div class="flashcard-face flashcard-front">
            <div class="card-top">
              <span class="card-badge badge-q">問題</span>
              <span id="fcCardNumber">卡片 1 / 1</span>
              <button class="master-btn" id="fcMasterBtn" onclick="toggleCardMaster(event)" title="標記為已掌握">★</button>
            </div>
            <div class="card-body" id="fcQuestion">載入中...</div>
            <div class="card-hint">💡 點擊卡片或按空白鍵翻面看答案</div>
          </div>
          <!-- Back Face -->
          <div class="flashcard-face flashcard-back">
            <div class="card-top">
              <span class="card-badge badge-a">解答</span>
              <span id="fcCardNumberBack">卡片 1 / 1</span>
              <button class="master-btn" id="fcMasterBtnBack" onclick="toggleCardMaster(event)" title="標記為已掌握">★</button>
            </div>
            <div class="card-body" id="fcAnswer">載入中...</div>
            <div class="card-hint">💡 再次點擊卡片翻回正面</div>
          </div>
        </div>
      </div>

      <div class="flashcard-controls">
        <button class="btn" onclick="prevCard()">← 上一題</button>
        <button class="btn btn-primary" onclick="flipCard()">翻轉卡片</button>
        <button class="btn" onclick="nextCard()">下一題 →</button>
      </div>
      <div class="shortcuts-hint">鍵盤快速鍵：[←] 上一題 · [空白鍵] 翻面 · [→] 下一題 · [M] 標記掌握</div>
    </div>
  </main>

  <script>
    const THEME_STORAGE_KEY = "qa_theme";
    const STORAGE_KEY = "anki_mastered_" + "Day25";
    const RAW_DATA = [{"id":1,"question":"在信用風險研究中，使用受監督的大語言模型框架處理文檔的主要目的是什麼？","answer":"從非結構化科學論文中自動提取模型、性能指標和驗證類型等結構化數據。"},{"id":2,"question":"受監督框架（Supervised Framework）相對於一般大語言模型提取，在哪兩個錯誤指標上表現更低？","answer":"幻覺（Hallucination）和遺漏（Omission）錯誤。"},{"id":3,"question":"在 Cojocaru 等人的框架中，用於檢測科學論文中表格邊界和單元格的特定模型是什麼？","answer":"Table Transformer（在 PubTables-1M 數據集上訓練）。"},{"id":4,"question":"Cojocaru 框架中，「元數據塊」（Metadata block）評估指標包含哪四個核心字段？","answer":"標題（Title）、作者（Authors）、年份（Year）和 DOI。"},{"id":5,"question":"在受監督框架的評估中，「忠實度」（Faithfulness）衡量的是什麼？","answer":"提取的信息與源文本內容的匹配程度。"},{"id":6,"question":"在受監督框架的評估中，「完整性」（Completeness）衡量的是什麼？","answer":"所有必需的數據元素是否都已存在於輸出中。"},{"id":7,"question":"Cojocaru 框架中，處理長文檔時為了保持語義連續性，將文本分成了什麼樣的片段？","answer":"重疊的文本段（Overlapping text segments）。"},{"id":8,"question":"框架中使用的「Map Reduce」程序的具體作用是什麼？","answer":"確定性地合併重疊內容，並確保各字段的一致性。"},{"id":9,"question":"為什麼在該框架中要對源文件進行 SHA-256 哈希處理？","answer":"為了確保非冗餘性，並實現從原始 PDF 到結果的全程追蹤。"},{"id":10,"question":"根據研究結果，決定大語言模型自動數據提取可靠性的關鍵因素是什麼？","answer":"結構化監督（Structured supervision）而非模型容量（Model scale）。"},{"id":11,"question":"計算綜合加權得分的公式為 $\\frac{M_{meta} + M_{models} + M_{refs}}{3}$，其中 $M_{refs}$ 代表什麼？","answer":"規範化的參考文獻塊均值（Normalized references block mean）。"},{"id":12,"question":"叡揚資訊開發的 Deep OCR 技術主要協助金融業處理哪種文件？","answer":"財務報表（Financial Statements）。"},{"id":13,"question":"Deep OCR 技術相對於傳統 OCR 的核心改進是什麼？","answer":"能讀取掃描結果，將非結構化資料轉為結構化資料，快速匯入徵授信系統。"},{"id":14,"question":"企業在考慮導入 AI 時應考量的「SPACE」架構中，「S」代表什麼？","answer":"安全（Security）。"},{"id":15,"question":"企業在考慮導入 AI 時應考量的「SPACE」架構中，「P」代表什麼？","answer":"痛點（Pain）。"},{"id":16,"question":"企業在考慮導入 AI 時應考量的「SPACE」架構中，「A」代表什麼？","answer":"應用範圍（Application）。"},{"id":17,"question":"企業在考慮導入 AI 時應考量的「SPACE」架構中，「C」代表什麼？","answer":"算力（Computing power）。"},{"id":18,"question":"企業在考慮導入 AI 時應考量的「SPACE」架構中，「E」代表什麼？","answer":"升級與成本（Enhance and expense）。"},{"id":19,"question":"叡揚團隊在導入 AI 前，通常會進行為期一個月的什麼程序？","answer":"概念性驗證（PoC, Proof of Concept）。"},{"id":20,"question":"若 AI 演算法沒有持續進行哪種學習或升級，其準確率可能會下降？","answer":"增量學習（Incremental learning）。"},{"id":21,"question":"Luo 研究中，金融監管智能助手系統的三個層級分別是什麼？","answer":"數據層（Data layer）、模型層（Model layer）和應用層（Application layer）。"},{"id":22,"question":"監管問答模組中，「解釋性查詢」（Interpretive inquiries）的主要目的是什麼？","answer":"澄清監管法律條文的含義。"},{"id":23,"question":"監管問答模組中，「適用性問題」（Applicability questions）旨在確定什麼？","answer":"特定條款是否適用於特定的個案。"},{"id":24,"question":"Luo 的系統中，哪種技術被用來根據權威源材料生成準確的回答？","answer":"檢索增強生成（RAG, Retrieval Augmented Generation）。"},{"id":25,"question":"問答模組中，「程序性查詢」（Procedural queries）主要涉及哪些內容？","answer":"申報要求和截止日期。"},{"id":26,"question":"Luo 的研究中，為了減少幻覺問題，系統執行了哪三種層級的驗證？","answer":"詞彙重疊測試、語義蘊涵模型和一致性檢查器。"},{"id":27,"question":"風險篩選模組中，信用風險的具體指標「不良貸款率」定義為何？","answer":"不良貸款（NPLs）佔總貸款的比例。"},{"id":28,"question":"風險篩選模組中，「撥備覆蓋率」（Provision Coverage Ratio）定義為何？","answer":"貸款損失準備與不良貸款的比例。"},{"id":29,"question":"流動性風險指標中，「LCR」的全稱及定義為何？","answer":"流動性覆蓋率；高質量流動性資產與淨現金流出的比例。"},{"id":30,"question":"風險篩選模組如何處理來自財務報告敘述部分的「非結構化數據」？","answer":"通過命名實體識別、情感分析和關係提取來獲取風險信號。"},{"id":31,"question":"情感分析在管理層討論部分的作用是什麼？","answer":"評估語氣，負面情感可能作為財務困境的領先指標。"},{"id":32,"question":"Luo 系統如何解決風險模型的「黑箱」問題？","answer":"由大語言模型生成解釋，說明貢獻得分的主要風險因素和建議措施。"},{"id":33,"question":"Luo 實驗結果顯示，大語言模型輔助使監管問題的響應時間減少了多少？","answer":"82.6%。"},{"id":34,"question":"綜合監管效率指數（CEI）權重分配中，哪一項佔比最高（30%）？","answer":"準確性（Accuracy）。"},{"id":35,"question":"在 Luo 的研究中，什麼是「全自動化率」（Full automation rate）？","answer":"無需人工干預即可通過驗證並直接發布的查詢比例。"},{"id":36,"question":"風險篩選模組對操作風險事件的早期預警平均提前了多少天？","answer":"61.2 天。"},{"id":37,"question":"在監管問答中，「比較性問題」（Comparative questions）之所以響應時間最長，是因為需要什麼？","answer":"需要進行更複雜的多文檔綜合分析。"},{"id":38,"question":"綜合監管效率指數的四個構成指標分別為何？","answer":"及時性（Timeliness）、準確性（Accuracy）、覆蓋範圍（Coverage）和員工效率（Staff efficiency）。"},{"id":39,"question":"計算第 $t$ 期綜合監管效率指數的公式為 $CEI_t = \\sum_{d=1}^{4} w_d \\cdot \\frac{X_{d,t}}{X_{d,0}} \\times 100$，其中 $X_{d,0}$ 代表什麼？","answer":"基準期（第 0 期）第 $d$ 個指標的數值。"},{"id":40,"question":"在處理財務報表識別時，印章（Stamps）和浮水印（Watermarks）會造成什麼影響？","answer":"會干擾文字辨識，需要額外處理。內容。"},{"id":41,"question":"為什麼 Luo 的系統選擇在私有雲（Private cloud）中部署，而非使用商業 API？","answer":"出於數據隱私和安全考慮，所有數據不得發送到外部。"},{"id":42,"question":"Luo 的系統中，「分層服務模型」（Tiered service model）的目的是什麼？","answer":"用小型蒸餾模型處理簡單查詢，全規模模型處理複雜查詢，以降低運營成本。"},{"id":43,"question":"在信用風險論文提取中，「模型/指標對」（Models/metric pairs）衡量的是什麼？","answer":"特定模型與其對應性能結果的關聯準確性。"},{"id":44,"question":"受監督框架中的「邏輯驗證」（Logical validation）流程負責檢查什麼？","answer":"驗證所有必需字段是否存在且邏輯上是否有效。"},{"id":45,"question":"對於低質量的掃描 PDF（如 Ohlson 論文），受監督系統會如何處理？","answer":"識別 OCR 限制並將其記錄在備註字段中，避免生成虛假數據。"},{"id":46,"question":"在 Luo 的研究中，「雙重差分法」（Difference in Differences, DID）模型的作用是什麼？","answer":"通過排除隨時間變化的因素和群體間的共同趨勢，分離出淨處理效應。"},{"id":47,"question":"市場風險指標中，「風險價值」（VaR）的定義是什麼？","answer":"在 99% 置信水平下的最大預期損失。"},{"id":48,"question":"操作風險指標中，「系統停機時間」（System Downtime）衡量的是什麼？","answer":"每季度的累計系統中斷小時數。"},{"id":49,"question":"合規風險指標中，「整改及時性」（Remediation Timeliness）的數據來源通常為何？","answer":"內部審計（Internal audits）。"},{"id":50,"question":"在信用風險框架中，「參考文獻 F1 分數」是基於哪一對數據計算的？","answer":"作者與年份對（Author/year pairs）。"},{"id":51,"question":"在 Luo 的實驗中，控制組（Control Group）是由哪兩個部門組成的？","answer":"證券監管部和保險監管部。"},{"id":52,"question":"在問答驗證中，「語義蘊涵模型」（Semantic entailment model）的作用是什麼？","answer":"確認生成的答案是否在邏輯上受檢索到的證據支持。"},{"id":53,"question":"財務風險評估模型中，「事件歸一化」（Event normalization）的目的是什麼？","answer":"將不同來源的公告、新聞和報告整合到統一的時間軸上。"},{"id":54,"question":"在大規模文檔處理中，「Token Aware Chunking」的主要功能是什麼？","answer":"根據模型的 Token 限制對文檔進行切片，同時保留語義內容。"},{"id":55,"question":"根據 Luo 的報告，大語言模型輔助使監管人員的平均每日有效工作量增加了多少倍？","answer":"2.8 倍。"},{"id":56,"question":"在受監督框架圖示中，哪一個步驟產生了「schema JSON」輸出？","answer":"大語言模型提取（LLM Extraction）步驟。"},{"id":57,"question":"在可靠性雷達圖中，除了 JSON 效度外，哪一項指標反映了系統直接對接業務的潛力？","answer":"自動化就緒度（Ease of Automation）。"},{"id":58,"question":"為什麼在受監督模型中，無法確定的數據應留空而非填充？","answer":"為了維護事實準確性並避免幻覺（Hallucinations）。"},{"id":59,"question":"Luo 研究中的「相關性提取」（Relation extraction）技術有助於構建什麼網絡？","answer":"實體間的風險敞口網絡（Exposure networks）。"},{"id":60,"question":"「單一登錄」（SSO）在監管系統部署中的意義是什麼？","answer":"確保使用與現有流程一致的訪問控制規則。"},{"id":61,"question":"叡揚資訊提到，AI 模型每過一兩年就需要定期進行什麼操作，以防止準確率下降？","answer":"定期升級演算法或重新建模。"},{"id":62,"question":"在風險篩選中，「異常檢測」（Anomaly detection）主要針對文本中的什麼現象？","answer":"與歷史常規顯著偏離的文本模式（如風險披露中的異常措辭）。"},{"id":63,"question":"Luo 實驗中，處理組的人員專業背景與控制組相比如何？","answer":"基準特徵（學歷、工作經驗）相似，無顯著統計學差異。"},{"id":64,"question":"對於「比較性查詢」，系統需要區分什麼？","answer":"多個不同的監管選項或條款之間的差異。"},{"id":65,"question":"監管效率指數中的「及時性」（Timeliness）指標具體定義為何？","answer":"從提交監管諮詢到發布最終答覆的時間。"},{"id":66,"question":"在大語言模型輔助下，監管人員的「工作滿意度」發生了什麼變化？","answer":"從 3.2 顯著提升至 4.1。"},{"id":67,"question":"在「SPACE」架構中，為什麼「算力」建議按需付費租用雲端資源？","answer":"因為 AI 伺服器通常只在訓練模型或建模期間較常使用。"},{"id":68,"question":"在信用風險框架中，「Schema Constrained Prompt」的作用是什麼？","answer":"指定所需的輸出字段和格式，以引導大語言模型生成結構化數據。"},{"id":69,"question":"受監督框架如何處理 PDF 中的橫向頁面（Landscape pages）？","answer":"系統能正確處理橫向內容，避免因佈局變動而產生錯誤數據。"},{"id":70,"question":"在 Luo 的研究中，誰負責提供準確性評估的「地面真值」（Ground Truth）？","answer":"一組不知道系統來源的資深審查員。"},{"id":71,"question":"風險篩選指標中的「集中曝險」（Concentrated Exposure）指的是什麼？","answer":"最大的風險敞口佔總資本的比例。"},{"id":72,"question":"在 Luo 的系统中，如何解決監管規定模糊或不一致的問題？","answer":"系統在回答旁呈現原始源材料，供人工操作員澄清。"},{"id":73,"question":"「檢索評分」（Retrieval quality scores）反映了系統的哪種能力？","answer":"在向量數據庫中定位最相關監管文檔塊的能力。"},{"id":74,"question":"在信用風險研究領域，哪種傳統方法被用於預測公司破產？","answer":"Altman Z-score 或 Ohlson logit 模型。"},{"id":75,"question":"根據受監督框架的研究，一般的聊天型模型在處理長文檔時容易出現什麼問題？","answer":"當佈局中斷邏輯流時，往往會丟失數據結構。"},{"id":76,"question":"「精確度」（Precision）在風險篩選背景下表示什麼？","answer":"被標記為風險的項目中，經進一步調查後確認為真實風險的比例。"},{"id":77,"question":"「召回率」（Recall）在風險篩選背景下表示什麼？","answer":"系統正確識別出的實際風險佔所有實際風險的比例。"},{"id":78,"question":"Luo 研究中的「指標完整性」（Indicator completeness）衡量什麼？","answer":"必需的風險指標中已填寫且未缺失的比例。"},{"id":79,"question":"在 GSS 的文中，「Deep OCR」主要解決了傳統 OCR 無法應對的哪種挑戰？","answer":"不同公司報表格式不一、篇幅換行換頁及浮水印影響識別等挑戰。"},{"id":80,"question":"受監督大語言模型框架在科學文獻外的潛在應用場景有哪些？","answer":"年度財務報表、審計報告或法律裁決書。"}];
    let currentData = [...RAW_DATA];
    let masteredSet = new Set(JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]"));
    let currentMode = 'list';
    let filterOnlyUnmastered = false;
    let isAllExpanded = false;
    let cardIndex = 0;

    function applyTheme(theme) {
      const normalizedTheme = theme === "dark" ? "dark" : "light";
      document.documentElement.dataset.theme = normalizedTheme;

      const btn = document.getElementById("themeToggleBtn");
      if (btn) {
        const isDark = normalizedTheme === "dark";
        btn.textContent = isDark ? "淺色模式" : "深色模式";
        btn.setAttribute("aria-label", isDark ? "切換為淺色模式" : "切換為深色模式");
      }
    }

    function initializeTheme() {
      const savedTheme = localStorage.getItem(THEME_STORAGE_KEY) || "light";
      applyTheme(savedTheme);
    }

    function toggleTheme() {
      const nextTheme = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
      localStorage.setItem(THEME_STORAGE_KEY, nextTheme);
      applyTheme(nextTheme);
    }

    initializeTheme();

    function saveMastered() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(Array.from(masteredSet)));
      updateStats();
    }

    function updateStats() {
      const total = RAW_DATA.length;
      const masteredCount = RAW_DATA.filter(item => masteredSet.has(item.id)).length;
      const pct = total === 0 ? 0 : Math.round((masteredCount / total) * 100);

      document.getElementById('statsCount').textContent = `顯示 ${currentData.length} / 共 ${total} 題`;
      document.getElementById('statsMastered').textContent = `已掌握 ${masteredCount} 題 (${pct}%)`;
      document.getElementById('progressFill').style.width = pct + '%';
    }

    function renderMath() {
      if (window.renderMathInElement) {
        renderMathInElement(document.body, {
          delimiters: [
            {left: '$$', right: '$$', display: true},
            {left: '$', right: '$', display: false}
          ],
          throwOnError: false
        });
      }
    }

    function renderList() {
      const container = document.getElementById('qaList');
      if (currentData.length === 0) {
        container.innerHTML = '<div class="empty-state">沒有符合條件的問答卡片</div>';
        return;
      }

      container.innerHTML = currentData.map(item => {
        const isMastered = masteredSet.has(item.id);
        return `
          <div class="qa-card ${isMastered ? 'mastered' : ''} ${isAllExpanded ? 'open' : ''}" id="card-${item.id}">
            <div class="qa-header" onclick="toggleItem(${item.id})">
              <span class="qa-id">#${item.id}</span>
              <span class="qa-question">${escapeHtml(item.question)}</span>
              <div class="qa-actions">
                <button class="master-btn ${isMastered ? 'is-mastered' : ''}"
                        onclick="toggleMaster(event, ${item.id})"
                        title="${isMastered ? '已掌握' : '標記掌握'}">★</button>
                <span class="expand-icon">▼</span>
              </div>
            </div>
            <div class="qa-answer">${escapeHtml(item.answer)}</div>
          </div>
        `;
      }).join('');

      renderMath();
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    function toggleItem(id) {
      const el = document.getElementById('card-' + id);
      if (el) {
        el.classList.toggle('open');
      }
    }

    function toggleMaster(event, id) {
      event.stopPropagation();
      if (masteredSet.has(id)) {
        masteredSet.delete(id);
      } else {
        masteredSet.add(id);
      }
      saveMastered();
      applyFilters();
    }

    function toggleExpandAll() {
      isAllExpanded = !isAllExpanded;
      document.getElementById('expandAllBtn').textContent = isAllExpanded ? "收合全部" : "展開全部";
      document.querySelectorAll('.qa-card').forEach(card => {
        if (isAllExpanded) {
          card.classList.add('open');
        } else {
          card.classList.remove('open');
        }
      });
    }

    function toggleFilterMastered() {
      filterOnlyUnmastered = !filterOnlyUnmastered;
      const btn = document.getElementById('filterMasteredBtn');
      btn.classList.toggle('active-filter', filterOnlyUnmastered);
      btn.textContent = filterOnlyUnmastered ? "✓ 僅顯示未掌握" : "⭐ 只看未掌握";
      applyFilters();
    }

    function handleSearch() {
      applyFilters();
    }

    function applyFilters() {
      const query = document.getElementById('searchInput').value.trim().toLowerCase();
      currentData = RAW_DATA.filter(item => {
        if (filterOnlyUnmastered && masteredSet.has(item.id)) {
          return false;
        }
        if (query) {
          const matchQ = item.question.toLowerCase().includes(query);
          const matchA = item.answer.toLowerCase().includes(query);
          return matchQ || matchA;
        }
        return true;
      });

      cardIndex = 0;
      if (currentMode === 'list') {
        renderList();
      } else {
        updateCardView();
      }
      updateStats();
    }

    function shuffleCards() {
      currentData.sort(() => Math.random() - 0.5);
      cardIndex = 0;
      if (currentMode === 'list') {
        renderList();
      } else {
        updateCardView();
      }
    }

    function resetOrder() {
      currentData.sort((a, b) => a.id - b.id);
      cardIndex = 0;
      if (currentMode === 'list') {
        renderList();
      } else {
        updateCardView();
      }
    }

    function switchMode(mode) {
      currentMode = mode;
      const listBtn = document.getElementById('listViewBtn');
      const cardBtn = document.getElementById('cardViewBtn');
      const qaList = document.getElementById('qaList');
      const flashcardContainer = document.getElementById('flashcardContainer');
      const expandAllBtn = document.getElementById('expandAllBtn');

      if (mode === 'list') {
        listBtn.classList.add('active');
        cardBtn.classList.remove('active');
        qaList.style.display = 'flex';
        flashcardContainer.style.display = 'none';
        expandAllBtn.style.display = 'inline-flex';
        renderList();
      } else {
        cardBtn.classList.add('active');
        listBtn.classList.remove('active');
        qaList.style.display = 'none';
        flashcardContainer.style.display = 'flex';
        expandAllBtn.style.display = 'none';
        updateCardView();
      }
    }

    /* Flashcard Functions */
    function flipCard() {
      const wrapper = document.getElementById('flashcardWrapper');
      wrapper.classList.toggle('flipped');
    }

    function updateCardView() {
      const wrapper = document.getElementById('flashcardWrapper');
      wrapper.classList.remove('flipped');

      if (currentData.length === 0) {
        document.getElementById('fcQuestion').textContent = '無卡片資料';
        document.getElementById('fcAnswer').textContent = '無卡片資料';
        document.getElementById('fcCardNumber').textContent = '0 / 0';
        document.getElementById('fcCardNumberBack').textContent = '0 / 0';
        return;
      }

      if (cardIndex < 0) cardIndex = 0;
      if (cardIndex >= currentData.length) cardIndex = currentData.length - 1;

      const item = currentData[cardIndex];
      const isMastered = masteredSet.has(item.id);

      document.getElementById('fcQuestion').textContent = item.question;
      document.getElementById('fcAnswer').textContent = item.answer;

      const cardNumText = `卡片 ${cardIndex + 1} / ${currentData.length} (#${item.id})`;
      document.getElementById('fcCardNumber').textContent = cardNumText;
      document.getElementById('fcCardNumberBack').textContent = cardNumText;

      const btn1 = document.getElementById('fcMasterBtn');
      const btn2 = document.getElementById('fcMasterBtnBack');
      btn1.classList.toggle('is-mastered', isMastered);
      btn2.classList.toggle('is-mastered', isMastered);

      renderMath();
    }

    function prevCard() {
      if (currentData.length === 0) return;
      cardIndex = (cardIndex - 1 + currentData.length) % currentData.length;
      updateCardView();
    }

    function nextCard() {
      if (currentData.length === 0) return;
      cardIndex = (cardIndex + 1) % currentData.length;
      updateCardView();
    }

    function toggleCardMaster(event) {
      event.stopPropagation();
      if (currentData.length === 0) return;
      const item = currentData[cardIndex];
      toggleMaster(event, item.id);
      updateCardView();
    }

    /* Keyboard Shortcuts */
    window.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT') return;
      if (currentMode === 'card') {
        if (e.code === 'Space') {
          e.preventDefault();
          flipCard();
        } else if (e.code === 'ArrowLeft') {
          e.preventDefault();
          prevCard();
        } else if (e.code === 'ArrowRight') {
          e.preventDefault();
          nextCard();
        } else if (e.code === 'KeyM') {
          e.preventDefault();
          toggleCardMaster(e);
        }
      }
    });

    // Init
    window.addEventListener('DOMContentLoaded', () => {
      updateStats();
      renderList();
      setTimeout(renderMath, 200);
    });
  </script>
</body>
</html>
