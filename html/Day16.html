<!DOCTYPE html>
<html lang="zh-TW" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Day16 - 問答複習卡</title>
  <!-- KaTeX for LaTeX rendering -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
  <style>
    :root {
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --primary-light: #eff6ff;
      --border-color: #e2e8f0;
      --success: #10b981;
      --success-light: #ecfdf5;
      --accent: #f59e0b;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
      --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.08), 0 2px 4px -2px rgba(0,0,0,0.05);
      --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.1), 0 4px 6px -4px rgba(0,0,0,0.05);
      --radius: 12px;
    }

    html[data-theme="dark"] {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #60a5fa;
      --primary-hover: #3b82f6;
      --primary-light: #1e3a8a33;
      --border-color: #334155;
      --success: #34d399;
      --success-light: #064e3b33;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans TC", sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      line-height: 1.6;
      padding-bottom: 60px;
    }

    /* Navigation / Header */
    header {
      background: var(--card-bg);
      border-bottom: 1px solid var(--border-color);
      position: sticky;
      top: 0;
      z-index: 50;
      box-shadow: var(--shadow-sm);
    }

    .header-container {
      max-width: 900px;
      margin: 0 auto;
      padding: 14px 20px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .nav-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 8px;
      background: var(--primary-light);
      color: var(--primary);
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      transition: all 0.2s;
    }

    .back-btn:hover {
      background: var(--primary);
      color: #fff;
    }

    .page-title {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .view-toggles {
      display: flex;
      background: var(--bg-color);
      padding: 3px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
    }

    .header-actions {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: flex-end;
    }

    .toggle-btn {
      padding: 6px 14px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .toggle-btn.active {
      background: var(--card-bg);
      color: var(--primary);
      box-shadow: var(--shadow-sm);
    }

    .theme-toggle {
      padding: 7px 12px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      background: var(--card-bg);
      color: var(--text-main);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: var(--shadow-sm);
      transition: border-color 0.2s, color 0.2s, background 0.2s;
    }

    .theme-toggle:hover {
      border-color: var(--primary);
      color: var(--primary);
    }

    /* Main Container */
    main {
      max-width: 900px;
      margin: 24px auto;
      padding: 0 20px;
    }

    /* Toolbar */
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 20px;
      align-items: center;
      justify-content: space-between;
    }

    .search-box {
      flex: 1;
      min-width: 240px;
      position: relative;
    }

    .search-box input {
      width: 100%;
      padding: 10px 14px 10px 38px;
      border-radius: 10px;
      border: 1px solid var(--border-color);
      background: var(--card-bg);
      color: var(--text-main);
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-box input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-light);
    }

    .search-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 14px;
    }

    .action-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background: var(--card-bg);
      color: var(--text-main);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn:hover {
      background: var(--border-color);
    }

    .btn.active-filter {
      background: var(--primary-light);
      border-color: var(--primary);
      color: var(--primary);
    }

    /* Stats bar */
    .stats-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      font-size: 14px;
      color: var(--text-muted);
    }

    .progress-bar-container {
      flex: 1;
      height: 8px;
      background: var(--border-color);
      border-radius: 99px;
      margin: 0 16px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: var(--success);
      width: 0%;
      transition: width 0.3s ease;
    }

    /* List View Cards */
    .qa-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .qa-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      box-shadow: var(--shadow-sm);
      overflow: hidden;
      transition: box-shadow 0.2s, border-color 0.2s;
    }

    .qa-card:hover {
      box-shadow: var(--shadow-md);
      border-color: #cbd5e1;
    }

    .qa-card.mastered {
      border-left: 4px solid var(--success);
    }

    .qa-header {
      padding: 16px 20px;
      display: flex;
      align-items: flex-start;
      gap: 12px;
      cursor: pointer;
      user-select: none;
    }

    .qa-id {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 28px;
      height: 28px;
      background: var(--primary-light);
      color: var(--primary);
      border-radius: 6px;
      font-size: 13px;
      font-weight: 700;
      margin-top: 2px;
      flex-shrink: 0;
    }

    .qa-question {
      flex: 1;
      font-size: 15px;
      font-weight: 600;
      color: var(--text-main);
      padding-top: 2px;
    }

    .qa-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .master-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 18px;
      padding: 4px;
      border-radius: 6px;
      transition: transform 0.15s, color 0.15s;
    }

    .master-btn:hover {
      transform: scale(1.15);
    }

    .master-btn.is-mastered {
      color: var(--accent);
    }

    .expand-icon {
      color: var(--text-muted);
      font-size: 14px;
      transition: transform 0.2s ease;
    }

    .qa-card.open .expand-icon {
      transform: rotate(180deg);
    }

    .qa-answer {
      display: none;
      padding: 16px 20px 18px 60px;
      background: var(--bg-color);
      border-top: 1px dashed var(--border-color);
      font-size: 15px;
      color: var(--text-main);
      line-height: 1.7;
    }

    .qa-card.open .qa-answer {
      display: block;
      animation: fadeIn 0.2s ease-in;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Flashcard Mode */
    .flashcard-container {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      padding: 10px 0;
    }

    .flashcard-wrapper {
      perspective: 1000px;
      width: 100%;
      max-width: 640px;
      min-height: 340px;
      cursor: pointer;
    }

    .flashcard-inner {
      position: relative;
      width: 100%;
      height: 100%;
      min-height: 340px;
      text-align: center;
      transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
      transform-style: preserve-3d;
      border-radius: 16px;
      box-shadow: var(--shadow-lg);
    }

    .flashcard-wrapper.flipped .flashcard-inner {
      transform: rotateY(180deg);
    }

    .flashcard-face {
      position: absolute;
      width: 100%;
      height: 100%;
      min-height: 340px;
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 30px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      box-sizing: border-box;
    }

    .flashcard-back {
      transform: rotateY(180deg);
      background: var(--card-bg);
      border: 2px solid var(--primary);
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      color: var(--text-muted);
    }

    .card-badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 99px;
      font-weight: 600;
      font-size: 12px;
    }

    .badge-q {
      background: var(--primary-light);
      color: var(--primary);
    }

    .badge-a {
      background: var(--success-light);
      color: var(--success);
    }

    .card-body {
      margin: auto 0;
      padding: 20px 10px;
      font-size: 18px;
      font-weight: 600;
      line-height: 1.6;
    }

    .card-hint {
      font-size: 12px;
      color: var(--text-muted);
    }

    .flashcard-controls {
      display: flex;
      gap: 12px;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 640px;
    }

    .flashcard-controls .btn {
      padding: 10px 20px;
      font-size: 14px;
      font-weight: 600;
    }

    .btn-primary {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    .btn-primary:hover {
      background: var(--primary-hover);
    }

    .shortcuts-hint {
      font-size: 12px;
      color: var(--text-muted);
      text-align: center;
      margin-top: 8px;
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
      background: var(--card-bg);
      border-radius: var(--radius);
      border: 1px dashed var(--border-color);
    }
  </style>
</head>
<body>
  <header>
    <div class="header-container">
      <div class="nav-left">
        <a href="index.html" class="back-btn" title="回目錄">← 目錄</a>
        <h1 class="page-title">Day16 問答卡</h1>
      </div>
      <div class="header-actions">
        <button class="theme-toggle" id="themeToggleBtn" type="button" onclick="toggleTheme()" aria-label="切換為深色模式">深色模式</button>
        <div class="view-toggles">
          <button id="listViewBtn" class="toggle-btn active" onclick="switchMode('list')">📋 列表模式</button>
          <button id="cardViewBtn" class="toggle-btn" onclick="switchMode('card')">🎴 翻卡測驗</button>
        </div>
      </div>
    </div>
  </header>

  <main>
    <div class="toolbar">
      <div class="search-box">
        <span class="search-icon">🔍</span>
        <input type="text" id="searchInput" placeholder="搜尋問題或答案關鍵字..." oninput="handleSearch()">
      </div>
      <div class="action-buttons">
        <button class="btn" id="filterMasteredBtn" onclick="toggleFilterMastered()">⭐ 只看未掌握</button>
        <button class="btn" id="expandAllBtn" onclick="toggleExpandAll()">展開全部</button>
        <button class="btn" onclick="shuffleCards()">🔀 隨機洗牌</button>
        <button class="btn" onclick="resetOrder()">🔄 恢復順序</button>
      </div>
    </div>

    <div class="stats-bar">
      <span id="statsCount">總計 0 題</span>
      <div class="progress-bar-container">
        <div id="progressFill" class="progress-fill"></div>
      </div>
      <span id="statsMastered">掌握率 0%</span>
    </div>

    <!-- List View -->
    <div id="qaList" class="qa-list"></div>

    <!-- Flashcard Mode View -->
    <div id="flashcardContainer" class="flashcard-container">
      <div class="flashcard-wrapper" id="flashcardWrapper" onclick="flipCard()">
        <div class="flashcard-inner">
          <!-- Front Face -->
          <div class="flashcard-face flashcard-front">
            <div class="card-top">
              <span class="card-badge badge-q">問題</span>
              <span id="fcCardNumber">卡片 1 / 1</span>
              <button class="master-btn" id="fcMasterBtn" onclick="toggleCardMaster(event)" title="標記為已掌握">★</button>
            </div>
            <div class="card-body" id="fcQuestion">載入中...</div>
            <div class="card-hint">💡 點擊卡片或按空白鍵翻面看答案</div>
          </div>
          <!-- Back Face -->
          <div class="flashcard-face flashcard-back">
            <div class="card-top">
              <span class="card-badge badge-a">解答</span>
              <span id="fcCardNumberBack">卡片 1 / 1</span>
              <button class="master-btn" id="fcMasterBtnBack" onclick="toggleCardMaster(event)" title="標記為已掌握">★</button>
            </div>
            <div class="card-body" id="fcAnswer">載入中...</div>
            <div class="card-hint">💡 再次點擊卡片翻回正面</div>
          </div>
        </div>
      </div>

      <div class="flashcard-controls">
        <button class="btn" onclick="prevCard()">← 上一題</button>
        <button class="btn btn-primary" onclick="flipCard()">翻轉卡片</button>
        <button class="btn" onclick="nextCard()">下一題 →</button>
      </div>
      <div class="shortcuts-hint">鍵盤快速鍵：[←] 上一題 · [空白鍵] 翻面 · [→] 下一題 · [M] 標記掌握</div>
    </div>
  </main>

  <script>
    const THEME_STORAGE_KEY = "qa_theme";
    const STORAGE_KEY = "anki_mastered_" + "Day16";
    const RAW_DATA = [{"id":1,"question":"根據提供的資料，美國銀行系統中反洗錢 (AML) 合規的主要功能是什麼？","answer":"阻礙非法金融活動，如洗錢、恐怖分子融資和欺詐。"},{"id":2,"question":"哪部法律被認為是美國廣泛反洗錢監管的起點？","answer":"1970 年的《銀行保密法》(BSA)。"},{"id":3,"question":"1970 年《銀行保密法》(BSA) 授權金融機構執行哪項核心任務？","answer":"實施適當措施以識別並報告可疑活動。"},{"id":4,"question":"2001 年的《美國愛國者法案》對銀行的 AML 條件有何影響？","answer":"加強了 AML 執法，要求對高風險客戶和交易進行加強盡職調查 (EDD)。"},{"id":5,"question":"FinCEN 在 2018 年推出了哪項規則來強化銀行的 AML 監測？","answer":"客戶盡職調查 (CDD) 規則。"},{"id":6,"question":"傳統銀行主要依賴哪種系統來識別可能的洗錢交易？","answer":"基於規則的交易監測系統 (Rule-based systems)。"},{"id":7,"question":"傳統「基於規則的系統」如何運作以標記可疑交易？","answer":"應用預定義的規則和閾值，並標記符合條件的交易供合規團隊審核。"},{"id":8,"question":"傳統 AML 異常檢測系統面臨的三個主要缺點是什麼？","answer":"偽陽性率極高、人力效率低下以及難以檢測複雜的洗錢方法。"},{"id":9,"question":"人工智慧 (AI) 驅動的異常檢測模型主要基於哪兩類方法？","answer":"機器學習 (ML) 和深度學習 (Deep Learning)。"},{"id":10,"question":"在 AML 背景下，人工智慧模型相比傳統方法的一大主要優點是什麼？","answer":"在降低偽陽性率的同時，捕捉實際的可疑交易。"},{"id":11,"question":"機器學習算法如何應對不斷變化的洗錢策略？","answer":"利用歷史數據進行學習，並持續更新其對新策略的檢測能力。"},{"id":12,"question":"自然語言處理 (NLP) 技術在 AML 中有何用途？","answer":"分析非結構化數據，如監管申報、新聞報導和可疑活動報告 (SARs)，以識別金融犯罪趨勢。"},{"id":13,"question":"負責美國 AML 標準制定並確保遵守情況的主要機構是？","answer":"金融犯罪執法局 (FinCEN)。"},{"id":14,"question":"傳統 AML 系統中，「偽陽性」(False Positives) 的定義是什麼？","answer":"被標記為可疑但最終證實為合法的交易。"},{"id":15,"question":"根據行業報告，傳統 AML 系統的偽陽性率通常高達多少？","answer":"95% 以上。"},{"id":16,"question":"高偽陽性率對銀行操作團隊造成了什麼樣的負擔？","answer":"造成沉重的資源負擔，增加成本、降低效率並延遲對真實威脅的識別。"},{"id":17,"question":"為什麼傳統系統難以檢測跨國移動或分層技術等複雜洗錢活動？","answer":"因為傳統模型無法識別偏離預定義模式的複雜交易行為。"},{"id":18,"question":"除了國內法律，美國金融機構還需實施哪些國際 AML 框架？","answer":"由金融行動特別工作組 (FATF) 規定的框架。"},{"id":19,"question":"如果銀行未能遵守 AML 合規要求，可能面臨哪些後果？","answer":"鉅額罰款、聲譽受損和法律後果。"},{"id":20,"question":"在部署先進 AI 解決方案時，銀行必須在風險管理與什麼之間取得平衡？","answer":"客戶體驗 (Customer experience)。"},{"id":21,"question":"什麼是「受監督學習」 (Supervised Learning) 模型在 AML 中的應用？","answer":"在已標記為可疑或非可疑的歷史數據集上進行訓練，以預測未來欺詐可能性。"},{"id":22,"question":"在 AML 中常用的兩种受監督學習算法是什麼？","answer":"隨機森林 (Random Forest) 和邏輯回歸 (Logistic Regression)。"},{"id":23,"question":"受監督學習模型在面對「新型」洗錢技術時有何局限性？","answer":"它們依賴過去的數據，可能無法識別以前未見過的欺詐模式。"},{"id":24,"question":"「非監督學習」 (Unsupervised Learning) 模型的主要特點是什麼？","answer":"不需要標記數據，而是從與常規不同的異常模式中檢測異常。"},{"id":25,"question":"列舉兩種 AML 中常用的非監督學習技術。","answer":"聚類 (Clustering) 和自動編碼器 (Autoencoders)。"},{"id":26,"question":"關於檢測能力，非監督模型與受監督模型相比有何優劣？","answer":"優點是能發現未知類型的洗錢，缺點是往往會產生更多偽陽性。"},{"id":27,"question":"深度學習中的「遞歸神經網路」 (RNNs) 為什麼適合 AML 檢測？","answer":"因為它們擅長發現隨著時間推移出現的可疑交易序列。"},{"id":28,"question":"「圖神經網路」 (GNNs) 在 AML 檢測中的具體作用是什麼？","answer":"研究網絡實體間的關係，並檢測隱藏的金融犯罪網絡。"},{"id":29,"question":"摩根大通 (JPMorgan Chase) 如何利用機器學習優化 AML？","answer":"提高 AML 檢測準確性並減少交易監控系統中的偽陽性數量。"},{"id":30,"question":"富國銀行 (Wells Fargo) 使用 AI 進行網絡分析的主要目的是什麼？","answer":"識別高風險實體之間隱藏的關係。"},{"id":31,"question":"花旗銀行 (Citibank) 採用深度學習技術的主要優勢是什麼？","answer":"實時分析海量交易，實現更快、更準確的風險評估。"},{"id":32,"question":"為了提高 AI 模型的性能，銀行在數據處理方面應採取哪些措施？","answer":"使用多種來源的交易數據，並對數據進行清洗和預處理以確保一致性。"},{"id":33,"question":"當真實標記數據稀缺時，銀行可以利用什麼數據來訓練模型？","answer":"合成數據 (Synthetic data)。"},{"id":34,"question":"什麼是「聯邦學習」 (Federated Learning) 及其在 AML 中的益處？","answer":"一種隱私保護 AI 技術，允許銀行在不損害敏感數據的情況下共享見解。"},{"id":35,"question":"「自適應學習模型」 (Adaptive learning models) 如何優化欺詐檢測？","answer":"隨著新欺詐模式的出現，模型能自動調整檢測閾值並提高準確性，無需靜態規則。"},{"id":36,"question":"行為分析 (Behavioral profiling) 如何幫助識別異常？","answer":"通過監測客戶隨時間變化的交易行為，檢測突發的異常偏差（如高額離岸轉帳）。"},{"id":37,"question":"什麼是「可解釋人工智慧」 (XAI)？","answer":"一種讓銀行能解釋 AI 模型如何對交易進行分類並證明決策合理性的技術。"},{"id":38,"question":"提及兩種常用的 XAI 技術。","answer":"SHAP 和 LIME。"},{"id":39,"question":"「人機協作」 (Human-AI collaboration) 在 AML 高風險案件中扮演什麼角色？","answer":"AI 提供見解並標記案例，但由合規團隊做出最終決定。"},{"id":40,"question":"FinCEN 在 2021 年發布的擬議規則制定預告 (ANPR) 中，對 AI 提出了什麼要求？","answer":"承認 AI 有潛力推動犯罪檢測，但強調了系統可解釋性和問責制的重要性。"},{"id":41,"question":"在 AI 合規框架中，為什麼「公平性審計」 (Fairness audits) 很重要？","answer":"為了發現並減少偏見，防止某些人口統計特徵或地區被不當標記為高風險。"},{"id":42,"question":"銀行採用「混合 AML 模型」 (Hybrid AML models) 的策略是什麼？","answer":"不取代傳統規則系統，而是整合 AI 以優化模式識別並識別網絡異常值。"},{"id":43,"question":"為何 AI 系統容易對「新業務」產生偽陽性？","answer":"因為新業務的交易行為可能與預期模式不符（如大量電匯），被模型誤認為異常。"},{"id":44,"question":"「數據富化」 (Data Enrichment) 如何降低偽陽性？","answer":"通過納入外部數據（如不利媒體報導、公司所有權登記）為 AI 提供更好的決策信息。"},{"id":45,"question":"根據 [SOURCE_IMAGE_3]，AI 在美國銀行中的哪項應用佔比最高？","answer":"欺詐檢測與預防 (30%)。"},{"id":46,"question":"根據 [SOURCE_IMAGE_3]，風險管理與合規在 AI 實施中的佔比是多少？","answer":"15%。"},{"id":47,"question":"根據 [SOURCE_IMAGE_4]，哪項監管考慮因素在銀行業中的採用率達到 100%？","answer":"廣泛的銀行業 AI 採用。"},{"id":48,"question":"未來 AML 監控趨勢中，處理非結構化數據的關鍵技術是？","answer":"自然語言處理 (NLP)。"},{"id":49,"question":"「雲端 AI 模型」在未來 AML 中的作用是什麼？","answer":"實現對大規模交易量的高效實時處理。"},{"id":50,"question":"針對加密貨幣洗錢，哪種工具被認為是目前最有效的應對方式？","answer":"區塊鏈分析與 AI 驅動的加密貨幣監控。"},{"id":51,"question":"未來銀行監管可能要求加密金融機構建立哪種自動化機制？","answer":"AI 驅動的智能合約，用於自動標記和凍結可疑加密交易。"},{"id":52,"question":"什麼是「監管沙盒」 (Regulatory sandboxes)？","answer":"金融機構在受保護環境中測試 AI 模型，確保其在全面部署前符合合規標準的機制。"},{"id":53,"question":"AI 如何改進可疑活動報告 (SAR) 的提交過程？","answer":"通過與監管數據庫（如 FinCEN 的電子歸檔系統）結合，自動化並提高申報準確性。"},{"id":54,"question":"傳統系統缺乏哪種能力，導致無法應對不斷變化的風險？","answer":"缺乏適應複雜且不斷演變的洗錢方法的能力。"},{"id":55,"question":"[SOURCE_IMAGE_2] 中提到的傳統 AML 檢測的五大挑戰是什麼？","answer":"高偽陽性、演變中的欺詐策略、擴展性問題、缺乏實時檢測、模型解釋性有限。"},{"id":56,"question":"哪種 AI 技術特別適用於發現看似獨立賬戶之間的隱藏聯繫？","answer":"圖神經網路 (GNNs)。"},{"id":57,"question":"什麼是「孤立森林」 (Isolation Forests) 模型在 AML 中的用途？","answer":"通過隔離不符合典型交易行為的交易來檢測異常。"},{"id":58,"question":"在 AML 流程中，「HITL」模型代表什麼含義？","answer":"人機回圈 (Human-in-the-Loop)，即由人工審核 AI 生成的警報。"},{"id":59,"question":"在金融領域，監管機構對 AI 決策的「透明度」有何具體要求？","answer":"模型的決策必須是可解釋、可審計且無偏見的。"},{"id":60,"question":"為什麼跨國洗錢活動對傳統靜態規則系統構成挑戰？","answer":"因為它們涉及結構化交易和分層技術，靜態規則難以捕捉這些動態行為。"},{"id":61,"question":"「自學習」 (Self-learning) AI 模型的主要優勢是什麼？","answer":"隨時間微調閾值，減少錯誤警報並提高檢測準確性。"},{"id":62,"question":"在數據質量方面，什麼問題可能導致 AI 模型誤分類交易？","answer":"標記不當、數據集偏見或信息缺失。"},{"id":63,"question":"「分層技術」 (Layering techniques) 在洗錢中指的是什麼？","answer":"通過複雜的交易層次來掩飾資金的非法來源。"},{"id":64,"question":"「結構化交易」 (Structured transactions) 在 AML 中通常指什麼？","answer":"將大額資金拆分成多筆小額交易以規避申報閾值。"},{"id":65,"question":"根據文中描述，AI 如何協助銀行進行「實時」AML 監控？","answer":"通過 AI 模型實時分析傳入交易，識別異常並立即採取凍結資金等行動。"},{"id":66,"question":"什麼是 AI 治理框架 (AI governance framework)？","answer":"定期審計已部署模型，確保其公平性、準確性並符合法律要求的框架。"},{"id":67,"question":"為何「負面媒體篩選」 (Adverse media screening) 對 AML 很有用？","answer":"它能提供有關個人或實體涉及非法活動的外部公開信息，增強風險評估。"},{"id":68,"question":"在聯邦學習中，數據是否需要在銀行之間交換？","answer":"不需要，它只共享模型見解而不暴露原始敏感客戶數據。"},{"id":69,"question":"哪種神經網路模型適合處理結構化和非結構化數據？","answer":"深度神經網路（如 RNNs 和 CNNs 的變體）。"},{"id":70,"question":"「模型驗證與測試」 (Model Validation and Testing) 的監管要求是什麼？","answer":"金融機構必須使用實際數據運行測試，確保 AI 模型達到合規基準。"},{"id":71,"question":"根據 [SOURCE_IMAGE_4]，監管警覺與指南 (Regulatory Awareness) 的重要性佔比是多少？","answer":"85%。"},{"id":72,"question":"傳統 AML 系統的高偽陽性如何影響客戶滿意度？","answer":"導致合法的交易被延遲或賬戶被錯誤凍結，增加客戶不滿。"},{"id":73,"question":"解釋「風險評分」 (Risk scoring) 在 AI AML 中的意義。","answer":"為每筆交易或客戶分配風險等級，使合規團隊能優先處理最具威脅的案例。"},{"id":74,"question":"什麼是「K-Means」聚類在 AML 中的應用示例？","answer":"將行為相似的交易分組，並標記明顯偏離組群的交易。"},{"id":75,"question":"在預防金融犯罪中，AI 的「可擴展性」意味著什麼？","answer":"模型能夠處理隨著銀行業務增長而快速增加的海量數據流。"},{"id":76,"question":"「模型解釋性」 (Model Interpretability) 缺失會帶來什麼合規風險？","answer":"銀行無法向監管機構解釋為什麼某筆特定交易被標記為可疑。"},{"id":77,"question":"未來 AML 領域的「跨境數據共享」有何意義？","answer":"利用 AI 跨司法管轄區檢測並攔截高效運作的洗錢者。"},{"id":78,"question":"解釋「去中心化金融 (DeFi)」平台給 AML 帶來的挑戰。","answer":"它們帶來了新的洗錢風險，需要 AI 驅動的區塊鏈監控工具來追蹤鏈上資金流。"},{"id":79,"question":"為何「混合 AI 與規則法」比單一方法更受銀行青睞？","answer":"它結合了人類定義的風險規則與 AI 的適應性，能過濾低風險警報並優先處理關鍵警報。"},{"id":80,"question":"機器學習模型中的「偏見檢測」主要是為了防止什麼？","answer":"防止特定客戶群體因算法偏見而被不當標記為高風險，造成金融排斥。"},{"id":81,"question":"「合規成本」在傳統系統中為何居高不下？","answer":"主要是因為需要大量人力進行手動審核那些高比例的無效警報。"},{"id":82,"question":"什麼是「預測分析」 (Predictive analytics) 在 AML 中的角色？","answer":"利用歷史趨勢預測未來可能發生洗錢活動的高風險區域或模式。"},{"id":83,"question":"為什麼 AI 技術被認為能「未來化」(future-proof) 銀行系統？","answer":"因為它能持續學習並適應快速變化的犯罪技術和監管環境。"},{"id":84,"question":"銀行在實施 AI 解決方案時，應如何與 FinCEN 和 OCC 等機構溝通？","answer":"積極接洽監管機構，參與政策制定並展示其作為 AI 負責任採用者的角色。"},{"id":85,"question":"總結：AI 如何轉變金融犯罪預防？","answer":"通過提供更安全、高效且符合監管要求的銀行系統，實現主動且精確的監測。"}];
    let currentData = [...RAW_DATA];
    let masteredSet = new Set(JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]"));
    let currentMode = 'list';
    let filterOnlyUnmastered = false;
    let isAllExpanded = false;
    let cardIndex = 0;

    function applyTheme(theme) {
      const normalizedTheme = theme === "dark" ? "dark" : "light";
      document.documentElement.dataset.theme = normalizedTheme;

      const btn = document.getElementById("themeToggleBtn");
      if (btn) {
        const isDark = normalizedTheme === "dark";
        btn.textContent = isDark ? "淺色模式" : "深色模式";
        btn.setAttribute("aria-label", isDark ? "切換為淺色模式" : "切換為深色模式");
      }
    }

    function initializeTheme() {
      const savedTheme = localStorage.getItem(THEME_STORAGE_KEY) || "light";
      applyTheme(savedTheme);
    }

    function toggleTheme() {
      const nextTheme = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
      localStorage.setItem(THEME_STORAGE_KEY, nextTheme);
      applyTheme(nextTheme);
    }

    initializeTheme();

    function saveMastered() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(Array.from(masteredSet)));
      updateStats();
    }

    function updateStats() {
      const total = RAW_DATA.length;
      const masteredCount = RAW_DATA.filter(item => masteredSet.has(item.id)).length;
      const pct = total === 0 ? 0 : Math.round((masteredCount / total) * 100);

      document.getElementById('statsCount').textContent = `顯示 ${currentData.length} / 共 ${total} 題`;
      document.getElementById('statsMastered').textContent = `已掌握 ${masteredCount} 題 (${pct}%)`;
      document.getElementById('progressFill').style.width = pct + '%';
    }

    function renderMath() {
      if (window.renderMathInElement) {
        renderMathInElement(document.body, {
          delimiters: [
            {left: '$$', right: '$$', display: true},
            {left: '$', right: '$', display: false}
          ],
          throwOnError: false
        });
      }
    }

    function renderList() {
      const container = document.getElementById('qaList');
      if (currentData.length === 0) {
        container.innerHTML = '<div class="empty-state">沒有符合條件的問答卡片</div>';
        return;
      }

      container.innerHTML = currentData.map(item => {
        const isMastered = masteredSet.has(item.id);
        return `
          <div class="qa-card ${isMastered ? 'mastered' : ''} ${isAllExpanded ? 'open' : ''}" id="card-${item.id}">
            <div class="qa-header" onclick="toggleItem(${item.id})">
              <span class="qa-id">#${item.id}</span>
              <span class="qa-question">${escapeHtml(item.question)}</span>
              <div class="qa-actions">
                <button class="master-btn ${isMastered ? 'is-mastered' : ''}"
                        onclick="toggleMaster(event, ${item.id})"
                        title="${isMastered ? '已掌握' : '標記掌握'}">★</button>
                <span class="expand-icon">▼</span>
              </div>
            </div>
            <div class="qa-answer">${escapeHtml(item.answer)}</div>
          </div>
        `;
      }).join('');

      renderMath();
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    function toggleItem(id) {
      const el = document.getElementById('card-' + id);
      if (el) {
        el.classList.toggle('open');
      }
    }

    function toggleMaster(event, id) {
      event.stopPropagation();
      if (masteredSet.has(id)) {
        masteredSet.delete(id);
      } else {
        masteredSet.add(id);
      }
      saveMastered();
      applyFilters();
    }

    function toggleExpandAll() {
      isAllExpanded = !isAllExpanded;
      document.getElementById('expandAllBtn').textContent = isAllExpanded ? "收合全部" : "展開全部";
      document.querySelectorAll('.qa-card').forEach(card => {
        if (isAllExpanded) {
          card.classList.add('open');
        } else {
          card.classList.remove('open');
        }
      });
    }

    function toggleFilterMastered() {
      filterOnlyUnmastered = !filterOnlyUnmastered;
      const btn = document.getElementById('filterMasteredBtn');
      btn.classList.toggle('active-filter', filterOnlyUnmastered);
      btn.textContent = filterOnlyUnmastered ? "✓ 僅顯示未掌握" : "⭐ 只看未掌握";
      applyFilters();
    }

    function handleSearch() {
      applyFilters();
    }

    function applyFilters() {
      const query = document.getElementById('searchInput').value.trim().toLowerCase();
      currentData = RAW_DATA.filter(item => {
        if (filterOnlyUnmastered && masteredSet.has(item.id)) {
          return false;
        }
        if (query) {
          const matchQ = item.question.toLowerCase().includes(query);
          const matchA = item.answer.toLowerCase().includes(query);
          return matchQ || matchA;
        }
        return true;
      });

      cardIndex = 0;
      if (currentMode === 'list') {
        renderList();
      } else {
        updateCardView();
      }
      updateStats();
    }

    function shuffleCards() {
      currentData.sort(() => Math.random() - 0.5);
      cardIndex = 0;
      if (currentMode === 'list') {
        renderList();
      } else {
        updateCardView();
      }
    }

    function resetOrder() {
      currentData.sort((a, b) => a.id - b.id);
      cardIndex = 0;
      if (currentMode === 'list') {
        renderList();
      } else {
        updateCardView();
      }
    }

    function switchMode(mode) {
      currentMode = mode;
      const listBtn = document.getElementById('listViewBtn');
      const cardBtn = document.getElementById('cardViewBtn');
      const qaList = document.getElementById('qaList');
      const flashcardContainer = document.getElementById('flashcardContainer');
      const expandAllBtn = document.getElementById('expandAllBtn');

      if (mode === 'list') {
        listBtn.classList.add('active');
        cardBtn.classList.remove('active');
        qaList.style.display = 'flex';
        flashcardContainer.style.display = 'none';
        expandAllBtn.style.display = 'inline-flex';
        renderList();
      } else {
        cardBtn.classList.add('active');
        listBtn.classList.remove('active');
        qaList.style.display = 'none';
        flashcardContainer.style.display = 'flex';
        expandAllBtn.style.display = 'none';
        updateCardView();
      }
    }

    /* Flashcard Functions */
    function flipCard() {
      const wrapper = document.getElementById('flashcardWrapper');
      wrapper.classList.toggle('flipped');
    }

    function updateCardView() {
      const wrapper = document.getElementById('flashcardWrapper');
      wrapper.classList.remove('flipped');

      if (currentData.length === 0) {
        document.getElementById('fcQuestion').textContent = '無卡片資料';
        document.getElementById('fcAnswer').textContent = '無卡片資料';
        document.getElementById('fcCardNumber').textContent = '0 / 0';
        document.getElementById('fcCardNumberBack').textContent = '0 / 0';
        return;
      }

      if (cardIndex < 0) cardIndex = 0;
      if (cardIndex >= currentData.length) cardIndex = currentData.length - 1;

      const item = currentData[cardIndex];
      const isMastered = masteredSet.has(item.id);

      document.getElementById('fcQuestion').textContent = item.question;
      document.getElementById('fcAnswer').textContent = item.answer;

      const cardNumText = `卡片 ${cardIndex + 1} / ${currentData.length} (#${item.id})`;
      document.getElementById('fcCardNumber').textContent = cardNumText;
      document.getElementById('fcCardNumberBack').textContent = cardNumText;

      const btn1 = document.getElementById('fcMasterBtn');
      const btn2 = document.getElementById('fcMasterBtnBack');
      btn1.classList.toggle('is-mastered', isMastered);
      btn2.classList.toggle('is-mastered', isMastered);

      renderMath();
    }

    function prevCard() {
      if (currentData.length === 0) return;
      cardIndex = (cardIndex - 1 + currentData.length) % currentData.length;
      updateCardView();
    }

    function nextCard() {
      if (currentData.length === 0) return;
      cardIndex = (cardIndex + 1) % currentData.length;
      updateCardView();
    }

    function toggleCardMaster(event) {
      event.stopPropagation();
      if (currentData.length === 0) return;
      const item = currentData[cardIndex];
      toggleMaster(event, item.id);
      updateCardView();
    }

    /* Keyboard Shortcuts */
    window.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT') return;
      if (currentMode === 'card') {
        if (e.code === 'Space') {
          e.preventDefault();
          flipCard();
        } else if (e.code === 'ArrowLeft') {
          e.preventDefault();
          prevCard();
        } else if (e.code === 'ArrowRight') {
          e.preventDefault();
          nextCard();
        } else if (e.code === 'KeyM') {
          e.preventDefault();
          toggleCardMaster(e);
        }
      }
    });

    // Init
    window.addEventListener('DOMContentLoaded', () => {
      updateStats();
      renderList();
      setTimeout(renderMath, 200);
    });
  </script>
</body>
</html>
