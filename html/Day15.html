<!DOCTYPE html>
<html lang="zh-TW" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Day15 - 問答複習卡</title>
  <!-- KaTeX for LaTeX rendering -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
  <style>
    :root {
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --primary-light: #eff6ff;
      --border-color: #e2e8f0;
      --success: #10b981;
      --success-light: #ecfdf5;
      --accent: #f59e0b;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
      --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.08), 0 2px 4px -2px rgba(0,0,0,0.05);
      --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.1), 0 4px 6px -4px rgba(0,0,0,0.05);
      --radius: 12px;
    }

    html[data-theme="dark"] {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #60a5fa;
      --primary-hover: #3b82f6;
      --primary-light: #1e3a8a33;
      --border-color: #334155;
      --success: #34d399;
      --success-light: #064e3b33;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans TC", sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      line-height: 1.6;
      padding-bottom: 60px;
    }

    /* Navigation / Header */
    header {
      background: var(--card-bg);
      border-bottom: 1px solid var(--border-color);
      position: sticky;
      top: 0;
      z-index: 50;
      box-shadow: var(--shadow-sm);
    }

    .header-container {
      max-width: 900px;
      margin: 0 auto;
      padding: 14px 20px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .nav-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 8px;
      background: var(--primary-light);
      color: var(--primary);
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      transition: all 0.2s;
    }

    .back-btn:hover {
      background: var(--primary);
      color: #fff;
    }

    .page-title {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .view-toggles {
      display: flex;
      background: var(--bg-color);
      padding: 3px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
    }

    .header-actions {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: flex-end;
    }

    .toggle-btn {
      padding: 6px 14px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .toggle-btn.active {
      background: var(--card-bg);
      color: var(--primary);
      box-shadow: var(--shadow-sm);
    }

    .theme-toggle {
      padding: 7px 12px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      background: var(--card-bg);
      color: var(--text-main);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: var(--shadow-sm);
      transition: border-color 0.2s, color 0.2s, background 0.2s;
    }

    .theme-toggle:hover {
      border-color: var(--primary);
      color: var(--primary);
    }

    /* Main Container */
    main {
      max-width: 900px;
      margin: 24px auto;
      padding: 0 20px;
    }

    /* Toolbar */
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 20px;
      align-items: center;
      justify-content: space-between;
    }

    .search-box {
      flex: 1;
      min-width: 240px;
      position: relative;
    }

    .search-box input {
      width: 100%;
      padding: 10px 14px 10px 38px;
      border-radius: 10px;
      border: 1px solid var(--border-color);
      background: var(--card-bg);
      color: var(--text-main);
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-box input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-light);
    }

    .search-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 14px;
    }

    .action-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background: var(--card-bg);
      color: var(--text-main);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn:hover {
      background: var(--border-color);
    }

    .btn.active-filter {
      background: var(--primary-light);
      border-color: var(--primary);
      color: var(--primary);
    }

    /* Stats bar */
    .stats-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      font-size: 14px;
      color: var(--text-muted);
    }

    .progress-bar-container {
      flex: 1;
      height: 8px;
      background: var(--border-color);
      border-radius: 99px;
      margin: 0 16px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: var(--success);
      width: 0%;
      transition: width 0.3s ease;
    }

    /* List View Cards */
    .qa-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .qa-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      box-shadow: var(--shadow-sm);
      overflow: hidden;
      transition: box-shadow 0.2s, border-color 0.2s;
    }

    .qa-card:hover {
      box-shadow: var(--shadow-md);
      border-color: #cbd5e1;
    }

    .qa-card.mastered {
      border-left: 4px solid var(--success);
    }

    .qa-header {
      padding: 16px 20px;
      display: flex;
      align-items: flex-start;
      gap: 12px;
      cursor: pointer;
      user-select: none;
    }

    .qa-id {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 28px;
      height: 28px;
      background: var(--primary-light);
      color: var(--primary);
      border-radius: 6px;
      font-size: 13px;
      font-weight: 700;
      margin-top: 2px;
      flex-shrink: 0;
    }

    .qa-question {
      flex: 1;
      font-size: 15px;
      font-weight: 600;
      color: var(--text-main);
      padding-top: 2px;
    }

    .qa-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .master-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 18px;
      padding: 4px;
      border-radius: 6px;
      transition: transform 0.15s, color 0.15s;
    }

    .master-btn:hover {
      transform: scale(1.15);
    }

    .master-btn.is-mastered {
      color: var(--accent);
    }

    .expand-icon {
      color: var(--text-muted);
      font-size: 14px;
      transition: transform 0.2s ease;
    }

    .qa-card.open .expand-icon {
      transform: rotate(180deg);
    }

    .qa-answer {
      display: none;
      padding: 16px 20px 18px 60px;
      background: var(--bg-color);
      border-top: 1px dashed var(--border-color);
      font-size: 15px;
      color: var(--text-main);
      line-height: 1.7;
    }

    .qa-card.open .qa-answer {
      display: block;
      animation: fadeIn 0.2s ease-in;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Flashcard Mode */
    .flashcard-container {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      padding: 10px 0;
    }

    .flashcard-wrapper {
      perspective: 1000px;
      width: 100%;
      max-width: 640px;
      min-height: 340px;
      cursor: pointer;
    }

    .flashcard-inner {
      position: relative;
      width: 100%;
      height: 100%;
      min-height: 340px;
      text-align: center;
      transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
      transform-style: preserve-3d;
      border-radius: 16px;
      box-shadow: var(--shadow-lg);
    }

    .flashcard-wrapper.flipped .flashcard-inner {
      transform: rotateY(180deg);
    }

    .flashcard-face {
      position: absolute;
      width: 100%;
      height: 100%;
      min-height: 340px;
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 30px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      box-sizing: border-box;
    }

    .flashcard-back {
      transform: rotateY(180deg);
      background: var(--card-bg);
      border: 2px solid var(--primary);
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      color: var(--text-muted);
    }

    .card-badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 99px;
      font-weight: 600;
      font-size: 12px;
    }

    .badge-q {
      background: var(--primary-light);
      color: var(--primary);
    }

    .badge-a {
      background: var(--success-light);
      color: var(--success);
    }

    .card-body {
      margin: auto 0;
      padding: 20px 10px;
      font-size: 18px;
      font-weight: 600;
      line-height: 1.6;
    }

    .card-hint {
      font-size: 12px;
      color: var(--text-muted);
    }

    .flashcard-controls {
      display: flex;
      gap: 12px;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 640px;
    }

    .flashcard-controls .btn {
      padding: 10px 20px;
      font-size: 14px;
      font-weight: 600;
    }

    .btn-primary {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    .btn-primary:hover {
      background: var(--primary-hover);
    }

    .shortcuts-hint {
      font-size: 12px;
      color: var(--text-muted);
      text-align: center;
      margin-top: 8px;
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
      background: var(--card-bg);
      border-radius: var(--radius);
      border: 1px dashed var(--border-color);
    }
  </style>
</head>
<body>
  <header>
    <div class="header-container">
      <div class="nav-left">
        <a href="index.html" class="back-btn" title="回目錄">← 目錄</a>
        <h1 class="page-title">Day15 問答卡</h1>
      </div>
      <div class="header-actions">
        <button class="theme-toggle" id="themeToggleBtn" type="button" onclick="toggleTheme()" aria-label="切換為深色模式">深色模式</button>
        <div class="view-toggles">
          <button id="listViewBtn" class="toggle-btn active" onclick="switchMode('list')">📋 列表模式</button>
          <button id="cardViewBtn" class="toggle-btn" onclick="switchMode('card')">🎴 翻卡測驗</button>
        </div>
      </div>
    </div>
  </header>

  <main>
    <div class="toolbar">
      <div class="search-box">
        <span class="search-icon">🔍</span>
        <input type="text" id="searchInput" placeholder="搜尋問題或答案關鍵字..." oninput="handleSearch()">
      </div>
      <div class="action-buttons">
        <button class="btn" id="filterMasteredBtn" onclick="toggleFilterMastered()">⭐ 只看未掌握</button>
        <button class="btn" id="expandAllBtn" onclick="toggleExpandAll()">展開全部</button>
        <button class="btn" onclick="shuffleCards()">🔀 隨機洗牌</button>
        <button class="btn" onclick="resetOrder()">🔄 恢復順序</button>
      </div>
    </div>

    <div class="stats-bar">
      <span id="statsCount">總計 0 題</span>
      <div class="progress-bar-container">
        <div id="progressFill" class="progress-fill"></div>
      </div>
      <span id="statsMastered">掌握率 0%</span>
    </div>

    <!-- List View -->
    <div id="qaList" class="qa-list"></div>

    <!-- Flashcard Mode View -->
    <div id="flashcardContainer" class="flashcard-container">
      <div class="flashcard-wrapper" id="flashcardWrapper" onclick="flipCard()">
        <div class="flashcard-inner">
          <!-- Front Face -->
          <div class="flashcard-face flashcard-front">
            <div class="card-top">
              <span class="card-badge badge-q">問題</span>
              <span id="fcCardNumber">卡片 1 / 1</span>
              <button class="master-btn" id="fcMasterBtn" onclick="toggleCardMaster(event)" title="標記為已掌握">★</button>
            </div>
            <div class="card-body" id="fcQuestion">載入中...</div>
            <div class="card-hint">💡 點擊卡片或按空白鍵翻面看答案</div>
          </div>
          <!-- Back Face -->
          <div class="flashcard-face flashcard-back">
            <div class="card-top">
              <span class="card-badge badge-a">解答</span>
              <span id="fcCardNumberBack">卡片 1 / 1</span>
              <button class="master-btn" id="fcMasterBtnBack" onclick="toggleCardMaster(event)" title="標記為已掌握">★</button>
            </div>
            <div class="card-body" id="fcAnswer">載入中...</div>
            <div class="card-hint">💡 再次點擊卡片翻回正面</div>
          </div>
        </div>
      </div>

      <div class="flashcard-controls">
        <button class="btn" onclick="prevCard()">← 上一題</button>
        <button class="btn btn-primary" onclick="flipCard()">翻轉卡片</button>
        <button class="btn" onclick="nextCard()">下一題 →</button>
      </div>
      <div class="shortcuts-hint">鍵盤快速鍵：[←] 上一題 · [空白鍵] 翻面 · [→] 下一題 · [M] 標記掌握</div>
    </div>
  </main>

  <script>
    const THEME_STORAGE_KEY = "qa_theme";
    const STORAGE_KEY = "anki_mastered_" + "Day15";
    const RAW_DATA = [{"id":1,"question":"根據商業雜誌數據，獲取一個新客戶的成本大約是保留既有客戶的幾倍？","answer":"5 到 7 倍。"},{"id":2,"question":"在銀行產業中，用戶轉換成本呈現什麼樣的特徵？","answer":"非常低。"},{"id":3,"question":"銀行客戶流失預測模型的主要目標是識別哪兩類客戶族群？","answer":"高風險流失客戶與高忠誠客戶。"},{"id":4,"question":"針對高流失風險的客戶，企業可以採取哪些挽留方案？","answer":"寄發關懷信件或提供更多信用卡優惠。"},{"id":5,"question":"針對高忠誠客戶，企業可以採取哪些提升忠誠度的方案？","answer":"升級為 VVIP 或優先理財戶。"},{"id":6,"question":"在流失預測專題中，資料集是否存在缺失值、重複值或極端值？","answer":"不存在，資料非常乾淨。"},{"id":7,"question":"在流失預測模型中，哪兩個欄位因對訓練無意義而被排除？","answer":"Customer ID（客戶編號）與 Surname（姓氏）。"},{"id":8,"question":"在 categorical（類別型）欄位中，'Geography' 包含哪三個國家？","answer":"法國、西班牙與德國。"},{"id":9,"question":"在 'Tenure' 欄位中，數值為 0 代表什麼意思？","answer":"未滿一年的新客戶。"},{"id":10,"question":"EDA 發現該銀行客戶年齡主要集中在什麼範圍？","answer":"30 到 40 歲。"},{"id":11,"question":"EDA 發現該銀行的 'Balance'（餘額）分布有一個特別的現象，是什麼？","answer":"有許多餘額為零的客戶。"},{"id":12,"question":"流失預測資料集中，流失與未流失的比例約為 1 比 4，這稱為什麼狀態？","answer":"資料不平衡（Data Imbalance）狀態。"},{"id":13,"question":"該組選擇哪項指標作為流失預測模型的主要評估指標？","answer":"ROCAUC。"},{"id":14,"question":"為什麼 ROCAUC 比準確率（Accuracy）更適合處理不平衡資料？","answer":"它能反映整體的排序能力，避免被高準確率誤導。"},{"id":15,"question":"EDA 顯示哪一個國家的客戶流失率明顯偏高？","answer":"德國。"},{"id":16,"question":"使用多少項產品的客戶，流失率表現出極高的異常值？","answer":"四項產品。"},{"id":17,"question":"在特徵編碼方面，該專題最終選擇了哪種方式？","answer":"One-Hot Encoder（獨熱編碼）。"},{"id":18,"question":"為什麼在特徵不多時選擇 One-Hot Encoder？","answer":"結構簡單直觀，且無維度爆炸問題。"},{"id":19,"question":"特徵工程中，將年齡每 20 歲分為一組的行為稱為什麼？","answer":"數據分組（Data Binning）。"},{"id":20,"question":"該小組比較的三種機器學習演算法分別為何？","answer":"XGBoost, LightGBM (LGBM), Random Forest。"},{"id":21,"question":"與 Grid Search 相比，Bayesian Optimization (TPE) 的優點為何？","answer":"會利用歷史資訊，減少探索次數，提升搜索效率。"},{"id":22,"question":"在超參數優化中，Grid Search 面臨的主要問題是什麼？","answer":"維度的詛咒（當參數多時組合數呈指數增長）。"},{"id":23,"question":"小組定義的過擬合（Overfitting）標準為何？","answer":"訓練與驗證指標差異超過 $5\\%$ 到 $10\\%$。"},{"id":24,"question":"實驗結果顯示，哪種演算法發生過擬合的機率最高？","answer":"XGBoost。"},{"id":25,"question":"統計檢定顯示，哪兩種演算法的性能表現顯著優於 Random Forest？","answer":"XGBoost 與 LightGBM。"},{"id":26,"question":"在介面實作中，為防止用戶輸入錯誤格式，類別欄位建議如何設計？","answer":"改為下拉式選單。"},{"id":27,"question":"RFM 模型中的 'R' 代表什麼含義？","answer":"Recency（最近一次交易時間）。"},{"id":28,"question":"RFM 模型中的 'F' 代表什麼含義？","answer":"Frequency（交易頻率）。"},{"id":29,"question":"RFM 模型中的 'M' 代表什麼含義？","answer":"Monetary Value（交易金額/貨幣價值）。"},{"id":30,"question":"大數據（Big Data）的 4V 模型包含哪些維度？","answer":"Volume (量), Variety (多樣性), Velocity (速度), Veracity (真實性/正確性)。"},{"id":31,"question":"分群（Clustering）屬於哪種機器學習方法？","answer":"非監督式學習（Unsupervised Learning）。"},{"id":32,"question":"DBSCAN 演算法相對於 K-means 的主要優點為何？","answer":"對資料形狀不敏感，且能偵測不規則形狀與雜訊。"},{"id":33,"question":"DBSCAN 演算法主要基於哪兩個參數進行分群？","answer":"半徑 ($EPS$) 與最少點數 ($MinPts$)。"},{"id":34,"question":"Map-Reduce 框架的設計核心思想是什麼？","answer":"分而治之（Split and Overcome）。"},{"id":35,"question":"在 RFM 分析中，若 R 數值較低（$R \\downarrow$）代表什麼？","answer":"代表客戶最近剛進行過交易，對公司是優選狀態。"},{"id":36,"question":"在客戶價值金字塔中，具有 $R \\downarrow F \\uparrow M \\uparrow$ 特徵的客戶通常被稱為什麼？","answer":"忠誠客戶（Loyal Customer）。"},{"id":37,"question":"若客戶特徵為 $R \\uparrow F \\downarrow M \\downarrow$，這類客戶通常被視為？","answer":"流失客戶（Lost Customer）。"},{"id":38,"question":"DBSCAN 中的 'Noise points' 是指什麼？","answer":"低密度區域中的點，不屬於任何群集。"},{"id":39,"question":"在使用 RFM 資料前，由於各指標單位不同，必須進行什麼處理？","answer":"標準化或正規化（Normalization）。"},{"id":40,"question":"寫出 Min-Max 正規化的公式。","answer":"$x' = \\frac{x - x_{min}}{x_{max} - x_{min}}$。"},{"id":41,"question":"在 DBSCAN 論文實驗中，識別出的第一群集（$R \\downarrow F \\uparrow M \\uparrow$）代表哪類客戶？","answer":"特惠/特殊忠誠客戶，如大股東或投資公司業主。"},{"id":42,"question":"CRISP-DM 模型包含哪六個階段？","answer":"業務理解、資料理解、資料準備、建模、模型評估、部署。"},{"id":43,"question":"Calinski-Harabasz (CH) 指標的數值越大代表什麼？","answer":"分群效果越好（群內凝聚力強且群間分離度高）。"},{"id":44,"question":"當資料存在缺失值時，若不使用平均值，論文建議使用什麼統計值填補？","answer":"中位數（Median）。"},{"id":45,"question":"在信用卡預測模型中，訓練集與測試集的常見分割比例是多少？","answer":"$80\\%$ 為訓練集，$20\\%$ 為測試集。"},{"id":46,"question":"什麼是 'Waterfall mechanism'（瀑布機制）？","answer":"當數位歐元錢包餘額超過限額時，自動將多餘資金轉回連結帳戶。"},{"id":47,"question":"什麼是 'Reverse-waterfall logic'（反向瀑布邏輯）？","answer":"當交易金額超過錢包餘額時，自動從帳戶補足資金至錢包。"},{"id":48,"question":"DESP 是指什麼縮寫？","answer":"Digital Euro Service Platform（數位歐元服務平台）。"},{"id":49,"question":"數位歐元錢包預計對零售用戶設定的持有上限大約是多少？","answer":"3,000 歐元。"},{"id":50,"question":"數位歐元的 'Offline functionality'（線下功能）解決了什麼問題？","answer":"讓用戶在沒有即時網路連接的情況下也能進行交易。"},{"id":51,"question":"SEPI 系統的主要功能為何？","answer":"提供安全令牌服務，取代敏感支付資訊以確保資安。"},{"id":52,"question":"數位歐元引入後，銀行面臨的主要結構性風險是什麼？","answer":"流動性壓力（資金從商業銀行存款轉向央行貨幣）。"},{"id":53,"question":"在特徵工程中，創建 'Senior' 標記是為了反應什麼數據關係？","answer":"高齡客戶的特定行為或分佈情況。"},{"id":54,"question":"在 Random Forest 演算法中，超參數優化是否能顯著提升該專題的性能？","answer":"統計檢定顯示無顯著提升。"},{"id":55,"question":"One-Hot Encoding 會產生什麼潛在問題（雖然在該專題中未發生）？","answer":"維度爆炸（當類別數量極多時）。"},{"id":56,"question":"為何在流失預測中要將資料分為數值型（Numerical）與類別型（Categorical）？","answer":"因為不同類型的資料需要不同的前處理與編碼方式。"},{"id":57,"question":"在統計檢定中，若 $p$-value 小於 $0.05$ 代表什麼？","answer":"拒絕虛無假設，代表差異具備顯著性。"},{"id":58,"question":"在流失預測案例中，女性與男性的流失率誰較高？","answer":"女性。"},{"id":59,"question":"活躍用戶（Active Member）與非活躍用戶的流失率關係為何？","answer":"活躍用戶流失率顯著較低。"},{"id":60,"question":"Bayesian Optimization 中的 'TPE' 是指什麼框架？","answer":"Tree-structured Parzen Estimator。"},{"id":61,"question":"在進行特徵工程後，統計檢定顯示對模型性能有顯著影響嗎？","answer":"沒有顯著差異，顯示特徵工程仍有優化空間。"},{"id":62,"question":"銀行為什麼需要實施 24/7/365 的維運能力來支持數位歐元？","answer":"因為它是即時支付工具，需滿足法規對可用性的要求。"},{"id":63,"question":"數位歐元與 SEPA Instant 的共同技術挑戰是什麼？","answer":"舊有支付架構難以支持即時的 API 請求與響應處理。"},{"id":64,"question":"在個人信用分群中，什麼情況會導致 Account Officer 處理錯誤？","answer":"缺乏決策支持系統，無法及時掌握潛在違約客戶。"},{"id":65,"question":"在 K-means 研究中，CH 指標顯示的最佳分群數量是多少？","answer":"2 群，但為了實務需求通常選擇更高（如 4 群）。"},{"id":66,"question":"在個人信用分群中，'Cluster 2' 被定義為高優先級是因為？","answer":"該群客戶活動度、餘額與交易頻率皆極低，違約風險最高。"},{"id":67,"question":"Apache Hive 在大數據架構中的作用是什麼？","answer":"作為數據倉庫，用於查詢與分析分佈式環境中的海量數據。"},{"id":68,"question":"Apache Hadoop 的核心特性之一為何？","answer":"大量資料集的分割與平行處理。"},{"id":69,"question":"DBSCAN 的 $Eps$ 參數定義了什麼？","answer":"鄰域半徑，用於判斷點與點之間是否足夠接近以形成密度。"},{"id":70,"question":"在 RFM 分群中，哪一類客戶是銀行最需優先保留的？","answer":"R 數值小、F 與 M 數值大的忠誠客戶。"},{"id":71,"question":"數位歐元的引入預計會增加銀行對哪種市場資金的依賴？","answer":"批發市場（Wholesale markets）。"},{"id":72,"question":"對於數位歐元的 AML（反洗錢）檢查，其要求為何？","answer":"需在交易流中即時完成檢查，而非事後批次處理。"},{"id":73,"question":"CRM 系統在銀行中的主要作用是什麼？","answer":"改善客戶關係、提升交叉銷售（Cross-selling）效率。"},{"id":74,"question":"在個人信用數據前處理中，為什麼要刪除空值比例大於 $70\\%$ 的變數？","answer":"因為這些變數無法提供足夠的資訊進行有效分群。"},{"id":75,"question":"何謂 'Binary Question'？","answer":"僅能回答 是/否 或 對/錯 的問題，在學習中應盡量避免。"},{"id":76,"question":"在貝氏優化中，'Informer search' 的核心概念為何？","answer":"利用已有的搜索歷史來引導下一步的參數挑選。"},{"id":77,"question":"專題中提到的 'Gradio' 平台用於實現什麼功能？","answer":"部署模型的使用者介面。"},{"id":78,"question":"在特徵工程中，'Plus' 特徵代表什麼意義？","answer":"客戶平均每年購買的產品數量。"},{"id":79,"question":"EDA 中提到，哪個因素會使客戶流失率變得極高（接近 $100\\%$）？","answer":"同時使用四項銀行產品。"},{"id":80,"question":"數位歐元與現有商業銀行存款的主要區別為何？","answer":"前者是央行貨幣（Central Bank Money），後者是商業銀行貨幣。"}];
    let currentData = [...RAW_DATA];
    let masteredSet = new Set(JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]"));
    let currentMode = 'list';
    let filterOnlyUnmastered = false;
    let isAllExpanded = false;
    let cardIndex = 0;

    function applyTheme(theme) {
      const normalizedTheme = theme === "dark" ? "dark" : "light";
      document.documentElement.dataset.theme = normalizedTheme;

      const btn = document.getElementById("themeToggleBtn");
      if (btn) {
        const isDark = normalizedTheme === "dark";
        btn.textContent = isDark ? "淺色模式" : "深色模式";
        btn.setAttribute("aria-label", isDark ? "切換為淺色模式" : "切換為深色模式");
      }
    }

    function initializeTheme() {
      const savedTheme = localStorage.getItem(THEME_STORAGE_KEY) || "light";
      applyTheme(savedTheme);
    }

    function toggleTheme() {
      const nextTheme = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
      localStorage.setItem(THEME_STORAGE_KEY, nextTheme);
      applyTheme(nextTheme);
    }

    initializeTheme();

    function saveMastered() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(Array.from(masteredSet)));
      updateStats();
    }

    function updateStats() {
      const total = RAW_DATA.length;
      const masteredCount = RAW_DATA.filter(item => masteredSet.has(item.id)).length;
      const pct = total === 0 ? 0 : Math.round((masteredCount / total) * 100);

      document.getElementById('statsCount').textContent = `顯示 ${currentData.length} / 共 ${total} 題`;
      document.getElementById('statsMastered').textContent = `已掌握 ${masteredCount} 題 (${pct}%)`;
      document.getElementById('progressFill').style.width = pct + '%';
    }

    function renderMath() {
      if (window.renderMathInElement) {
        renderMathInElement(document.body, {
          delimiters: [
            {left: '$$', right: '$$', display: true},
            {left: '$', right: '$', display: false}
          ],
          throwOnError: false
        });
      }
    }

    function renderList() {
      const container = document.getElementById('qaList');
      if (currentData.length === 0) {
        container.innerHTML = '<div class="empty-state">沒有符合條件的問答卡片</div>';
        return;
      }

      container.innerHTML = currentData.map(item => {
        const isMastered = masteredSet.has(item.id);
        return `
          <div class="qa-card ${isMastered ? 'mastered' : ''} ${isAllExpanded ? 'open' : ''}" id="card-${item.id}">
            <div class="qa-header" onclick="toggleItem(${item.id})">
              <span class="qa-id">#${item.id}</span>
              <span class="qa-question">${escapeHtml(item.question)}</span>
              <div class="qa-actions">
                <button class="master-btn ${isMastered ? 'is-mastered' : ''}"
                        onclick="toggleMaster(event, ${item.id})"
                        title="${isMastered ? '已掌握' : '標記掌握'}">★</button>
                <span class="expand-icon">▼</span>
              </div>
            </div>
            <div class="qa-answer">${escapeHtml(item.answer)}</div>
          </div>
        `;
      }).join('');

      renderMath();
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    function toggleItem(id) {
      const el = document.getElementById('card-' + id);
      if (el) {
        el.classList.toggle('open');
      }
    }

    function toggleMaster(event, id) {
      event.stopPropagation();
      if (masteredSet.has(id)) {
        masteredSet.delete(id);
      } else {
        masteredSet.add(id);
      }
      saveMastered();
      applyFilters();
    }

    function toggleExpandAll() {
      isAllExpanded = !isAllExpanded;
      document.getElementById('expandAllBtn').textContent = isAllExpanded ? "收合全部" : "展開全部";
      document.querySelectorAll('.qa-card').forEach(card => {
        if (isAllExpanded) {
          card.classList.add('open');
        } else {
          card.classList.remove('open');
        }
      });
    }

    function toggleFilterMastered() {
      filterOnlyUnmastered = !filterOnlyUnmastered;
      const btn = document.getElementById('filterMasteredBtn');
      btn.classList.toggle('active-filter', filterOnlyUnmastered);
      btn.textContent = filterOnlyUnmastered ? "✓ 僅顯示未掌握" : "⭐ 只看未掌握";
      applyFilters();
    }

    function handleSearch() {
      applyFilters();
    }

    function applyFilters() {
      const query = document.getElementById('searchInput').value.trim().toLowerCase();
      currentData = RAW_DATA.filter(item => {
        if (filterOnlyUnmastered && masteredSet.has(item.id)) {
          return false;
        }
        if (query) {
          const matchQ = item.question.toLowerCase().includes(query);
          const matchA = item.answer.toLowerCase().includes(query);
          return matchQ || matchA;
        }
        return true;
      });

      cardIndex = 0;
      if (currentMode === 'list') {
        renderList();
      } else {
        updateCardView();
      }
      updateStats();
    }

    function shuffleCards() {
      currentData.sort(() => Math.random() - 0.5);
      cardIndex = 0;
      if (currentMode === 'list') {
        renderList();
      } else {
        updateCardView();
      }
    }

    function resetOrder() {
      currentData.sort((a, b) => a.id - b.id);
      cardIndex = 0;
      if (currentMode === 'list') {
        renderList();
      } else {
        updateCardView();
      }
    }

    function switchMode(mode) {
      currentMode = mode;
      const listBtn = document.getElementById('listViewBtn');
      const cardBtn = document.getElementById('cardViewBtn');
      const qaList = document.getElementById('qaList');
      const flashcardContainer = document.getElementById('flashcardContainer');
      const expandAllBtn = document.getElementById('expandAllBtn');

      if (mode === 'list') {
        listBtn.classList.add('active');
        cardBtn.classList.remove('active');
        qaList.style.display = 'flex';
        flashcardContainer.style.display = 'none';
        expandAllBtn.style.display = 'inline-flex';
        renderList();
      } else {
        cardBtn.classList.add('active');
        listBtn.classList.remove('active');
        qaList.style.display = 'none';
        flashcardContainer.style.display = 'flex';
        expandAllBtn.style.display = 'none';
        updateCardView();
      }
    }

    /* Flashcard Functions */
    function flipCard() {
      const wrapper = document.getElementById('flashcardWrapper');
      wrapper.classList.toggle('flipped');
    }

    function updateCardView() {
      const wrapper = document.getElementById('flashcardWrapper');
      wrapper.classList.remove('flipped');

      if (currentData.length === 0) {
        document.getElementById('fcQuestion').textContent = '無卡片資料';
        document.getElementById('fcAnswer').textContent = '無卡片資料';
        document.getElementById('fcCardNumber').textContent = '0 / 0';
        document.getElementById('fcCardNumberBack').textContent = '0 / 0';
        return;
      }

      if (cardIndex < 0) cardIndex = 0;
      if (cardIndex >= currentData.length) cardIndex = currentData.length - 1;

      const item = currentData[cardIndex];
      const isMastered = masteredSet.has(item.id);

      document.getElementById('fcQuestion').textContent = item.question;
      document.getElementById('fcAnswer').textContent = item.answer;

      const cardNumText = `卡片 ${cardIndex + 1} / ${currentData.length} (#${item.id})`;
      document.getElementById('fcCardNumber').textContent = cardNumText;
      document.getElementById('fcCardNumberBack').textContent = cardNumText;

      const btn1 = document.getElementById('fcMasterBtn');
      const btn2 = document.getElementById('fcMasterBtnBack');
      btn1.classList.toggle('is-mastered', isMastered);
      btn2.classList.toggle('is-mastered', isMastered);

      renderMath();
    }

    function prevCard() {
      if (currentData.length === 0) return;
      cardIndex = (cardIndex - 1 + currentData.length) % currentData.length;
      updateCardView();
    }

    function nextCard() {
      if (currentData.length === 0) return;
      cardIndex = (cardIndex + 1) % currentData.length;
      updateCardView();
    }

    function toggleCardMaster(event) {
      event.stopPropagation();
      if (currentData.length === 0) return;
      const item = currentData[cardIndex];
      toggleMaster(event, item.id);
      updateCardView();
    }

    /* Keyboard Shortcuts */
    window.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT') return;
      if (currentMode === 'card') {
        if (e.code === 'Space') {
          e.preventDefault();
          flipCard();
        } else if (e.code === 'ArrowLeft') {
          e.preventDefault();
          prevCard();
        } else if (e.code === 'ArrowRight') {
          e.preventDefault();
          nextCard();
        } else if (e.code === 'KeyM') {
          e.preventDefault();
          toggleCardMaster(e);
        }
      }
    });

    // Init
    window.addEventListener('DOMContentLoaded', () => {
      updateStats();
      renderList();
      setTimeout(renderMath, 200);
    });
  </script>
</body>
</html>
