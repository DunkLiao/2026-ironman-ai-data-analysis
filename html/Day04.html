<!DOCTYPE html>
<html lang="zh-TW" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Day04 - 問答複習卡</title>
  <!-- KaTeX for LaTeX rendering -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
  <style>
    :root {
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --primary-light: #eff6ff;
      --border-color: #e2e8f0;
      --success: #10b981;
      --success-light: #ecfdf5;
      --accent: #f59e0b;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
      --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.08), 0 2px 4px -2px rgba(0,0,0,0.05);
      --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.1), 0 4px 6px -4px rgba(0,0,0,0.05);
      --radius: 12px;
    }

    html[data-theme="dark"] {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #60a5fa;
      --primary-hover: #3b82f6;
      --primary-light: #1e3a8a33;
      --border-color: #334155;
      --success: #34d399;
      --success-light: #064e3b33;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans TC", sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      line-height: 1.6;
      padding-bottom: 60px;
    }

    /* Navigation / Header */
    header {
      background: var(--card-bg);
      border-bottom: 1px solid var(--border-color);
      position: sticky;
      top: 0;
      z-index: 50;
      box-shadow: var(--shadow-sm);
    }

    .header-container {
      max-width: 900px;
      margin: 0 auto;
      padding: 14px 20px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .nav-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 8px;
      background: var(--primary-light);
      color: var(--primary);
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      transition: all 0.2s;
    }

    .back-btn:hover {
      background: var(--primary);
      color: #fff;
    }

    .page-title {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .view-toggles {
      display: flex;
      background: var(--bg-color);
      padding: 3px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
    }

    .header-actions {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: flex-end;
    }

    .toggle-btn {
      padding: 6px 14px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .toggle-btn.active {
      background: var(--card-bg);
      color: var(--primary);
      box-shadow: var(--shadow-sm);
    }

    .theme-toggle {
      padding: 7px 12px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      background: var(--card-bg);
      color: var(--text-main);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: var(--shadow-sm);
      transition: border-color 0.2s, color 0.2s, background 0.2s;
    }

    .theme-toggle:hover {
      border-color: var(--primary);
      color: var(--primary);
    }

    /* Main Container */
    main {
      max-width: 900px;
      margin: 24px auto;
      padding: 0 20px;
    }

    /* Toolbar */
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 20px;
      align-items: center;
      justify-content: space-between;
    }

    .search-box {
      flex: 1;
      min-width: 240px;
      position: relative;
    }

    .search-box input {
      width: 100%;
      padding: 10px 14px 10px 38px;
      border-radius: 10px;
      border: 1px solid var(--border-color);
      background: var(--card-bg);
      color: var(--text-main);
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-box input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-light);
    }

    .search-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 14px;
    }

    .action-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background: var(--card-bg);
      color: var(--text-main);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn:hover {
      background: var(--border-color);
    }

    .btn.active-filter {
      background: var(--primary-light);
      border-color: var(--primary);
      color: var(--primary);
    }

    /* Stats bar */
    .stats-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      font-size: 14px;
      color: var(--text-muted);
    }

    .progress-bar-container {
      flex: 1;
      height: 8px;
      background: var(--border-color);
      border-radius: 99px;
      margin: 0 16px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: var(--success);
      width: 0%;
      transition: width 0.3s ease;
    }

    /* List View Cards */
    .qa-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .qa-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      box-shadow: var(--shadow-sm);
      overflow: hidden;
      transition: box-shadow 0.2s, border-color 0.2s;
    }

    .qa-card:hover {
      box-shadow: var(--shadow-md);
      border-color: #cbd5e1;
    }

    .qa-card.mastered {
      border-left: 4px solid var(--success);
    }

    .qa-header {
      padding: 16px 20px;
      display: flex;
      align-items: flex-start;
      gap: 12px;
      cursor: pointer;
      user-select: none;
    }

    .qa-id {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 28px;
      height: 28px;
      background: var(--primary-light);
      color: var(--primary);
      border-radius: 6px;
      font-size: 13px;
      font-weight: 700;
      margin-top: 2px;
      flex-shrink: 0;
    }

    .qa-question {
      flex: 1;
      font-size: 15px;
      font-weight: 600;
      color: var(--text-main);
      padding-top: 2px;
    }

    .qa-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .master-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 18px;
      padding: 4px;
      border-radius: 6px;
      transition: transform 0.15s, color 0.15s;
    }

    .master-btn:hover {
      transform: scale(1.15);
    }

    .master-btn.is-mastered {
      color: var(--accent);
    }

    .expand-icon {
      color: var(--text-muted);
      font-size: 14px;
      transition: transform 0.2s ease;
    }

    .qa-card.open .expand-icon {
      transform: rotate(180deg);
    }

    .qa-answer {
      display: none;
      padding: 16px 20px 18px 60px;
      background: var(--bg-color);
      border-top: 1px dashed var(--border-color);
      font-size: 15px;
      color: var(--text-main);
      line-height: 1.7;
    }

    .qa-card.open .qa-answer {
      display: block;
      animation: fadeIn 0.2s ease-in;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Flashcard Mode */
    .flashcard-container {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      padding: 10px 0;
    }

    .flashcard-wrapper {
      perspective: 1000px;
      width: 100%;
      max-width: 640px;
      min-height: 340px;
      cursor: pointer;
    }

    .flashcard-inner {
      position: relative;
      width: 100%;
      height: 100%;
      min-height: 340px;
      text-align: center;
      transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
      transform-style: preserve-3d;
      border-radius: 16px;
      box-shadow: var(--shadow-lg);
    }

    .flashcard-wrapper.flipped .flashcard-inner {
      transform: rotateY(180deg);
    }

    .flashcard-face {
      position: absolute;
      width: 100%;
      height: 100%;
      min-height: 340px;
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 30px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      box-sizing: border-box;
    }

    .flashcard-back {
      transform: rotateY(180deg);
      background: var(--card-bg);
      border: 2px solid var(--primary);
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      color: var(--text-muted);
    }

    .card-badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 99px;
      font-weight: 600;
      font-size: 12px;
    }

    .badge-q {
      background: var(--primary-light);
      color: var(--primary);
    }

    .badge-a {
      background: var(--success-light);
      color: var(--success);
    }

    .card-body {
      margin: auto 0;
      padding: 20px 10px;
      font-size: 18px;
      font-weight: 600;
      line-height: 1.6;
    }

    .card-hint {
      font-size: 12px;
      color: var(--text-muted);
    }

    .flashcard-controls {
      display: flex;
      gap: 12px;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 640px;
    }

    .flashcard-controls .btn {
      padding: 10px 20px;
      font-size: 14px;
      font-weight: 600;
    }

    .btn-primary {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    .btn-primary:hover {
      background: var(--primary-hover);
    }

    .shortcuts-hint {
      font-size: 12px;
      color: var(--text-muted);
      text-align: center;
      margin-top: 8px;
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
      background: var(--card-bg);
      border-radius: var(--radius);
      border: 1px dashed var(--border-color);
    }
  </style>
</head>
<body>
  <header>
    <div class="header-container">
      <div class="nav-left">
        <a href="index.html" class="back-btn" title="回目錄">← 目錄</a>
        <h1 class="page-title">Day04 問答卡</h1>
      </div>
      <div class="header-actions">
        <button class="theme-toggle" id="themeToggleBtn" type="button" onclick="toggleTheme()" aria-label="切換為深色模式">深色模式</button>
        <div class="view-toggles">
          <button id="listViewBtn" class="toggle-btn active" onclick="switchMode('list')">📋 列表模式</button>
          <button id="cardViewBtn" class="toggle-btn" onclick="switchMode('card')">🎴 翻卡測驗</button>
        </div>
      </div>
    </div>
  </header>

  <main>
    <div class="toolbar">
      <div class="search-box">
        <span class="search-icon">🔍</span>
        <input type="text" id="searchInput" placeholder="搜尋問題或答案關鍵字..." oninput="handleSearch()">
      </div>
      <div class="action-buttons">
        <button class="btn" id="filterMasteredBtn" onclick="toggleFilterMastered()">⭐ 只看未掌握</button>
        <button class="btn" id="expandAllBtn" onclick="toggleExpandAll()">展開全部</button>
        <button class="btn" onclick="shuffleCards()">🔀 隨機洗牌</button>
        <button class="btn" onclick="resetOrder()">🔄 恢復順序</button>
      </div>
    </div>

    <div class="stats-bar">
      <span id="statsCount">總計 0 題</span>
      <div class="progress-bar-container">
        <div id="progressFill" class="progress-fill"></div>
      </div>
      <span id="statsMastered">掌握率 0%</span>
    </div>

    <!-- List View -->
    <div id="qaList" class="qa-list"></div>

    <!-- Flashcard Mode View -->
    <div id="flashcardContainer" class="flashcard-container">
      <div class="flashcard-wrapper" id="flashcardWrapper" onclick="flipCard()">
        <div class="flashcard-inner">
          <!-- Front Face -->
          <div class="flashcard-face flashcard-front">
            <div class="card-top">
              <span class="card-badge badge-q">問題</span>
              <span id="fcCardNumber">卡片 1 / 1</span>
              <button class="master-btn" id="fcMasterBtn" onclick="toggleCardMaster(event)" title="標記為已掌握">★</button>
            </div>
            <div class="card-body" id="fcQuestion">載入中...</div>
            <div class="card-hint">💡 點擊卡片或按空白鍵翻面看答案</div>
          </div>
          <!-- Back Face -->
          <div class="flashcard-face flashcard-back">
            <div class="card-top">
              <span class="card-badge badge-a">解答</span>
              <span id="fcCardNumberBack">卡片 1 / 1</span>
              <button class="master-btn" id="fcMasterBtnBack" onclick="toggleCardMaster(event)" title="標記為已掌握">★</button>
            </div>
            <div class="card-body" id="fcAnswer">載入中...</div>
            <div class="card-hint">💡 再次點擊卡片翻回正面</div>
          </div>
        </div>
      </div>

      <div class="flashcard-controls">
        <button class="btn" onclick="prevCard()">← 上一題</button>
        <button class="btn btn-primary" onclick="flipCard()">翻轉卡片</button>
        <button class="btn" onclick="nextCard()">下一題 →</button>
      </div>
      <div class="shortcuts-hint">鍵盤快速鍵：[←] 上一題 · [空白鍵] 翻面 · [→] 下一題 · [M] 標記掌握</div>
    </div>
  </main>

  <script>
    const THEME_STORAGE_KEY = "qa_theme";
    const STORAGE_KEY = "anki_mastered_" + "Day04";
    const RAW_DATA = [{"id":1,"question":"在數據品質管理中，「維度」（Dimensions）與「指標」（Metrics）的主要區別為何？","answer":"維度是品質問題的類別，而指標是衡量維度具體表現的量化或定性標準。"},{"id":2,"question":"數據品質中的「關鍵績效指標」（KPIs）與一般指標有何不同？","answer":"KPIs 是反映企業達成特定業務目標成效的指標。"},{"id":3,"question":"數據品質維度：及時性（Timeliness）","answer":"定義：在正確的時間以正確的格式將事實呈現給正確的受眾，以支持決策。"},{"id":4,"question":"數據品質維度：準確性（Accuracy）","answer":"定義：數據正確描繪其所代表的真實世界事物或事件的程度。"},{"id":5,"question":"數據品質維度：完整性（Completeness）","answer":"定義：確保所有相關的數據點均可用，沒有分析缺口。"},{"id":6,"question":"數據品質維度：一致性（Consistency）","answer":"定義：跨數據集或跨時間的數據值遵循相同規則或表示方式，不產生矛盾。"},{"id":7,"question":"數據品質維度：有效性（Validity）","answer":"定義：數據符合預定義的規則、格式、範圍或業務邏輯。"},{"id":8,"question":"數據品質維度：唯一性（Uniqueness）","answer":"定義：確保每個數據點代表一個單獨的實體，避免數據重複。"},{"id":9,"question":"在計算「數據錯誤率」（Data to Errors Ratio）時，分母通常是什麼？","answer":"數據集的總大小。"},{"id":10,"question":"為什麼僅依賴「數據錯誤率」可能過於樂觀？","answer":"因為可能存在尚未被發現或識別的隱藏數據錯誤。"},{"id":11,"question":"在追蹤「空值數量」時，團隊應優先關注哪些數據欄位？","answer":"對整體業務價值有重大貢獻的關鍵欄位（例如郵政編碼或電話號碼）。"},{"id":12,"question":"數據轉換錯誤（Data Transformation Errors）頻發通常暗示了什麼問題？","answer":"底層數據品質不佳，如欄位缺失或出現非預期的數值。"},{"id":13,"question":"什麼是「暗數據」（Dark Data）？","answer":"企業收集並存儲但從未以任何方式使用的數據。"},{"id":14,"question":"數據存儲成本增加但使用量不變，這通常是哪種情況的信號？","answer":"數據品質不佳或存儲了大量無用的低品質數據。"},{"id":15,"question":"數據「轉化為價值所需時間」（Time-to-Value）與品質有何關係？","answer":"低品質數據需要大量人工清理，會顯著延長價值轉化的時間。"},{"id":16,"question":"電子郵件彈回率（Email Bounce Rates）高通常是由於數據品質的哪種問題？","answer":"客戶數據過時、不準確或缺失。"},{"id":17,"question":"「重複記錄百分比」指標與哪一個數據品質維度直接相關？","answer":"唯一性（Uniqueness）。"},{"id":18,"question":"數據更新延遲（Data Update Delays）主要是衡量哪一個維度的表現？","answer":"及時性（Timeliness）。"},{"id":19,"question":"數據管線事故（Data Pipeline Incidents）的監控有助於識別什麼風險？","answer":"數據完整性可能遭到破壞的地方。"},{"id":20,"question":"「表健康度」（Table Health）通常包含哪些測量指標？","answer":"缺失值數量、數據範圍、記錄完整性及及時性等聚合指標。"},{"id":21,"question":"什麼是 PPT 框架（People, Process, Technology）在提升數據品質中的作用？","answer":"作為組織運營開發的實施框架，從人員問責、業務流程及技術工具三方面改進數據品質。"},{"id":22,"question":"工程團隊如何透過 pull request 流程提升數據品質？","answer":"限制對上游系統的「破壞性變更」（breaking changes），以確保下游數據產品的穩定。"},{"id":23,"question":"什麼是數據剖析（Data Profiling）？","answer":"對數據進行詳細評估，以確定其結構、內容、關係、模式和異常情況。"},{"id":24,"question":"數據審計（Data Auditing）的定義為何？","answer":"將數據與預定義的規則和標準進行比較，以檢測異常和錯誤。"},{"id":25,"question":"數據清理（Data Cleansing）的主要目標是什麼？","answer":"修復或刪除錯誤、不完整或不相關的數據信息。"},{"id":26,"question":"根據 Oz Katz 的建議，應將數據品質指標轉化為合併門禁（Merge Gates），而非 _____。","answer":"儀表板事後報告（Dashboard Postmortems）。"},{"id":27,"question":"數據量測類型：標稱量表（Nominal）","answer":"定義：對數據進行分類，數據間沒有內在順序（例如國家代碼、錯誤類型）。"},{"id":28,"question":"數據量測類型：比率量表（Ratio）","answer":"定義：具有相等間隔且存在「絕對零點」的有序數據，可進行完整算術運算。"},{"id":29,"question":"什麼是數據品質分數（Data Quality Score）的計算邏輯？","answer":"衡量關鍵品質維度，為每個維度評分，並根據重要性權重合併為單一指標。"},{"id":30,"question":"BCBS 239 原則的全稱是什麼？","answer":"有效風險數據聚合與風險報告原則（Principles for Effective Risk Data Aggregation and Risk Reporting）。"},{"id":31,"question":"BCBS 239 最初是針對哪類銀行制定的？","answer":"全球系統重要性銀行（G-SIBs）。"},{"id":32,"question":"BCBS 239 的 14 項原則主要分為哪四個類別？","answer":"治理與基礎設施、風險數據聚合能力、風險報告實務、監督審查。"},{"id":33,"question":"BCBS 239 原則 1：治理（Governance）","answer":"核心要求：高級管理層必須對風險數據品質和報告流程承擔所有權與問責制。"},{"id":34,"question":"BCBS 239 原則 2：數據架構與 IT 基礎設施","answer":"核心要求：銀行應建立整合且可擴展的系統，支持跨業務線的風險數據聚合。"},{"id":35,"question":"BCBS 239 要求數據具有「適應性」（Adaptability），其目的是什麼？","answer":"確保系統能隨監管要求、新風險類型或組織變更快速調整，減少手動補救。"},{"id":36,"question":"BCBS 239 提到的「數據譜系」（Data Lineage）指的是什麼能力？","answer":"追蹤數據點從來源到最終報表目的地的流向、變化及處理邏輯的能力。"},{"id":37,"question":"在 BCBS 239 中，「及時性」對壓力情境（Stress conditions）有何特殊要求？","answer":"要求銀行在市場動盪期間能大幅增加報告頻率，甚至提供即時數據支持。"},{"id":38,"question":"為什麼銀行實施 BCBS 239 如此困難？","answer":"因為銀行普遍面臨舊有系統（如 COBOL）與現代雲端平台（如 Snowflake）並存的複雜架構。"},{"id":39,"question":"BCBS 239 原則 14 要求「母國/地主國監管合作」，其主要目的是什麼？","answer":"確保跨國銀行在不同司法管轄區的監督一致性，加強全球金融穩定。"},{"id":40,"question":"歐盟人工智慧法案（EU AI Act）第 10 條針對哪類 AI 系統規定了數據治理要求？","answer":"高風險 AI 系統（High-risk AI systems）。"},{"id":41,"question":"根據歐盟 AI 法案，高風險 AI 的訓練數據集必須符合哪些品質標準？","answer":"相關（Relevant）、具備足夠代表性、盡可能無錯誤且完整。"},{"id":42,"question":"歐盟 AI 法案第 10(2) 條要求數據治理實踐必須包含哪些過程？","answer":"包含設計選擇、數據收集、數據準備（如標註）、假設制定及偏見評估等。"},{"id":43,"question":"在高風險 AI 開發中，法案允許在什麼特定條件下處理「特殊類別個人數據」？","answer":"僅限於偏見檢測與糾正，且在無法使用匿名數據達成目標且具備嚴格安全保障時。"},{"id":44,"question":"什麼是機器學習中的「特徵」（Feature）？","answer":"模型用於進行預測的輸入變量，通常是從原始數據中衍生出的結構化信號。"},{"id":45,"question":"什麼是特徵管線（Feature Pipeline）的三個主要階段？","answer":"攝取（Ingestion）、轉換（Transformation）、存儲與服務（Storage and Serving）。"},{"id":46,"question":"機器學習中的「訓練-服務偏差」（Training-serving skew）常見原因為何？","answer":"模型訓練使用的歷史數據與生產環境中使用的實時數據在時間性或分佈上存在差異。"},{"id":47,"question":"在機器學習架構中，在線特徵存儲（Online Store）的主要用途是什麼？","answer":"在單毫秒級延遲下為模型推理（Inference）提供最新的特徵值。"},{"id":48,"question":"在機器學習架構中，離線特徵存儲（Offline Store）的主要用途是什麼？","answer":"存儲歷史特徵值，支持具備「點對點正確性」的模型訓練。"},{"id":49,"question":"什麼是「數據洩漏」（Data Leakage）？","answer":"在訓練特徵中意外包含「未來信息」，導致模型表現被虛假抬高。"},{"id":50,"question":"變更數據捕獲（Change Data Capture, CDC）技術在 ML 特徵管線中的優勢為何？","answer":"能實時流式傳輸數據庫變更，消除批處理造成的特徵過時問題。"},{"id":51,"question":"什麼是「滑動窗口聚合」（Sliding Windows）？","answer":"一種持續更新的重疊時間間隔，用於計算如「過去 60 分鐘內的事件計數」。"},{"id":52,"question":"在特徵工程中，「流關聯與富化」（Stream Joins）的作用是什麼？","answer":"將多個 CDC 流（如交易流與客戶檔案流）即時合併，以富化每個事件的上下文。"},{"id":53,"question":"什麼是「功能可靠性評分」（Feature Reliability Score, FRS）？","answer":"由 BDO Andreas Igl 教授提出，用於以特定語境聚合數據品質維度的綜合得分。"},{"id":54,"question":"特徵新鮮度（Feature Freshness）問題對欺詐檢測模型有何直接影響？","answer":"如果特徵更新滯後（如每 6 小時一次），模型將對最近發生的連續欺詐行為視而不見。"},{"id":55,"question":"為什麼 CDC 能夠解決訓練-服務偏差？","answer":"因為訓練和服務路徑都由相同的連續數據庫變更流供電，特徵計算邏輯保持一致。"},{"id":56,"question":"在流處理中，什麼是「翻轉窗口」（Tumbling Windows）？","answer":"固定大小且不重疊的時間間隔（例如每 1 小時一個區塊）。"},{"id":57,"question":"數據維度對比：唯一性 vs. 一致性","answer":"唯一性關注單一記錄的非重複，一致性關注不同系統或時間點數據值是否遵循相同規則。"},{"id":58,"question":"什麼是「空值代理」（Null proxies）？","answer":"用於代表空值的填充符，如 000-000、N/A 或 NA。"},{"id":59,"question":"在計算唯一性時，若已知主鍵計數和總行數，公式為何？","answer":"$1 - \\frac{\\text{primary\\_key\\_count}}{\\text{total\\_row\\_count}}$"},{"id":60,"question":"什麼是「虛假重複」（False duplicate）？","answer":"一條記錄與另一條記錄具有相同的主鍵值，但實際上代表不同的實體。"},{"id":61,"question":"數據品質維度中的「一致性」可分為哪些類型？","answer":"記錄內、記錄間、跨數據集以及隨時間的一致性（時間一致性）。"},{"id":62,"question":"什麼是數據湖環境中的 WAP 模式？","answer":"寫入（Write）、審計（Audit）、發布（Publish）模式：先寫入分支，測試通過後才合併至生產環境。"},{"id":63,"question":"數據量測類型：定序量表（Ordinal）","answer":"定義：數據具有意義的順序，但間隔不相等（例如滿意度等級）。"},{"id":64,"question":"數據量測類型：等距量表（Interval）","answer":"定義：有序數據且間隔相等，但沒有真正的絕對零點（例如攝氏溫度）。"},{"id":65,"question":"特徵工程：速度特徵（Velocity features）","answer":"定義：衡量行為變化率的特徵，如「當前交易頻率相對於 7 天平均值的增長率」。"},{"id":66,"question":"為什麼「數據重放」（Replay）對模型重訓很重要？","answer":"允許將更新的特徵定義應用於存儲的 CDC 事件流，快速且準確地回填歷史特徵值。"},{"id":67,"question":"BCBS 239 的「風險報告實務」類別包含哪些原則？","answer":"準確性、全面性、清晰度與實用性、頻率、分發。"},{"id":68,"question":"在數據治理中，「數據管理員」（Data Steward）的職責是什麼？","answer":"負責數據的日常管理、品質控制及標準執行，通常由業務部門人員擔任。"},{"id":69,"question":"對於高風險 AI，法案要求數據集必須考慮地理、行為或功能設置的特定特徵，這是為了 _____。","answer":"確保系統在預定使用的具體情境中能有效運行且不具偏見。"},{"id":70,"question":"什麼是「單一事實來源」（Single Source of Truth, SSOT）？","answer":"確保每個數據點在企業內只有一個權威副本，以消除矛盾和不信任。"},{"id":71,"question":"數據品質中的「成本指標」除了存儲成本外，還包括什麼？","answer":"品質成本（Cost of Quality）：展示對品質管理的投資對業務增長的價值。"},{"id":72,"question":"「特徵可靠性評分」（FRS）的主要聚合難點為何？","answer":"難以用統一且具有意義的方式將非平凡的不同維度測量值進行聚合。"},{"id":73,"question":"歐盟 AI 法案第 10(3) 條強調數據集必須具備「適當的統計屬性」，特別是針對什麼？","answer":"系統預定使用的個人或群體特徵。"},{"id":74,"question":"為何「手動數據搬運」是 BCBS 239 合規的潛在弱點？","answer":"易產生錯誤、導致延遲，且在危機期間難以維持報告的完整性。"},{"id":75,"question":"機器學習特徵管線中的「混合方法」（Hybrid approach）是指什麼？","answer":"對實時性要求高的特徵使用流處理（CDC），對緩慢變化的特徵使用批處理（Batch）。"},{"id":76,"question":"在 BCBS 239 框架下，什麼是「數據缺口分析」（Gap analysis）？","answer":"評估現有治理、架構與原則要求之間的差距，以確定補救任務的優先順序。"},{"id":77,"question":"特徵存儲中的「點對點正確性」（Point-in-time correctness）旨在防止什麼？","answer":"防止在訓練時使用預測時間點之後才產生的數據。"},{"id":78,"question":"數據品質管理中的「數據分類（Categorize）」屬於哪種量測類型？","answer":"標稱量表（Nominal）。"},{"id":79,"question":"根據湖倉一體（lakeFS）的建議，自動化審計應作為生產環境的 _____ 門檻。","answer":"釋放/發布 (Release)"},{"id":80,"question":"機器學習特徵工程：組合特徵（Composite features）","answer":"定義：結合多個信號的複雜特徵，例如「當前會話頁面瀏覽量除以歷史平均值」。"}];
    let currentData = [...RAW_DATA];
    let masteredSet = new Set(JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]"));
    let currentMode = 'list';
    let filterOnlyUnmastered = false;
    let isAllExpanded = false;
    let cardIndex = 0;

    function applyTheme(theme) {
      const normalizedTheme = theme === "dark" ? "dark" : "light";
      document.documentElement.dataset.theme = normalizedTheme;

      const btn = document.getElementById("themeToggleBtn");
      if (btn) {
        const isDark = normalizedTheme === "dark";
        btn.textContent = isDark ? "淺色模式" : "深色模式";
        btn.setAttribute("aria-label", isDark ? "切換為淺色模式" : "切換為深色模式");
      }
    }

    function initializeTheme() {
      const savedTheme = localStorage.getItem(THEME_STORAGE_KEY) || "light";
      applyTheme(savedTheme);
    }

    function toggleTheme() {
      const nextTheme = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
      localStorage.setItem(THEME_STORAGE_KEY, nextTheme);
      applyTheme(nextTheme);
    }

    initializeTheme();

    function saveMastered() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(Array.from(masteredSet)));
      updateStats();
    }

    function updateStats() {
      const total = RAW_DATA.length;
      const masteredCount = RAW_DATA.filter(item => masteredSet.has(item.id)).length;
      const pct = total === 0 ? 0 : Math.round((masteredCount / total) * 100);

      document.getElementById('statsCount').textContent = `顯示 ${currentData.length} / 共 ${total} 題`;
      document.getElementById('statsMastered').textContent = `已掌握 ${masteredCount} 題 (${pct}%)`;
      document.getElementById('progressFill').style.width = pct + '%';
    }

    function renderMath() {
      if (window.renderMathInElement) {
        renderMathInElement(document.body, {
          delimiters: [
            {left: '$$', right: '$$', display: true},
            {left: '$', right: '$', display: false}
          ],
          throwOnError: false
        });
      }
    }

    function renderList() {
      const container = document.getElementById('qaList');
      if (currentData.length === 0) {
        container.innerHTML = '<div class="empty-state">沒有符合條件的問答卡片</div>';
        return;
      }

      container.innerHTML = currentData.map(item => {
        const isMastered = masteredSet.has(item.id);
        return `
          <div class="qa-card ${isMastered ? 'mastered' : ''} ${isAllExpanded ? 'open' : ''}" id="card-${item.id}">
            <div class="qa-header" onclick="toggleItem(${item.id})">
              <span class="qa-id">#${item.id}</span>
              <span class="qa-question">${escapeHtml(item.question)}</span>
              <div class="qa-actions">
                <button class="master-btn ${isMastered ? 'is-mastered' : ''}"
                        onclick="toggleMaster(event, ${item.id})"
                        title="${isMastered ? '已掌握' : '標記掌握'}">★</button>
                <span class="expand-icon">▼</span>
              </div>
            </div>
            <div class="qa-answer">${escapeHtml(item.answer)}</div>
          </div>
        `;
      }).join('');

      renderMath();
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    function toggleItem(id) {
      const el = document.getElementById('card-' + id);
      if (el) {
        el.classList.toggle('open');
      }
    }

    function toggleMaster(event, id) {
      event.stopPropagation();
      if (masteredSet.has(id)) {
        masteredSet.delete(id);
      } else {
        masteredSet.add(id);
      }
      saveMastered();
      applyFilters();
    }

    function toggleExpandAll() {
      isAllExpanded = !isAllExpanded;
      document.getElementById('expandAllBtn').textContent = isAllExpanded ? "收合全部" : "展開全部";
      document.querySelectorAll('.qa-card').forEach(card => {
        if (isAllExpanded) {
          card.classList.add('open');
        } else {
          card.classList.remove('open');
        }
      });
    }

    function toggleFilterMastered() {
      filterOnlyUnmastered = !filterOnlyUnmastered;
      const btn = document.getElementById('filterMasteredBtn');
      btn.classList.toggle('active-filter', filterOnlyUnmastered);
      btn.textContent = filterOnlyUnmastered ? "✓ 僅顯示未掌握" : "⭐ 只看未掌握";
      applyFilters();
    }

    function handleSearch() {
      applyFilters();
    }

    function applyFilters() {
      const query = document.getElementById('searchInput').value.trim().toLowerCase();
      currentData = RAW_DATA.filter(item => {
        if (filterOnlyUnmastered && masteredSet.has(item.id)) {
          return false;
        }
        if (query) {
          const matchQ = item.question.toLowerCase().includes(query);
          const matchA = item.answer.toLowerCase().includes(query);
          return matchQ || matchA;
        }
        return true;
      });

      cardIndex = 0;
      if (currentMode === 'list') {
        renderList();
      } else {
        updateCardView();
      }
      updateStats();
    }

    function shuffleCards() {
      currentData.sort(() => Math.random() - 0.5);
      cardIndex = 0;
      if (currentMode === 'list') {
        renderList();
      } else {
        updateCardView();
      }
    }

    function resetOrder() {
      currentData.sort((a, b) => a.id - b.id);
      cardIndex = 0;
      if (currentMode === 'list') {
        renderList();
      } else {
        updateCardView();
      }
    }

    function switchMode(mode) {
      currentMode = mode;
      const listBtn = document.getElementById('listViewBtn');
      const cardBtn = document.getElementById('cardViewBtn');
      const qaList = document.getElementById('qaList');
      const flashcardContainer = document.getElementById('flashcardContainer');
      const expandAllBtn = document.getElementById('expandAllBtn');

      if (mode === 'list') {
        listBtn.classList.add('active');
        cardBtn.classList.remove('active');
        qaList.style.display = 'flex';
        flashcardContainer.style.display = 'none';
        expandAllBtn.style.display = 'inline-flex';
        renderList();
      } else {
        cardBtn.classList.add('active');
        listBtn.classList.remove('active');
        qaList.style.display = 'none';
        flashcardContainer.style.display = 'flex';
        expandAllBtn.style.display = 'none';
        updateCardView();
      }
    }

    /* Flashcard Functions */
    function flipCard() {
      const wrapper = document.getElementById('flashcardWrapper');
      wrapper.classList.toggle('flipped');
    }

    function updateCardView() {
      const wrapper = document.getElementById('flashcardWrapper');
      wrapper.classList.remove('flipped');

      if (currentData.length === 0) {
        document.getElementById('fcQuestion').textContent = '無卡片資料';
        document.getElementById('fcAnswer').textContent = '無卡片資料';
        document.getElementById('fcCardNumber').textContent = '0 / 0';
        document.getElementById('fcCardNumberBack').textContent = '0 / 0';
        return;
      }

      if (cardIndex < 0) cardIndex = 0;
      if (cardIndex >= currentData.length) cardIndex = currentData.length - 1;

      const item = currentData[cardIndex];
      const isMastered = masteredSet.has(item.id);

      document.getElementById('fcQuestion').textContent = item.question;
      document.getElementById('fcAnswer').textContent = item.answer;

      const cardNumText = `卡片 ${cardIndex + 1} / ${currentData.length} (#${item.id})`;
      document.getElementById('fcCardNumber').textContent = cardNumText;
      document.getElementById('fcCardNumberBack').textContent = cardNumText;

      const btn1 = document.getElementById('fcMasterBtn');
      const btn2 = document.getElementById('fcMasterBtnBack');
      btn1.classList.toggle('is-mastered', isMastered);
      btn2.classList.toggle('is-mastered', isMastered);

      renderMath();
    }

    function prevCard() {
      if (currentData.length === 0) return;
      cardIndex = (cardIndex - 1 + currentData.length) % currentData.length;
      updateCardView();
    }

    function nextCard() {
      if (currentData.length === 0) return;
      cardIndex = (cardIndex + 1) % currentData.length;
      updateCardView();
    }

    function toggleCardMaster(event) {
      event.stopPropagation();
      if (currentData.length === 0) return;
      const item = currentData[cardIndex];
      toggleMaster(event, item.id);
      updateCardView();
    }

    /* Keyboard Shortcuts */
    window.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT') return;
      if (currentMode === 'card') {
        if (e.code === 'Space') {
          e.preventDefault();
          flipCard();
        } else if (e.code === 'ArrowLeft') {
          e.preventDefault();
          prevCard();
        } else if (e.code === 'ArrowRight') {
          e.preventDefault();
          nextCard();
        } else if (e.code === 'KeyM') {
          e.preventDefault();
          toggleCardMaster(e);
        }
      }
    });

    // Init
    window.addEventListener('DOMContentLoaded', () => {
      updateStats();
      renderList();
      setTimeout(renderMath, 200);
    });
  </script>
</body>
</html>
