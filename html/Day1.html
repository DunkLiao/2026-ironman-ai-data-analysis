<!DOCTYPE html>
<html lang="zh-TW" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Day1 - 問答複習卡</title>
  <!-- KaTeX for LaTeX rendering -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
  <style>
    :root {
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --primary-light: #eff6ff;
      --border-color: #e2e8f0;
      --success: #10b981;
      --success-light: #ecfdf5;
      --accent: #f59e0b;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
      --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.08), 0 2px 4px -2px rgba(0,0,0,0.05);
      --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.1), 0 4px 6px -4px rgba(0,0,0,0.05);
      --radius: 12px;
    }

    html[data-theme="dark"] {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #60a5fa;
      --primary-hover: #3b82f6;
      --primary-light: #1e3a8a33;
      --border-color: #334155;
      --success: #34d399;
      --success-light: #064e3b33;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans TC", sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      line-height: 1.6;
      padding-bottom: 60px;
    }

    /* Navigation / Header */
    header {
      background: var(--card-bg);
      border-bottom: 1px solid var(--border-color);
      position: sticky;
      top: 0;
      z-index: 50;
      box-shadow: var(--shadow-sm);
    }

    .header-container {
      max-width: 900px;
      margin: 0 auto;
      padding: 14px 20px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .nav-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 8px;
      background: var(--primary-light);
      color: var(--primary);
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      transition: all 0.2s;
    }

    .back-btn:hover {
      background: var(--primary);
      color: #fff;
    }

    .page-title {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .view-toggles {
      display: flex;
      background: var(--bg-color);
      padding: 3px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
    }

    .header-actions {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: flex-end;
    }

    .toggle-btn {
      padding: 6px 14px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .toggle-btn.active {
      background: var(--card-bg);
      color: var(--primary);
      box-shadow: var(--shadow-sm);
    }

    .theme-toggle {
      padding: 7px 12px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      background: var(--card-bg);
      color: var(--text-main);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: var(--shadow-sm);
      transition: border-color 0.2s, color 0.2s, background 0.2s;
    }

    .theme-toggle:hover {
      border-color: var(--primary);
      color: var(--primary);
    }

    /* Main Container */
    main {
      max-width: 900px;
      margin: 24px auto;
      padding: 0 20px;
    }

    /* Toolbar */
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 20px;
      align-items: center;
      justify-content: space-between;
    }

    .search-box {
      flex: 1;
      min-width: 240px;
      position: relative;
    }

    .search-box input {
      width: 100%;
      padding: 10px 14px 10px 38px;
      border-radius: 10px;
      border: 1px solid var(--border-color);
      background: var(--card-bg);
      color: var(--text-main);
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-box input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-light);
    }

    .search-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 14px;
    }

    .action-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background: var(--card-bg);
      color: var(--text-main);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn:hover {
      background: var(--border-color);
    }

    .btn.active-filter {
      background: var(--primary-light);
      border-color: var(--primary);
      color: var(--primary);
    }

    /* Stats bar */
    .stats-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      font-size: 14px;
      color: var(--text-muted);
    }

    .progress-bar-container {
      flex: 1;
      height: 8px;
      background: var(--border-color);
      border-radius: 99px;
      margin: 0 16px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: var(--success);
      width: 0%;
      transition: width 0.3s ease;
    }

    /* List View Cards */
    .qa-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .qa-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      box-shadow: var(--shadow-sm);
      overflow: hidden;
      transition: box-shadow 0.2s, border-color 0.2s;
    }

    .qa-card:hover {
      box-shadow: var(--shadow-md);
      border-color: #cbd5e1;
    }

    .qa-card.mastered {
      border-left: 4px solid var(--success);
    }

    .qa-header {
      padding: 16px 20px;
      display: flex;
      align-items: flex-start;
      gap: 12px;
      cursor: pointer;
      user-select: none;
    }

    .qa-id {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 28px;
      height: 28px;
      background: var(--primary-light);
      color: var(--primary);
      border-radius: 6px;
      font-size: 13px;
      font-weight: 700;
      margin-top: 2px;
      flex-shrink: 0;
    }

    .qa-question {
      flex: 1;
      font-size: 15px;
      font-weight: 600;
      color: var(--text-main);
      padding-top: 2px;
    }

    .qa-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .master-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 18px;
      padding: 4px;
      border-radius: 6px;
      transition: transform 0.15s, color 0.15s;
    }

    .master-btn:hover {
      transform: scale(1.15);
    }

    .master-btn.is-mastered {
      color: var(--accent);
    }

    .expand-icon {
      color: var(--text-muted);
      font-size: 14px;
      transition: transform 0.2s ease;
    }

    .qa-card.open .expand-icon {
      transform: rotate(180deg);
    }

    .qa-answer {
      display: none;
      padding: 16px 20px 18px 60px;
      background: var(--bg-color);
      border-top: 1px dashed var(--border-color);
      font-size: 15px;
      color: var(--text-main);
      line-height: 1.7;
    }

    .qa-card.open .qa-answer {
      display: block;
      animation: fadeIn 0.2s ease-in;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Flashcard Mode */
    .flashcard-container {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      padding: 10px 0;
    }

    .flashcard-wrapper {
      perspective: 1000px;
      width: 100%;
      max-width: 640px;
      min-height: 340px;
      cursor: pointer;
    }

    .flashcard-inner {
      position: relative;
      width: 100%;
      height: 100%;
      min-height: 340px;
      text-align: center;
      transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
      transform-style: preserve-3d;
      border-radius: 16px;
      box-shadow: var(--shadow-lg);
    }

    .flashcard-wrapper.flipped .flashcard-inner {
      transform: rotateY(180deg);
    }

    .flashcard-face {
      position: absolute;
      width: 100%;
      height: 100%;
      min-height: 340px;
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 30px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      box-sizing: border-box;
    }

    .flashcard-back {
      transform: rotateY(180deg);
      background: var(--card-bg);
      border: 2px solid var(--primary);
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      color: var(--text-muted);
    }

    .card-badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 99px;
      font-weight: 600;
      font-size: 12px;
    }

    .badge-q {
      background: var(--primary-light);
      color: var(--primary);
    }

    .badge-a {
      background: var(--success-light);
      color: var(--success);
    }

    .card-body {
      margin: auto 0;
      padding: 20px 10px;
      font-size: 18px;
      font-weight: 600;
      line-height: 1.6;
    }

    .card-hint {
      font-size: 12px;
      color: var(--text-muted);
    }

    .flashcard-controls {
      display: flex;
      gap: 12px;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 640px;
    }

    .flashcard-controls .btn {
      padding: 10px 20px;
      font-size: 14px;
      font-weight: 600;
    }

    .btn-primary {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    .btn-primary:hover {
      background: var(--primary-hover);
    }

    .shortcuts-hint {
      font-size: 12px;
      color: var(--text-muted);
      text-align: center;
      margin-top: 8px;
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
      background: var(--card-bg);
      border-radius: var(--radius);
      border: 1px dashed var(--border-color);
    }
  </style>
</head>
<body>
  <header>
    <div class="header-container">
      <div class="nav-left">
        <a href="index.html" class="back-btn" title="回目錄">← 目錄</a>
        <h1 class="page-title">Day1 問答卡</h1>
      </div>
      <div class="header-actions">
        <button class="theme-toggle" id="themeToggleBtn" type="button" onclick="toggleTheme()" aria-label="切換為深色模式">深色模式</button>
        <div class="view-toggles">
          <button id="listViewBtn" class="toggle-btn active" onclick="switchMode('list')">📋 列表模式</button>
          <button id="cardViewBtn" class="toggle-btn" onclick="switchMode('card')">🎴 翻卡測驗</button>
        </div>
      </div>
    </div>
  </header>

  <main>
    <div class="toolbar">
      <div class="search-box">
        <span class="search-icon">🔍</span>
        <input type="text" id="searchInput" placeholder="搜尋問題或答案關鍵字..." oninput="handleSearch()">
      </div>
      <div class="action-buttons">
        <button class="btn" id="filterMasteredBtn" onclick="toggleFilterMastered()">⭐ 只看未掌握</button>
        <button class="btn" id="expandAllBtn" onclick="toggleExpandAll()">展開全部</button>
        <button class="btn" onclick="shuffleCards()">🔀 隨機洗牌</button>
        <button class="btn" onclick="resetOrder()">🔄 恢復順序</button>
      </div>
    </div>

    <div class="stats-bar">
      <span id="statsCount">總計 0 題</span>
      <div class="progress-bar-container">
        <div id="progressFill" class="progress-fill"></div>
      </div>
      <span id="statsMastered">掌握率 0%</span>
    </div>

    <!-- List View -->
    <div id="qaList" class="qa-list"></div>

    <!-- Flashcard Mode View -->
    <div id="flashcardContainer" class="flashcard-container">
      <div class="flashcard-wrapper" id="flashcardWrapper" onclick="flipCard()">
        <div class="flashcard-inner">
          <!-- Front Face -->
          <div class="flashcard-face flashcard-front">
            <div class="card-top">
              <span class="card-badge badge-q">問題</span>
              <span id="fcCardNumber">卡片 1 / 1</span>
              <button class="master-btn" id="fcMasterBtn" onclick="toggleCardMaster(event)" title="標記為已掌握">★</button>
            </div>
            <div class="card-body" id="fcQuestion">載入中...</div>
            <div class="card-hint">💡 點擊卡片或按空白鍵翻面看答案</div>
          </div>
          <!-- Back Face -->
          <div class="flashcard-face flashcard-back">
            <div class="card-top">
              <span class="card-badge badge-a">解答</span>
              <span id="fcCardNumberBack">卡片 1 / 1</span>
              <button class="master-btn" id="fcMasterBtnBack" onclick="toggleCardMaster(event)" title="標記為已掌握">★</button>
            </div>
            <div class="card-body" id="fcAnswer">載入中...</div>
            <div class="card-hint">💡 再次點擊卡片翻回正面</div>
          </div>
        </div>
      </div>

      <div class="flashcard-controls">
        <button class="btn" onclick="prevCard()">← 上一題</button>
        <button class="btn btn-primary" onclick="flipCard()">翻轉卡片</button>
        <button class="btn" onclick="nextCard()">下一題 →</button>
      </div>
      <div class="shortcuts-hint">鍵盤快速鍵：[←] 上一題 · [空白鍵] 翻面 · [→] 下一題 · [M] 標記掌握</div>
    </div>
  </main>

  <script>
    const THEME_STORAGE_KEY = "qa_theme";
    const STORAGE_KEY = "anki_mastered_" + "Day1";
    const RAW_DATA = [{"id":1,"question":"根據 K2view 的定義，何謂「AI 資料隱私」？","answer":"為保護 AI 應用程式、框架和模型所收集、存儲和處理的敏感資料而採取的安全措施。"},{"id":2,"question":"生成式 AI（GenAI）為金融機構分析海量資料時帶來的主要優勢為何？","answer":"能自動化複雜任務並透過個人化與效率提升客戶體驗。"},{"id":3,"question":"金融服務提供商在處理 AI 資料時，必須遵守哪些主要的資料隱私法律？","answer":"包括 CPRA、GDPR 和 HIPAA 等法律。"},{"id":4,"question":"在金融業的 AI 資料隱私風險中，「繞過標準安全協議」的威脅稱為什麼？","answer":"越獄（Jailbreaking）或提示注入（Prompt Injection）。"},{"id":5,"question":"金融機構若發生 AI 模型漏洞，可能會導致什麼敏感資訊外洩？","answer":"模型內部的敏感訓練資料。"},{"id":6,"question":"在 AI 資料隱私策略中，「資料加密」的主要用途為何？","answer":"掩蓋靜態或傳輸中的敏感資料。"},{"id":7,"question":"「存取控制」在 AI 資料隱私策略中扮演什麼角色？","answer":"確保只有獲得授權的使用者才能查看或修改個人識別資訊（PII）。"},{"id":8,"question":"在訓練和生產資料集中隱藏個人識別碼的技術稱為什麼？","answer":"資料遮罩（Data Masking）。"},{"id":9,"question":"「對抗性策略」（Adversarial strategizing）的目的是什麼？","answer":"保護 AI 模型免受惡意攻擊。"},{"id":10,"question":"「資料最小化」（Data minimization）原則的核心為何？","answer":"僅存儲真正需要的資料。"},{"id":11,"question":"檢索增強生成（RAG）框架如何提升 LLM 的回應品質？","answer":"透過將受信任的企業資料注入 LLM，實現更精確且具上下文關聯的回應。"},{"id":12,"question":"RAG 聊天機器人在金融客戶服務中的主要效益為何？","answer":"減少通話時間並增加客戶滿意度。"},{"id":13,"question":"主動式檢索增強生成在金融業「欺詐檢測」方面的運作方式為何？","answer":"即時分析交易模式並標記可能代表欺詐行為的異常活動。"},{"id":14,"question":"為什麼傳統的中央資料湖不適合用於存放生成式 AI 資料？","answer":"因為它包含易洩漏的敏感資訊，且清理與查詢成本高昂。"},{"id":15,"question":"微型資料庫（Micro-Database）技術如何處理個別實體的資料？","answer":"為每位客戶、員工或產品創建微型資料湖，並與源系統持續同步。"},{"id":16,"question":"微型資料庫如何確保 AI 資料的品質與隱私？","answer":"自動執行資料隱私規則並應用 AI 資料品質標準。"},{"id":17,"question":"金管會於 2024 年發布的哪份文件顯示了對 AI 應用資料治理的重視？","answer":"《金融業運用人工智慧（AI）指引》。"},{"id":18,"question":"目前金融機構將資料「去識別化」以符合個資法要求面臨的主要痛點為何？","answer":"目前缺乏明確且客觀的去識別化程度標準。"},{"id":19,"question":"即使採用聯合學習（Federated Learning）產生參數，仍存在什麼樣的法規隱憂？","answer":"仍被認為可能存在資料再識別風險的疑慮。"},{"id":20,"question":"關於 AI 模型訓練產出的「衍生資料」，目前的爭議點為何？","answer":"其權利歸屬難以界定，消費者是否能要求剔除其相關資料尚無定論。"},{"id":21,"question":"在金融 AI 應用中，「遷移學習」（Transfer Learning）技術引發了什麼爭議？","answer":"資料利用目的範圍的爭議，例如將公益目的訓練的模型轉用於商業行銷。"},{"id":22,"question":"金融機構面對 AI 監理法規落後技術發展時應採取什麼思維？","answer":"應轉變為積極主動的風險管理，建立內部管理機制。"},{"id":23,"question":"AI 系統在處理大量敏感資料時，必須確保符合哪兩大核心要素？","answer":"隱私保護與監理合規。"},{"id":24,"question":"歐盟的 GDPR 要求企業在處理個人資料時必須遵守哪些原則？","answer":"透明性、資料最小化及維護資料主體權利。"},{"id":25,"question":"PCI DSS 標準主要關注金融業的哪類資料安全？","answer":"支付卡資料安全環境。"},{"id":26,"question":"巴塞爾協議 III（Basel III）在資料治理方面強調了什麼需求？","answer":"有效的風險資料聚合與風險管理實踐。"},{"id":27,"question":"AI 合規性中「黑箱」性質（Black box）指的是什麼挑戰？","answer":"決策過程難以理解與解釋，可能導致公眾不信任。"},{"id":28,"question":"「演算法問責制」（Algorithmic accountability）包含哪些具體流程？","answer":"評估並減輕 AI 系統中可能產生的潛在偏誤。"},{"id":29,"question":"為什麼 AI 系統需要建立「問責機制」來處理錯誤決策？","answer":"因為當 AI 造成損害時，確定責任歸屬（設計者或使用者）過程極為複雜。"},{"id":30,"question":"歐盟提出的《人工智慧法案》（Artificial Intelligence Act）如何分類 AI 系統？","answer":"根據 AI 對基本權利的潛在影響和風險進行分級管理。"},{"id":31,"question":"造成演算法偏誤（Algorithmic bias）的主要原因是什麼？","answer":"訓練資料集中包含固有的社會偏見，並在自動化決策中被放大。"},{"id":32,"question":"減輕演算法偏誤的關鍵策略之一為何？","answer":"實現訓練資料的多樣化並定期進行公平性審計。"},{"id":33,"question":"AI 廣泛採用對金融業低技能職位可能造成的社會衝擊為何？","answer":"可能導致工作職位的消失。"},{"id":34,"question":"差異隱私（Differential Privacy）的主要數學目的是什麼？","answer":"平衡量化的披露風險與資料分析的有用性（Utility）。"},{"id":35,"question":"在差異隱私中，鄰近資料集（Neighboring Datasets）的定義為何？","answer":"兩者之間僅存在一個隱私單位（Privacy Unit）差異的資料集對。"},{"id":36,"question":"差異隱私（DP）中的參數 $\\epsilon$ 代表什麼意義？","answer":"它代表隱私損失預算（Privacy-loss budget），控制相鄰資料集輸出分佈的區分程度。"},{"id":37,"question":"差異隱私的「後處理」（Post-processing）性質保證了什麼？","answer":"一旦結果受到 DP 保護，任何進一步處理都不能降低其隱私保證。"},{"id":38,"question":"「成員攻擊」（Membership attack）的具體目標為何？","answer":"確定特定個人的資料是否被包含在某個資料集中。"},{"id":39,"question":"在差異隱私的假設檢定框架中，第一型錯誤（Type I error）代表什麼？","answer":"攻擊者錯誤地推斷某人屬於資料集成員（偽陽性）。"},{"id":40,"question":"在差異隱私的假設檢定框架中，第二型錯誤（Type II error）代表什麼？","answer":"攻擊者未能檢測到資料集中確實存在的成員（偽陰性）。"},{"id":41,"question":"ROC 曲線在差異隱私評估中是用來顯示什麼關係？","answer":"測試功效（$1 - \\beta$）與偽陽性率（$\\alpha$）之間的權衡。"},{"id":42,"question":"拉普拉斯機制（Laplace mechanism）如何實現差異隱私？","answer":"透過在查詢結果中添加符合拉普拉斯分佈的隨機雜訊。"},{"id":43,"question":"高斯機制（Gaussian mechanism）與拉普拉斯機制在隱私保證上的主要區別為何？","answer":"高斯機制不滿足純粹的 $\\epsilon$-差異隱私，而是滿足近似差異隱私或 $f$-DP。"},{"id":44,"question":"在貝氏統計中，「先驗機率」（Prior probability）的意義為何？","answer":"在進行統計檢定之前，假設目標屬於資料集的機率。"},{"id":45,"question":"何謂「冒然披露」（Blatant disclosure）？","answer":"攻擊者的後驗機率達到 $1$，即以 $100\\%$ 確定性識別出個體。"},{"id":46,"question":"「災難性失敗」（Catastrophic failure）在隨機機制中如何定義？","answer":"指該機制允許通過成員攻擊以確定性揭露敏感屬性。"},{"id":47,"question":"均勻隨機抽樣機制（Uniform Random Sampling）為什麼容易發生災難性失敗？","answer":"因為它有正機率直接洩漏資料集中的原始記錄。"},{"id":48,"question":"「優雅失敗」（Graceful failure）的隨機機制具有什麼特點？","answer":"攻擊者的後驗信心可以接近但永遠無法達到 $1$，始終保持殘餘不確定性。"},{"id":49,"question":"「相對披露風險」（Relative disclosure risk）測量的核心指標為何？","answer":"衡量因發布查詢結果而導致目標成員身分機率增加的倍數。"},{"id":50,"question":"根據定理 2，隨機機制擁有「有限相對披露風險」的條件為何？","answer":"當 $\\alpha \\to 0$ 時，比率 $\\frac{1 - f_\\mu(\\alpha)}{\\alpha}$ 必須收斂至有限值。"},{"id":51,"question":"純粹 $\\epsilon$-差異隱私機制與相對披露風險 $\\rho$ 的關係為何？","answer":"其相對披露風險滿足 $\\rho \\le e^\\epsilon$。"},{"id":52,"question":"在資料分析中，差異隱私產生的擾動可以被視為哪種性質的來源？","answer":"一種精確指定的「測量誤差」或統計不確定性。"},{"id":53,"question":"為什麼差異隱私保護機制和參數值的透明公開不會損害隱私？","answer":"因為 DP 的數學保證對演算法透明度具有魯棒性（防範未來技術進步）。"},{"id":54,"question":"在管理隱私與效用權衡時，「隱私優先」（Privacy-first）策略的步驟為何？","answer":"先定義最大可接受風險並選定隱私參數，再評估資料產出的效用是否足夠。"},{"id":55,"question":"在管理隱私與效用權衡時，「效用優先」（Utility-first）策略的步驟為何？","answer":"先評估分析所需的最小準確度，再確定相應隱私保護所帶來的最低風險。"},{"id":56,"question":"針對不信任的資料接收者，專家強烈建議避免使用哪種失敗類型的機制？","answer":"災難性失敗機制。"},{"id":57,"question":"如果數據接收者是受法律約束的信任人員（如公務員），什麼情況下可接受冒然披露？","answer":"當資料接收者的範圍受控且發布是為了公共政策目的時。"},{"id":58,"question":"在實踐中，效用分析應如何避免額外的披露風險？","answer":"應在不接觸實際數據的情況下，模擬實驗性研究來進行。"},{"id":59,"question":"「合成資料生成」在效用分析中扮演什麼角色？","answer":"讓接收者在不接觸原件的情況下，測試不同隱私參數對分析結果的影響。"},{"id":60,"question":"差異隱私中的「組合成」（Composition）屬性有何作用？","answer":"允許跨多個演算法自動累計並計算總隱私損失。"},{"id":61,"question":"為何「資料最小化」在 AI 模型開發中尤為重要？","answer":"減少攻擊面並降低違反 GDPR 等法規的法律風險。"},{"id":62,"question":"RAG 技術如何解決金融 AI 應用中的「幻覺」問題？","answer":"透過將 LLM 錨定（Grounding）在受信任的企業數據上，提高回應準確性。"},{"id":63,"question":"「推論風險」（Inference risk）與一般的披露風險有何區別？","answer":"它指即使個人資料未直接參與資料集，敏感資訊仍可能被推斷出的風險。"},{"id":64,"question":"為什麼絕對匿名化（Absolute anonymization）在現代數據環境下被視為「破碎的承諾」？","answer":"因為重構與連結攻擊已證明傳統去識別化技術（如聚合、k-匿名）存在漏洞。"},{"id":65,"question":"在 $f$-差異隱私中，權衡函數 $f_\\mu$ 的作用為何？","answer":"它定義了攻擊者在區分兩個鄰近資料集時所面臨的最小錯誤界限。"},{"id":66,"question":"根據 Source 4，為什麼 AUC 面積不是評估隱私保護的理想指標？","answer":"因為它無法捕捉到可能發生的局部「災難性失敗」。"},{"id":67,"question":"「對抗性測試」在 AI 資料安全生命週期中的作用為何？","answer":"識別並修補模型中可能導致敏感訓練數據洩漏的漏洞。"},{"id":68,"question":"遷移學習引發的資料用途爭議，主要違反了資料治理中的哪項原則？","answer":"目的限制原則（Purpose Limitation）。"},{"id":69,"question":"差異隱私如何處理「輔助資訊」（Auxiliary information）帶來的威脅？","answer":"其數學框架保證了即使攻擊者擁有外部知識，隱私洩漏量依然受控。"},{"id":70,"question":"在金融業實施 RAG 時，微型資料庫如何解決「實時性」挑戰？","answer":"透過與源系統持續同步，確保 AI 獲得的是最新且合規的實體資料。"},{"id":71,"question":"何謂「資料主權」（Data sovereignty）的社會契約視角？","answer":"重新思考個體對其生成行為資料的所有權與使用決定權。"},{"id":72,"question":"為什麼 Z-檢定在差異隱私效用分析中是常見的工具？","answer":"用於評估添加 DP 雜訊後的樣本平均值是否仍具統計顯著性。"},{"id":73,"question":"Five Safes 治理框架主要評估資料發布的哪五個維度？","answer":"安全的人、安全的研究、安全的設定、安全的數據、安全的產出。"},{"id":74,"question":"差異隱私的「隱私損失參數」如何與「統計顯著性」連結？","answer":"透過計算不同隱私強度下檢定功效（Power）的下降程度來連結。"},{"id":75,"question":"為何「數據質量」對 AI 資料治理至關重要？","answer":"因為低質量的偏誤數據會導致 AI 模型產生歧視性或錯誤的財務決策。"},{"id":76,"question":"「聯合學習」（Federated Learning）在醫療大數據分析中的優點為何？","answer":"允許在不共享原始數據的情況下進行模型訓練，提升數位轉型。"},{"id":77,"question":"差異隱私如何幫助減少金融機構的「商譽損害」風險？","answer":"透過嚴格限制數據洩漏的可能性，維持客戶的信任與忠誠度。"},{"id":78,"question":"「去識別化」技術在法律上目前面臨的最大辯論為何？","answer":"關於去識別化後的資料是否仍屬於「個人資料」範疇的認定。"},{"id":79,"question":"差異隱私框架下的「成員推論攻擊」與「重構攻擊」有何異同？","answer":"兩者皆旨在竊取資訊，但成員推論關注「存在性」，重構關注「具體數值」。"},{"id":80,"question":"對於金融從業者而言，「微型資料庫」如何改變大規模個人化的成本？","answer":"它允許在保持嚴格安全措施的同時，以業務規模和速度提供個人化服務。"},{"id":81,"question":"在 AI 治理中，「人類監督」（Human oversight）的主要職責為何？","answer":"確保 AI 決策過程不違反公平性原則且在出錯時能及時介入。"},{"id":82,"question":"為什麼歐盟的 5AMLD 指令對 AI 資料治理有影響？","answer":"它要求金融機構使用進階監控系統來檢測非法資金流動並確保數據保護。"},{"id":83,"question":"何謂 AI 時代的「代理經濟」（Agentic AI）？","answer":"指 AI 代理（Agents）加速融入企業營運核心並代表用戶執行決策的趨勢。"},{"id":84,"question":"差異隱私技術中的「雜訊校準」（Noise calibration）目的是什麼？","answer":"根據查詢的敏感度和隱私預算，確定需要添加的最優雜訊量。"},{"id":85,"question":"在處理多個假設檢定時，為何需使用「龐費洛尼校正」（Bonferroni correction）？","answer":"為了控制因多次檢定而增加的偽陽性（第一型錯誤）累積機率。"}];
    let currentData = [...RAW_DATA];
    let masteredSet = new Set(JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]"));
    let currentMode = 'list';
    let filterOnlyUnmastered = false;
    let isAllExpanded = false;
    let cardIndex = 0;

    function applyTheme(theme) {
      const normalizedTheme = theme === "dark" ? "dark" : "light";
      document.documentElement.dataset.theme = normalizedTheme;

      const btn = document.getElementById("themeToggleBtn");
      if (btn) {
        const isDark = normalizedTheme === "dark";
        btn.textContent = isDark ? "淺色模式" : "深色模式";
        btn.setAttribute("aria-label", isDark ? "切換為淺色模式" : "切換為深色模式");
      }
    }

    function initializeTheme() {
      const savedTheme = localStorage.getItem(THEME_STORAGE_KEY) || "light";
      applyTheme(savedTheme);
    }

    function toggleTheme() {
      const nextTheme = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
      localStorage.setItem(THEME_STORAGE_KEY, nextTheme);
      applyTheme(nextTheme);
    }

    initializeTheme();

    function saveMastered() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(Array.from(masteredSet)));
      updateStats();
    }

    function updateStats() {
      const total = RAW_DATA.length;
      const masteredCount = RAW_DATA.filter(item => masteredSet.has(item.id)).length;
      const pct = total === 0 ? 0 : Math.round((masteredCount / total) * 100);

      document.getElementById('statsCount').textContent = `顯示 ${currentData.length} / 共 ${total} 題`;
      document.getElementById('statsMastered').textContent = `已掌握 ${masteredCount} 題 (${pct}%)`;
      document.getElementById('progressFill').style.width = pct + '%';
    }

    function renderMath() {
      if (window.renderMathInElement) {
        renderMathInElement(document.body, {
          delimiters: [
            {left: '$$', right: '$$', display: true},
            {left: '$', right: '$', display: false}
          ],
          throwOnError: false
        });
      }
    }

    function renderList() {
      const container = document.getElementById('qaList');
      if (currentData.length === 0) {
        container.innerHTML = '<div class="empty-state">沒有符合條件的問答卡片</div>';
        return;
      }

      container.innerHTML = currentData.map(item => {
        const isMastered = masteredSet.has(item.id);
        return `
          <div class="qa-card ${isMastered ? 'mastered' : ''} ${isAllExpanded ? 'open' : ''}" id="card-${item.id}">
            <div class="qa-header" onclick="toggleItem(${item.id})">
              <span class="qa-id">#${item.id}</span>
              <span class="qa-question">${escapeHtml(item.question)}</span>
              <div class="qa-actions">
                <button class="master-btn ${isMastered ? 'is-mastered' : ''}"
                        onclick="toggleMaster(event, ${item.id})"
                        title="${isMastered ? '已掌握' : '標記掌握'}">★</button>
                <span class="expand-icon">▼</span>
              </div>
            </div>
            <div class="qa-answer">${escapeHtml(item.answer)}</div>
          </div>
        `;
      }).join('');

      renderMath();
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    function toggleItem(id) {
      const el = document.getElementById('card-' + id);
      if (el) {
        el.classList.toggle('open');
      }
    }

    function toggleMaster(event, id) {
      event.stopPropagation();
      if (masteredSet.has(id)) {
        masteredSet.delete(id);
      } else {
        masteredSet.add(id);
      }
      saveMastered();
      applyFilters();
    }

    function toggleExpandAll() {
      isAllExpanded = !isAllExpanded;
      document.getElementById('expandAllBtn').textContent = isAllExpanded ? "收合全部" : "展開全部";
      document.querySelectorAll('.qa-card').forEach(card => {
        if (isAllExpanded) {
          card.classList.add('open');
        } else {
          card.classList.remove('open');
        }
      });
    }

    function toggleFilterMastered() {
      filterOnlyUnmastered = !filterOnlyUnmastered;
      const btn = document.getElementById('filterMasteredBtn');
      btn.classList.toggle('active-filter', filterOnlyUnmastered);
      btn.textContent = filterOnlyUnmastered ? "✓ 僅顯示未掌握" : "⭐ 只看未掌握";
      applyFilters();
    }

    function handleSearch() {
      applyFilters();
    }

    function applyFilters() {
      const query = document.getElementById('searchInput').value.trim().toLowerCase();
      currentData = RAW_DATA.filter(item => {
        if (filterOnlyUnmastered && masteredSet.has(item.id)) {
          return false;
        }
        if (query) {
          const matchQ = item.question.toLowerCase().includes(query);
          const matchA = item.answer.toLowerCase().includes(query);
          return matchQ || matchA;
        }
        return true;
      });

      cardIndex = 0;
      if (currentMode === 'list') {
        renderList();
      } else {
        updateCardView();
      }
      updateStats();
    }

    function shuffleCards() {
      currentData.sort(() => Math.random() - 0.5);
      cardIndex = 0;
      if (currentMode === 'list') {
        renderList();
      } else {
        updateCardView();
      }
    }

    function resetOrder() {
      currentData.sort((a, b) => a.id - b.id);
      cardIndex = 0;
      if (currentMode === 'list') {
        renderList();
      } else {
        updateCardView();
      }
    }

    function switchMode(mode) {
      currentMode = mode;
      const listBtn = document.getElementById('listViewBtn');
      const cardBtn = document.getElementById('cardViewBtn');
      const qaList = document.getElementById('qaList');
      const flashcardContainer = document.getElementById('flashcardContainer');
      const expandAllBtn = document.getElementById('expandAllBtn');

      if (mode === 'list') {
        listBtn.classList.add('active');
        cardBtn.classList.remove('active');
        qaList.style.display = 'flex';
        flashcardContainer.style.display = 'none';
        expandAllBtn.style.display = 'inline-flex';
        renderList();
      } else {
        cardBtn.classList.add('active');
        listBtn.classList.remove('active');
        qaList.style.display = 'none';
        flashcardContainer.style.display = 'flex';
        expandAllBtn.style.display = 'none';
        updateCardView();
      }
    }

    /* Flashcard Functions */
    function flipCard() {
      const wrapper = document.getElementById('flashcardWrapper');
      wrapper.classList.toggle('flipped');
    }

    function updateCardView() {
      const wrapper = document.getElementById('flashcardWrapper');
      wrapper.classList.remove('flipped');

      if (currentData.length === 0) {
        document.getElementById('fcQuestion').textContent = '無卡片資料';
        document.getElementById('fcAnswer').textContent = '無卡片資料';
        document.getElementById('fcCardNumber').textContent = '0 / 0';
        document.getElementById('fcCardNumberBack').textContent = '0 / 0';
        return;
      }

      if (cardIndex < 0) cardIndex = 0;
      if (cardIndex >= currentData.length) cardIndex = currentData.length - 1;

      const item = currentData[cardIndex];
      const isMastered = masteredSet.has(item.id);

      document.getElementById('fcQuestion').textContent = item.question;
      document.getElementById('fcAnswer').textContent = item.answer;

      const cardNumText = `卡片 ${cardIndex + 1} / ${currentData.length} (#${item.id})`;
      document.getElementById('fcCardNumber').textContent = cardNumText;
      document.getElementById('fcCardNumberBack').textContent = cardNumText;

      const btn1 = document.getElementById('fcMasterBtn');
      const btn2 = document.getElementById('fcMasterBtnBack');
      btn1.classList.toggle('is-mastered', isMastered);
      btn2.classList.toggle('is-mastered', isMastered);

      renderMath();
    }

    function prevCard() {
      if (currentData.length === 0) return;
      cardIndex = (cardIndex - 1 + currentData.length) % currentData.length;
      updateCardView();
    }

    function nextCard() {
      if (currentData.length === 0) return;
      cardIndex = (cardIndex + 1) % currentData.length;
      updateCardView();
    }

    function toggleCardMaster(event) {
      event.stopPropagation();
      if (currentData.length === 0) return;
      const item = currentData[cardIndex];
      toggleMaster(event, item.id);
      updateCardView();
    }

    /* Keyboard Shortcuts */
    window.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT') return;
      if (currentMode === 'card') {
        if (e.code === 'Space') {
          e.preventDefault();
          flipCard();
        } else if (e.code === 'ArrowLeft') {
          e.preventDefault();
          prevCard();
        } else if (e.code === 'ArrowRight') {
          e.preventDefault();
          nextCard();
        } else if (e.code === 'KeyM') {
          e.preventDefault();
          toggleCardMaster(e);
        }
      }
    });

    // Init
    window.addEventListener('DOMContentLoaded', () => {
      updateStats();
      renderList();
      setTimeout(renderMath, 200);
    });
  </script>
</body>
</html>
