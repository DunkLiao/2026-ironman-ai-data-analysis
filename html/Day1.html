<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Day1 - 數據分析問答複習卡</title>
  <!-- KaTeX for LaTeX rendering -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
  <style>
    :root {
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --primary-light: #eff6ff;
      --border-color: #e2e8f0;
      --success: #10b981;
      --success-light: #ecfdf5;
      --accent: #f59e0b;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
      --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.08), 0 2px 4px -2px rgba(0,0,0,0.05);
      --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.1), 0 4px 6px -4px rgba(0,0,0,0.05);
      --radius: 12px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg-color: #0f172a;
        --card-bg: #1e293b;
        --text-main: #f8fafc;
        --text-muted: #94a3b8;
        --primary: #60a5fa;
        --primary-hover: #3b82f6;
        --primary-light: #1e3a8a33;
        --border-color: #334155;
        --success: #34d399;
        --success-light: #064e3b33;
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans TC", sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      line-height: 1.6;
      padding-bottom: 60px;
    }

    /* Navigation / Header */
    header {
      background: var(--card-bg);
      border-bottom: 1px solid var(--border-color);
      position: sticky;
      top: 0;
      z-index: 50;
      box-shadow: var(--shadow-sm);
    }

    .header-container {
      max-width: 900px;
      margin: 0 auto;
      padding: 14px 20px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .nav-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 8px;
      background: var(--primary-light);
      color: var(--primary);
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      transition: all 0.2s;
    }

    .back-btn:hover {
      background: var(--primary);
      color: #fff;
    }

    .page-title {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .view-toggles {
      display: flex;
      background: var(--bg-color);
      padding: 3px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
    }

    .toggle-btn {
      padding: 6px 14px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .toggle-btn.active {
      background: var(--card-bg);
      color: var(--primary);
      box-shadow: var(--shadow-sm);
    }

    /* Main Container */
    main {
      max-width: 900px;
      margin: 24px auto;
      padding: 0 20px;
    }

    /* Toolbar */
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 20px;
      align-items: center;
      justify-content: space-between;
    }

    .search-box {
      flex: 1;
      min-width: 240px;
      position: relative;
    }

    .search-box input {
      width: 100%;
      padding: 10px 14px 10px 38px;
      border-radius: 10px;
      border: 1px solid var(--border-color);
      background: var(--card-bg);
      color: var(--text-main);
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-box input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-light);
    }

    .search-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 14px;
    }

    .action-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background: var(--card-bg);
      color: var(--text-main);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn:hover {
      background: var(--border-color);
    }

    .btn.active-filter {
      background: var(--primary-light);
      border-color: var(--primary);
      color: var(--primary);
    }

    /* Stats bar */
    .stats-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      font-size: 14px;
      color: var(--text-muted);
    }

    .progress-bar-container {
      flex: 1;
      height: 8px;
      background: var(--border-color);
      border-radius: 99px;
      margin: 0 16px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: var(--success);
      width: 0%;
      transition: width 0.3s ease;
    }

    /* List View Cards */
    .qa-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .qa-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      box-shadow: var(--shadow-sm);
      overflow: hidden;
      transition: box-shadow 0.2s, border-color 0.2s;
    }

    .qa-card:hover {
      box-shadow: var(--shadow-md);
      border-color: #cbd5e1;
    }

    .qa-card.mastered {
      border-left: 4px solid var(--success);
    }

    .qa-header {
      padding: 16px 20px;
      display: flex;
      align-items: flex-start;
      gap: 12px;
      cursor: pointer;
      user-select: none;
    }

    .qa-id {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 28px;
      height: 28px;
      background: var(--primary-light);
      color: var(--primary);
      border-radius: 6px;
      font-size: 13px;
      font-weight: 700;
      margin-top: 2px;
      flex-shrink: 0;
    }

    .qa-question {
      flex: 1;
      font-size: 15px;
      font-weight: 600;
      color: var(--text-main);
      padding-top: 2px;
    }

    .qa-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .master-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 18px;
      padding: 4px;
      border-radius: 6px;
      transition: transform 0.15s, color 0.15s;
    }

    .master-btn:hover {
      transform: scale(1.15);
    }

    .master-btn.is-mastered {
      color: var(--accent);
    }

    .expand-icon {
      color: var(--text-muted);
      font-size: 14px;
      transition: transform 0.2s ease;
    }

    .qa-card.open .expand-icon {
      transform: rotate(180deg);
    }

    .qa-answer {
      display: none;
      padding: 16px 20px 18px 60px;
      background: var(--bg-color);
      border-top: 1px dashed var(--border-color);
      font-size: 15px;
      color: var(--text-main);
      line-height: 1.7;
    }

    .qa-card.open .qa-answer {
      display: block;
      animation: fadeIn 0.2s ease-in;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Flashcard Mode */
    .flashcard-container {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      padding: 10px 0;
    }

    .flashcard-wrapper {
      perspective: 1000px;
      width: 100%;
      max-width: 640px;
      min-height: 340px;
      cursor: pointer;
    }

    .flashcard-inner {
      position: relative;
      width: 100%;
      height: 100%;
      min-height: 340px;
      text-align: center;
      transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
      transform-style: preserve-3d;
      border-radius: 16px;
      box-shadow: var(--shadow-lg);
    }

    .flashcard-wrapper.flipped .flashcard-inner {
      transform: rotateY(180deg);
    }

    .flashcard-face {
      position: absolute;
      width: 100%;
      height: 100%;
      min-height: 340px;
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 30px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      box-sizing: border-box;
    }

    .flashcard-back {
      transform: rotateY(180deg);
      background: var(--card-bg);
      border: 2px solid var(--primary);
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      color: var(--text-muted);
    }

    .card-badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 99px;
      font-weight: 600;
      font-size: 12px;
    }

    .badge-q {
      background: var(--primary-light);
      color: var(--primary);
    }

    .badge-a {
      background: var(--success-light);
      color: var(--success);
    }

    .card-body {
      margin: auto 0;
      padding: 20px 10px;
      font-size: 18px;
      font-weight: 600;
      line-height: 1.6;
    }

    .card-hint {
      font-size: 12px;
      color: var(--text-muted);
    }

    .flashcard-controls {
      display: flex;
      gap: 12px;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 640px;
    }

    .flashcard-controls .btn {
      padding: 10px 20px;
      font-size: 14px;
      font-weight: 600;
    }

    .btn-primary {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    .btn-primary:hover {
      background: var(--primary-hover);
    }

    .shortcuts-hint {
      font-size: 12px;
      color: var(--text-muted);
      text-align: center;
      margin-top: 8px;
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
      background: var(--card-bg);
      border-radius: var(--radius);
      border: 1px dashed var(--border-color);
    }
  </style>
</head>
<body>
  <header>
    <div class="header-container">
      <div class="nav-left">
        <a href="../index.html" class="back-btn" title="回目錄">← 目錄</a>
        <h1 class="page-title">Day1 問答卡</h1>
      </div>
      <div class="view-toggles">
        <button id="listViewBtn" class="toggle-btn active" onclick="switchMode('list')">📋 列表模式</button>
        <button id="cardViewBtn" class="toggle-btn" onclick="switchMode('card')">🎴 翻卡測驗</button>
      </div>
    </div>
  </header>

  <main>
    <div class="toolbar">
      <div class="search-box">
        <span class="search-icon">🔍</span>
        <input type="text" id="searchInput" placeholder="搜尋問題或答案關鍵字..." oninput="handleSearch()">
      </div>
      <div class="action-buttons">
        <button class="btn" id="filterMasteredBtn" onclick="toggleFilterMastered()">⭐ 只看未掌握</button>
        <button class="btn" id="expandAllBtn" onclick="toggleExpandAll()">展開全部</button>
        <button class="btn" onclick="shuffleCards()">🔀 隨機洗牌</button>
        <button class="btn" onclick="resetOrder()">🔄 恢復順序</button>
      </div>
    </div>

    <div class="stats-bar">
      <span id="statsCount">總計 0 題</span>
      <div class="progress-bar-container">
        <div id="progressFill" class="progress-fill"></div>
      </div>
      <span id="statsMastered">掌握率 0%</span>
    </div>

    <!-- List View -->
    <div id="qaList" class="qa-list"></div>

    <!-- Flashcard Mode View -->
    <div id="flashcardContainer" class="flashcard-container">
      <div class="flashcard-wrapper" id="flashcardWrapper" onclick="flipCard()">
        <div class="flashcard-inner">
          <!-- Front Face -->
          <div class="flashcard-face flashcard-front">
            <div class="card-top">
              <span class="card-badge badge-q">問題</span>
              <span id="fcCardNumber">卡片 1 / 1</span>
              <button class="master-btn" id="fcMasterBtn" onclick="toggleCardMaster(event)" title="標記為已掌握">★</button>
            </div>
            <div class="card-body" id="fcQuestion">載入中...</div>
            <div class="card-hint">💡 點擊卡片或按空白鍵翻面看答案</div>
          </div>
          <!-- Back Face -->
          <div class="flashcard-face flashcard-back">
            <div class="card-top">
              <span class="card-badge badge-a">解答</span>
              <span id="fcCardNumberBack">卡片 1 / 1</span>
              <button class="master-btn" id="fcMasterBtnBack" onclick="toggleCardMaster(event)" title="標記為已掌握">★</button>
            </div>
            <div class="card-body" id="fcAnswer">載入中...</div>
            <div class="card-hint">💡 再次點擊卡片翻回正面</div>
          </div>
        </div>
      </div>

      <div class="flashcard-controls">
        <button class="btn" onclick="prevCard()">← 上一題</button>
        <button class="btn btn-primary" onclick="flipCard()">翻轉卡片</button>
        <button class="btn" onclick="nextCard()">下一題 →</button>
      </div>
      <div class="shortcuts-hint">鍵盤快速鍵：[←] 上一題 · [空白鍵] 翻面 · [→] 下一題 · [M] 標記掌握</div>
    </div>
  </main>

  <script>
    const STORAGE_KEY = "anki_mastered_" + "Day1";
    const RAW_DATA = [{"id":1,"question":"根據 Gartner 的數據分析框架，哪一種分析類型旨在回答「發生了什麼事？」(What happened?)","answer":"描述性分析 (Descriptive Analysis)"},{"id":2,"question":"在 Gartner 的分析框架中，「診斷性分析」的核心命題是什麼？","answer":"為何會發生？ (Why did it happen?)"},{"id":3,"question":"旨在探討「將來會發生什麼？」(What will happen?) 的數據分析階段稱為 _____。","answer":"預測性分析 (Predictive Analysis)"},{"id":4,"question":"「處方性分析」在商業決策中的主要提問為何？","answer":"我們可以做什麼，來讓未來更符合我們的期待？"},{"id":5,"question":"在分析難度與價值的座標圖中，描述性分析被歸類為「事後覺察」，而診斷性分析則被視為 _____。","answer":"洞見 (Insight)"},{"id":6,"question":"Gartner 框架中，屬於「預見性 (Foresight)」範疇的分析包含預測性分析與 _____。","answer":"處方性分析 (Prescriptive Analysis)"},{"id":7,"question":"進行數據分析之前，必須先將原始數據整理成機器可理解的格式，這種資料稱為 _____。","answer":"結構化資料"},{"id":8,"question":"「假說思考法」的定義是什麼？","answer":"根據過去經驗或目前資訊，提出最接近根本原因的猜想與假說。"},{"id":9,"question":"在診斷性分析中，除了提出「假設」與「理由」，還需要列出什麼來驗證猜想？","answer":"檢驗方式 (可驗證的方式)"},{"id":10,"question":"概念：髒資料 (Dirty Data)","answer":"定義：格式不統一、重複、含有錯誤值或缺失值的原始數據，無法直接進行準確分析。"},{"id":11,"question":"數據清洗情境：將單一欄位內容（如：Taiwan, Taipei）拆分到不同欄位的操作稱為 _____。","answer":"切割 (Split)"},{"id":12,"question":"在數據處理層級中，Level 2 重點在於識別與處理什麼樣的數據？","answer":"非精確匹配的模糊重複數據 (如：Google, Inc. 與 Google LLC)。"},{"id":13,"question":"數據處理 Level 4 階段所強調的「數據管線 (Data Pipeline)」主要目的是什麼？","answer":"建立自動化的數據清洗流程並持續監控數據品質。"},{"id":14,"question":"導致資料雜亂的「系統設計問題」範例之一是：幣別格式從加拿大幣更改為 _____。","answer":"美金計價"},{"id":15,"question":"將「高雄縣」更名為「高雄市」後的資料對應整理，屬於數據清洗中的哪種情境？","answer":"資料欄位格式差異 (或資料定義變更)"},{"id":16,"question":"數據品質的維度除了準確性與一致性外，還包括完整性、唯一性與 _____。","answer":"時效性"},{"id":17,"question":"Tableau Public 版本最大的特色（也是與付費版的主要差異）為何？","answer":"它是完全免費的，但儲存的專案通常是公開的。"},{"id":18,"question":"在數據視覺化領域中，與 Tableau 競爭且同屬領導者地位的微軟工具是 _____。","answer":"Power BI"},{"id":19,"question":"Google 推出的免費雲端數據視覺化與分析工具名稱為何？","answer":"Looker Studio (原稱 Google Data Studio)"},{"id":20,"question":"根據 Northwestern University 的報告，數據分析師必備的七項關鍵技能包含 SQL、Excel、視覺化、數學統計、溝通、批判性思考與 _____。","answer":"程式語言 (R, Python, 或 MATLAB)"},{"id":21,"question":"在 Excel 自動化分析的 Level 3 階段，通常會結合哪種程式語言進行協作？","answer":"Python"},{"id":22,"question":"AI First！Vibe Coding 是指 Excel 自動化應用中的第幾個等級？","answer":"Level 4 (人機協作)"},{"id":23,"question":"進行「大量資料合併」的 AI 自動化技巧中，最關鍵的操作是比對什麼？","answer":"跨表的關聯資料 (如訂單編號對接客戶姓名)。"},{"id":24,"question":"請求 AI 分析樞紐分析表時，Prompt 應要求 AI 整理出「觀察重點」、「支持數字」、以及「可以怎麼說」與哪項關鍵資訊？","answer":"目前不能推論什麼"},{"id":25,"question":"在視覺化原則中，為了呈現主要資訊，Before/After 的建議做法是將資訊從灰色改為 _____。","answer":"亮色 (或鮮豔色彩)"},{"id":26,"question":"「WTF Visualizations」網站收集圖表的目的是為了警示什麼？","answer":"避免製作邏輯不通或誤導讀者的無意義圖表。"},{"id":27,"question":"Excel 函數常用於資料彙整，若要計算特定縣市在某月份的受傷人數，應提供 AI 哪些資訊來生成公式？","answer":"Excel 欄位名稱與前三筆資料的範例長相。"},{"id":28,"question":"數據分析過程中，哪一種分析通常需要建立模型 (Model) 或撰寫 Python 程式？","answer":"預測性分析 (及處方性分析)"},{"id":29,"question":"當數據處理邏輯不再只是單純的 $if\\ p\\ then\\ q$ 時，Level 2 處理重複值需要運用什麼演算法？","answer":"字串相似度演算法"},{"id":30,"question":"描述性統計中常用的數值除了平值數外，還包含最大值、最小值與 _____。","answer":"中位數 (或標準差等統計量)"},{"id":31,"question":"在進行數據分析提問前，建議先開啟 _____ 的對話空間，以避免不同主題干擾 AI 邏輯。","answer":"新 (New Chat)"},{"id":32,"question":"診斷性分析中，若發現特定時段事故死亡率偏高，除了疲勞駕駛外，另一種常見的生理性假設為何？","answer":"酒後駕駛 (酒駕)"},{"id":33,"question":"在數據處理中，處理明顯錯誤與統一格式屬於 Level 1 的 _____。","answer":"基礎資料處理 (初步清理)"},{"id":34,"question":"自動化分析 Level 2 階段，除了大量資料合併，另一項常見的 AI 自動化技巧是自動比對 _____。","answer":"付款 (對帳)"},{"id":35,"question":"製作視覺化圖表時，如果想要顯示趨勢變化，通常應選擇線圖還是長條圖？","answer":"線圖 (Line Chart)"},{"id":36,"question":"數據分析流程中，從「提問、準備、處理」到「分析、分享」，最後一個關鍵步驟是 _____。","answer":"行動 (Action)"},{"id":37,"question":"當我們使用 AI 寫分析報告時，應在 Prompt 中指定生成的檔案格式為 _____。","answer":"Word 檔 (或 .docx)"},{"id":38,"question":"分析 A1 事故數據時，若高雄市事故件數最多，卻不能直接說高雄「最危險」，其原因為何？","answer":"尚未考慮人口數、車流量、道路長度等暴露量基準 (Exposure)。"},{"id":39,"question":"在假說思考法中，針對「凌晨事故死亡風險高」提出的環境假設可能是因為道路較 _____，導致車速較高。","answer":"空曠"},{"id":40,"question":"「資料欄位名稱、前三筆資料長相」是請求 AI 輔助分析時必須提供的 _____ 資訊。","answer":"上下文 (Context) 或 Prompt 基礎"},{"id":41,"question":"哪一項數據分析師技能強調「不輕易盲從圖表表面資訊，能發現隱藏問題」？","answer":"批判性思考 (Critical Thinking)"},{"id":42,"question":"數據清洗情境：將幣別符號與數值分離，以便進行數學運算，這屬於清洗中的什麼步驟？","answer":"格式統一化或欄位拆分"},{"id":43,"question":"根據教材，目前主流的商業智慧 (BI) 領導工具前三名分別為 Microsoft、Tableau 與 _____。","answer":"Google (Looker)"},{"id":44,"question":"在數據視覺化中，使用亮色突顯主要資訊，是為了引導讀者的 _____。","answer":"視覺焦點 (或注意力)"},{"id":45,"question":"「預測性分析」關注的是 Foresight，而「描述性分析」關注的是 _____。","answer":"Hindsight (事後覺察)"},{"id":46,"question":"AI 自動化分析 Level 3 的「分析模型建構」，其主要價值在於提升預測的 _____。","answer":"準確性 (或精準度)"},{"id":47,"question":"當數據來自多個平台且日期格式不一時（如：2023/1/1 與 106/1/1），清洗的首要任務是 _____。","answer":"格式統一化"},{"id":48,"question":"在 Excel 樞紐分析中，將資料依據「發生縣市」和「受傷人數」進行整合，是為了進行不同 _____ 的觀察。","answer":"維度 (Dimensions)"},{"id":49,"question":"批判性思考在數據分析中的重要性，在於能夠發現 AI 難以驗證的 _____。","answer":"邏輯問題或數據偏差"},{"id":50,"question":"利用 AI 生成 1500 字報告時，Prompt 中應包含「質化論述、行動方案、分析背景」與什麼核心分析？","answer":"描述性分析與診斷性分析"},{"id":51,"question":"在診斷分析案例中，若要檢驗「酒駕」假設，需要連結外部的什麼資料？","answer":"酒測資料或警方事故原因分類。"},{"id":52,"question":"描述性分析的極限在於它只能告訴我們現象，無法告訴我們 _____。","answer":"原因 (或為什麼)"},{"id":53,"question":"Level 3 異常值偵測的分析前提，是需要有清晰的 _____ 和數據標準。","answer":"業務規則 (Business Rules)"},{"id":54,"question":"視覺化工具的選擇上，Tableau 被認為風格較優美，而 Power BI 常被部分使用者認為風格較為 _____。","answer":"陽春 (或陽剛、商務)"},{"id":55,"question":"進行數據分析的「行動 (Action)」步驟，通常對應到 Gartner 框架中的哪種分析？","answer":"處方性分析 (Prescriptive Analysis)"}];
    let currentData = [...RAW_DATA];
    let masteredSet = new Set(JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]"));
    let currentMode = 'list';
    let filterOnlyUnmastered = false;
    let isAllExpanded = false;
    let cardIndex = 0;

    function saveMastered() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(Array.from(masteredSet)));
      updateStats();
    }

    function updateStats() {
      const total = RAW_DATA.length;
      const masteredCount = RAW_DATA.filter(item => masteredSet.has(item.id)).length;
      const pct = total === 0 ? 0 : Math.round((masteredCount / total) * 100);

      document.getElementById('statsCount').textContent = `顯示 ${currentData.length} / 共 ${total} 題`;
      document.getElementById('statsMastered').textContent = `已掌握 ${masteredCount} 題 (${pct}%)`;
      document.getElementById('progressFill').style.width = pct + '%';
    }

    function renderMath() {
      if (window.renderMathInElement) {
        renderMathInElement(document.body, {
          delimiters: [
            {left: '$$', right: '$$', display: true},
            {left: '$', right: '$', display: false}
          ],
          throwOnError: false
        });
      }
    }

    function renderList() {
      const container = document.getElementById('qaList');
      if (currentData.length === 0) {
        container.innerHTML = '<div class="empty-state">沒有符合條件的問答卡片</div>';
        return;
      }

      container.innerHTML = currentData.map(item => {
        const isMastered = masteredSet.has(item.id);
        return `
          <div class="qa-card ${isMastered ? 'mastered' : ''} ${isAllExpanded ? 'open' : ''}" id="card-${item.id}">
            <div class="qa-header" onclick="toggleItem(${item.id})">
              <span class="qa-id">#${item.id}</span>
              <span class="qa-question">${escapeHtml(item.question)}</span>
              <div class="qa-actions">
                <button class="master-btn ${isMastered ? 'is-mastered' : ''}"
                        onclick="toggleMaster(event, ${item.id})"
                        title="${isMastered ? '已掌握' : '標記掌握'}">★</button>
                <span class="expand-icon">▼</span>
              </div>
            </div>
            <div class="qa-answer">${escapeHtml(item.answer)}</div>
          </div>
        `;
      }).join('');

      renderMath();
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    function toggleItem(id) {
      const el = document.getElementById('card-' + id);
      if (el) {
        el.classList.toggle('open');
      }
    }

    function toggleMaster(event, id) {
      event.stopPropagation();
      if (masteredSet.has(id)) {
        masteredSet.delete(id);
      } else {
        masteredSet.add(id);
      }
      saveMastered();
      applyFilters();
    }

    function toggleExpandAll() {
      isAllExpanded = !isAllExpanded;
      document.getElementById('expandAllBtn').textContent = isAllExpanded ? "收合全部" : "展開全部";
      document.querySelectorAll('.qa-card').forEach(card => {
        if (isAllExpanded) {
          card.classList.add('open');
        } else {
          card.classList.remove('open');
        }
      });
    }

    function toggleFilterMastered() {
      filterOnlyUnmastered = !filterOnlyUnmastered;
      const btn = document.getElementById('filterMasteredBtn');
      btn.classList.toggle('active-filter', filterOnlyUnmastered);
      btn.textContent = filterOnlyUnmastered ? "✓ 僅顯示未掌握" : "⭐ 只看未掌握";
      applyFilters();
    }

    function handleSearch() {
      applyFilters();
    }

    function applyFilters() {
      const query = document.getElementById('searchInput').value.trim().toLowerCase();
      currentData = RAW_DATA.filter(item => {
        if (filterOnlyUnmastered && masteredSet.has(item.id)) {
          return false;
        }
        if (query) {
          const matchQ = item.question.toLowerCase().includes(query);
          const matchA = item.answer.toLowerCase().includes(query);
          return matchQ || matchA;
        }
        return true;
      });

      cardIndex = 0;
      if (currentMode === 'list') {
        renderList();
      } else {
        updateCardView();
      }
      updateStats();
    }

    function shuffleCards() {
      currentData.sort(() => Math.random() - 0.5);
      cardIndex = 0;
      if (currentMode === 'list') {
        renderList();
      } else {
        updateCardView();
      }
    }

    function resetOrder() {
      currentData.sort((a, b) => a.id - b.id);
      cardIndex = 0;
      if (currentMode === 'list') {
        renderList();
      } else {
        updateCardView();
      }
    }

    function switchMode(mode) {
      currentMode = mode;
      const listBtn = document.getElementById('listViewBtn');
      const cardBtn = document.getElementById('cardViewBtn');
      const qaList = document.getElementById('qaList');
      const flashcardContainer = document.getElementById('flashcardContainer');
      const expandAllBtn = document.getElementById('expandAllBtn');

      if (mode === 'list') {
        listBtn.classList.add('active');
        cardBtn.classList.remove('active');
        qaList.style.display = 'flex';
        flashcardContainer.style.display = 'none';
        expandAllBtn.style.display = 'inline-flex';
        renderList();
      } else {
        cardBtn.classList.add('active');
        listBtn.classList.remove('active');
        qaList.style.display = 'none';
        flashcardContainer.style.display = 'flex';
        expandAllBtn.style.display = 'none';
        updateCardView();
      }
    }

    /* Flashcard Functions */
    function flipCard() {
      const wrapper = document.getElementById('flashcardWrapper');
      wrapper.classList.toggle('flipped');
    }

    function updateCardView() {
      const wrapper = document.getElementById('flashcardWrapper');
      wrapper.classList.remove('flipped');

      if (currentData.length === 0) {
        document.getElementById('fcQuestion').textContent = '無卡片資料';
        document.getElementById('fcAnswer').textContent = '無卡片資料';
        document.getElementById('fcCardNumber').textContent = '0 / 0';
        document.getElementById('fcCardNumberBack').textContent = '0 / 0';
        return;
      }

      if (cardIndex < 0) cardIndex = 0;
      if (cardIndex >= currentData.length) cardIndex = currentData.length - 1;

      const item = currentData[cardIndex];
      const isMastered = masteredSet.has(item.id);

      document.getElementById('fcQuestion').textContent = item.question;
      document.getElementById('fcAnswer').textContent = item.answer;

      const cardNumText = `卡片 ${cardIndex + 1} / ${currentData.length} (#${item.id})`;
      document.getElementById('fcCardNumber').textContent = cardNumText;
      document.getElementById('fcCardNumberBack').textContent = cardNumText;

      const btn1 = document.getElementById('fcMasterBtn');
      const btn2 = document.getElementById('fcMasterBtnBack');
      btn1.classList.toggle('is-mastered', isMastered);
      btn2.classList.toggle('is-mastered', isMastered);

      renderMath();
    }

    function prevCard() {
      if (currentData.length === 0) return;
      cardIndex = (cardIndex - 1 + currentData.length) % currentData.length;
      updateCardView();
    }

    function nextCard() {
      if (currentData.length === 0) return;
      cardIndex = (cardIndex + 1) % currentData.length;
      updateCardView();
    }

    function toggleCardMaster(event) {
      event.stopPropagation();
      if (currentData.length === 0) return;
      const item = currentData[cardIndex];
      toggleMaster(event, item.id);
      updateCardView();
    }

    /* Keyboard Shortcuts */
    window.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT') return;
      if (currentMode === 'card') {
        if (e.code === 'Space') {
          e.preventDefault();
          flipCard();
        } else if (e.code === 'ArrowLeft') {
          e.preventDefault();
          prevCard();
        } else if (e.code === 'ArrowRight') {
          e.preventDefault();
          nextCard();
        } else if (e.code === 'KeyM') {
          e.preventDefault();
          toggleCardMaster(e);
        }
      }
    });

    // Init
    window.addEventListener('DOMContentLoaded', () => {
      updateStats();
      renderList();
      setTimeout(renderMath, 200);
    });
  </script>
</body>
</html>
