<!DOCTYPE html>
<html lang="zh-TW" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Day6 - 問答複習卡</title>
  <!-- KaTeX for LaTeX rendering -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
  <style>
    :root {
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --primary-light: #eff6ff;
      --border-color: #e2e8f0;
      --success: #10b981;
      --success-light: #ecfdf5;
      --accent: #f59e0b;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
      --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.08), 0 2px 4px -2px rgba(0,0,0,0.05);
      --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.1), 0 4px 6px -4px rgba(0,0,0,0.05);
      --radius: 12px;
    }

    html[data-theme="dark"] {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #60a5fa;
      --primary-hover: #3b82f6;
      --primary-light: #1e3a8a33;
      --border-color: #334155;
      --success: #34d399;
      --success-light: #064e3b33;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans TC", sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      line-height: 1.6;
      padding-bottom: 60px;
    }

    /* Navigation / Header */
    header {
      background: var(--card-bg);
      border-bottom: 1px solid var(--border-color);
      position: sticky;
      top: 0;
      z-index: 50;
      box-shadow: var(--shadow-sm);
    }

    .header-container {
      max-width: 900px;
      margin: 0 auto;
      padding: 14px 20px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .nav-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 8px;
      background: var(--primary-light);
      color: var(--primary);
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      transition: all 0.2s;
    }

    .back-btn:hover {
      background: var(--primary);
      color: #fff;
    }

    .page-title {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .view-toggles {
      display: flex;
      background: var(--bg-color);
      padding: 3px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
    }

    .header-actions {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: flex-end;
    }

    .toggle-btn {
      padding: 6px 14px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .toggle-btn.active {
      background: var(--card-bg);
      color: var(--primary);
      box-shadow: var(--shadow-sm);
    }

    .theme-toggle {
      padding: 7px 12px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      background: var(--card-bg);
      color: var(--text-main);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: var(--shadow-sm);
      transition: border-color 0.2s, color 0.2s, background 0.2s;
    }

    .theme-toggle:hover {
      border-color: var(--primary);
      color: var(--primary);
    }

    /* Main Container */
    main {
      max-width: 900px;
      margin: 24px auto;
      padding: 0 20px;
    }

    /* Toolbar */
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 20px;
      align-items: center;
      justify-content: space-between;
    }

    .search-box {
      flex: 1;
      min-width: 240px;
      position: relative;
    }

    .search-box input {
      width: 100%;
      padding: 10px 14px 10px 38px;
      border-radius: 10px;
      border: 1px solid var(--border-color);
      background: var(--card-bg);
      color: var(--text-main);
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-box input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-light);
    }

    .search-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 14px;
    }

    .action-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background: var(--card-bg);
      color: var(--text-main);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn:hover {
      background: var(--border-color);
    }

    .btn.active-filter {
      background: var(--primary-light);
      border-color: var(--primary);
      color: var(--primary);
    }

    /* Stats bar */
    .stats-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      font-size: 14px;
      color: var(--text-muted);
    }

    .progress-bar-container {
      flex: 1;
      height: 8px;
      background: var(--border-color);
      border-radius: 99px;
      margin: 0 16px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: var(--success);
      width: 0%;
      transition: width 0.3s ease;
    }

    /* List View Cards */
    .qa-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .qa-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      box-shadow: var(--shadow-sm);
      overflow: hidden;
      transition: box-shadow 0.2s, border-color 0.2s;
    }

    .qa-card:hover {
      box-shadow: var(--shadow-md);
      border-color: #cbd5e1;
    }

    .qa-card.mastered {
      border-left: 4px solid var(--success);
    }

    .qa-header {
      padding: 16px 20px;
      display: flex;
      align-items: flex-start;
      gap: 12px;
      cursor: pointer;
      user-select: none;
    }

    .qa-id {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 28px;
      height: 28px;
      background: var(--primary-light);
      color: var(--primary);
      border-radius: 6px;
      font-size: 13px;
      font-weight: 700;
      margin-top: 2px;
      flex-shrink: 0;
    }

    .qa-question {
      flex: 1;
      font-size: 15px;
      font-weight: 600;
      color: var(--text-main);
      padding-top: 2px;
    }

    .qa-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .master-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 18px;
      padding: 4px;
      border-radius: 6px;
      transition: transform 0.15s, color 0.15s;
    }

    .master-btn:hover {
      transform: scale(1.15);
    }

    .master-btn.is-mastered {
      color: var(--accent);
    }

    .expand-icon {
      color: var(--text-muted);
      font-size: 14px;
      transition: transform 0.2s ease;
    }

    .qa-card.open .expand-icon {
      transform: rotate(180deg);
    }

    .qa-answer {
      display: none;
      padding: 16px 20px 18px 60px;
      background: var(--bg-color);
      border-top: 1px dashed var(--border-color);
      font-size: 15px;
      color: var(--text-main);
      line-height: 1.7;
    }

    .qa-card.open .qa-answer {
      display: block;
      animation: fadeIn 0.2s ease-in;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Flashcard Mode */
    .flashcard-container {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      padding: 10px 0;
    }

    .flashcard-wrapper {
      perspective: 1000px;
      width: 100%;
      max-width: 640px;
      min-height: 340px;
      cursor: pointer;
    }

    .flashcard-inner {
      position: relative;
      width: 100%;
      height: 100%;
      min-height: 340px;
      text-align: center;
      transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
      transform-style: preserve-3d;
      border-radius: 16px;
      box-shadow: var(--shadow-lg);
    }

    .flashcard-wrapper.flipped .flashcard-inner {
      transform: rotateY(180deg);
    }

    .flashcard-face {
      position: absolute;
      width: 100%;
      height: 100%;
      min-height: 340px;
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 30px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      box-sizing: border-box;
    }

    .flashcard-back {
      transform: rotateY(180deg);
      background: var(--card-bg);
      border: 2px solid var(--primary);
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      color: var(--text-muted);
    }

    .card-badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 99px;
      font-weight: 600;
      font-size: 12px;
    }

    .badge-q {
      background: var(--primary-light);
      color: var(--primary);
    }

    .badge-a {
      background: var(--success-light);
      color: var(--success);
    }

    .card-body {
      margin: auto 0;
      padding: 20px 10px;
      font-size: 18px;
      font-weight: 600;
      line-height: 1.6;
    }

    .card-hint {
      font-size: 12px;
      color: var(--text-muted);
    }

    .flashcard-controls {
      display: flex;
      gap: 12px;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 640px;
    }

    .flashcard-controls .btn {
      padding: 10px 20px;
      font-size: 14px;
      font-weight: 600;
    }

    .btn-primary {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    .btn-primary:hover {
      background: var(--primary-hover);
    }

    .shortcuts-hint {
      font-size: 12px;
      color: var(--text-muted);
      text-align: center;
      margin-top: 8px;
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
      background: var(--card-bg);
      border-radius: var(--radius);
      border: 1px dashed var(--border-color);
    }
  </style>
</head>
<body>
  <header>
    <div class="header-container">
      <div class="nav-left">
        <a href="index.html" class="back-btn" title="回目錄">← 目錄</a>
        <h1 class="page-title">Day6 問答卡</h1>
      </div>
      <div class="header-actions">
        <button class="theme-toggle" id="themeToggleBtn" type="button" onclick="toggleTheme()" aria-label="切換為深色模式">深色模式</button>
        <div class="view-toggles">
          <button id="listViewBtn" class="toggle-btn active" onclick="switchMode('list')">📋 列表模式</button>
          <button id="cardViewBtn" class="toggle-btn" onclick="switchMode('card')">🎴 翻卡測驗</button>
        </div>
      </div>
    </div>
  </header>

  <main>
    <div class="toolbar">
      <div class="search-box">
        <span class="search-icon">🔍</span>
        <input type="text" id="searchInput" placeholder="搜尋問題或答案關鍵字..." oninput="handleSearch()">
      </div>
      <div class="action-buttons">
        <button class="btn" id="filterMasteredBtn" onclick="toggleFilterMastered()">⭐ 只看未掌握</button>
        <button class="btn" id="expandAllBtn" onclick="toggleExpandAll()">展開全部</button>
        <button class="btn" onclick="shuffleCards()">🔀 隨機洗牌</button>
        <button class="btn" onclick="resetOrder()">🔄 恢復順序</button>
      </div>
    </div>

    <div class="stats-bar">
      <span id="statsCount">總計 0 題</span>
      <div class="progress-bar-container">
        <div id="progressFill" class="progress-fill"></div>
      </div>
      <span id="statsMastered">掌握率 0%</span>
    </div>

    <!-- List View -->
    <div id="qaList" class="qa-list"></div>

    <!-- Flashcard Mode View -->
    <div id="flashcardContainer" class="flashcard-container">
      <div class="flashcard-wrapper" id="flashcardWrapper" onclick="flipCard()">
        <div class="flashcard-inner">
          <!-- Front Face -->
          <div class="flashcard-face flashcard-front">
            <div class="card-top">
              <span class="card-badge badge-q">問題</span>
              <span id="fcCardNumber">卡片 1 / 1</span>
              <button class="master-btn" id="fcMasterBtn" onclick="toggleCardMaster(event)" title="標記為已掌握">★</button>
            </div>
            <div class="card-body" id="fcQuestion">載入中...</div>
            <div class="card-hint">💡 點擊卡片或按空白鍵翻面看答案</div>
          </div>
          <!-- Back Face -->
          <div class="flashcard-face flashcard-back">
            <div class="card-top">
              <span class="card-badge badge-a">解答</span>
              <span id="fcCardNumberBack">卡片 1 / 1</span>
              <button class="master-btn" id="fcMasterBtnBack" onclick="toggleCardMaster(event)" title="標記為已掌握">★</button>
            </div>
            <div class="card-body" id="fcAnswer">載入中...</div>
            <div class="card-hint">💡 再次點擊卡片翻回正面</div>
          </div>
        </div>
      </div>

      <div class="flashcard-controls">
        <button class="btn" onclick="prevCard()">← 上一題</button>
        <button class="btn btn-primary" onclick="flipCard()">翻轉卡片</button>
        <button class="btn" onclick="nextCard()">下一題 →</button>
      </div>
      <div class="shortcuts-hint">鍵盤快速鍵：[←] 上一題 · [空白鍵] 翻面 · [→] 下一題 · [M] 標記掌握</div>
    </div>
  </main>

  <script>
    const THEME_STORAGE_KEY = "qa_theme";
    const STORAGE_KEY = "anki_mastered_" + "Day6";
    const RAW_DATA = [{"id":1,"question":"在 BHPH 投資組合管理中，哪種分析技術是根據貸款的發放期間（Origination Period）將貸款分組來觀察其表現？","answer":"靜態池分析（Static Pool Analysis）。"},{"id":2,"question":"靜態池分析中，測量扣除回收款後的壞帳損失頻率與嚴重程度的指標是什麼？","answer":"淨靜態池率（Net Static Pool Rate）。"},{"id":3,"question":"轉移率分析（Roll-Rate Analysis）主要監控貸款在不同_____階段之間的移動（例如從逾期 30 天移動到 60 天）。","answer":"逾期（Delinquency）。"},{"id":4,"question":"如果轉移率分析顯示貸款直接從「正常」跳轉到「逾期 60+ 天」，這通常釋放什麼信號？","answer":"借款人可能面臨嚴重的財務困難。"},{"id":5,"question":"哪種分析方法是將貸款發放期間與表現趨勢對齊，並繪製隨「在冊月份」（Months on Books）變化的表現曲線？","answer":"帳齡曲線分析（Vintage Curve Analysis）。"},{"id":6,"question":"在 BHPH 案例中，若 2024 年 1 月發放的貸款在 6 個月後的沖銷率為 $2\\%$，而 7 月發放的則為 $2.5\\%$，這代表什麼？","answer":"投資組合質量正在下降。"},{"id":7,"question":"轉移率分析中的「借款人計數法」（Borrower Count）主要用於理解什麼？","answer":"客戶行為。"},{"id":8,"question":"BCBS 239 的正式全稱是什麼？","answer":"《有效風險數據彙總與風險報告原則》（Principles for Effective Risk Data Aggregation and Risk Reporting）。"},{"id":9,"question":"BCBS 239 準則主要是為了應對哪一個事件暴露的漏洞而制定的？","answer":"2008 年金融海嘯。"},{"id":10,"question":"BCBS 239 的 14 條原則中，有多少條適用於銀行，多少條適用於監管機構？","answer":"11 條適用於銀行，3 條適用於監管機構。"},{"id":11,"question":"BCBS 239 的第一個焦點領域是什麼？","answer":"總體治理與基礎設施（Overarching Governance and Infrastructure）。"},{"id":12,"question":"根據 BCBS 239 原則 2，銀行應在何種條件下確保 IT 基礎設施能支持風險數據彙總？","answer":"在正常及壓力（或危機）時期。"},{"id":13,"question":"BCBS 239 原則 3（準確性與完整性）建議應儘量以_____方式彙總數據，以減少錯誤機率。","answer":"自動化。"},{"id":14,"question":"BCBS 239 原則 6 要求銀行具備何種能力，以便滿足臨時的風險管理報告需求？","answer":"適應性（Adaptability）。"},{"id":15,"question":"風險報告原則（原則 7-11）中，「頻率」應根據什麼來設定？","answer":"風險的性質、變化速度以及接收者的需求。"},{"id":16,"question":"BCBS 239 原則 14 涉及各司法管轄區監管機構之間的什麼行為？","answer":"母國與東道國的監管合作（Home/Host Cooperation）。"},{"id":17,"question":"在銀行數據分析中，旨在解釋「為什麼會發生某事」的分析類型稱為_____。","answer":"診斷性分析（Diagnostic Analytics）。"},{"id":18,"question":"「預測性分析」（Predictive Analytics）如何幫助銀行進行貸款業務？","answer":"透過機器學習算法比傳統評分法更準確地評估信用風險。"},{"id":19,"question":"「指示性分析」（Prescriptive Analytics）在銀行決策中的作用是什麼？","answer":"建議應採取什麼行動。"},{"id":20,"question":"銀行用於識別高利潤客戶關係並了解長期盈利驅動因素的模型稱為什麼？","answer":"終身價值模型（Lifetime Value Modeling）。"},{"id":21,"question":"在客戶分析中，「下一最佳行動」（Next-best-action）分析結合了客戶見解與什麼？","answer":"商業規則（Business Rules）。"},{"id":22,"question":"金融機構將異構來源的數據整合到統一數據庫的關鍵步驟稱為 _____ 過程。","answer":"ETL（提取、轉換、加載）。"},{"id":23,"question":"CECL（當前預期信用損失）模型與傳統模型的主要區別在於它測量的是什麼？","answer":"預期的信用損失，而非已發生的損失。"},{"id":24,"question":"在 CECL 方法論中，哪種方法跟蹤一組封閉的貸款池並計算單一的損失率？","answer":"靜態池分析（Static Pool Analysis）。"},{"id":25,"question":"CECL 的「折現現金流」（DCF）模型估計中包含哪三個關鍵信用指標？","answer":"違約概率（PD）、違約損失率（LGD）與違約風險敞口（EAD）。"},{"id":26,"question":"遷移分析（Migration Analysis）通常推薦用於哪種類型的貸款池？","answer":"壽命較短（小於 3 年）且具有風險多樣性的貸款池。"},{"id":27,"question":"「轉換矩陣」（Transition Matrix）方法也被稱為什麼分析？","answer":"滾動率分析（Roll Rate Analysis）。"},{"id":28,"question":"帳齡分析（Vintage Analysis）最適合應用於哪類貸款？","answer":"同質的分期貸款和抵押貸款（Homogeneous Installment Loans and Mortgages）。"},{"id":29,"question":"WARM（餘額加權平均剩餘壽命）方法如何估計損失？","answer":"利用週期性的沖銷率並將其應用於工具剩餘壽命的餘額預測。"},{"id":30,"question":"為什麼不建議在沒有風險監控的貸款池中使用 PD/LGD 方法？","answer":"因為難以在沒有衰退數據期的情況下應用合理且可支撐的預測（R&S Forecasts）。"},{"id":31,"question":"建立信用風險模型的第一步通常是什麼？","answer":"定義目標（Define Objective）。"},{"id":32,"question":"在模型開發中，「觀察窗口」（Observation Window）的作用是什麼？","answer":"提取用於預測未來表現的自變量（Independent Variables）。"},{"id":33,"question":"信用風險模型中的「細分」（Segmentation）目的是什麼？","answer":"將人口劃分為子組，以便更好地分離「好」與「壞」客戶。"},{"id":34,"question":"在確定模型的「壞帳」（Bad）定義時，分析師通常會檢查什麼？","answer":"帳戶轉移率（Account Roll Rates）和瀑布流（Waterfalls）。"},{"id":35,"question":"BCBS 239 原則 4（完整性）要求銀行具備識別何種風險的能力？","answer":"集中風險（Concentrations）和新興風險（Emerging Risks）。"},{"id":36,"question":"對於長壽命貸款（通常指 3 年以上），為什麼不推薦使用靜態池分析？","answer":"因為在此階段應用預測會變得難以維持（Untenable）。"},{"id":37,"question":"在 Tableau 等 BI 工具中，用於數據清洗、重塑和預處理的工作流工具是什麼？","answer":"Tableau Prep。"},{"id":38,"question":"一名商業智能（BI）分析師在處理來自 ERP 的數據時，通常需要精通哪種數據庫查詢語言？","answer":"SQL。"},{"id":39,"question":"BCBS 239 原則 10 中，誰負責設定風險管理報告的生產與分發頻率？","answer":"董事會和高級管理層。"},{"id":40,"question":"「合規分析」（Compliance Analytics）如何利用機器學習？","answer":"自動化監控交易以對照監管要求，減少誤報並適應新的監管解釋。"},{"id":41,"question":"在衡量數據分析的 ROI 時，除了直接財務指標外，還應考慮哪些營運指標？","answer":"流程效率、決策速度和客戶滿意度。"},{"id":42,"question":"在零售與中小企業信用風險策略中，涵蓋的範疇除了承保（Underwriting）外，還包括哪些要素？","answer":"信用政策、風險定價、貸款額度及期限。"},{"id":43,"question":"BCBS 239 原則 13 給予監管機構何種權力？","answer":"要求銀行採取及時補救行動以解決風險數據彙總缺陷的權力。"},{"id":44,"question":"靜態池分析與帳齡分析的主要共同點是什麼？","answer":"皆基於封閉的、按時間界定的貸款群組。"},{"id":45,"question":"公式概念：在 CECL 的 DCF 模型中，$EAD$ 代表什麼？","answer":"違約風險敞口（Exposure-at-default）。"},{"id":46,"question":"在數據可視化中，將複雜的數值信息轉換為直觀表示的工具稱為什麼？","answer":"儀表板（Dashboards）。"},{"id":47,"question":"根據維基百科，BCBS 239 對於在 2012 年 11 月前被定義為 G-SIBs 的銀行，何時開始適用？","answer":"2016 年 1 月 1 日。"},{"id":48,"question":"BCBS 239 原則 9（清晰度與實用性）強調報告應在數據與什麼之間取得平衡？","answer":"分析、解釋及定性說明。"},{"id":49,"question":"在信用模型驗證中，測試模型在不同時間段表現的一致性稱為什麼？","answer":"校準與再驗證（Validation and Recalibration）。"},{"id":50,"question":"對於信用文件較薄（Thin file）的客戶，信用風險建模時常用的細分變量是什麼？","answer":"信用文件的厚度（Credit file thickness）。"},{"id":51,"question":"銀行數據安全分析系統如何識別潛在的未授權訪問？","answer":"建立正常活動的基線模式並標記異常情況。"},{"id":52,"question":"在銀行預測性分析中，用於預防客戶流失的模型稱為什麼？","answer":"流失預測模型（Churn Prediction Models）。"},{"id":53,"question":"BCBS 239 原則 12 要求監管機構_____審查銀行對 11 條原則的遵循情況。","answer":"定期（Periodically）。"},{"id":54,"question":"轉移率分析中的「金額法」（Dollar Amount）主要用於評估什麼？","answer":"財務影響（Financial Impact）。"},{"id":55,"question":"如果銀行缺乏足夠的歷史數據來估算 CECL，通常推薦使用哪種模型？","answer":"折現現金流（DCF）模型。"},{"id":56,"question":"在靜態池分析中，一旦池子建立後，是否可以添加新貸款？","answer":"不可以，池子是封閉的。"},{"id":57,"question":"BCBS 239 旨在加強銀行的風險數據彙總能力，從而增進什麼？","answer":"風險管理與決策過程。"},{"id":58,"question":"「關鍵風險指標」（KRI）在投資組合監控中的主要作用是什麼？","answer":"識別新興的投資組合風險（Emerging portfolio risks）。"},{"id":59,"question":"哪種分析方法最適合測量貸款對「調性」（Seasoning）的敏感度？","answer":"帳齡分析（Vintage Analysis）。"},{"id":60,"question":"在 Tableau 儀表板設計中，用於實現動態見解的常見功能包括參數（Parameters）、集合（Sets）和 _____。","answer":"LOD 表達式（Level of Detail expressions）。"},{"id":61,"question":"銀行「競爭情報」（Competitive Intelligence）通常將機構表現與什麼進行對比？","answer":"行業基準（Industry Benchmarks）與競爭對手活動。"},{"id":62,"question":"根據 BCBS 239，風險報告的「準確性」要求報告數據應與什麼進行核對？","answer":"對帳與驗證（Reconciled and Validated）。"},{"id":63,"question":"建立信用風險模型時，剔除「不合格」賬戶的步驟稱為什麼？","answer":"應用排除標準（Applying Exclusions）。"},{"id":64,"question":"在 CECL 遷移分析中，「Pass」等級的信貸通常分配較低撥備，但何時會立即獲得額外分配？","answer":"當其發生風險等級遷移（向下遷移）時。"},{"id":65,"question":"BCBS 239 原則 11 強調報告分發時必須同時維護什麼？","answer":"機密性（Confidentiality）。"},{"id":66,"question":"數據治理框架對銀行決策的首要貢獻是什麼？","answer":"確保數據質量、安全性和合規性。"},{"id":67,"question":"銀行分析中的「市場情報」（Market Intelligence）主要關注什麼？","answer":"宏觀環境、行業趨勢與市場動態。"},{"id":68,"question":"在預測貸款還款可能性時，機器學習算法通常分析哪些變量？","answer":"借款人行為、宏觀經濟指標和歷史還款模式。"},{"id":69,"question":"在 BHPH 業務中，對帳戶實施「沖銷政策」（Charge-off Policy）通常在逾期多久後發生？","answer":"逾期 60 到 90 天。"},{"id":70,"question":"BCBS 239 原則 5（及時性）規定數據產生的速度應取決於風險的什麼特性？","answer":"風險的潛在波動性（Volatility）及其關鍵性。"},{"id":71,"question":"為什麼 WARM 方法被認為在數據或損失經驗缺乏時具有適應性？","answer":"因為它相對簡單且在概念上與標準一致，適用於多種資產類別。"},{"id":72,"question":"在信用風險模型中，「表現窗口」（Performance Window）用於定義什麼？","answer":"目標變量（Dependent Variable），即賬戶是「好」還是「壞」。"},{"id":73,"question":"什麼類型的金融機構被建議在被指定後的三年內應用 BCBS 239 準則？","answer":"國內系統重要性銀行（D-SIBs）。"},{"id":74,"question":"在 BHPH 投資組合分析中，若 Q3 2024 的貸款違約率高出 15%，分析師應首先檢查什麼？","answer":"該期間的承保標準（Underwriting Standards）。"},{"id":75,"question":"數據湖（Data Lake）與數據倉庫（Data Warehouse）在銀行數據整合中的作用有何不同？","answer":"數據湖存儲原始格式數據（包含結構化與非結構化），而數據倉庫存儲標準化的結構化數據。"},{"id":76,"question":"在 BCBS 239 治理框架下，誰最終負責審查和批准風險數據彙總框架？","answer":"高級管理層。"},{"id":77,"question":"為什麼 DCF 被認為是可回測的（Back-testable）方法？","answer":"因為它產生了有時限的損失與收入組件預期。"},{"id":78,"question":"在信用風險管理中，「早期預警信號」（Early Warning Signals）的主要目的是什麼？","answer":"在損失發生前識別潛在的風險惡化。"},{"id":79,"question":"Tableau 中的「鑽取」（Drill-downs）功能對高管決策有何幫助？","answer":"允許用戶從匯總數據深入查看底層細節，以發現特定問題的原因。"},{"id":80,"question":"轉移率分析中的「組合分析」（Combined Analysis）是指什麼？","answer":"同時使用借款人數量和美元金額進行分析，以獲得完整視圖。"},{"id":81,"question":"在 CECL 方法論中，對於循環信用工具（如信用卡），哪種方法是不合適的？","answer":"帳齡分析（Vintage Analysis）。"},{"id":82,"question":"風險數據彙總的「適應性」是指在何種情況下能夠產生彙總數據？","answer":"滿足各種隨機、臨時的報告請求。"},{"id":83,"question":"在銀行預測模型中，用於解決數據集不平衡問題（例如壞帳遠少於好帳）的技術通常在模型建立的哪個階段處理？","answer":"細分與變量選擇階段（Segmentation and Variable Selection）。"},{"id":84,"question":"CECL 實施的時間表更新是為了讓金融機構有更多時間做什麼？","answer":"獲取更好的數據、建立魯棒的內部控制並從大型申報者身上學習。"},{"id":85,"question":"BCBS 239 的原則 8 要求風險管理報告的深度應與銀行的什麼相匹配？","answer":"規模、業務複雜程度及風險概況。"}];
    let currentData = [...RAW_DATA];
    let masteredSet = new Set(JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]"));
    let currentMode = 'list';
    let filterOnlyUnmastered = false;
    let isAllExpanded = false;
    let cardIndex = 0;

    function applyTheme(theme) {
      const normalizedTheme = theme === "dark" ? "dark" : "light";
      document.documentElement.dataset.theme = normalizedTheme;

      const btn = document.getElementById("themeToggleBtn");
      if (btn) {
        const isDark = normalizedTheme === "dark";
        btn.textContent = isDark ? "淺色模式" : "深色模式";
        btn.setAttribute("aria-label", isDark ? "切換為淺色模式" : "切換為深色模式");
      }
    }

    function initializeTheme() {
      const savedTheme = localStorage.getItem(THEME_STORAGE_KEY) || "light";
      applyTheme(savedTheme);
    }

    function toggleTheme() {
      const nextTheme = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
      localStorage.setItem(THEME_STORAGE_KEY, nextTheme);
      applyTheme(nextTheme);
    }

    initializeTheme();

    function saveMastered() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(Array.from(masteredSet)));
      updateStats();
    }

    function updateStats() {
      const total = RAW_DATA.length;
      const masteredCount = RAW_DATA.filter(item => masteredSet.has(item.id)).length;
      const pct = total === 0 ? 0 : Math.round((masteredCount / total) * 100);

      document.getElementById('statsCount').textContent = `顯示 ${currentData.length} / 共 ${total} 題`;
      document.getElementById('statsMastered').textContent = `已掌握 ${masteredCount} 題 (${pct}%)`;
      document.getElementById('progressFill').style.width = pct + '%';
    }

    function renderMath() {
      if (window.renderMathInElement) {
        renderMathInElement(document.body, {
          delimiters: [
            {left: '$$', right: '$$', display: true},
            {left: '$', right: '$', display: false}
          ],
          throwOnError: false
        });
      }
    }

    function renderList() {
      const container = document.getElementById('qaList');
      if (currentData.length === 0) {
        container.innerHTML = '<div class="empty-state">沒有符合條件的問答卡片</div>';
        return;
      }

      container.innerHTML = currentData.map(item => {
        const isMastered = masteredSet.has(item.id);
        return `
          <div class="qa-card ${isMastered ? 'mastered' : ''} ${isAllExpanded ? 'open' : ''}" id="card-${item.id}">
            <div class="qa-header" onclick="toggleItem(${item.id})">
              <span class="qa-id">#${item.id}</span>
              <span class="qa-question">${escapeHtml(item.question)}</span>
              <div class="qa-actions">
                <button class="master-btn ${isMastered ? 'is-mastered' : ''}"
                        onclick="toggleMaster(event, ${item.id})"
                        title="${isMastered ? '已掌握' : '標記掌握'}">★</button>
                <span class="expand-icon">▼</span>
              </div>
            </div>
            <div class="qa-answer">${escapeHtml(item.answer)}</div>
          </div>
        `;
      }).join('');

      renderMath();
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    function toggleItem(id) {
      const el = document.getElementById('card-' + id);
      if (el) {
        el.classList.toggle('open');
      }
    }

    function toggleMaster(event, id) {
      event.stopPropagation();
      if (masteredSet.has(id)) {
        masteredSet.delete(id);
      } else {
        masteredSet.add(id);
      }
      saveMastered();
      applyFilters();
    }

    function toggleExpandAll() {
      isAllExpanded = !isAllExpanded;
      document.getElementById('expandAllBtn').textContent = isAllExpanded ? "收合全部" : "展開全部";
      document.querySelectorAll('.qa-card').forEach(card => {
        if (isAllExpanded) {
          card.classList.add('open');
        } else {
          card.classList.remove('open');
        }
      });
    }

    function toggleFilterMastered() {
      filterOnlyUnmastered = !filterOnlyUnmastered;
      const btn = document.getElementById('filterMasteredBtn');
      btn.classList.toggle('active-filter', filterOnlyUnmastered);
      btn.textContent = filterOnlyUnmastered ? "✓ 僅顯示未掌握" : "⭐ 只看未掌握";
      applyFilters();
    }

    function handleSearch() {
      applyFilters();
    }

    function applyFilters() {
      const query = document.getElementById('searchInput').value.trim().toLowerCase();
      currentData = RAW_DATA.filter(item => {
        if (filterOnlyUnmastered && masteredSet.has(item.id)) {
          return false;
        }
        if (query) {
          const matchQ = item.question.toLowerCase().includes(query);
          const matchA = item.answer.toLowerCase().includes(query);
          return matchQ || matchA;
        }
        return true;
      });

      cardIndex = 0;
      if (currentMode === 'list') {
        renderList();
      } else {
        updateCardView();
      }
      updateStats();
    }

    function shuffleCards() {
      currentData.sort(() => Math.random() - 0.5);
      cardIndex = 0;
      if (currentMode === 'list') {
        renderList();
      } else {
        updateCardView();
      }
    }

    function resetOrder() {
      currentData.sort((a, b) => a.id - b.id);
      cardIndex = 0;
      if (currentMode === 'list') {
        renderList();
      } else {
        updateCardView();
      }
    }

    function switchMode(mode) {
      currentMode = mode;
      const listBtn = document.getElementById('listViewBtn');
      const cardBtn = document.getElementById('cardViewBtn');
      const qaList = document.getElementById('qaList');
      const flashcardContainer = document.getElementById('flashcardContainer');
      const expandAllBtn = document.getElementById('expandAllBtn');

      if (mode === 'list') {
        listBtn.classList.add('active');
        cardBtn.classList.remove('active');
        qaList.style.display = 'flex';
        flashcardContainer.style.display = 'none';
        expandAllBtn.style.display = 'inline-flex';
        renderList();
      } else {
        cardBtn.classList.add('active');
        listBtn.classList.remove('active');
        qaList.style.display = 'none';
        flashcardContainer.style.display = 'flex';
        expandAllBtn.style.display = 'none';
        updateCardView();
      }
    }

    /* Flashcard Functions */
    function flipCard() {
      const wrapper = document.getElementById('flashcardWrapper');
      wrapper.classList.toggle('flipped');
    }

    function updateCardView() {
      const wrapper = document.getElementById('flashcardWrapper');
      wrapper.classList.remove('flipped');

      if (currentData.length === 0) {
        document.getElementById('fcQuestion').textContent = '無卡片資料';
        document.getElementById('fcAnswer').textContent = '無卡片資料';
        document.getElementById('fcCardNumber').textContent = '0 / 0';
        document.getElementById('fcCardNumberBack').textContent = '0 / 0';
        return;
      }

      if (cardIndex < 0) cardIndex = 0;
      if (cardIndex >= currentData.length) cardIndex = currentData.length - 1;

      const item = currentData[cardIndex];
      const isMastered = masteredSet.has(item.id);

      document.getElementById('fcQuestion').textContent = item.question;
      document.getElementById('fcAnswer').textContent = item.answer;

      const cardNumText = `卡片 ${cardIndex + 1} / ${currentData.length} (#${item.id})`;
      document.getElementById('fcCardNumber').textContent = cardNumText;
      document.getElementById('fcCardNumberBack').textContent = cardNumText;

      const btn1 = document.getElementById('fcMasterBtn');
      const btn2 = document.getElementById('fcMasterBtnBack');
      btn1.classList.toggle('is-mastered', isMastered);
      btn2.classList.toggle('is-mastered', isMastered);

      renderMath();
    }

    function prevCard() {
      if (currentData.length === 0) return;
      cardIndex = (cardIndex - 1 + currentData.length) % currentData.length;
      updateCardView();
    }

    function nextCard() {
      if (currentData.length === 0) return;
      cardIndex = (cardIndex + 1) % currentData.length;
      updateCardView();
    }

    function toggleCardMaster(event) {
      event.stopPropagation();
      if (currentData.length === 0) return;
      const item = currentData[cardIndex];
      toggleMaster(event, item.id);
      updateCardView();
    }

    /* Keyboard Shortcuts */
    window.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT') return;
      if (currentMode === 'card') {
        if (e.code === 'Space') {
          e.preventDefault();
          flipCard();
        } else if (e.code === 'ArrowLeft') {
          e.preventDefault();
          prevCard();
        } else if (e.code === 'ArrowRight') {
          e.preventDefault();
          nextCard();
        } else if (e.code === 'KeyM') {
          e.preventDefault();
          toggleCardMaster(e);
        }
      }
    });

    // Init
    window.addEventListener('DOMContentLoaded', () => {
      updateStats();
      renderList();
      setTimeout(renderMath, 200);
    });
  </script>
</body>
</html>
