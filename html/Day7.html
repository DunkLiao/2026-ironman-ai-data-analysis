<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Day7 - 問答複習卡</title>
  <!-- KaTeX for LaTeX rendering -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
  <style>
    :root {
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --primary-light: #eff6ff;
      --border-color: #e2e8f0;
      --success: #10b981;
      --success-light: #ecfdf5;
      --accent: #f59e0b;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
      --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.08), 0 2px 4px -2px rgba(0,0,0,0.05);
      --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.1), 0 4px 6px -4px rgba(0,0,0,0.05);
      --radius: 12px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg-color: #0f172a;
        --card-bg: #1e293b;
        --text-main: #f8fafc;
        --text-muted: #94a3b8;
        --primary: #60a5fa;
        --primary-hover: #3b82f6;
        --primary-light: #1e3a8a33;
        --border-color: #334155;
        --success: #34d399;
        --success-light: #064e3b33;
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans TC", sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      line-height: 1.6;
      padding-bottom: 60px;
    }

    /* Navigation / Header */
    header {
      background: var(--card-bg);
      border-bottom: 1px solid var(--border-color);
      position: sticky;
      top: 0;
      z-index: 50;
      box-shadow: var(--shadow-sm);
    }

    .header-container {
      max-width: 900px;
      margin: 0 auto;
      padding: 14px 20px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .nav-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 8px;
      background: var(--primary-light);
      color: var(--primary);
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      transition: all 0.2s;
    }

    .back-btn:hover {
      background: var(--primary);
      color: #fff;
    }

    .page-title {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .view-toggles {
      display: flex;
      background: var(--bg-color);
      padding: 3px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
    }

    .toggle-btn {
      padding: 6px 14px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .toggle-btn.active {
      background: var(--card-bg);
      color: var(--primary);
      box-shadow: var(--shadow-sm);
    }

    /* Main Container */
    main {
      max-width: 900px;
      margin: 24px auto;
      padding: 0 20px;
    }

    /* Toolbar */
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 20px;
      align-items: center;
      justify-content: space-between;
    }

    .search-box {
      flex: 1;
      min-width: 240px;
      position: relative;
    }

    .search-box input {
      width: 100%;
      padding: 10px 14px 10px 38px;
      border-radius: 10px;
      border: 1px solid var(--border-color);
      background: var(--card-bg);
      color: var(--text-main);
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-box input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-light);
    }

    .search-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 14px;
    }

    .action-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background: var(--card-bg);
      color: var(--text-main);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn:hover {
      background: var(--border-color);
    }

    .btn.active-filter {
      background: var(--primary-light);
      border-color: var(--primary);
      color: var(--primary);
    }

    /* Stats bar */
    .stats-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      font-size: 14px;
      color: var(--text-muted);
    }

    .progress-bar-container {
      flex: 1;
      height: 8px;
      background: var(--border-color);
      border-radius: 99px;
      margin: 0 16px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: var(--success);
      width: 0%;
      transition: width 0.3s ease;
    }

    /* List View Cards */
    .qa-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .qa-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      box-shadow: var(--shadow-sm);
      overflow: hidden;
      transition: box-shadow 0.2s, border-color 0.2s;
    }

    .qa-card:hover {
      box-shadow: var(--shadow-md);
      border-color: #cbd5e1;
    }

    .qa-card.mastered {
      border-left: 4px solid var(--success);
    }

    .qa-header {
      padding: 16px 20px;
      display: flex;
      align-items: flex-start;
      gap: 12px;
      cursor: pointer;
      user-select: none;
    }

    .qa-id {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 28px;
      height: 28px;
      background: var(--primary-light);
      color: var(--primary);
      border-radius: 6px;
      font-size: 13px;
      font-weight: 700;
      margin-top: 2px;
      flex-shrink: 0;
    }

    .qa-question {
      flex: 1;
      font-size: 15px;
      font-weight: 600;
      color: var(--text-main);
      padding-top: 2px;
    }

    .qa-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .master-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 18px;
      padding: 4px;
      border-radius: 6px;
      transition: transform 0.15s, color 0.15s;
    }

    .master-btn:hover {
      transform: scale(1.15);
    }

    .master-btn.is-mastered {
      color: var(--accent);
    }

    .expand-icon {
      color: var(--text-muted);
      font-size: 14px;
      transition: transform 0.2s ease;
    }

    .qa-card.open .expand-icon {
      transform: rotate(180deg);
    }

    .qa-answer {
      display: none;
      padding: 16px 20px 18px 60px;
      background: var(--bg-color);
      border-top: 1px dashed var(--border-color);
      font-size: 15px;
      color: var(--text-main);
      line-height: 1.7;
    }

    .qa-card.open .qa-answer {
      display: block;
      animation: fadeIn 0.2s ease-in;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Flashcard Mode */
    .flashcard-container {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      padding: 10px 0;
    }

    .flashcard-wrapper {
      perspective: 1000px;
      width: 100%;
      max-width: 640px;
      min-height: 340px;
      cursor: pointer;
    }

    .flashcard-inner {
      position: relative;
      width: 100%;
      height: 100%;
      min-height: 340px;
      text-align: center;
      transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
      transform-style: preserve-3d;
      border-radius: 16px;
      box-shadow: var(--shadow-lg);
    }

    .flashcard-wrapper.flipped .flashcard-inner {
      transform: rotateY(180deg);
    }

    .flashcard-face {
      position: absolute;
      width: 100%;
      height: 100%;
      min-height: 340px;
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 30px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      box-sizing: border-box;
    }

    .flashcard-back {
      transform: rotateY(180deg);
      background: var(--card-bg);
      border: 2px solid var(--primary);
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      color: var(--text-muted);
    }

    .card-badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 99px;
      font-weight: 600;
      font-size: 12px;
    }

    .badge-q {
      background: var(--primary-light);
      color: var(--primary);
    }

    .badge-a {
      background: var(--success-light);
      color: var(--success);
    }

    .card-body {
      margin: auto 0;
      padding: 20px 10px;
      font-size: 18px;
      font-weight: 600;
      line-height: 1.6;
    }

    .card-hint {
      font-size: 12px;
      color: var(--text-muted);
    }

    .flashcard-controls {
      display: flex;
      gap: 12px;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 640px;
    }

    .flashcard-controls .btn {
      padding: 10px 20px;
      font-size: 14px;
      font-weight: 600;
    }

    .btn-primary {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    .btn-primary:hover {
      background: var(--primary-hover);
    }

    .shortcuts-hint {
      font-size: 12px;
      color: var(--text-muted);
      text-align: center;
      margin-top: 8px;
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
      background: var(--card-bg);
      border-radius: var(--radius);
      border: 1px dashed var(--border-color);
    }
  </style>
</head>
<body>
  <header>
    <div class="header-container">
      <div class="nav-left">
        <a href="../index.html" class="back-btn" title="回目錄">← 目錄</a>
        <h1 class="page-title">Day7 問答卡</h1>
      </div>
      <div class="view-toggles">
        <button id="listViewBtn" class="toggle-btn active" onclick="switchMode('list')">📋 列表模式</button>
        <button id="cardViewBtn" class="toggle-btn" onclick="switchMode('card')">🎴 翻卡測驗</button>
      </div>
    </div>
  </header>

  <main>
    <div class="toolbar">
      <div class="search-box">
        <span class="search-icon">🔍</span>
        <input type="text" id="searchInput" placeholder="搜尋問題或答案關鍵字..." oninput="handleSearch()">
      </div>
      <div class="action-buttons">
        <button class="btn" id="filterMasteredBtn" onclick="toggleFilterMastered()">⭐ 只看未掌握</button>
        <button class="btn" id="expandAllBtn" onclick="toggleExpandAll()">展開全部</button>
        <button class="btn" onclick="shuffleCards()">🔀 隨機洗牌</button>
        <button class="btn" onclick="resetOrder()">🔄 恢復順序</button>
      </div>
    </div>

    <div class="stats-bar">
      <span id="statsCount">總計 0 題</span>
      <div class="progress-bar-container">
        <div id="progressFill" class="progress-fill"></div>
      </div>
      <span id="statsMastered">掌握率 0%</span>
    </div>

    <!-- List View -->
    <div id="qaList" class="qa-list"></div>

    <!-- Flashcard Mode View -->
    <div id="flashcardContainer" class="flashcard-container">
      <div class="flashcard-wrapper" id="flashcardWrapper" onclick="flipCard()">
        <div class="flashcard-inner">
          <!-- Front Face -->
          <div class="flashcard-face flashcard-front">
            <div class="card-top">
              <span class="card-badge badge-q">問題</span>
              <span id="fcCardNumber">卡片 1 / 1</span>
              <button class="master-btn" id="fcMasterBtn" onclick="toggleCardMaster(event)" title="標記為已掌握">★</button>
            </div>
            <div class="card-body" id="fcQuestion">載入中...</div>
            <div class="card-hint">💡 點擊卡片或按空白鍵翻面看答案</div>
          </div>
          <!-- Back Face -->
          <div class="flashcard-face flashcard-back">
            <div class="card-top">
              <span class="card-badge badge-a">解答</span>
              <span id="fcCardNumberBack">卡片 1 / 1</span>
              <button class="master-btn" id="fcMasterBtnBack" onclick="toggleCardMaster(event)" title="標記為已掌握">★</button>
            </div>
            <div class="card-body" id="fcAnswer">載入中...</div>
            <div class="card-hint">💡 再次點擊卡片翻回正面</div>
          </div>
        </div>
      </div>

      <div class="flashcard-controls">
        <button class="btn" onclick="prevCard()">← 上一題</button>
        <button class="btn btn-primary" onclick="flipCard()">翻轉卡片</button>
        <button class="btn" onclick="nextCard()">下一題 →</button>
      </div>
      <div class="shortcuts-hint">鍵盤快速鍵：[←] 上一題 · [空白鍵] 翻面 · [→] 下一題 · [M] 標記掌握</div>
    </div>
  </main>

  <script>
    const STORAGE_KEY = "anki_mastered_" + "Day7";
    const RAW_DATA = [{"id":1,"question":"數據結構根據其組織程度，主要可分為哪三大類型？","answer":"結構化資料、半結構化資料與非結構化資料。"},{"id":2,"question":"哪種資料類型通常以「表格」呈現，並具有明確的欄位屬性（如 Excel 或資料庫）？","answer":"結構化資料。"},{"id":3,"question":"JSON 與 XML 檔案屬於哪一種數據結構類型？","answer":"半結構化資料。"},{"id":4,"question":"圖片、影片或自由格式的社群媒體貼文，屬於哪一種數據結構類型？","answer":"非結構化資料。"},{"id":5,"question":"在資料分析中，「補值」（Imputation）的主要目的是什麼？","answer":"用統計或規則推估最可能的值，填補缺漏資料以利完整分析。"},{"id":6,"question":"將單一欄位的「國家與城市」（如 Taiwan, Taipei）拆分為兩個欄位，屬於哪種資料清洗動作？","answer":"切割（Split）。"},{"id":7,"question":"資料清洗中的「萃取」（Extract）動作通常用於處理什麼樣的資訊？","answer":"清除欄位中多餘的、不需要的資訊（如財務欄位的逗點）。"},{"id":8,"question":"Gartner 提出的四大分析框架中，關注「發生了什麼事？」的是哪一種分析？","answer":"描述性分析（Descriptive Analytics）。"},{"id":9,"question":"旨在回答「為何會發生？」的數據分析類型稱為？","answer":"診斷性分析（Diagnostic Analytics）。"},{"id":10,"question":"預測性分析（Predictive Analytics）主要探討的核心問題是什麼？","answer":"將來會發生什麼？"},{"id":11,"question":"哪種分析層次最高，旨在提供決策建議以達成期望的未來？","answer":"處方性分析（Prescriptive Analytics）。"},{"id":12,"question":"在 Tableau 中，藍色的欄位代表什麼樣的屬性？","answer":"維度（Dimensions），通常是類別型或離散數據。"},{"id":13,"question":"在 Tableau 中，綠色的欄位代表什麼樣的屬性？","answer":"量值（Measures），通常是數值型或連續數據。"},{"id":14,"question":"Tableau Public 版本與付費版的主要差異之一是什麼？","answer":"Public 版為免費提供，但儲存的作品必須公開。"},{"id":15,"question":"為什麼在製作長條圖時，Y 軸通常被建議從零開始？","answer":"避免因基準點不同而造成視覺上的比較偏誤或心機干擾。"},{"id":16,"question":"當長條圖的數值落差過大時，除了調整基準點，還可以用哪種數學方式調整尺度？","answer":"取對數（$log$）。"},{"id":17,"question":"在資料視覺化中，使用「面積」來比較數值時常會產生什麼問題？","answer":"人類大腦難以精確估計面積差異，且面積會隨平方倍增導致視覺誇大。"},{"id":18,"question":"在 Tableau 的色彩設定中，「漸層色彩」通常適用於哪種欄位屬性？","answer":"數值型或量值欄位。"},{"id":19,"question":"視覺化心理學中，什麼顏色通常用於表示「背景資訊」或「次要資訊」？","answer":"灰色。"},{"id":20,"question":"螺旋圖（Spiral Chart）在結構上可以視為哪種圖表的變體？","answer":"將折線圖拉直後即為螺旋圖。"},{"id":21,"question":"在使用 AI 進行數據分析提問時，採用什麼樣的格式有助於 AI 理解資訊階層？","answer":"Markdown 格式。"},{"id":22,"question":"在將機密資料提供給 AI 分析前，最簡單的個人資料保護方式是什麼？","answer":"去識別化（如將姓名改為代號、金額取對數）。"},{"id":23,"question":"Excel 樞紐分析表中，若修改原始資料後聚類結果未更新，通常是因為什麼問題？","answer":"快取（Cache）尚未更新，需重新整理或重建表格。"},{"id":24,"question":"當 X 軸為連續型數值，且需觀察分佈情況時，適合使用哪種圖表？","answer":"直方圖（Histogram）。"},{"id":25,"question":"若要同時呈現多個項目的「百分比佔比」與「年度變化」，建議使用哪種長條圖？","answer":"百分比堆疊長條圖。"},{"id":26,"question":"樹狀圖（Treemap）適合用來觀測什麼樣的資料特徵？","answer":"呈現階層式結構中由大到小的組成與佔比。"},{"id":27,"question":"在資料品質維度中，「及時性」指的是什麼？","answer":"資料必須是有效且新鮮的，以反映當前情況（如股票數據）。"},{"id":28,"question":"在 Tableau 載入 Excel 資料時，若一個檔案有多個工作表，應如何處理？","answer":"將目標工作表拖曳至右側的畫布區域完成載入。"},{"id":29,"question":"在 Tableau 畫布中，一個「工作表」可以用來繪製幾個圖表？","answer":"一個圖表。"},{"id":30,"question":"針對跨多個年度的季節趨勢分析，Tableau 的時間格式提供了哪兩種層級選擇？","answer":"跨年度的季節（如 2015 Q2）或單一季節的年度彙整（所有年份的 Q2）。"},{"id":31,"question":"在 Tableau 中，若要將圖表的顏色根據銷售額深度自動調整，應將該欄位拖至何處？","answer":"標記（Marks）卡片中的「色彩」。"},{"id":32,"question":"「連續型」數據在視覺化工具中通常以什麼顏色作為視覺提示？","answer":"綠色。"},{"id":33,"question":"「離散型」數據在視覺化工具中通常以什麼顏色作為視覺提示？","answer":"藍色。"},{"id":34,"question":"Excel 函數中，若要將民國年日期轉換為西元格式並強制輸出為文字，可配合使用哪個函數？","answer":"TEXT 函數。"},{"id":35,"question":"資料清洗中的「模糊重複值」（Fuzzy Duplicates）是指什麼？","answer":"內容極其相似但寫法不一的資料（如 Google Inc. 與 Google LLC）。"},{"id":36,"question":"在 Tableau 編輯色彩時，「分段色彩」的主要用途是什麼？","answer":"將連續的數值範圍強制劃分為數個固定的顏色階層。"},{"id":37,"question":"哪種圖表最適合呈現兩個變數（X 軸與 Y 軸）之間的關聯性或相關趨勢？","answer":"散佈圖（Scatter Plot）。"},{"id":38,"question":"若原始資料的地點資訊包含地址，Tableau 如何生成地圖座標？","answer":"透過內建的地點資料庫自動對應出經緯度（Latitude/Longitude）。"},{"id":39,"question":"在數據分析流程中，將「圖片」整理成「分級表格」的行為屬於哪一個步驟？","answer":"處理（Processing/Cleaning）。"},{"id":40,"question":"描述性分析中，常用的統計數值包括哪些？","answer":"平均數、最大值、最小值與計數。"},{"id":41,"question":"Tableau 的「標籤」功能中，若只想標註銷售額最高的一點，應選擇哪種設定？","answer":"最小值/最大值（Min/Max）。"},{"id":42,"question":"在 Tableau 中，若要根據多個欄位篩選圖表，應將欄位拖曳至畫布的哪個區域？","answer":"篩選器（Filters）。"},{"id":43,"question":"在 Excel 中，CSV 檔案與普通 XLSX 檔案最大的差異是什麼？","answer":"CSV 為純文字格式，不保留公式、格式或多個工作表。"},{"id":44,"question":"為什麼在 AI 指令中應避免直接貼上包含各資的試算表連結？","answer":"防止敏感資訊被用於訓練模型或導致外部洩漏風險。"},{"id":45,"question":"在數據分析中，「異場值」（Outliers）通常如何定義？","answer":"數值顯著不同於多數數據的觀測點。"},{"id":46,"question":"在 Tableau 中，「離散」與「連續」的概念分別對應於哪兩種數學類型？","answer":"分類（Qualitative）與數值（Quantitative）。"},{"id":47,"question":"Tableau 的色彩調色盤中，「發散型色彩」（Diverging）通常用於什麼情況？","answer":"強調數值相對於中心值（如零）的正負偏差。"},{"id":48,"question":"什麼是「數據顆粒度」（Data Granularity）？","answer":"資料記錄的細膩程度，如時間層級（年、月、日、分）。"},{"id":49,"question":"在分析事故資料時，將地址轉化為「路口」層級的分析稱為？","answer":"降低顆粒度（Aggregation）。"},{"id":50,"question":"在 Excel 中利用 AI 生成複雜函數時，若公式跨工作表，應在指令中提供什麼？","answer":"明確的工作表名稱與對應的欄位代號（如 A1）。"},{"id":51,"question":"在視覺化作品中，「信號與雜訊」比率的高低代表什麼？","answer":"越高代表圖表傳達核心資訊的效率越佳，干擾元素越少。"},{"id":52,"question":"對於「非結構化資料」，現代 AI 技術（如 GPT-4）如何輔助轉換為「結構化資料」？","answer":"透過影像識別或自然語言處理將文字/圖片內容轉換為表格欄位。"},{"id":53,"question":"在 Tableau 介面左側，自動生成的「技術（技術）」欄位代表什麼意義？","answer":"計算原始資料的紀錄筆數（Count）。"},{"id":54,"question":"在 Tableau 工作表中，「欄」與「列」分別對應圖表的什麼軸？","answer":"「欄」對應 X 軸，「列」對應 Y 軸。"},{"id":55,"question":"若要一次選擇多個不連續的欄位來生成圖表，應按住鍵盤哪個鍵？","answer":"Ctrl 鍵（Windows）或 Command 鍵（Mac）。"},{"id":56,"question":"為什麼餅圖（Pie Chart）通常不建議用於比較超過 5 個以上的類別？","answer":"類別過多時，角度差異難以用肉眼辨識，失去比較效率。"},{"id":57,"question":"數據分析專家建議，在資料視覺化的「分享」階段，最關鍵的目標是什麼？","answer":"數據溝通與說服相關利害關係人（Stakeholders）。"},{"id":58,"question":"在 Excel 樞紐分析表中，若想知道「不重複」的會員數，應使用哪種計算類型？","answer":"相異計數（Distinct Count）。"},{"id":59,"question":"在 Tableau 中，若要取消自動聚合，改為顯示每一筆原始數據點，應在選單中如何操作？","answer":"取消勾選「分析」選單中的「彙總度量」。"},{"id":60,"question":"在 Tableau 中，若圖表色彩太鮮艷導致視覺疲勞，可以調整哪個設定？","answer":"不透明度（Opacity）。"}];
    let currentData = [...RAW_DATA];
    let masteredSet = new Set(JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]"));
    let currentMode = 'list';
    let filterOnlyUnmastered = false;
    let isAllExpanded = false;
    let cardIndex = 0;

    function saveMastered() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(Array.from(masteredSet)));
      updateStats();
    }

    function updateStats() {
      const total = RAW_DATA.length;
      const masteredCount = RAW_DATA.filter(item => masteredSet.has(item.id)).length;
      const pct = total === 0 ? 0 : Math.round((masteredCount / total) * 100);

      document.getElementById('statsCount').textContent = `顯示 ${currentData.length} / 共 ${total} 題`;
      document.getElementById('statsMastered').textContent = `已掌握 ${masteredCount} 題 (${pct}%)`;
      document.getElementById('progressFill').style.width = pct + '%';
    }

    function renderMath() {
      if (window.renderMathInElement) {
        renderMathInElement(document.body, {
          delimiters: [
            {left: '$$', right: '$$', display: true},
            {left: '$', right: '$', display: false}
          ],
          throwOnError: false
        });
      }
    }

    function renderList() {
      const container = document.getElementById('qaList');
      if (currentData.length === 0) {
        container.innerHTML = '<div class="empty-state">沒有符合條件的問答卡片</div>';
        return;
      }

      container.innerHTML = currentData.map(item => {
        const isMastered = masteredSet.has(item.id);
        return `
          <div class="qa-card ${isMastered ? 'mastered' : ''} ${isAllExpanded ? 'open' : ''}" id="card-${item.id}">
            <div class="qa-header" onclick="toggleItem(${item.id})">
              <span class="qa-id">#${item.id}</span>
              <span class="qa-question">${escapeHtml(item.question)}</span>
              <div class="qa-actions">
                <button class="master-btn ${isMastered ? 'is-mastered' : ''}"
                        onclick="toggleMaster(event, ${item.id})"
                        title="${isMastered ? '已掌握' : '標記掌握'}">★</button>
                <span class="expand-icon">▼</span>
              </div>
            </div>
            <div class="qa-answer">${escapeHtml(item.answer)}</div>
          </div>
        `;
      }).join('');

      renderMath();
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    function toggleItem(id) {
      const el = document.getElementById('card-' + id);
      if (el) {
        el.classList.toggle('open');
      }
    }

    function toggleMaster(event, id) {
      event.stopPropagation();
      if (masteredSet.has(id)) {
        masteredSet.delete(id);
      } else {
        masteredSet.add(id);
      }
      saveMastered();
      applyFilters();
    }

    function toggleExpandAll() {
      isAllExpanded = !isAllExpanded;
      document.getElementById('expandAllBtn').textContent = isAllExpanded ? "收合全部" : "展開全部";
      document.querySelectorAll('.qa-card').forEach(card => {
        if (isAllExpanded) {
          card.classList.add('open');
        } else {
          card.classList.remove('open');
        }
      });
    }

    function toggleFilterMastered() {
      filterOnlyUnmastered = !filterOnlyUnmastered;
      const btn = document.getElementById('filterMasteredBtn');
      btn.classList.toggle('active-filter', filterOnlyUnmastered);
      btn.textContent = filterOnlyUnmastered ? "✓ 僅顯示未掌握" : "⭐ 只看未掌握";
      applyFilters();
    }

    function handleSearch() {
      applyFilters();
    }

    function applyFilters() {
      const query = document.getElementById('searchInput').value.trim().toLowerCase();
      currentData = RAW_DATA.filter(item => {
        if (filterOnlyUnmastered && masteredSet.has(item.id)) {
          return false;
        }
        if (query) {
          const matchQ = item.question.toLowerCase().includes(query);
          const matchA = item.answer.toLowerCase().includes(query);
          return matchQ || matchA;
        }
        return true;
      });

      cardIndex = 0;
      if (currentMode === 'list') {
        renderList();
      } else {
        updateCardView();
      }
      updateStats();
    }

    function shuffleCards() {
      currentData.sort(() => Math.random() - 0.5);
      cardIndex = 0;
      if (currentMode === 'list') {
        renderList();
      } else {
        updateCardView();
      }
    }

    function resetOrder() {
      currentData.sort((a, b) => a.id - b.id);
      cardIndex = 0;
      if (currentMode === 'list') {
        renderList();
      } else {
        updateCardView();
      }
    }

    function switchMode(mode) {
      currentMode = mode;
      const listBtn = document.getElementById('listViewBtn');
      const cardBtn = document.getElementById('cardViewBtn');
      const qaList = document.getElementById('qaList');
      const flashcardContainer = document.getElementById('flashcardContainer');
      const expandAllBtn = document.getElementById('expandAllBtn');

      if (mode === 'list') {
        listBtn.classList.add('active');
        cardBtn.classList.remove('active');
        qaList.style.display = 'flex';
        flashcardContainer.style.display = 'none';
        expandAllBtn.style.display = 'inline-flex';
        renderList();
      } else {
        cardBtn.classList.add('active');
        listBtn.classList.remove('active');
        qaList.style.display = 'none';
        flashcardContainer.style.display = 'flex';
        expandAllBtn.style.display = 'none';
        updateCardView();
      }
    }

    /* Flashcard Functions */
    function flipCard() {
      const wrapper = document.getElementById('flashcardWrapper');
      wrapper.classList.toggle('flipped');
    }

    function updateCardView() {
      const wrapper = document.getElementById('flashcardWrapper');
      wrapper.classList.remove('flipped');

      if (currentData.length === 0) {
        document.getElementById('fcQuestion').textContent = '無卡片資料';
        document.getElementById('fcAnswer').textContent = '無卡片資料';
        document.getElementById('fcCardNumber').textContent = '0 / 0';
        document.getElementById('fcCardNumberBack').textContent = '0 / 0';
        return;
      }

      if (cardIndex < 0) cardIndex = 0;
      if (cardIndex >= currentData.length) cardIndex = currentData.length - 1;

      const item = currentData[cardIndex];
      const isMastered = masteredSet.has(item.id);

      document.getElementById('fcQuestion').textContent = item.question;
      document.getElementById('fcAnswer').textContent = item.answer;

      const cardNumText = `卡片 ${cardIndex + 1} / ${currentData.length} (#${item.id})`;
      document.getElementById('fcCardNumber').textContent = cardNumText;
      document.getElementById('fcCardNumberBack').textContent = cardNumText;

      const btn1 = document.getElementById('fcMasterBtn');
      const btn2 = document.getElementById('fcMasterBtnBack');
      btn1.classList.toggle('is-mastered', isMastered);
      btn2.classList.toggle('is-mastered', isMastered);

      renderMath();
    }

    function prevCard() {
      if (currentData.length === 0) return;
      cardIndex = (cardIndex - 1 + currentData.length) % currentData.length;
      updateCardView();
    }

    function nextCard() {
      if (currentData.length === 0) return;
      cardIndex = (cardIndex + 1) % currentData.length;
      updateCardView();
    }

    function toggleCardMaster(event) {
      event.stopPropagation();
      if (currentData.length === 0) return;
      const item = currentData[cardIndex];
      toggleMaster(event, item.id);
      updateCardView();
    }

    /* Keyboard Shortcuts */
    window.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT') return;
      if (currentMode === 'card') {
        if (e.code === 'Space') {
          e.preventDefault();
          flipCard();
        } else if (e.code === 'ArrowLeft') {
          e.preventDefault();
          prevCard();
        } else if (e.code === 'ArrowRight') {
          e.preventDefault();
          nextCard();
        } else if (e.code === 'KeyM') {
          e.preventDefault();
          toggleCardMaster(e);
        }
      }
    });

    // Init
    window.addEventListener('DOMContentLoaded', () => {
      updateStats();
      renderList();
      setTimeout(renderMath, 200);
    });
  </script>
</body>
</html>
