<!DOCTYPE html>
<html lang="zh-TW" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Day3 - 問答複習卡</title>
  <!-- KaTeX for LaTeX rendering -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
  <style>
    :root {
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --primary-light: #eff6ff;
      --border-color: #e2e8f0;
      --success: #10b981;
      --success-light: #ecfdf5;
      --accent: #f59e0b;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
      --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.08), 0 2px 4px -2px rgba(0,0,0,0.05);
      --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.1), 0 4px 6px -4px rgba(0,0,0,0.05);
      --radius: 12px;
    }

    html[data-theme="dark"] {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #60a5fa;
      --primary-hover: #3b82f6;
      --primary-light: #1e3a8a33;
      --border-color: #334155;
      --success: #34d399;
      --success-light: #064e3b33;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans TC", sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      line-height: 1.6;
      padding-bottom: 60px;
    }

    /* Navigation / Header */
    header {
      background: var(--card-bg);
      border-bottom: 1px solid var(--border-color);
      position: sticky;
      top: 0;
      z-index: 50;
      box-shadow: var(--shadow-sm);
    }

    .header-container {
      max-width: 900px;
      margin: 0 auto;
      padding: 14px 20px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .nav-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 8px;
      background: var(--primary-light);
      color: var(--primary);
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      transition: all 0.2s;
    }

    .back-btn:hover {
      background: var(--primary);
      color: #fff;
    }

    .page-title {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .view-toggles {
      display: flex;
      background: var(--bg-color);
      padding: 3px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
    }

    .header-actions {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: flex-end;
    }

    .toggle-btn {
      padding: 6px 14px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .toggle-btn.active {
      background: var(--card-bg);
      color: var(--primary);
      box-shadow: var(--shadow-sm);
    }

    .theme-toggle {
      padding: 7px 12px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      background: var(--card-bg);
      color: var(--text-main);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: var(--shadow-sm);
      transition: border-color 0.2s, color 0.2s, background 0.2s;
    }

    .theme-toggle:hover {
      border-color: var(--primary);
      color: var(--primary);
    }

    /* Main Container */
    main {
      max-width: 900px;
      margin: 24px auto;
      padding: 0 20px;
    }

    /* Toolbar */
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 20px;
      align-items: center;
      justify-content: space-between;
    }

    .search-box {
      flex: 1;
      min-width: 240px;
      position: relative;
    }

    .search-box input {
      width: 100%;
      padding: 10px 14px 10px 38px;
      border-radius: 10px;
      border: 1px solid var(--border-color);
      background: var(--card-bg);
      color: var(--text-main);
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-box input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-light);
    }

    .search-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 14px;
    }

    .action-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background: var(--card-bg);
      color: var(--text-main);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn:hover {
      background: var(--border-color);
    }

    .btn.active-filter {
      background: var(--primary-light);
      border-color: var(--primary);
      color: var(--primary);
    }

    /* Stats bar */
    .stats-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      font-size: 14px;
      color: var(--text-muted);
    }

    .progress-bar-container {
      flex: 1;
      height: 8px;
      background: var(--border-color);
      border-radius: 99px;
      margin: 0 16px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: var(--success);
      width: 0%;
      transition: width 0.3s ease;
    }

    /* List View Cards */
    .qa-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .qa-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      box-shadow: var(--shadow-sm);
      overflow: hidden;
      transition: box-shadow 0.2s, border-color 0.2s;
    }

    .qa-card:hover {
      box-shadow: var(--shadow-md);
      border-color: #cbd5e1;
    }

    .qa-card.mastered {
      border-left: 4px solid var(--success);
    }

    .qa-header {
      padding: 16px 20px;
      display: flex;
      align-items: flex-start;
      gap: 12px;
      cursor: pointer;
      user-select: none;
    }

    .qa-id {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 28px;
      height: 28px;
      background: var(--primary-light);
      color: var(--primary);
      border-radius: 6px;
      font-size: 13px;
      font-weight: 700;
      margin-top: 2px;
      flex-shrink: 0;
    }

    .qa-question {
      flex: 1;
      font-size: 15px;
      font-weight: 600;
      color: var(--text-main);
      padding-top: 2px;
    }

    .qa-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .master-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 18px;
      padding: 4px;
      border-radius: 6px;
      transition: transform 0.15s, color 0.15s;
    }

    .master-btn:hover {
      transform: scale(1.15);
    }

    .master-btn.is-mastered {
      color: var(--accent);
    }

    .expand-icon {
      color: var(--text-muted);
      font-size: 14px;
      transition: transform 0.2s ease;
    }

    .qa-card.open .expand-icon {
      transform: rotate(180deg);
    }

    .qa-answer {
      display: none;
      padding: 16px 20px 18px 60px;
      background: var(--bg-color);
      border-top: 1px dashed var(--border-color);
      font-size: 15px;
      color: var(--text-main);
      line-height: 1.7;
    }

    .qa-card.open .qa-answer {
      display: block;
      animation: fadeIn 0.2s ease-in;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Flashcard Mode */
    .flashcard-container {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      padding: 10px 0;
    }

    .flashcard-wrapper {
      perspective: 1000px;
      width: 100%;
      max-width: 640px;
      min-height: 340px;
      cursor: pointer;
    }

    .flashcard-inner {
      position: relative;
      width: 100%;
      height: 100%;
      min-height: 340px;
      text-align: center;
      transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
      transform-style: preserve-3d;
      border-radius: 16px;
      box-shadow: var(--shadow-lg);
    }

    .flashcard-wrapper.flipped .flashcard-inner {
      transform: rotateY(180deg);
    }

    .flashcard-face {
      position: absolute;
      width: 100%;
      height: 100%;
      min-height: 340px;
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 30px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      box-sizing: border-box;
    }

    .flashcard-back {
      transform: rotateY(180deg);
      background: var(--card-bg);
      border: 2px solid var(--primary);
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      color: var(--text-muted);
    }

    .card-badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 99px;
      font-weight: 600;
      font-size: 12px;
    }

    .badge-q {
      background: var(--primary-light);
      color: var(--primary);
    }

    .badge-a {
      background: var(--success-light);
      color: var(--success);
    }

    .card-body {
      margin: auto 0;
      padding: 20px 10px;
      font-size: 18px;
      font-weight: 600;
      line-height: 1.6;
    }

    .card-hint {
      font-size: 12px;
      color: var(--text-muted);
    }

    .flashcard-controls {
      display: flex;
      gap: 12px;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 640px;
    }

    .flashcard-controls .btn {
      padding: 10px 20px;
      font-size: 14px;
      font-weight: 600;
    }

    .btn-primary {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    .btn-primary:hover {
      background: var(--primary-hover);
    }

    .shortcuts-hint {
      font-size: 12px;
      color: var(--text-muted);
      text-align: center;
      margin-top: 8px;
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
      background: var(--card-bg);
      border-radius: var(--radius);
      border: 1px dashed var(--border-color);
    }
  </style>
</head>
<body>
  <header>
    <div class="header-container">
      <div class="nav-left">
        <a href="index.html" class="back-btn" title="回目錄">← 目錄</a>
        <h1 class="page-title">Day3 問答卡</h1>
      </div>
      <div class="header-actions">
        <button class="theme-toggle" id="themeToggleBtn" type="button" onclick="toggleTheme()" aria-label="切換為深色模式">深色模式</button>
        <div class="view-toggles">
          <button id="listViewBtn" class="toggle-btn active" onclick="switchMode('list')">📋 列表模式</button>
          <button id="cardViewBtn" class="toggle-btn" onclick="switchMode('card')">🎴 翻卡測驗</button>
        </div>
      </div>
    </div>
  </header>

  <main>
    <div class="toolbar">
      <div class="search-box">
        <span class="search-icon">🔍</span>
        <input type="text" id="searchInput" placeholder="搜尋問題或答案關鍵字..." oninput="handleSearch()">
      </div>
      <div class="action-buttons">
        <button class="btn" id="filterMasteredBtn" onclick="toggleFilterMastered()">⭐ 只看未掌握</button>
        <button class="btn" id="expandAllBtn" onclick="toggleExpandAll()">展開全部</button>
        <button class="btn" onclick="shuffleCards()">🔀 隨機洗牌</button>
        <button class="btn" onclick="resetOrder()">🔄 恢復順序</button>
      </div>
    </div>

    <div class="stats-bar">
      <span id="statsCount">總計 0 題</span>
      <div class="progress-bar-container">
        <div id="progressFill" class="progress-fill"></div>
      </div>
      <span id="statsMastered">掌握率 0%</span>
    </div>

    <!-- List View -->
    <div id="qaList" class="qa-list"></div>

    <!-- Flashcard Mode View -->
    <div id="flashcardContainer" class="flashcard-container">
      <div class="flashcard-wrapper" id="flashcardWrapper" onclick="flipCard()">
        <div class="flashcard-inner">
          <!-- Front Face -->
          <div class="flashcard-face flashcard-front">
            <div class="card-top">
              <span class="card-badge badge-q">問題</span>
              <span id="fcCardNumber">卡片 1 / 1</span>
              <button class="master-btn" id="fcMasterBtn" onclick="toggleCardMaster(event)" title="標記為已掌握">★</button>
            </div>
            <div class="card-body" id="fcQuestion">載入中...</div>
            <div class="card-hint">💡 點擊卡片或按空白鍵翻面看答案</div>
          </div>
          <!-- Back Face -->
          <div class="flashcard-face flashcard-back">
            <div class="card-top">
              <span class="card-badge badge-a">解答</span>
              <span id="fcCardNumberBack">卡片 1 / 1</span>
              <button class="master-btn" id="fcMasterBtnBack" onclick="toggleCardMaster(event)" title="標記為已掌握">★</button>
            </div>
            <div class="card-body" id="fcAnswer">載入中...</div>
            <div class="card-hint">💡 再次點擊卡片翻回正面</div>
          </div>
        </div>
      </div>

      <div class="flashcard-controls">
        <button class="btn" onclick="prevCard()">← 上一題</button>
        <button class="btn btn-primary" onclick="flipCard()">翻轉卡片</button>
        <button class="btn" onclick="nextCard()">下一題 →</button>
      </div>
      <div class="shortcuts-hint">鍵盤快速鍵：[←] 上一題 · [空白鍵] 翻面 · [→] 下一題 · [M] 標記掌握</div>
    </div>
  </main>

  <script>
    const THEME_STORAGE_KEY = "qa_theme";
    const STORAGE_KEY = "anki_mastered_" + "Day3";
    const RAW_DATA = [{"id":1,"question":"在人工智慧生命週期中，哪種偏差是指訓練數據反映了過去的社會歧視，導致模型複製這些模式？","answer":"代表性偏差或歷史偏差 (Representational/Historical Bias)。"},{"id":2,"question":"當數據收集過程本身偏向特定樣本，或使用的標籤僅是真實結果的代理指標時，會產生哪種偏差？","answer":"選擇或測量偏差 (Selection/Measurement Bias)。"},{"id":3,"question":"所謂的「回饋偏差」(Feedback Bias) 是指模型輸出如何影響未來的系統行為？","answer":"模型輸出塑造未來數據，例如推薦系統放大已受歡迎的內容，使少數群體的偏好失去信號。"},{"id":4,"question":"在機器學習公平性中，哪一階段的緩解措施主要涉及分層抽樣、重新加權和數據集文件記錄？","answer":"預處理階段 (Pre-processing)。"},{"id":5,"question":"「中處理」(In-processing) 緩解方法主要在 AI 生命週期的哪一個環節實施？","answer":"模型訓練與優化階段。"},{"id":6,"question":"哪一種後處理 (Post-processing) 技術涉及調整模型的機率輸出，使預測機率與群體內的實際結果率相匹配？","answer":"分數校準 (Score Calibration)。"},{"id":7,"question":"根據 Kreante 指南，為什麼在招聘或貸款等受監管領域使用「特定群體門檻」的後處理方式具有法律風險？","answer":"這可能違反美國《民權法案》第七章或《平等信用機會法》，構成差別性處遇。"},{"id":8,"question":"在公平性指標中，「統計平等」(Statistical Parity) 的核心定義為何？","answer":"確保不同受保護群體獲得正面預測結果的比例相等。"},{"id":9,"question":"「相等機率」(Equalized Odds) 指標要求在不同群體之間，必須同時達到哪兩種率的平等？","answer":"真陽性率 (TPR) 與偽陽性率 (FPR)。"},{"id":10,"question":"為何「校準」(Calibration) 與「相等機率」(Equalized Odds) 在數學上往往無法同時滿足？","answer":"當不同群體的基礎率 (Base Rates) 存在差異時，這兩者在數學上互斥。"},{"id":11,"question":"在 TEVV 工作流程中，術語 \"V\" (Validation) 代表什麼意義？","answer":"驗證模型在進入暫存環境前是否符合公平性與效能指標。"},{"id":12,"question":"在資料審計中，什麼是「非隨機缺失」(Non-random missingness) 的潛在風險？","answer":"數據在特定子群體中缺失更頻繁，若用整體平均值填補會系統性低估該群體的真實值。"},{"id":13,"question":"哪一種緩解技術會訓練一個輔助模型，試圖從主模型的表示中預測受保護屬性，並對此進行懲罰？","answer":"對抗性去偏 (Adversarial Debiasing)。"},{"id":14,"question":"根據 CFPB Circular 2023-03，金融機構在提供「不利處分通知」時，不能僅依賴什麼？","answer":"Regulation B 附錄 C 中的標準檢查表範本。"},{"id":15,"question":"在金融信用審核中，「代理變數」(Proxy Variables) 的主要危害為何？","answer":"即使移除敏感特徵，非敏感特徵（如郵遞區號）仍能重建申請人的受保護屬性。"},{"id":16,"question":"Upstart 案例中，模型將「畢業院校」與平均 SAT 成績關聯，導致特定族裔院校畢業生受損，這被稱為什麼現象？","answer":"教育紅線 (Educational Redlining)。"},{"id":17,"question":"歐盟《人工智慧法案》將用於信用評級的 AI 系統歸類為哪一種風險等級？","answer":"高風險 AI 系統 (High-Risk AI Systems)。"},{"id":18,"question":"歐盟《人工智慧法案》規定，高風險 AI 系統的日誌紀錄 (Logs) 應至少保存多久？","answer":"至少 6 個月。"},{"id":19,"question":"在 Apple Card 調查中，儘管統計上未發現違規，但哪一方面的缺陷導致了公眾信任危機？","answer":"客戶服務缺乏解釋 AI 評分邏輯的能力（可解釋性崩潰）。"},{"id":20,"question":"「羅生門效應」(Rashomon Effect) 在演算法公平性研究中代表什麼含義？","answer":"存在多個準確度幾乎相等但內部結構不同的模型，其中某些模型的偏差可能較小。"},{"id":21,"question":"什麼是「級聯演算法偏差」(Cascading Algorithmic Bias)？","answer":"一個系統的偏見輸出成為另一個系統的輸入，導致歧視效應被放大。"},{"id":22,"question":"在美國勞工法律中，「四分之五法則」(4/5 Rule) 用於判斷什麼？","answer":"判斷不同群體間的選拔率是否存在實質性差異，以識別潛在的差別性影響。"},{"id":23,"question":"哪一種統計方法常被用於在缺乏人口統計數據時，推估個體的種族與族裔？","answer":"貝氏改進姓氏地理編碼法 (BISG)。"},{"id":24,"question":"根據 Kreante 的建議，當模型信心低於定義門檻或涉及受監管的受保護群體時，應採取什麼機制？","answer":"人工干預或覆核機制 (Human-in-the-loop)。"},{"id":25,"question":"在無監督學習中，偏差通常如何表現？","answer":"嵌入模型（如單詞嵌入）在其幾何結構中編碼職業或性別刻板印象。"},{"id":26,"question":"哪種 AI 框架要求在追求自動化效率的同時，必須確保決策軌跡具備追溯性？","answer":"歐盟《人工智慧法案》高風險治理體系。"},{"id":27,"question":"在金融授信中，「反對事實測試」(Counterfactual Testing) 的目的是什麼？","answer":"通過邊際調整單一特徵，驗證模型輸出是否翻轉，以確認拒絕理由的真實性。"},{"id":28,"question":"根據 CFPB 指引，若 AI 模型因申請人的「職業選擇」而拒絕貸款，機構必須揭露什麼？","answer":"真實且具體的因素，而非模糊的「收入不足」。"},{"id":29,"question":"歐盟《人工智慧法案》規定，違反高風險 AI 系統合規義務的最高罰鍰為何？","answer":"1,500 萬歐元或全球年度總營業額的 $3\\%$。"},{"id":30,"question":"什麼是「數據血統追蹤」(Data Lineage Traceability)？","answer":"確認所有替代性數據（如支付紀錄）具備明確定義與來源紀錄，以消除代理變數。"},{"id":31,"question":"在強化學習 (RL) 中，偏差最容易從哪個部分進入系統？","answer":"獎勵函數 (Reward Function) 的設計。"},{"id":32,"question":"哪一種指標衡量的是：改變受保護屬性後，模型的預測結果是否保持不變？","answer":"反事實公平性 (Counterfactual Fairness)。"},{"id":33,"question":"「個體公平性」(Individual Fairness) 的基本要求為何？","answer":"相似的個體應獲得相似的預測結果。"},{"id":34,"question":"在預處理階段，如果某個受保護子群體的樣本嚴重不足，通常會採取什麼措施？","answer":"目標過度抽樣 (Targeted Oversampling)。"},{"id":35,"question":"什麼是「標籤裁定協議」(Label Adjudication Protocols)？","answer":"當多個標註者意見分歧時，使用的結構化處理方式，分歧本身往往標記了偏差易發點。"},{"id":36,"question":"為何僅依靠移除特徵（盲性公平）不足以消除偏差？","answer":"因為其他特徵可能與被移除的敏感屬性高度相關，成為其代理指標。"},{"id":37,"question":"在金融審計中，「差別性影響」(Disparate Impact) 與「差別性處遇」(Disparate Treatment) 的主要區別為何？","answer":"前者指無意但造成不平等後果的實踐，後者指有意的歧視性行為。"},{"id":38,"question":"Meta 案例中，為了減少廣告投放中的人口統計偏斜，開發了哪種系統？","answer":"變異數減少系統 (Variance Reduction System)。"},{"id":39,"question":"哪一個開源程式庫涵蓋了預處理、中處理與後處理的全生命週期演算法？","answer":"IBM AI Fairness 360 (AIF360)。"},{"id":40,"question":"Microsoft Fairlearn 程式庫的主要優點為何？","answer":"提供約束型 API 與儀表板，可方便地比較不同模型變體的公平性指標。"},{"id":41,"question":"Google What-If Tool 主要服務於哪種分析目的？","answer":"無需程式碼的視覺化探討，用於分析模型在不同子群體中的行為。"},{"id":42,"question":"在部署後的監控中，「數據漂移」(Data Drift) 告警通常在哪種情況下觸發？","answer":"當輸入特徵的分佈偏離訓練數據的分佈超過定義門檻時。"},{"id":43,"question":"根據 2025 年的 Nature 研究，哪種後部署機制對於檢測長期偏差至關重要？","answer":"持續性的最終用戶回饋循環 (End-user feedback loops)。"},{"id":44,"question":"在實施偏差緩解計劃時，模型開發團隊與法律團隊應共同簽署什麼文件？","answer":"模型卡 (Model Card)，詳述公平性決策、指標權衡與已知限制。"},{"id":45,"question":"什麼是「自動化平庸」(Automation Complacency)？","answer":"審核人員過度依賴模型建議，即使模型出錯也傾向於批准，這在醫療或法律情境中尤為嚴重。"},{"id":46,"question":"在金融 AI 監管中，「商業必要性」(Business Necessity) 防禦何時適用？","answer":"當某項具備差別性影響的特徵對商業目標不可或缺，且無更少歧視的替代方案時。"},{"id":47,"question":"Rite Aid 案例中，聯邦貿易委員會 (FTC) 對其臉部辨識技術的處置為何？","answer":"禁止 Rite Aid 使用臉部辨識 AI 五年。"},{"id":48,"question":"在美國，《房屋抵押貸款揭露法》(HMDA) 如何幫助演算法調查？","answer":"強制貸方報告數據，讓監管機構與公眾能分析是否存在種族歧視模式。"},{"id":49,"question":"什麼是「信息障礙」(Information Barriers) 對 AI 審計的影響？","answer":"審計者無法獲取完整的訓練數據或模型代碼，導致難以重建決策過程。"},{"id":50,"question":"在 Kreante 的生命週期指南中，TEVV 代表的四個步驟分別是什麼？","answer":"測試 (Testing)、評估 (Evaluation)、驗證 (Validation)、核實 (Verification)。"},{"id":51,"question":"如果一個系統展示出「公平的紙上數據」，但在實際應用中失效，最常見的原因是什麼？","answer":"治理缺口，即缺乏監控基礎設施來檢測現實世界與測試數據的背離。"},{"id":52,"question":"在進行合成數據增強時，必須注意哪一點以防偏差？","answer":"合成數據會複製生成模型本身的偏差，必須用真實的子群體數據進行驗證。"},{"id":53,"question":"「群體特定門檻」(Group-specific thresholds) 在美國法律中通常被視為哪種性質？","answer":"顯性處遇歧視 (Disparate Treatment)。"},{"id":54,"question":"哪項法規是美國金融授信公平性的核心，明文禁止基於種族或性別的信用歧視？","answer":"平等信用機會法 (ECOA)。"},{"id":55,"question":"根據歐盟《人工智慧法案》，哪些類型的 AI 系統被直接禁止（Prohibited）而非僅是高風險？","answer":"在公共空間進行實時遠程生物特徵識別以用於執法（特定例外除外）。"},{"id":56,"question":"在金融授信模型中，移除「畢業院校」並引入「歸一化」機制是為了修正什麼？","answer":"修正少數族裔服務機構 (MSI) 與傳統名校之間的系統性得分差距。"},{"id":57,"question":"為什麼「參與式設計」(Participatory Design) 能有效緩解偏差？","answer":"受影響群體參與定義「公平」的標準，能發現內部開發團隊容易忽略的失效模式。"},{"id":58,"question":"在偏差緩解的權衡中，增加公平性約束通常會導致什麼代價？","answer":"預測準確度 (Accuracy) 的下降。"},{"id":59,"question":"什麼是「數據字典」或「數據集卡」(Dataset Card) 的核心內容？","answer":"記錄數據來源、收集方法、受保護屬性分佈及已知的限制。"},{"id":60,"question":"針對高風險 AI 系統，歐盟要求部署者在投入運作前必須完成什麼評估？","answer":"基本權利影響評估 (FRIA)。"},{"id":61,"question":"在 CFPB 的視角下，複雜演算法的「黑箱特性」能否作為無法提供具體理由的藉口？","answer":"不能，機構仍有法律義務提供具體且精準的原因。"},{"id":62,"question":"當模型使用「消費行為」數據進行帳戶凍結時，可能產生哪種非預期的後果？","answer":"過度擬合產生的隱性偏差放大，例如因在特定零售店購物而被扣分。"},{"id":63,"question":"什麼是「紅隊演練」(Red-teaming) 在 AI 公平性中的應用？","answer":"由外部專家進行結構化的攻擊性測試，以尋找模型的弱點與潛在歧視路徑。"},{"id":64,"question":"對於低風險系統，Kreante 建議如何開始緩解偏差？","answer":"從後處理校準與監控開始，隨後再向數據管道上游追溯。"},{"id":65,"question":"什麼是「敏感性分析」(Sensitivity Analysis) 在公平性審計中的作用？","answer":"測試模型輸出對特定受保護屬性變動的敏感程度。"},{"id":66,"question":"在處理「非隨機缺失」數據時，哪種做法優於直接用均值填補？","answer":"針對不同群體分別分析缺失模式，或使用更複雜的插值方法。"},{"id":67,"question":"對於 NLP 模型，Winogender 數據集主要用來測試什麼偏差？","answer":"性別代詞關聯偏差 (Gender Coreference Bias)。"},{"id":68,"question":"根據 Skadden 的分析，CFPB 的 Circular 2023-03 顯示監管機構對哪種數據特別關注？","answer":"從「消費者監視」(Consumer Surveillance) 獲取的數據。"},{"id":69,"question":"歐盟《人工智慧法案》中，Annex III 涵蓋的八大高風險領域包括哪些？","answer":"教育、就業、關鍵基礎設施、司法管理、公共服務、移民等。"},{"id":70,"question":"為何「公平性指標」被稱為政策決定而非純技術決定？","answer":"因為選擇優化哪一種指標（如統計平等或相等機率）涉及對社會正義的不同定義。"},{"id":71,"question":"在 AI 公平性治理中，「模型所有者」(Model Owner) 的首要職責是什麼？","answer":"對公平性結果負責，而不僅僅是模型效能。"},{"id":72,"question":"在 Apple Card 調查報告中，提到「附屬卡用戶」(Authorized User) 制度如何導致額度差異？","answer":"附屬卡用戶的獨立信用紀錄長度不足，即使其配偶信用良好，系統仍會判定其信用歷史過短。"},{"id":73,"question":"什麼是「隱性偏差放大」(Implicit Bias Amplification)？","answer":"即使排除單一敏感變數，多維特徵的非線性組合仍能以極高精度重建敏感屬性並放大歧視。"},{"id":74,"question":"在 CFPB 2022-03 通告中，明確了哪項關於演算法透明度的要求？","answer":"即使是複雜算法，債權人也必須向消費者提供拒絕貸款的「具體且精準的主要原因」。"},{"id":75,"question":"哪一項法律原則主張：法律應積極拆解群體層級體制，即使需要考慮受保護階級身份？","answer":"反從屬原則 (Anti-subordination)。"},{"id":76,"question":"在 AI 偏差治理中，為什麼「溝通無偏」與「演算法無偏」同樣重要？","answer":"即使統計上無歧視，如果客服無法解釋決策逻辑（黑箱運作），仍會摧毀公眾信任並引發監管調查。"},{"id":77,"question":"歐盟《人工智慧法案》中提到的「符合性評估」(Conformity Assessment) 是指什麼？","answer":"提供者在將系統投入市場前，需證明系統符合技術文件、數據治理與安全性要求。"},{"id":78,"question":"在 AI 信用審核中，「水瀑模型」(Waterfalls) 審計的重點為何？","answer":"繪製數據輸入至授信決策的路徑，釐清自動化決策與人工干預的邊界。"},{"id":79,"question":"針對 Meta 住房廣告案，司法部 (DOJ) 施加的罰鍰數額代表了什麼？","answer":"《公平住房法》允許的最高民事罰鍰。"},{"id":80,"question":"對於具有高度非線性特徵的 AI 模型，常用的局部解釋工具包括哪些？","answer":"SHAP 與 LIME。"},{"id":81,"question":"Kreante 指南中提到，哪種情況下應立即觸發「模型回滾」(Rollback)？","answer":"例如：偽陽性率偏差較基準增加 $10\\%$ 時。"},{"id":82,"question":"為什麼「分層抽樣」是緩解偏差的首選技術之一？","answer":"它能在不增加模型複雜度的情況下，確保受保護群體在訓練集中有足夠的代表性。"},{"id":83,"question":"在 CFPB 2023-03 通告中，哪種拒絕理由被認為過於模糊且可能違規？","answer":"「消費歷史過短」或「收入不足」，若實際原因是特定的店鋪消費行為。"},{"id":84,"question":"歐盟《人工智慧法案》規定，部署者在發現高風險 AI 系統存在嚴重事故時，應採取什麼行動？","answer":"立即通知提供者及國家監管機構。"},{"id":85,"question":"在 AI 生命週期的治理中，哪一個角色負責數據集的文件記錄與血統追蹤？","answer":"數據管家 (Data Steward)。"},{"id":86,"question":"在 AI 公平性中，「平等獲取」(Equality of Access) 與「結果平等」(Equality of Outcome) 的區別為何？","answer":"前者關注機會的開放性，後者關注不同群體最終獲得正面結果的比例是否一致。"},{"id":87,"question":"為何「單一指標」在 AI 公平性衡量中是不夠的？","answer":"因為不同指標可能掩蓋不同類型的偏見，例如統計平等可能隱藏極高的錯誤率。"},{"id":88,"question":"在美國，哪一個機構負責執行《公平住房法》，並與 Meta 達成廣告偏差和解？","answer":"司法部 (DOJ) 與 住房及城市發展部 (HUD)。"},{"id":89,"question":"在 AI 偏差緩解的實施計劃中，「設計階段」的核心任務是什麼？","answer":"定義用例範圍、識別相關受保護屬性、選擇公平性指標並設定可接受的權衡門檻。"},{"id":90,"question":"什麼是「偏差應急響應」(Incident Response) 的第一步？","answer":"立即緩解，如套用快速修復（調整門檻）、路由至人工審核或回滾模型版本。"}];
    let currentData = [...RAW_DATA];
    let masteredSet = new Set(JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]"));
    let currentMode = 'list';
    let filterOnlyUnmastered = false;
    let isAllExpanded = false;
    let cardIndex = 0;

    function applyTheme(theme) {
      const normalizedTheme = theme === "dark" ? "dark" : "light";
      document.documentElement.dataset.theme = normalizedTheme;

      const btn = document.getElementById("themeToggleBtn");
      if (btn) {
        const isDark = normalizedTheme === "dark";
        btn.textContent = isDark ? "淺色模式" : "深色模式";
        btn.setAttribute("aria-label", isDark ? "切換為淺色模式" : "切換為深色模式");
      }
    }

    function initializeTheme() {
      const savedTheme = localStorage.getItem(THEME_STORAGE_KEY) || "light";
      applyTheme(savedTheme);
    }

    function toggleTheme() {
      const nextTheme = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
      localStorage.setItem(THEME_STORAGE_KEY, nextTheme);
      applyTheme(nextTheme);
    }

    initializeTheme();

    function saveMastered() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(Array.from(masteredSet)));
      updateStats();
    }

    function updateStats() {
      const total = RAW_DATA.length;
      const masteredCount = RAW_DATA.filter(item => masteredSet.has(item.id)).length;
      const pct = total === 0 ? 0 : Math.round((masteredCount / total) * 100);

      document.getElementById('statsCount').textContent = `顯示 ${currentData.length} / 共 ${total} 題`;
      document.getElementById('statsMastered').textContent = `已掌握 ${masteredCount} 題 (${pct}%)`;
      document.getElementById('progressFill').style.width = pct + '%';
    }

    function renderMath() {
      if (window.renderMathInElement) {
        renderMathInElement(document.body, {
          delimiters: [
            {left: '$$', right: '$$', display: true},
            {left: '$', right: '$', display: false}
          ],
          throwOnError: false
        });
      }
    }

    function renderList() {
      const container = document.getElementById('qaList');
      if (currentData.length === 0) {
        container.innerHTML = '<div class="empty-state">沒有符合條件的問答卡片</div>';
        return;
      }

      container.innerHTML = currentData.map(item => {
        const isMastered = masteredSet.has(item.id);
        return `
          <div class="qa-card ${isMastered ? 'mastered' : ''} ${isAllExpanded ? 'open' : ''}" id="card-${item.id}">
            <div class="qa-header" onclick="toggleItem(${item.id})">
              <span class="qa-id">#${item.id}</span>
              <span class="qa-question">${escapeHtml(item.question)}</span>
              <div class="qa-actions">
                <button class="master-btn ${isMastered ? 'is-mastered' : ''}"
                        onclick="toggleMaster(event, ${item.id})"
                        title="${isMastered ? '已掌握' : '標記掌握'}">★</button>
                <span class="expand-icon">▼</span>
              </div>
            </div>
            <div class="qa-answer">${escapeHtml(item.answer)}</div>
          </div>
        `;
      }).join('');

      renderMath();
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    function toggleItem(id) {
      const el = document.getElementById('card-' + id);
      if (el) {
        el.classList.toggle('open');
      }
    }

    function toggleMaster(event, id) {
      event.stopPropagation();
      if (masteredSet.has(id)) {
        masteredSet.delete(id);
      } else {
        masteredSet.add(id);
      }
      saveMastered();
      applyFilters();
    }

    function toggleExpandAll() {
      isAllExpanded = !isAllExpanded;
      document.getElementById('expandAllBtn').textContent = isAllExpanded ? "收合全部" : "展開全部";
      document.querySelectorAll('.qa-card').forEach(card => {
        if (isAllExpanded) {
          card.classList.add('open');
        } else {
          card.classList.remove('open');
        }
      });
    }

    function toggleFilterMastered() {
      filterOnlyUnmastered = !filterOnlyUnmastered;
      const btn = document.getElementById('filterMasteredBtn');
      btn.classList.toggle('active-filter', filterOnlyUnmastered);
      btn.textContent = filterOnlyUnmastered ? "✓ 僅顯示未掌握" : "⭐ 只看未掌握";
      applyFilters();
    }

    function handleSearch() {
      applyFilters();
    }

    function applyFilters() {
      const query = document.getElementById('searchInput').value.trim().toLowerCase();
      currentData = RAW_DATA.filter(item => {
        if (filterOnlyUnmastered && masteredSet.has(item.id)) {
          return false;
        }
        if (query) {
          const matchQ = item.question.toLowerCase().includes(query);
          const matchA = item.answer.toLowerCase().includes(query);
          return matchQ || matchA;
        }
        return true;
      });

      cardIndex = 0;
      if (currentMode === 'list') {
        renderList();
      } else {
        updateCardView();
      }
      updateStats();
    }

    function shuffleCards() {
      currentData.sort(() => Math.random() - 0.5);
      cardIndex = 0;
      if (currentMode === 'list') {
        renderList();
      } else {
        updateCardView();
      }
    }

    function resetOrder() {
      currentData.sort((a, b) => a.id - b.id);
      cardIndex = 0;
      if (currentMode === 'list') {
        renderList();
      } else {
        updateCardView();
      }
    }

    function switchMode(mode) {
      currentMode = mode;
      const listBtn = document.getElementById('listViewBtn');
      const cardBtn = document.getElementById('cardViewBtn');
      const qaList = document.getElementById('qaList');
      const flashcardContainer = document.getElementById('flashcardContainer');
      const expandAllBtn = document.getElementById('expandAllBtn');

      if (mode === 'list') {
        listBtn.classList.add('active');
        cardBtn.classList.remove('active');
        qaList.style.display = 'flex';
        flashcardContainer.style.display = 'none';
        expandAllBtn.style.display = 'inline-flex';
        renderList();
      } else {
        cardBtn.classList.add('active');
        listBtn.classList.remove('active');
        qaList.style.display = 'none';
        flashcardContainer.style.display = 'flex';
        expandAllBtn.style.display = 'none';
        updateCardView();
      }
    }

    /* Flashcard Functions */
    function flipCard() {
      const wrapper = document.getElementById('flashcardWrapper');
      wrapper.classList.toggle('flipped');
    }

    function updateCardView() {
      const wrapper = document.getElementById('flashcardWrapper');
      wrapper.classList.remove('flipped');

      if (currentData.length === 0) {
        document.getElementById('fcQuestion').textContent = '無卡片資料';
        document.getElementById('fcAnswer').textContent = '無卡片資料';
        document.getElementById('fcCardNumber').textContent = '0 / 0';
        document.getElementById('fcCardNumberBack').textContent = '0 / 0';
        return;
      }

      if (cardIndex < 0) cardIndex = 0;
      if (cardIndex >= currentData.length) cardIndex = currentData.length - 1;

      const item = currentData[cardIndex];
      const isMastered = masteredSet.has(item.id);

      document.getElementById('fcQuestion').textContent = item.question;
      document.getElementById('fcAnswer').textContent = item.answer;

      const cardNumText = `卡片 ${cardIndex + 1} / ${currentData.length} (#${item.id})`;
      document.getElementById('fcCardNumber').textContent = cardNumText;
      document.getElementById('fcCardNumberBack').textContent = cardNumText;

      const btn1 = document.getElementById('fcMasterBtn');
      const btn2 = document.getElementById('fcMasterBtnBack');
      btn1.classList.toggle('is-mastered', isMastered);
      btn2.classList.toggle('is-mastered', isMastered);

      renderMath();
    }

    function prevCard() {
      if (currentData.length === 0) return;
      cardIndex = (cardIndex - 1 + currentData.length) % currentData.length;
      updateCardView();
    }

    function nextCard() {
      if (currentData.length === 0) return;
      cardIndex = (cardIndex + 1) % currentData.length;
      updateCardView();
    }

    function toggleCardMaster(event) {
      event.stopPropagation();
      if (currentData.length === 0) return;
      const item = currentData[cardIndex];
      toggleMaster(event, item.id);
      updateCardView();
    }

    /* Keyboard Shortcuts */
    window.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT') return;
      if (currentMode === 'card') {
        if (e.code === 'Space') {
          e.preventDefault();
          flipCard();
        } else if (e.code === 'ArrowLeft') {
          e.preventDefault();
          prevCard();
        } else if (e.code === 'ArrowRight') {
          e.preventDefault();
          nextCard();
        } else if (e.code === 'KeyM') {
          e.preventDefault();
          toggleCardMaster(e);
        }
      }
    });

    // Init
    window.addEventListener('DOMContentLoaded', () => {
      updateStats();
      renderList();
      setTimeout(renderMath, 200);
    });
  </script>
</body>
