<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Day3 - 問答複習卡</title>
  <!-- KaTeX for LaTeX rendering -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
  <style>
    :root {
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --primary-light: #eff6ff;
      --border-color: #e2e8f0;
      --success: #10b981;
      --success-light: #ecfdf5;
      --accent: #f59e0b;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
      --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.08), 0 2px 4px -2px rgba(0,0,0,0.05);
      --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.1), 0 4px 6px -4px rgba(0,0,0,0.05);
      --radius: 12px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg-color: #0f172a;
        --card-bg: #1e293b;
        --text-main: #f8fafc;
        --text-muted: #94a3b8;
        --primary: #60a5fa;
        --primary-hover: #3b82f6;
        --primary-light: #1e3a8a33;
        --border-color: #334155;
        --success: #34d399;
        --success-light: #064e3b33;
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans TC", sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      line-height: 1.6;
      padding-bottom: 60px;
    }

    /* Navigation / Header */
    header {
      background: var(--card-bg);
      border-bottom: 1px solid var(--border-color);
      position: sticky;
      top: 0;
      z-index: 50;
      box-shadow: var(--shadow-sm);
    }

    .header-container {
      max-width: 900px;
      margin: 0 auto;
      padding: 14px 20px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .nav-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 8px;
      background: var(--primary-light);
      color: var(--primary);
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      transition: all 0.2s;
    }

    .back-btn:hover {
      background: var(--primary);
      color: #fff;
    }

    .page-title {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .view-toggles {
      display: flex;
      background: var(--bg-color);
      padding: 3px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
    }

    .toggle-btn {
      padding: 6px 14px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .toggle-btn.active {
      background: var(--card-bg);
      color: var(--primary);
      box-shadow: var(--shadow-sm);
    }

    /* Main Container */
    main {
      max-width: 900px;
      margin: 24px auto;
      padding: 0 20px;
    }

    /* Toolbar */
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 20px;
      align-items: center;
      justify-content: space-between;
    }

    .search-box {
      flex: 1;
      min-width: 240px;
      position: relative;
    }

    .search-box input {
      width: 100%;
      padding: 10px 14px 10px 38px;
      border-radius: 10px;
      border: 1px solid var(--border-color);
      background: var(--card-bg);
      color: var(--text-main);
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-box input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-light);
    }

    .search-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 14px;
    }

    .action-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background: var(--card-bg);
      color: var(--text-main);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn:hover {
      background: var(--border-color);
    }

    .btn.active-filter {
      background: var(--primary-light);
      border-color: var(--primary);
      color: var(--primary);
    }

    /* Stats bar */
    .stats-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      font-size: 14px;
      color: var(--text-muted);
    }

    .progress-bar-container {
      flex: 1;
      height: 8px;
      background: var(--border-color);
      border-radius: 99px;
      margin: 0 16px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: var(--success);
      width: 0%;
      transition: width 0.3s ease;
    }

    /* List View Cards */
    .qa-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .qa-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      box-shadow: var(--shadow-sm);
      overflow: hidden;
      transition: box-shadow 0.2s, border-color 0.2s;
    }

    .qa-card:hover {
      box-shadow: var(--shadow-md);
      border-color: #cbd5e1;
    }

    .qa-card.mastered {
      border-left: 4px solid var(--success);
    }

    .qa-header {
      padding: 16px 20px;
      display: flex;
      align-items: flex-start;
      gap: 12px;
      cursor: pointer;
      user-select: none;
    }

    .qa-id {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 28px;
      height: 28px;
      background: var(--primary-light);
      color: var(--primary);
      border-radius: 6px;
      font-size: 13px;
      font-weight: 700;
      margin-top: 2px;
      flex-shrink: 0;
    }

    .qa-question {
      flex: 1;
      font-size: 15px;
      font-weight: 600;
      color: var(--text-main);
      padding-top: 2px;
    }

    .qa-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .master-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 18px;
      padding: 4px;
      border-radius: 6px;
      transition: transform 0.15s, color 0.15s;
    }

    .master-btn:hover {
      transform: scale(1.15);
    }

    .master-btn.is-mastered {
      color: var(--accent);
    }

    .expand-icon {
      color: var(--text-muted);
      font-size: 14px;
      transition: transform 0.2s ease;
    }

    .qa-card.open .expand-icon {
      transform: rotate(180deg);
    }

    .qa-answer {
      display: none;
      padding: 16px 20px 18px 60px;
      background: var(--bg-color);
      border-top: 1px dashed var(--border-color);
      font-size: 15px;
      color: var(--text-main);
      line-height: 1.7;
    }

    .qa-card.open .qa-answer {
      display: block;
      animation: fadeIn 0.2s ease-in;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Flashcard Mode */
    .flashcard-container {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      padding: 10px 0;
    }

    .flashcard-wrapper {
      perspective: 1000px;
      width: 100%;
      max-width: 640px;
      min-height: 340px;
      cursor: pointer;
    }

    .flashcard-inner {
      position: relative;
      width: 100%;
      height: 100%;
      min-height: 340px;
      text-align: center;
      transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
      transform-style: preserve-3d;
      border-radius: 16px;
      box-shadow: var(--shadow-lg);
    }

    .flashcard-wrapper.flipped .flashcard-inner {
      transform: rotateY(180deg);
    }

    .flashcard-face {
      position: absolute;
      width: 100%;
      height: 100%;
      min-height: 340px;
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 30px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      box-sizing: border-box;
    }

    .flashcard-back {
      transform: rotateY(180deg);
      background: var(--card-bg);
      border: 2px solid var(--primary);
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      color: var(--text-muted);
    }

    .card-badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 99px;
      font-weight: 600;
      font-size: 12px;
    }

    .badge-q {
      background: var(--primary-light);
      color: var(--primary);
    }

    .badge-a {
      background: var(--success-light);
      color: var(--success);
    }

    .card-body {
      margin: auto 0;
      padding: 20px 10px;
      font-size: 18px;
      font-weight: 600;
      line-height: 1.6;
    }

    .card-hint {
      font-size: 12px;
      color: var(--text-muted);
    }

    .flashcard-controls {
      display: flex;
      gap: 12px;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 640px;
    }

    .flashcard-controls .btn {
      padding: 10px 20px;
      font-size: 14px;
      font-weight: 600;
    }

    .btn-primary {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    .btn-primary:hover {
      background: var(--primary-hover);
    }

    .shortcuts-hint {
      font-size: 12px;
      color: var(--text-muted);
      text-align: center;
      margin-top: 8px;
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
      background: var(--card-bg);
      border-radius: var(--radius);
      border: 1px dashed var(--border-color);
    }
  </style>
</head>
<body>
  <header>
    <div class="header-container">
      <div class="nav-left">
        <a href="../index.html" class="back-btn" title="回目錄">← 目錄</a>
        <h1 class="page-title">Day3 問答卡</h1>
      </div>
      <div class="view-toggles">
        <button id="listViewBtn" class="toggle-btn active" onclick="switchMode('list')">📋 列表模式</button>
        <button id="cardViewBtn" class="toggle-btn" onclick="switchMode('card')">🎴 翻卡測驗</button>
      </div>
    </div>
  </header>

  <main>
    <div class="toolbar">
      <div class="search-box">
        <span class="search-icon">🔍</span>
        <input type="text" id="searchInput" placeholder="搜尋問題或答案關鍵字..." oninput="handleSearch()">
      </div>
      <div class="action-buttons">
        <button class="btn" id="filterMasteredBtn" onclick="toggleFilterMastered()">⭐ 只看未掌握</button>
        <button class="btn" id="expandAllBtn" onclick="toggleExpandAll()">展開全部</button>
        <button class="btn" onclick="shuffleCards()">🔀 隨機洗牌</button>
        <button class="btn" onclick="resetOrder()">🔄 恢復順序</button>
      </div>
    </div>

    <div class="stats-bar">
      <span id="statsCount">總計 0 題</span>
      <div class="progress-bar-container">
        <div id="progressFill" class="progress-fill"></div>
      </div>
      <span id="statsMastered">掌握率 0%</span>
    </div>

    <!-- List View -->
    <div id="qaList" class="qa-list"></div>

    <!-- Flashcard Mode View -->
    <div id="flashcardContainer" class="flashcard-container">
      <div class="flashcard-wrapper" id="flashcardWrapper" onclick="flipCard()">
        <div class="flashcard-inner">
          <!-- Front Face -->
          <div class="flashcard-face flashcard-front">
            <div class="card-top">
              <span class="card-badge badge-q">問題</span>
              <span id="fcCardNumber">卡片 1 / 1</span>
              <button class="master-btn" id="fcMasterBtn" onclick="toggleCardMaster(event)" title="標記為已掌握">★</button>
            </div>
            <div class="card-body" id="fcQuestion">載入中...</div>
            <div class="card-hint">💡 點擊卡片或按空白鍵翻面看答案</div>
          </div>
          <!-- Back Face -->
          <div class="flashcard-face flashcard-back">
            <div class="card-top">
              <span class="card-badge badge-a">解答</span>
              <span id="fcCardNumberBack">卡片 1 / 1</span>
              <button class="master-btn" id="fcMasterBtnBack" onclick="toggleCardMaster(event)" title="標記為已掌握">★</button>
            </div>
            <div class="card-body" id="fcAnswer">載入中...</div>
            <div class="card-hint">💡 再次點擊卡片翻回正面</div>
          </div>
        </div>
      </div>

      <div class="flashcard-controls">
        <button class="btn" onclick="prevCard()">← 上一題</button>
        <button class="btn btn-primary" onclick="flipCard()">翻轉卡片</button>
        <button class="btn" onclick="nextCard()">下一題 →</button>
      </div>
      <div class="shortcuts-hint">鍵盤快速鍵：[←] 上一題 · [空白鍵] 翻面 · [→] 下一題 · [M] 標記掌握</div>
    </div>
  </main>

  <script>
    const STORAGE_KEY = "anki_mastered_" + "Day3";
    const RAW_DATA = [{"id":1,"question":"數據分析的時間分配法則：在一個標準的數據分析專案中，「準備與處理資料」通常佔據多少時間比例？","answer":"約佔整體的 $60$ 到 $70\\%$。"},{"id":2,"question":"根據 Gartner 的四大數據分析類型，哪一種分析旨在回答「發生了什麼事？」","answer":"描述性分析（Descriptive Analysis）。"},{"id":3,"question":"根據 Gartner 的四大數據分析類型，哪一種分析旨在回答「為何會發生？」","answer":"診斷性分析（Diagnostic Analysis）。"},{"id":4,"question":"旨在預測「將來會發生什麼？」的分析類型稱為 _____。","answer":"預測性分析（Predictive Analysis）"},{"id":5,"question":"旨在探討「我們可以做什麼，來讓未來更符合期待」的分析類型稱為 _____。","answer":"處方性分析（Prescriptive Analysis）"},{"id":6,"question":"在數據分析流程中，第一步通常是什麼？","answer":"定義要分析的問題（提問）。"},{"id":7,"question":"數據分析流程的最終目標（最後一步）是什麼？","answer":"根據分析結果採取行動（Action）。"},{"id":8,"question":"資料品質維度：確保資料中沒有重複紀錄的特性稱為 _____。","answer":"獨特性（Uniqueness）"},{"id":9,"question":"資料品質維度：資料能正確反映所描述事物的特性稱為 _____。","answer":"準確性（Accuracy）"},{"id":10,"question":"資料品質維度：具備足夠屬性以得出有意義結論的特性稱為 _____。","answer":"完整性（Completeness）"},{"id":11,"question":"資料品質維度：資料是否新鮮、即時的特性稱為 _____。","answer":"即時性（Timeliness）"},{"id":12,"question":"資料品質維度：不同資料集或來源之間沒有矛盾且定義相同的特性稱為 _____。","answer":"一致性（Consistency）"},{"id":13,"question":"資料品質維度：符合預定規則、格式與標準（如年齡無負值）的特性稱為 _____。","answer":"有效性（Validity）"},{"id":14,"question":"數據清洗場景：將單一欄位的內容分散到不同欄位（如 Taiwan, Taipei 切分）的操作稱為 _____。","answer":"切割（Split）"},{"id":15,"question":"數據清洗場景：去除字串中無意義的空白資料稱為 _____。","answer":"修剪（Trim）"},{"id":16,"question":"數據清洗場景：將缺失或遺失的數據填補回去稱為 _____。","answer":"補值（Append）"},{"id":17,"question":"數據清洗場景：將多個欄位的資料結合成單一欄位稱為 _____。","answer":"合併（Merge）"},{"id":18,"question":"數據清洗場景：將「日期」或「貨幣」格式進行調整以相容於分析工具稱為 _____。","answer":"格式轉換（Format）"},{"id":19,"question":"數據清洗場景：將欄與列的位置進行交換的作業稱為 _____。","answer":"轉置（Transposing/pivoting）"},{"id":20,"question":"資料清洗層級：Level 1 基礎處理的核心任務是什麼？","answer":"初步清理原始資料、檢查資料型態與處理明顯錯誤。"},{"id":21,"question":"資料清洗層級：Level 2 主要探討如何處理 _____ 重複數據（如 Google, Inc. 與 Google LLC）。","answer":"非精確匹配（模糊重複）"},{"id":22,"question":"資料清洗層級：Level 4 的重點在於建立什麼流程？","answer":"自動化資料清洗與監控流程（Data Pipeline）。"},{"id":23,"question":"在進行數據分析前，若未清洗資料導致「Gardbage In」，其結果通常被稱為 _____。","answer":"Garbage Out（垃圾進，垃圾出）"},{"id":24,"question":"繪製長條圖（Bar Chart）時，為什麼建議 Y 軸應從零開始？","answer":"為了避免視覺上過度誇大數據間的差異。"},{"id":25,"question":"在比較數據大小時，「面積圖」比「長條圖」更容易產生誤導的原因是什麼？","answer":"人類視覺對長度（一次方）的判斷比對面積（二次方）精確。"},{"id":26,"question":"視覺化工具比較：Tableau 與 Power BI 的核心概念雖然相似，但主要差異在於 _____。","answer":"設計風格、操作邏輯與公司系統生態的整合。"},{"id":27,"question":"Tableau Public 版本相較於付費版，主要限制為何？","answer":"無法保護私密資料，作品必須發布到公開雲端。"},{"id":28,"question":"為什麼在 Tableau 中繪圖前需要先檢查「資料屬性」？","answer":"確保維度（如日期、地點）被正確識別，以便進行後續分析。"},{"id":29,"question":"在 Tableau 中，「熱度圖」（Highlight Table）主要的觀察用途為何？","answer":"利用顏色深淺快速找出數值的極端分佈或缺失狀況。"},{"id":30,"question":"AI 數據分析優勢：使用 AI 生成 Excel 函數的主要優點是什麼？","answer":"降低資安疑慮（不需上傳原始資料）且過程可重現。"},{"id":31,"question":"AI 數據分析劣勢：直接上傳資料讓 AI 進行清洗的主要缺點為何？","answer":"難以重現計算過程，且 AI 可能會產生不可控的錯誤。"},{"id":32,"question":"與 AI 對話時，為了獲得精確的分析結果，應採用什麼樣的指令技術？","answer":"結構化指令（Structured Prompting）。"},{"id":33,"question":"在診斷性分析中，常用的思考方法是什麼？","answer":"假說思考法（提出假說並進行驗證）。"},{"id":34,"question":"Excel 的資料列數極限大約是多少？","answer":"約 $104$ 萬筆。"},{"id":35,"question":"什麼樣的檔案格式（如 .csv）適合處理超過 Excel 筆數限制的大型資料？","answer":"純文字結構化資料格式（CSV）。"},{"id":36,"question":"在 Excel 中，可以用哪一個內建功能將「台南市永康區」切割成兩欄？","answer":"資料剖析（Text to Columns）。"},{"id":37,"question":"Excel 樞紐分析表的主要用途是什麼？","answer":"從不同維度整合大批量數據，進行快速彙整與觀察。"},{"id":38,"question":"在分析交通意外數據時，若想知道「哪一個時段最容易發生事故」，需要從原始時間中取出什麼欄位？","answer":"小時（Hour）。"},{"id":39,"question":"在數據分析分享階段，圖表製作的主要目的是為了改善 _____。","answer":"數據溝通的效率（Data Communication）。"},{"id":40,"question":"在 Tableau 中，若要觀察不同年份的趨勢，應將日期欄位放在「欄」還是「列」？","answer":"欄（Columns）。"},{"id":41,"question":"什麼是「數據思維」的起點？","answer":"從一個具體的商業提問或目標出發。"},{"id":42,"question":"診斷性分析中「追問」AI 的目的是什麼？","answer":"利用對話上下文進行深層原因探索，不需要重複描述背景。"},{"id":43,"question":"在處理台灣交通資料時，「發生時間」為民國年，轉換成西元年屬於哪種資料清洗操作？","answer":"格式轉換（Format）。"},{"id":44,"question":"在 Tableau 中，將特定欄位（如 Category）拖曳至「顏色」標記的作用是什麼？","answer":"根據類別區分數據的視覺呈現，以便進行分類比較。"},{"id":45,"question":"在結構化資料中，每一個欄位應該代表 _____。","answer":"單一且獨立的屬性或維度。"},{"id":46,"question":"數據溝通中，為何要避免使用過於擁擠或顏色過雜的圖表？","answer":"因為會增加閱覽者的認知負擔，降低資訊傳遞效率。"},{"id":47,"question":"AI 素養中，調整對話指令（Prompt）的過程稱為 _____。","answer":"疊代（Iteration）。"},{"id":48,"question":"資料品質評估中的「一致性」對於金融業特別重要的原因是什麼？","answer":"確保跨系統或跨幣別的數據計算不會發生偏差。"},{"id":49,"question":"在 Tableau 中，「顆粒度」指的是資料呈現的 _____。","answer":"精細程度（如由年份展開至月份或日期）。"},{"id":50,"question":"AI 數據分析提示詞建議：若要請 AI 生成複雜函數，最好先提供什麼資訊？","answer":"資料欄位名稱及前幾筆範例資料。"},{"id":51,"question":"Tableau 的「標誌」（Marks）窗格主要包含哪些視覺屬性？","answer":"顏色、大小、文字、詳細資料、工具提示。"},{"id":52,"question":"在數據分析的分享（Share）階段，除了圖表外，最重要的要素是什麼？","answer":"數據說故事（Data Storytelling）的能力。"},{"id":53,"question":"為何「描述性分析」是數據分析專案的第一個實質分析步驟？","answer":"為了客觀掌握資料的現狀、分佈與基本統計指標。"},{"id":54,"question":"在 Excel 函數中，`VALUE` 函數的主要作用是什麼？","answer":"將文字格式的數字轉換為可計算的數值格式。"},{"id":55,"question":"數據分析循環中，「行動」後若未達成目標，下一個步驟是什麼？","answer":"回到提問階段，進行下一輪的分析疊代。"},{"id":56,"question":"資料品質維度：如果員編應該是唯一碼，這對應到哪一個特性？","answer":"獨特性（Uniqueness）。"},{"id":57,"question":"在 AI 輔助下，初學者也能快速進行分析的關鍵在於如何正確地 _____。","answer":"描述資料結構與分析需求（提問）。"},{"id":58,"question":"當數據量極大且更新頻繁時，應提升到哪一個資料處理層級？","answer":"Level 4（自動化數據清洗與監控）。"},{"id":59,"question":"視覺化心理學：為什麼我們會優先看長條圖中最高的條柱？","answer":"因為大腦會直覺地先處理視覺對比最顯著的部分。"},{"id":60,"question":"Tableau 的核心優勢之一是其強大的 _____ 處理能力。","answer":"地理資訊（地圖）與時間維度。"}];
    let currentData = [...RAW_DATA];
    let masteredSet = new Set(JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]"));
    let currentMode = 'list';
    let filterOnlyUnmastered = false;
    let isAllExpanded = false;
    let cardIndex = 0;

    function saveMastered() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(Array.from(masteredSet)));
      updateStats();
    }

    function updateStats() {
      const total = RAW_DATA.length;
      const masteredCount = RAW_DATA.filter(item => masteredSet.has(item.id)).length;
      const pct = total === 0 ? 0 : Math.round((masteredCount / total) * 100);

      document.getElementById('statsCount').textContent = `顯示 ${currentData.length} / 共 ${total} 題`;
      document.getElementById('statsMastered').textContent = `已掌握 ${masteredCount} 題 (${pct}%)`;
      document.getElementById('progressFill').style.width = pct + '%';
    }

    function renderMath() {
      if (window.renderMathInElement) {
        renderMathInElement(document.body, {
          delimiters: [
            {left: '$$', right: '$$', display: true},
            {left: '$', right: '$', display: false}
          ],
          throwOnError: false
        });
      }
    }

    function renderList() {
      const container = document.getElementById('qaList');
      if (currentData.length === 0) {
        container.innerHTML = '<div class="empty-state">沒有符合條件的問答卡片</div>';
        return;
      }

      container.innerHTML = currentData.map(item => {
        const isMastered = masteredSet.has(item.id);
        return `
          <div class="qa-card ${isMastered ? 'mastered' : ''} ${isAllExpanded ? 'open' : ''}" id="card-${item.id}">
            <div class="qa-header" onclick="toggleItem(${item.id})">
              <span class="qa-id">#${item.id}</span>
              <span class="qa-question">${escapeHtml(item.question)}</span>
              <div class="qa-actions">
                <button class="master-btn ${isMastered ? 'is-mastered' : ''}"
                        onclick="toggleMaster(event, ${item.id})"
                        title="${isMastered ? '已掌握' : '標記掌握'}">★</button>
                <span class="expand-icon">▼</span>
              </div>
            </div>
            <div class="qa-answer">${escapeHtml(item.answer)}</div>
          </div>
        `;
      }).join('');

      renderMath();
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    function toggleItem(id) {
      const el = document.getElementById('card-' + id);
      if (el) {
        el.classList.toggle('open');
      }
    }

    function toggleMaster(event, id) {
      event.stopPropagation();
      if (masteredSet.has(id)) {
        masteredSet.delete(id);
      } else {
        masteredSet.add(id);
      }
      saveMastered();
      applyFilters();
    }

    function toggleExpandAll() {
      isAllExpanded = !isAllExpanded;
      document.getElementById('expandAllBtn').textContent = isAllExpanded ? "收合全部" : "展開全部";
      document.querySelectorAll('.qa-card').forEach(card => {
        if (isAllExpanded) {
          card.classList.add('open');
        } else {
          card.classList.remove('open');
        }
      });
    }

    function toggleFilterMastered() {
      filterOnlyUnmastered = !filterOnlyUnmastered;
      const btn = document.getElementById('filterMasteredBtn');
      btn.classList.toggle('active-filter', filterOnlyUnmastered);
      btn.textContent = filterOnlyUnmastered ? "✓ 僅顯示未掌握" : "⭐ 只看未掌握";
      applyFilters();
    }

    function handleSearch() {
      applyFilters();
    }

    function applyFilters() {
      const query = document.getElementById('searchInput').value.trim().toLowerCase();
      currentData = RAW_DATA.filter(item => {
        if (filterOnlyUnmastered && masteredSet.has(item.id)) {
          return false;
        }
        if (query) {
          const matchQ = item.question.toLowerCase().includes(query);
          const matchA = item.answer.toLowerCase().includes(query);
          return matchQ || matchA;
        }
        return true;
      });

      cardIndex = 0;
      if (currentMode === 'list') {
        renderList();
      } else {
        updateCardView();
      }
      updateStats();
    }

    function shuffleCards() {
      currentData.sort(() => Math.random() - 0.5);
      cardIndex = 0;
      if (currentMode === 'list') {
        renderList();
      } else {
        updateCardView();
      }
    }

    function resetOrder() {
      currentData.sort((a, b) => a.id - b.id);
      cardIndex = 0;
      if (currentMode === 'list') {
        renderList();
      } else {
        updateCardView();
      }
    }

    function switchMode(mode) {
      currentMode = mode;
      const listBtn = document.getElementById('listViewBtn');
      const cardBtn = document.getElementById('cardViewBtn');
      const qaList = document.getElementById('qaList');
      const flashcardContainer = document.getElementById('flashcardContainer');
      const expandAllBtn = document.getElementById('expandAllBtn');

      if (mode === 'list') {
        listBtn.classList.add('active');
        cardBtn.classList.remove('active');
        qaList.style.display = 'flex';
        flashcardContainer.style.display = 'none';
        expandAllBtn.style.display = 'inline-flex';
        renderList();
      } else {
        cardBtn.classList.add('active');
        listBtn.classList.remove('active');
        qaList.style.display = 'none';
        flashcardContainer.style.display = 'flex';
        expandAllBtn.style.display = 'none';
        updateCardView();
      }
    }

    /* Flashcard Functions */
    function flipCard() {
      const wrapper = document.getElementById('flashcardWrapper');
      wrapper.classList.toggle('flipped');
    }

    function updateCardView() {
      const wrapper = document.getElementById('flashcardWrapper');
      wrapper.classList.remove('flipped');

      if (currentData.length === 0) {
        document.getElementById('fcQuestion').textContent = '無卡片資料';
        document.getElementById('fcAnswer').textContent = '無卡片資料';
        document.getElementById('fcCardNumber').textContent = '0 / 0';
        document.getElementById('fcCardNumberBack').textContent = '0 / 0';
        return;
      }

      if (cardIndex < 0) cardIndex = 0;
      if (cardIndex >= currentData.length) cardIndex = currentData.length - 1;

      const item = currentData[cardIndex];
      const isMastered = masteredSet.has(item.id);

      document.getElementById('fcQuestion').textContent = item.question;
      document.getElementById('fcAnswer').textContent = item.answer;

      const cardNumText = `卡片 ${cardIndex + 1} / ${currentData.length} (#${item.id})`;
      document.getElementById('fcCardNumber').textContent = cardNumText;
      document.getElementById('fcCardNumberBack').textContent = cardNumText;

      const btn1 = document.getElementById('fcMasterBtn');
      const btn2 = document.getElementById('fcMasterBtnBack');
      btn1.classList.toggle('is-mastered', isMastered);
      btn2.classList.toggle('is-mastered', isMastered);

      renderMath();
    }

    function prevCard() {
      if (currentData.length === 0) return;
      cardIndex = (cardIndex - 1 + currentData.length) % currentData.length;
      updateCardView();
    }

    function nextCard() {
      if (currentData.length === 0) return;
      cardIndex = (cardIndex + 1) % currentData.length;
      updateCardView();
    }

    function toggleCardMaster(event) {
      event.stopPropagation();
      if (currentData.length === 0) return;
      const item = currentData[cardIndex];
      toggleMaster(event, item.id);
      updateCardView();
    }

    /* Keyboard Shortcuts */
    window.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT') return;
      if (currentMode === 'card') {
        if (e.code === 'Space') {
          e.preventDefault();
          flipCard();
        } else if (e.code === 'ArrowLeft') {
          e.preventDefault();
          prevCard();
        } else if (e.code === 'ArrowRight') {
          e.preventDefault();
          nextCard();
        } else if (e.code === 'KeyM') {
          e.preventDefault();
          toggleCardMaster(e);
        }
      }
    });

    // Init
    window.addEventListener('DOMContentLoaded', () => {
      updateStats();
      renderList();
      setTimeout(renderMath, 200);
    });
  </script>
</body>
</html>
