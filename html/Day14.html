<!DOCTYPE html>
<html lang="zh-TW" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Day14 - 問答複習卡</title>
  <!-- KaTeX for LaTeX rendering -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
  <style>
    :root {
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --primary-light: #eff6ff;
      --border-color: #e2e8f0;
      --success: #10b981;
      --success-light: #ecfdf5;
      --accent: #f59e0b;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
      --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.08), 0 2px 4px -2px rgba(0,0,0,0.05);
      --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.1), 0 4px 6px -4px rgba(0,0,0,0.05);
      --radius: 12px;
    }

    html[data-theme="dark"] {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #60a5fa;
      --primary-hover: #3b82f6;
      --primary-light: #1e3a8a33;
      --border-color: #334155;
      --success: #34d399;
      --success-light: #064e3b33;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans TC", sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      line-height: 1.6;
      padding-bottom: 60px;
    }

    /* Navigation / Header */
    header {
      background: var(--card-bg);
      border-bottom: 1px solid var(--border-color);
      position: sticky;
      top: 0;
      z-index: 50;
      box-shadow: var(--shadow-sm);
    }

    .header-container {
      max-width: 900px;
      margin: 0 auto;
      padding: 14px 20px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .nav-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 8px;
      background: var(--primary-light);
      color: var(--primary);
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      transition: all 0.2s;
    }

    .back-btn:hover {
      background: var(--primary);
      color: #fff;
    }

    .page-title {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .view-toggles {
      display: flex;
      background: var(--bg-color);
      padding: 3px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
    }

    .header-actions {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: flex-end;
    }

    .toggle-btn {
      padding: 6px 14px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .toggle-btn.active {
      background: var(--card-bg);
      color: var(--primary);
      box-shadow: var(--shadow-sm);
    }

    .theme-toggle {
      padding: 7px 12px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      background: var(--card-bg);
      color: var(--text-main);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: var(--shadow-sm);
      transition: border-color 0.2s, color 0.2s, background 0.2s;
    }

    .theme-toggle:hover {
      border-color: var(--primary);
      color: var(--primary);
    }

    /* Main Container */
    main {
      max-width: 900px;
      margin: 24px auto;
      padding: 0 20px;
    }

    /* Toolbar */
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 20px;
      align-items: center;
      justify-content: space-between;
    }

    .search-box {
      flex: 1;
      min-width: 240px;
      position: relative;
    }

    .search-box input {
      width: 100%;
      padding: 10px 14px 10px 38px;
      border-radius: 10px;
      border: 1px solid var(--border-color);
      background: var(--card-bg);
      color: var(--text-main);
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-box input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-light);
    }

    .search-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 14px;
    }

    .action-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background: var(--card-bg);
      color: var(--text-main);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn:hover {
      background: var(--border-color);
    }

    .btn.active-filter {
      background: var(--primary-light);
      border-color: var(--primary);
      color: var(--primary);
    }

    /* Stats bar */
    .stats-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      font-size: 14px;
      color: var(--text-muted);
    }

    .progress-bar-container {
      flex: 1;
      height: 8px;
      background: var(--border-color);
      border-radius: 99px;
      margin: 0 16px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: var(--success);
      width: 0%;
      transition: width 0.3s ease;
    }

    /* List View Cards */
    .qa-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .qa-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      box-shadow: var(--shadow-sm);
      overflow: hidden;
      transition: box-shadow 0.2s, border-color 0.2s;
    }

    .qa-card:hover {
      box-shadow: var(--shadow-md);
      border-color: #cbd5e1;
    }

    .qa-card.mastered {
      border-left: 4px solid var(--success);
    }

    .qa-header {
      padding: 16px 20px;
      display: flex;
      align-items: flex-start;
      gap: 12px;
      cursor: pointer;
      user-select: none;
    }

    .qa-id {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 28px;
      height: 28px;
      background: var(--primary-light);
      color: var(--primary);
      border-radius: 6px;
      font-size: 13px;
      font-weight: 700;
      margin-top: 2px;
      flex-shrink: 0;
    }

    .qa-question {
      flex: 1;
      font-size: 15px;
      font-weight: 600;
      color: var(--text-main);
      padding-top: 2px;
    }

    .qa-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .master-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 18px;
      padding: 4px;
      border-radius: 6px;
      transition: transform 0.15s, color 0.15s;
    }

    .master-btn:hover {
      transform: scale(1.15);
    }

    .master-btn.is-mastered {
      color: var(--accent);
    }

    .expand-icon {
      color: var(--text-muted);
      font-size: 14px;
      transition: transform 0.2s ease;
    }

    .qa-card.open .expand-icon {
      transform: rotate(180deg);
    }

    .qa-answer {
      display: none;
      padding: 16px 20px 18px 60px;
      background: var(--bg-color);
      border-top: 1px dashed var(--border-color);
      font-size: 15px;
      color: var(--text-main);
      line-height: 1.7;
    }

    .qa-card.open .qa-answer {
      display: block;
      animation: fadeIn 0.2s ease-in;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Flashcard Mode */
    .flashcard-container {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      padding: 10px 0;
    }

    .flashcard-wrapper {
      perspective: 1000px;
      width: 100%;
      max-width: 640px;
      min-height: 340px;
      cursor: pointer;
    }

    .flashcard-inner {
      position: relative;
      width: 100%;
      height: 100%;
      min-height: 340px;
      text-align: center;
      transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
      transform-style: preserve-3d;
      border-radius: 16px;
      box-shadow: var(--shadow-lg);
    }

    .flashcard-wrapper.flipped .flashcard-inner {
      transform: rotateY(180deg);
    }

    .flashcard-face {
      position: absolute;
      width: 100%;
      height: 100%;
      min-height: 340px;
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 30px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      box-sizing: border-box;
    }

    .flashcard-back {
      transform: rotateY(180deg);
      background: var(--card-bg);
      border: 2px solid var(--primary);
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      color: var(--text-muted);
    }

    .card-badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 99px;
      font-weight: 600;
      font-size: 12px;
    }

    .badge-q {
      background: var(--primary-light);
      color: var(--primary);
    }

    .badge-a {
      background: var(--success-light);
      color: var(--success);
    }

    .card-body {
      margin: auto 0;
      padding: 20px 10px;
      font-size: 18px;
      font-weight: 600;
      line-height: 1.6;
    }

    .card-hint {
      font-size: 12px;
      color: var(--text-muted);
    }

    .flashcard-controls {
      display: flex;
      gap: 12px;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 640px;
    }

    .flashcard-controls .btn {
      padding: 10px 20px;
      font-size: 14px;
      font-weight: 600;
    }

    .btn-primary {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    .btn-primary:hover {
      background: var(--primary-hover);
    }

    .shortcuts-hint {
      font-size: 12px;
      color: var(--text-muted);
      text-align: center;
      margin-top: 8px;
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
      background: var(--card-bg);
      border-radius: var(--radius);
      border: 1px dashed var(--border-color);
    }
  </style>
</head>
<body>
  <header>
    <div class="header-container">
      <div class="nav-left">
        <a href="index.html" class="back-btn" title="回目錄">← 目錄</a>
        <h1 class="page-title">Day14 問答卡</h1>
      </div>
      <div class="header-actions">
        <button class="theme-toggle" id="themeToggleBtn" type="button" onclick="toggleTheme()" aria-label="切換為深色模式">深色模式</button>
        <div class="view-toggles">
          <button id="listViewBtn" class="toggle-btn active" onclick="switchMode('list')">📋 列表模式</button>
          <button id="cardViewBtn" class="toggle-btn" onclick="switchMode('card')">🎴 翻卡測驗</button>
        </div>
      </div>
    </div>
  </header>

  <main>
    <div class="toolbar">
      <div class="search-box">
        <span class="search-icon">🔍</span>
        <input type="text" id="searchInput" placeholder="搜尋問題或答案關鍵字..." oninput="handleSearch()">
      </div>
      <div class="action-buttons">
        <button class="btn" id="filterMasteredBtn" onclick="toggleFilterMastered()">⭐ 只看未掌握</button>
        <button class="btn" id="expandAllBtn" onclick="toggleExpandAll()">展開全部</button>
        <button class="btn" onclick="shuffleCards()">🔀 隨機洗牌</button>
        <button class="btn" onclick="resetOrder()">🔄 恢復順序</button>
      </div>
    </div>

    <div class="stats-bar">
      <span id="statsCount">總計 0 題</span>
      <div class="progress-bar-container">
        <div id="progressFill" class="progress-fill"></div>
      </div>
      <span id="statsMastered">掌握率 0%</span>
    </div>

    <!-- List View -->
    <div id="qaList" class="qa-list"></div>

    <!-- Flashcard Mode View -->
    <div id="flashcardContainer" class="flashcard-container">
      <div class="flashcard-wrapper" id="flashcardWrapper" onclick="flipCard()">
        <div class="flashcard-inner">
          <!-- Front Face -->
          <div class="flashcard-face flashcard-front">
            <div class="card-top">
              <span class="card-badge badge-q">問題</span>
              <span id="fcCardNumber">卡片 1 / 1</span>
              <button class="master-btn" id="fcMasterBtn" onclick="toggleCardMaster(event)" title="標記為已掌握">★</button>
            </div>
            <div class="card-body" id="fcQuestion">載入中...</div>
            <div class="card-hint">💡 點擊卡片或按空白鍵翻面看答案</div>
          </div>
          <!-- Back Face -->
          <div class="flashcard-face flashcard-back">
            <div class="card-top">
              <span class="card-badge badge-a">解答</span>
              <span id="fcCardNumberBack">卡片 1 / 1</span>
              <button class="master-btn" id="fcMasterBtnBack" onclick="toggleCardMaster(event)" title="標記為已掌握">★</button>
            </div>
            <div class="card-body" id="fcAnswer">載入中...</div>
            <div class="card-hint">💡 再次點擊卡片翻回正面</div>
          </div>
        </div>
      </div>

      <div class="flashcard-controls">
        <button class="btn" onclick="prevCard()">← 上一題</button>
        <button class="btn btn-primary" onclick="flipCard()">翻轉卡片</button>
        <button class="btn" onclick="nextCard()">下一題 →</button>
      </div>
      <div class="shortcuts-hint">鍵盤快速鍵：[←] 上一題 · [空白鍵] 翻面 · [→] 下一題 · [M] 標記掌握</div>
    </div>
  </main>

  <script>
    const THEME_STORAGE_KEY = "qa_theme";
    const STORAGE_KEY = "anki_mastered_" + "Day14";
    const RAW_DATA = [{"id":1,"question":"在台灣，根據 Basel II 的哪一個支柱（Pillar），金管會（FSC）要求本國銀行至少每年進行一次壓力測試？","answer":"第二支柱（Pillar 2）。"},{"id":2,"question":"金管會（FSC）在 2010 年與 2011 年分別要求本國銀行針對哪兩類風險進行壓力測試？","answer":"市場風險（Market risk）與信用風險（Credit risk）。"},{"id":3,"question":"根據金管會公佈的壓力測試結果，本國銀行的平均資本適足率（CAR）需高於多少法定最低標準？","answer":"$8\\%$。"},{"id":4,"question":"台灣中央銀行（CBC）開發總體壓力測試模型的主要目的是什麼？","answer":"評估整個銀行體系對抗不利總體經濟與金融衝擊的韌性。"},{"id":5,"question":"中央銀行（CBC）在 2010 年建立的市場風險總體壓力測試模型中，使用了哪種分析方法來驗證壓力情境參數？","answer":"向量自我迴歸（Vector Autoregression, VAR）分析。"},{"id":6,"question":"中央銀行的市場風險總體壓力測試模型主要參考了哪位學者在 2007 年建立的範本？","answer":"Martin \\check{C}ih\\acute{a}k。"},{"id":7,"question":"中央銀行在 2011 年開發的信用風險壓力測試框架是採用哪種方式（Top-down 或 Bottom-up）進行？","answer":"由上而下（Top-down）方式。"},{"id":8,"question":"中央銀行信用風險模型中，用來分析銀行組合違約率與總體經濟變數相關性的模型是什麼？","answer":"總體計量經濟模型（Macroeconometric model）。"},{"id":9,"question":"在中央銀行的信用風險模型中，哪種模型被用來將外部總體經濟衝擊映射到銀行的資產負債表？","answer":"衛星模型（Satellite model）。"},{"id":10,"question":"中央銀行在估計信用風險違約率與總體經濟數值之間的關係時，應用了哪種迴歸方法？","answer":"看似無關迴歸（Seemingly Unrelated Regression, SUR）。"},{"id":11,"question":"中央銀行的信用風險壓力測試中，透過蒙地卡羅模擬法模擬了多少條未來一年的違約機率（PD）路徑？","answer":"10,000 條。"},{"id":12,"question":"根據 McKinsey 的研究，具備良好信用監控實踐的銀行能提前多久識別出有風險的客戶？","answer":"6 到 9 個月。"},{"id":13,"question":"根據 McKinsey 指出，改善監控效率可降低多少比例的貸款損失撥備（Loan-loss provisions）？","answer":"$10\\%$ 到 $20\\%$。"},{"id":14,"question":"良好信用監控實踐可使風險加權資產（RWA）和法定資本需求最多減少多少比例？","answer":"$10\\%$。"},{"id":15,"question":"信用監控中的「信用轉換係數」（CCF）指的是什麼？","answer":"客戶在違約前一年內，將先前未動用的信用額度動用的程度。"},{"id":16,"question":"早期預警系統（EWS）中，哪種指標代表「被系統標記且隨後轉入觀察名單的客戶比例」？","answer":"命中率（Hit ratio）。"},{"id":17,"question":"在設計早期預警系統時，必須在效率與完整性之間取得平衡，這涉及哪兩類錯誤的權衡？","answer":"Alpha 錯誤與 Beta 錯誤。"},{"id":18,"question":"McKinsey 建議的觀察名單（Watch-list）第一類別「暫時性困難」的應對目標是什麼？","answer":"確保更頻繁的客戶互動與更謹慎的授信決策。"},{"id":19,"question":"McKinsey 建議的觀察名單第二類別「結構性或策略性問題」的應對目標是什麼？","answer":"積極減少風險暴露（Risk exposures）。"},{"id":20,"question":"McKinsey 建議的觀察名單第三類別「信用能力嚴重受損」的應對目標是什麼？","answer":"促進退出或準備快速移交至重組或催收部門。"},{"id":21,"question":"在優化的信用監控流程中，哪一個單位應擁有對客戶分類與緩釋行動的最終決定權？","answer":"獨立的監控單位（Monitoring unit）。"},{"id":22,"question":"根據 McKinsey 指出，早期預警系統（EWS）實施成功的關鍵因素之一是哪三個部門間的協作？","answer":"監控部門、核貸部門（Underwriting）與業務部門。"},{"id":23,"question":"Kolmogorov-Arnold Networks (KAN) 與傳統 MLP 的核心差異在於？","answer":"KAN 將可學習的激發函數放在權重邊（Edges）上，而非節點上。"},{"id":24,"question":"在時間序列異常檢測中，「空白區間」（Blank interval）的定義是什麼？","answer":"輸入特徵視窗與觀察期（目標事件發生期）之間的時間間隔。"},{"id":25,"question":"何謂「時間外數據」（Out-of-time, OOT）測試集？","answer":"訓練數據與測試數據來自不同的年份。"},{"id":26,"question":"研究指出，GRU-KAN 模型在提前 8 個月預測貸款違約時，準確度可達多少以上？","answer":"$88\\%$。"},{"id":27,"question":"在貸款違約預測中，為什麼召回率（Recall）通常比精確率（Precision）更受重視？","answer":"為了確保能識別出大多數實際違約的貸款，以有效管理風險並減少損失。"},{"id":28,"question":"KAN 層使用哪種數學函數作為邊緣權重的參數化方法？","answer":"樣條函數（Spline function）。"},{"id":29,"question":"長短期記憶網絡（LSTM）相對於標準 RNN 的主要優勢在於解決什麼問題？","answer":"梯度消失（Vanishing gradient）問題。"},{"id":30,"question":"門控循環單元（GRU）相較於 LSTM 的主要結構特點是什麼？","answer":"參數較少、計算更高效，僅包含重置門與更新門。"},{"id":31,"question":"在 LSTM 結構中，哪一個「門」決定有多少新資訊被添加到記憶單元中？","answer":"輸入門（Input gate）。"},{"id":32,"question":"在 LSTM 結構中，哪一個「門」負責決定從記憶單元中過濾掉哪些舊資訊？","answer":"遺忘門（Forget gate）。"},{"id":33,"question":"在 KAN-based 模型中，批次歸一化（Batch Normalization）層的主要作用是什麼？","answer":"穩定訓練過程並提高模型的泛化能力。"},{"id":34,"question":"貸款違約預測中，$F1$ 分數的定義公式為何？","answer":"$F1 = 2 \\cdot \\frac{Precision \\cdot Recall}{Precision + Recall}$。"},{"id":35,"question":"AUC（曲線下面積）指標在分類模型中主要衡量什麼能力？","answer":"模型區分正負類別的能力。"},{"id":36,"question":"根據研究，LSTM-Transformer 模型在處理短時間序列數據時可能面臨什麼挑戰？","answer":"複雜度較高，可能增加計算負擔並削弱其序列建模能力。"},{"id":37,"question":"為了應對數據集中的類別不平衡（Class imbalance），研究通常採用哪種重採樣方法？","answer":"隨機欠採樣（Random undersampling）。"},{"id":38,"question":"在 KAN 網絡中，每一層的作用可以看作是將輸入進行什麼樣的轉換？","answer":"多層級的非線性特徵提取。"},{"id":39,"question":"「特徵視窗長度」（Feature window length）在模型訓練中代表什麼意義？","answer":"用於訓練模型的歷史數據月份數。"},{"id":40,"question":"研究中使用的 Freddie Mac 數據集中，定義違約（Default）的標準是什麼？","answer":"當目前貸款逾期狀態（CLDS）值達到 3 或以上。"},{"id":41,"question":"McKinsey 的研究顯示，領先銀行的 EWS 觸發通常比客戶實際違約提前幾個月？","answer":"平均 7 個月。"},{"id":42,"question":"在信用監控的評估階段，哪一個分析可區分出「彩票觸發器」（無效觸發器）與有效觸發器？","answer":"選擇性（Selectivity）分析。"},{"id":43,"question":"信用監控流程的三個主要階段依序為何？","answer":"分類（Classification）、緩釋（Mitigation）、控制（Control）。"},{"id":44,"question":"在緩釋（Mitigation）階段，誰負責提議風險緩釋措施與行動計劃？","answer":"業務部門（Business）。"},{"id":45,"question":"在監控流程中，核貸部門（Underwriting）在「緩釋」階段的角色為何？","answer":"支持業務部門提議措施並協助實施。"},{"id":46,"question":"若銀行沒有獨立的監控單位，通常由哪一個部門執行監控任務？","answer":"核貸部門（Underwriting）。"},{"id":47,"question":"何謂早期預警系統中的「選擇性」（Selectivity）指標？","answer":"某一觸發器在次級或非履行客戶中出現的頻率相對於履行客戶的比例。"},{"id":48,"question":"在建立 EWS 的特徵樣本時，數據應包含哪兩類貸款客戶？","answer":"問題客戶（Problematic）與完全履行的客戶（Fully performing）。"},{"id":49,"question":"在 KAN 應用中，如何應對 KAN 對局部異常過於敏感的問題？","answer":"結合傅立葉級數（Fourier series）來強調全域模式（Global patterns）。"},{"id":50,"question":"根據研究，當空白區間從 3 個月增加到 8 個月時，基礎 GRU 模型的效能會如何變化？","answer":"大幅下降，甚至幾乎失去預測能力。"},{"id":51,"question":"KAN-based 模型相對於傳統模型在長空白區間表現更佳的原因是？","answer":"能動態學習激發函數，有效提取與目標事件相關的非線性特徵。"},{"id":52,"question":"中央銀行壓力測試模型中提到的 SUR 方法，其全名為何？","answer":"看似無關迴歸（Seemingly Unrelated Regression）。"},{"id":53,"question":"台灣壓力測試中，用於分析違約率與總體變數相關性的變數包括哪些？（舉三例）","answer":"台灣實質 GDP、全球出口、失業率（或利率、房價）。"},{"id":54,"question":"McKinsey 指出，如果緩釋行動未達預期結果，監控系統應包含什麼機制？","answer":"潛在的升級（Escalations）機制與額外措施。"},{"id":55,"question":"在信用監控系統中，由誰負責控制緩釋行動的及時執行與結果？","answer":"監控單位（Monitoring unit）。"},{"id":56,"question":"在 KAN 模型中，用於防止過擬合（Overfitting）的層是什麼？","answer":"丟棄層（Dropout layer）。"},{"id":57,"question":"在處理逾期數據時，將類別變數（如援助狀態碼）轉化為模型可處理格式的方法是？","answer":"獨熱編碼（One-Hot encoding）。"},{"id":58,"question":"研究中，為減少長週期趨勢影響並強調短期波動，對未償本金餘額（UPB）採取了什麼處理？","answer":"一階差分（First-order differencing）。"},{"id":59,"question":"根據 McKinsey 報告，銀行在違約前增加對客戶的風險暴露（Exposure）通常反映了什麼？","answer":"缺乏有效的早期預警系統與緩釋機制。"},{"id":60,"question":"中央銀行市場風險測試模型所考量的三種市場衝擊變數為何？","answer":"匯率、利率與股價的不利變動。"},{"id":61,"question":"何謂早期預警指標中的「軟事實」（Soft facts）？","answer":"如期中報表數值、企業主個人問題或應收帳款品質惡化等專家知識。"},{"id":62,"question":"在優化 EWS 的過程中，多元迴歸分析的主要目的是什麼？","answer":"排除冗餘（Redundant）的早期預警觸發器。"},{"id":63,"question":"在觀察名單管理中，對於強制性緩釋行動（Mandatory actions）的偏差需經過誰的批准？","answer":"相關權責主管（Explicit approval from a relevant authority）。"},{"id":64,"question":"研究中使用的 Freddie Mac 數據集，其主要涉及哪類貸款？","answer":"單一家庭貸款（Single-Family Loan）。"},{"id":65,"question":"在 KAN-AD 應用中，哪種數學轉換被用來減少局部峰值對 KAN 的影響？","answer":"傅立葉級數（Fourier series）。"},{"id":66,"question":"在銀行業，LGD 是什麼指標的縮寫？","answer":"違約損失率（Loss Given Default）。"},{"id":67,"question":"在銀行業，EAD 是什麼指標的縮寫？","answer":"違約風險暴露額（Exposure at Default）。"},{"id":68,"question":"McKinsey 提到，對 endangered sectors（受威脅產業）降低暴露屬於哪種層級的監控？","answer":"組合層級（Portfolio level）監控。"},{"id":69,"question":"在信用監控系統中，IT 系統應具備追蹤什麼項目的能力？","answer":"觀察名單客戶淨暴露額（Net exposure）的遞減情況。"},{"id":70,"question":"根據研究結果，LSTM 與 GRU 模型在捕捉「長距離依賴」能力上，誰通常表現較佳？","answer":"LSTM。"},{"id":71,"question":"在 KAN 網絡層結構中，輸出層通常使用哪種激發函數將數值轉換為違約機率？","answer":"Sigmoid 函數。"},{"id":72,"question":"McKinsey 提到的「Vicious circle」（惡性循環）是指 deleveraging（去槓桿）導致了什麼後果？","answer":"信貸供應萎縮，進一步惡化客戶的信用狀況。"},{"id":73,"question":"在進行 OOT 實驗時，2019 年數據作為訓練集，2020 年數據作為測試集，這是為了模擬什麼？","answer":"使用過去數據預測未來事件的真實情境。"},{"id":74,"question":"在中央銀行壓力測試框架中，計量模型預測的期間通常是多久？","answer":"未來一年（One-year-ahead）。"},{"id":75,"question":"KAN 層中，將多變量函數分解為單變量函數的組合，其理論基礎是？","answer":"Kolmogorov-Arnold 表示定理。"}];
    let currentData = [...RAW_DATA];
    let masteredSet = new Set(JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]"));
    let currentMode = 'list';
    let filterOnlyUnmastered = false;
    let isAllExpanded = false;
    let cardIndex = 0;

    function applyTheme(theme) {
      const normalizedTheme = theme === "dark" ? "dark" : "light";
      document.documentElement.dataset.theme = normalizedTheme;

      const btn = document.getElementById("themeToggleBtn");
      if (btn) {
        const isDark = normalizedTheme === "dark";
        btn.textContent = isDark ? "淺色模式" : "深色模式";
        btn.setAttribute("aria-label", isDark ? "切換為淺色模式" : "切換為深色模式");
      }
    }

    function initializeTheme() {
      const savedTheme = localStorage.getItem(THEME_STORAGE_KEY) || "light";
      applyTheme(savedTheme);
    }

    function toggleTheme() {
      const nextTheme = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
      localStorage.setItem(THEME_STORAGE_KEY, nextTheme);
      applyTheme(nextTheme);
    }

    initializeTheme();

    function saveMastered() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(Array.from(masteredSet)));
      updateStats();
    }

    function updateStats() {
      const total = RAW_DATA.length;
      const masteredCount = RAW_DATA.filter(item => masteredSet.has(item.id)).length;
      const pct = total === 0 ? 0 : Math.round((masteredCount / total) * 100);

      document.getElementById('statsCount').textContent = `顯示 ${currentData.length} / 共 ${total} 題`;
      document.getElementById('statsMastered').textContent = `已掌握 ${masteredCount} 題 (${pct}%)`;
      document.getElementById('progressFill').style.width = pct + '%';
    }

    function renderMath() {
      if (window.renderMathInElement) {
        renderMathInElement(document.body, {
          delimiters: [
            {left: '$$', right: '$$', display: true},
            {left: '$', right: '$', display: false}
          ],
          throwOnError: false
        });
      }
    }

    function renderList() {
      const container = document.getElementById('qaList');
      if (currentData.length === 0) {
        container.innerHTML = '<div class="empty-state">沒有符合條件的問答卡片</div>';
        return;
      }

      container.innerHTML = currentData.map(item => {
        const isMastered = masteredSet.has(item.id);
        return `
          <div class="qa-card ${isMastered ? 'mastered' : ''} ${isAllExpanded ? 'open' : ''}" id="card-${item.id}">
            <div class="qa-header" onclick="toggleItem(${item.id})">
              <span class="qa-id">#${item.id}</span>
              <span class="qa-question">${escapeHtml(item.question)}</span>
              <div class="qa-actions">
                <button class="master-btn ${isMastered ? 'is-mastered' : ''}"
                        onclick="toggleMaster(event, ${item.id})"
                        title="${isMastered ? '已掌握' : '標記掌握'}">★</button>
                <span class="expand-icon">▼</span>
              </div>
            </div>
            <div class="qa-answer">${escapeHtml(item.answer)}</div>
          </div>
        `;
      }).join('');

      renderMath();
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    function toggleItem(id) {
      const el = document.getElementById('card-' + id);
      if (el) {
        el.classList.toggle('open');
      }
    }

    function toggleMaster(event, id) {
      event.stopPropagation();
      if (masteredSet.has(id)) {
        masteredSet.delete(id);
      } else {
        masteredSet.add(id);
      }
      saveMastered();
      applyFilters();
    }

    function toggleExpandAll() {
      isAllExpanded = !isAllExpanded;
      document.getElementById('expandAllBtn').textContent = isAllExpanded ? "收合全部" : "展開全部";
      document.querySelectorAll('.qa-card').forEach(card => {
        if (isAllExpanded) {
          card.classList.add('open');
        } else {
          card.classList.remove('open');
        }
      });
    }

    function toggleFilterMastered() {
      filterOnlyUnmastered = !filterOnlyUnmastered;
      const btn = document.getElementById('filterMasteredBtn');
      btn.classList.toggle('active-filter', filterOnlyUnmastered);
      btn.textContent = filterOnlyUnmastered ? "✓ 僅顯示未掌握" : "⭐ 只看未掌握";
      applyFilters();
    }

    function handleSearch() {
      applyFilters();
    }

    function applyFilters() {
      const query = document.getElementById('searchInput').value.trim().toLowerCase();
      currentData = RAW_DATA.filter(item => {
        if (filterOnlyUnmastered && masteredSet.has(item.id)) {
          return false;
        }
        if (query) {
          const matchQ = item.question.toLowerCase().includes(query);
          const matchA = item.answer.toLowerCase().includes(query);
          return matchQ || matchA;
        }
        return true;
      });

      cardIndex = 0;
      if (currentMode === 'list') {
        renderList();
      } else {
        updateCardView();
      }
      updateStats();
    }

    function shuffleCards() {
      currentData.sort(() => Math.random() - 0.5);
      cardIndex = 0;
      if (currentMode === 'list') {
        renderList();
      } else {
        updateCardView();
      }
    }

    function resetOrder() {
      currentData.sort((a, b) => a.id - b.id);
      cardIndex = 0;
      if (currentMode === 'list') {
        renderList();
      } else {
        updateCardView();
      }
    }

    function switchMode(mode) {
      currentMode = mode;
      const listBtn = document.getElementById('listViewBtn');
      const cardBtn = document.getElementById('cardViewBtn');
      const qaList = document.getElementById('qaList');
      const flashcardContainer = document.getElementById('flashcardContainer');
      const expandAllBtn = document.getElementById('expandAllBtn');

      if (mode === 'list') {
        listBtn.classList.add('active');
        cardBtn.classList.remove('active');
        qaList.style.display = 'flex';
        flashcardContainer.style.display = 'none';
        expandAllBtn.style.display = 'inline-flex';
        renderList();
      } else {
        cardBtn.classList.add('active');
        listBtn.classList.remove('active');
        qaList.style.display = 'none';
        flashcardContainer.style.display = 'flex';
        expandAllBtn.style.display = 'none';
        updateCardView();
      }
    }

    /* Flashcard Functions */
    function flipCard() {
      const wrapper = document.getElementById('flashcardWrapper');
      wrapper.classList.toggle('flipped');
    }

    function updateCardView() {
      const wrapper = document.getElementById('flashcardWrapper');
      wrapper.classList.remove('flipped');

      if (currentData.length === 0) {
        document.getElementById('fcQuestion').textContent = '無卡片資料';
        document.getElementById('fcAnswer').textContent = '無卡片資料';
        document.getElementById('fcCardNumber').textContent = '0 / 0';
        document.getElementById('fcCardNumberBack').textContent = '0 / 0';
        return;
      }

      if (cardIndex < 0) cardIndex = 0;
      if (cardIndex >= currentData.length) cardIndex = currentData.length - 1;

      const item = currentData[cardIndex];
      const isMastered = masteredSet.has(item.id);

      document.getElementById('fcQuestion').textContent = item.question;
      document.getElementById('fcAnswer').textContent = item.answer;

      const cardNumText = `卡片 ${cardIndex + 1} / ${currentData.length} (#${item.id})`;
      document.getElementById('fcCardNumber').textContent = cardNumText;
      document.getElementById('fcCardNumberBack').textContent = cardNumText;

      const btn1 = document.getElementById('fcMasterBtn');
      const btn2 = document.getElementById('fcMasterBtnBack');
      btn1.classList.toggle('is-mastered', isMastered);
      btn2.classList.toggle('is-mastered', isMastered);

      renderMath();
    }

    function prevCard() {
      if (currentData.length === 0) return;
      cardIndex = (cardIndex - 1 + currentData.length) % currentData.length;
      updateCardView();
    }

    function nextCard() {
      if (currentData.length === 0) return;
      cardIndex = (cardIndex + 1) % currentData.length;
      updateCardView();
    }

    function toggleCardMaster(event) {
      event.stopPropagation();
      if (currentData.length === 0) return;
      const item = currentData[cardIndex];
      toggleMaster(event, item.id);
      updateCardView();
    }

    /* Keyboard Shortcuts */
    window.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT') return;
      if (currentMode === 'card') {
        if (e.code === 'Space') {
          e.preventDefault();
          flipCard();
        } else if (e.code === 'ArrowLeft') {
          e.preventDefault();
          prevCard();
        } else if (e.code === 'ArrowRight') {
          e.preventDefault();
          nextCard();
        } else if (e.code === 'KeyM') {
          e.preventDefault();
          toggleCardMaster(e);
        }
      }
    });

    // Init
    window.addEventListener('DOMContentLoaded', () => {
      updateStats();
      renderList();
      setTimeout(renderMath, 200);
    });
  </script>
</body>
</html>
