<!DOCTYPE html>
<html lang="zh-TW" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Day12 - 問答複習卡</title>
  <!-- KaTeX for LaTeX rendering -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
  <style>
    :root {
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --primary-light: #eff6ff;
      --border-color: #e2e8f0;
      --success: #10b981;
      --success-light: #ecfdf5;
      --accent: #f59e0b;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
      --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.08), 0 2px 4px -2px rgba(0,0,0,0.05);
      --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.1), 0 4px 6px -4px rgba(0,0,0,0.05);
      --radius: 12px;
    }

    html[data-theme="dark"] {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #60a5fa;
      --primary-hover: #3b82f6;
      --primary-light: #1e3a8a33;
      --border-color: #334155;
      --success: #34d399;
      --success-light: #064e3b33;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans TC", sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      line-height: 1.6;
      padding-bottom: 60px;
    }

    /* Navigation / Header */
    header {
      background: var(--card-bg);
      border-bottom: 1px solid var(--border-color);
      position: sticky;
      top: 0;
      z-index: 50;
      box-shadow: var(--shadow-sm);
    }

    .header-container {
      max-width: 900px;
      margin: 0 auto;
      padding: 14px 20px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .nav-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 8px;
      background: var(--primary-light);
      color: var(--primary);
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      transition: all 0.2s;
    }

    .back-btn:hover {
      background: var(--primary);
      color: #fff;
    }

    .page-title {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .view-toggles {
      display: flex;
      background: var(--bg-color);
      padding: 3px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
    }

    .header-actions {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: flex-end;
    }

    .toggle-btn {
      padding: 6px 14px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .toggle-btn.active {
      background: var(--card-bg);
      color: var(--primary);
      box-shadow: var(--shadow-sm);
    }

    .theme-toggle {
      padding: 7px 12px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      background: var(--card-bg);
      color: var(--text-main);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: var(--shadow-sm);
      transition: border-color 0.2s, color 0.2s, background 0.2s;
    }

    .theme-toggle:hover {
      border-color: var(--primary);
      color: var(--primary);
    }

    /* Main Container */
    main {
      max-width: 900px;
      margin: 24px auto;
      padding: 0 20px;
    }

    /* Toolbar */
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 20px;
      align-items: center;
      justify-content: space-between;
    }

    .search-box {
      flex: 1;
      min-width: 240px;
      position: relative;
    }

    .search-box input {
      width: 100%;
      padding: 10px 14px 10px 38px;
      border-radius: 10px;
      border: 1px solid var(--border-color);
      background: var(--card-bg);
      color: var(--text-main);
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-box input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-light);
    }

    .search-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 14px;
    }

    .action-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background: var(--card-bg);
      color: var(--text-main);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn:hover {
      background: var(--border-color);
    }

    .btn.active-filter {
      background: var(--primary-light);
      border-color: var(--primary);
      color: var(--primary);
    }

    /* Stats bar */
    .stats-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      font-size: 14px;
      color: var(--text-muted);
    }

    .progress-bar-container {
      flex: 1;
      height: 8px;
      background: var(--border-color);
      border-radius: 99px;
      margin: 0 16px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: var(--success);
      width: 0%;
      transition: width 0.3s ease;
    }

    /* List View Cards */
    .qa-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .qa-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      box-shadow: var(--shadow-sm);
      overflow: hidden;
      transition: box-shadow 0.2s, border-color 0.2s;
    }

    .qa-card:hover {
      box-shadow: var(--shadow-md);
      border-color: #cbd5e1;
    }

    .qa-card.mastered {
      border-left: 4px solid var(--success);
    }

    .qa-header {
      padding: 16px 20px;
      display: flex;
      align-items: flex-start;
      gap: 12px;
      cursor: pointer;
      user-select: none;
    }

    .qa-id {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 28px;
      height: 28px;
      background: var(--primary-light);
      color: var(--primary);
      border-radius: 6px;
      font-size: 13px;
      font-weight: 700;
      margin-top: 2px;
      flex-shrink: 0;
    }

    .qa-question {
      flex: 1;
      font-size: 15px;
      font-weight: 600;
      color: var(--text-main);
      padding-top: 2px;
    }

    .qa-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .master-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 18px;
      padding: 4px;
      border-radius: 6px;
      transition: transform 0.15s, color 0.15s;
    }

    .master-btn:hover {
      transform: scale(1.15);
    }

    .master-btn.is-mastered {
      color: var(--accent);
    }

    .expand-icon {
      color: var(--text-muted);
      font-size: 14px;
      transition: transform 0.2s ease;
    }

    .qa-card.open .expand-icon {
      transform: rotate(180deg);
    }

    .qa-answer {
      display: none;
      padding: 16px 20px 18px 60px;
      background: var(--bg-color);
      border-top: 1px dashed var(--border-color);
      font-size: 15px;
      color: var(--text-main);
      line-height: 1.7;
    }

    .qa-card.open .qa-answer {
      display: block;
      animation: fadeIn 0.2s ease-in;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Flashcard Mode */
    .flashcard-container {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      padding: 10px 0;
    }

    .flashcard-wrapper {
      perspective: 1000px;
      width: 100%;
      max-width: 640px;
      min-height: 340px;
      cursor: pointer;
    }

    .flashcard-inner {
      position: relative;
      width: 100%;
      height: 100%;
      min-height: 340px;
      text-align: center;
      transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
      transform-style: preserve-3d;
      border-radius: 16px;
      box-shadow: var(--shadow-lg);
    }

    .flashcard-wrapper.flipped .flashcard-inner {
      transform: rotateY(180deg);
    }

    .flashcard-face {
      position: absolute;
      width: 100%;
      height: 100%;
      min-height: 340px;
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 30px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      box-sizing: border-box;
    }

    .flashcard-back {
      transform: rotateY(180deg);
      background: var(--card-bg);
      border: 2px solid var(--primary);
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      color: var(--text-muted);
    }

    .card-badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 99px;
      font-weight: 600;
      font-size: 12px;
    }

    .badge-q {
      background: var(--primary-light);
      color: var(--primary);
    }

    .badge-a {
      background: var(--success-light);
      color: var(--success);
    }

    .card-body {
      margin: auto 0;
      padding: 20px 10px;
      font-size: 18px;
      font-weight: 600;
      line-height: 1.6;
    }

    .card-hint {
      font-size: 12px;
      color: var(--text-muted);
    }

    .flashcard-controls {
      display: flex;
      gap: 12px;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 640px;
    }

    .flashcard-controls .btn {
      padding: 10px 20px;
      font-size: 14px;
      font-weight: 600;
    }

    .btn-primary {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    .btn-primary:hover {
      background: var(--primary-hover);
    }

    .shortcuts-hint {
      font-size: 12px;
      color: var(--text-muted);
      text-align: center;
      margin-top: 8px;
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
      background: var(--card-bg);
      border-radius: var(--radius);
      border: 1px dashed var(--border-color);
    }
  </style>
</head>
<body>
  <header>
    <div class="header-container">
      <div class="nav-left">
        <a href="index.html" class="back-btn" title="回目錄">← 目錄</a>
        <h1 class="page-title">Day12 問答卡</h1>
      </div>
      <div class="header-actions">
        <button class="theme-toggle" id="themeToggleBtn" type="button" onclick="toggleTheme()" aria-label="切換為深色模式">深色模式</button>
        <div class="view-toggles">
          <button id="listViewBtn" class="toggle-btn active" onclick="switchMode('list')">📋 列表模式</button>
          <button id="cardViewBtn" class="toggle-btn" onclick="switchMode('card')">🎴 翻卡測驗</button>
        </div>
      </div>
    </div>
  </header>

  <main>
    <div class="toolbar">
      <div class="search-box">
        <span class="search-icon">🔍</span>
        <input type="text" id="searchInput" placeholder="搜尋問題或答案關鍵字..." oninput="handleSearch()">
      </div>
      <div class="action-buttons">
        <button class="btn" id="filterMasteredBtn" onclick="toggleFilterMastered()">⭐ 只看未掌握</button>
        <button class="btn" id="expandAllBtn" onclick="toggleExpandAll()">展開全部</button>
        <button class="btn" onclick="shuffleCards()">🔀 隨機洗牌</button>
        <button class="btn" onclick="resetOrder()">🔄 恢復順序</button>
      </div>
    </div>

    <div class="stats-bar">
      <span id="statsCount">總計 0 題</span>
      <div class="progress-bar-container">
        <div id="progressFill" class="progress-fill"></div>
      </div>
      <span id="statsMastered">掌握率 0%</span>
    </div>

    <!-- List View -->
    <div id="qaList" class="qa-list"></div>

    <!-- Flashcard Mode View -->
    <div id="flashcardContainer" class="flashcard-container">
      <div class="flashcard-wrapper" id="flashcardWrapper" onclick="flipCard()">
        <div class="flashcard-inner">
          <!-- Front Face -->
          <div class="flashcard-face flashcard-front">
            <div class="card-top">
              <span class="card-badge badge-q">問題</span>
              <span id="fcCardNumber">卡片 1 / 1</span>
              <button class="master-btn" id="fcMasterBtn" onclick="toggleCardMaster(event)" title="標記為已掌握">★</button>
            </div>
            <div class="card-body" id="fcQuestion">載入中...</div>
            <div class="card-hint">💡 點擊卡片或按空白鍵翻面看答案</div>
          </div>
          <!-- Back Face -->
          <div class="flashcard-face flashcard-back">
            <div class="card-top">
              <span class="card-badge badge-a">解答</span>
              <span id="fcCardNumberBack">卡片 1 / 1</span>
              <button class="master-btn" id="fcMasterBtnBack" onclick="toggleCardMaster(event)" title="標記為已掌握">★</button>
            </div>
            <div class="card-body" id="fcAnswer">載入中...</div>
            <div class="card-hint">💡 再次點擊卡片翻回正面</div>
          </div>
        </div>
      </div>

      <div class="flashcard-controls">
        <button class="btn" onclick="prevCard()">← 上一題</button>
        <button class="btn btn-primary" onclick="flipCard()">翻轉卡片</button>
        <button class="btn" onclick="nextCard()">下一題 →</button>
      </div>
      <div class="shortcuts-hint">鍵盤快速鍵：[←] 上一題 · [空白鍵] 翻面 · [→] 下一題 · [M] 標記掌握</div>
    </div>
  </main>

  <script>
    const THEME_STORAGE_KEY = "qa_theme";
    const STORAGE_KEY = "anki_mastered_" + "Day12";
    const RAW_DATA = [{"id":1,"question":"根據英格蘭銀行 (2022) 的調查，英國金融機構在業務中使用機器學習的比例超過了 _____。","answer":"$70\\%$"},{"id":2,"question":"在信用風險管理領域，金融機構主要將機器學習應用於哪兩類模型？","answer":"信用評分模型 (credit scoring models) 與違約模型 (default models)。"},{"id":3,"question":"傳統上用於建立借款人違約率或信用評等模型的參數模型是什麼？","answer":"邏輯迴歸 (logit regression)。"},{"id":4,"question":"相較於傳統邏輯迴歸，機器學習在違約率預測上的主要優勢為何？","answer":"能夠捕捉更複雜的非線性關係。"},{"id":5,"question":"信用評等分類模型 (credit rating classification model) 的定義為何？","answer":"一種根據財務指標和總體經濟變數來預測企業信用評等的框架。"},{"id":6,"question":"歐洲銀行管理局 (EBA, 2021) 對機器學習應用提出的主要批評為何？","answer":"模型過於複雜且可解釋性低。"},{"id":7,"question":"「XAI」是哪一個術語的縮寫？","answer":"可解釋人工智慧 (eXplainable AI)。"},{"id":8,"question":"本研究比較預測準確度的兩類模型分別為何？","answer":"機器學習模型與序位邏輯迴歸 (ordinal logit regression)。"},{"id":9,"question":"在機器學習領域中，SHAP 技術的主要功能為何？","answer":"衡量解釋變數對模型預測結果的貢獻度。"},{"id":10,"question":"在機器學習領域中，部分相依圖 (PDP) 的主要功能為何？","answer":"識別當解釋變數改變時，模型預測結果的變化趨勢。"},{"id":11,"question":"本研究使用的數據集包含了約幾家企業的信用評等與財務數據？","answer":"約 $6,000$ 家。"},{"id":12,"question":"本研究觀測期間從 1991 年第一季到哪一年哪一季？","answer":"2022 年第二季。"},{"id":13,"question":"本研究模型中使用的應變數 (dependent variable) 來源為何？","answer":"穆迪投資者服務公司 (Moody's Investors Service) 的長期發行人評等。"},{"id":14,"question":"在穆迪評等分類中，本研究將 A3 或以上的評等歸類為 _____。","answer":"A 或以上 (A or above)"},{"id":15,"question":"當數據集中某些評等類別的樣本數遠多於其他類別時，這種現象稱為 _____。","answer":"類別失衡 (class imbalance)"},{"id":16,"question":"本研究使用哪種技術來解決類別失衡問題？","answer":"合成少數過採樣技術 (SMOTE)。"},{"id":17,"question":"SMOTE 技術是由誰在 2002 年提出的？","answer":"Chawla 等人。"},{"id":18,"question":"本研究中「業務規模」類別使用的具體財務指標為何？","answer":"總營收 (Total Revenue，取對數)。"},{"id":19,"question":"「利息保障倍數 (ICR)」的計算公式為何？","answer":"$EBITDA / \\text{現金利息支出}$"},{"id":20,"question":"「淨債務股本比 (Net DER)」衡量的是企業的哪種能力？","answer":"償債能力 (Repayment capacity)。"},{"id":21,"question":"「EBITDA 利潤率」屬於哪一類財務指標？","answer":"獲利能力 (Profitability)。"},{"id":22,"question":"「總資產週轉率 (Total Assets Turnover)」的計算方式為何？","answer":"總營收除以總資產 ($Total Revenue / Total Assets$)。"},{"id":23,"question":"「財務槓桿 (Financial Leverage)」在本研究中使用的指標為何？","answer":"槓桿率 (Leverage，即有息負債除以總資產)。"},{"id":24,"question":"「流動比率 (Current Ratio)」衡量的是企業的哪種屬性？","answer":"流動性 (Liquidity)。"},{"id":25,"question":"企業的信用評等與總營收、ICR 之間通常呈現什麼樣的關係？","answer":"單調遞減關係 (評等越差，指標中位數越低)。"},{"id":26,"question":"本研究觀察到槓桿率與評等降級之間呈現非線性關係，具體表現為何？","answer":"評等較低時，槓桿率中位數的上升更為明顯。"},{"id":27,"question":"哪些指標與評等的關係呈現「向上凸起」的形狀？","answer":"EBITDA 利潤率、流動比率與總資產週轉率。"},{"id":28,"question":"對於 ICR 指標，信用評等越高，樣本間的變異數 (variance) 通常如何變化？","answer":"變異數會擴大 (25%-75% 間距變寬)。"},{"id":29,"question":"為何低評等企業的淨利潤增長率和淨 DER 的絕對值往往較大且容易出現極端值？","answer":"因為低評等企業的業務規模較小，導致公式分母較小。"},{"id":30,"question":"在傳統參數模型中，什麼現象會降低估計參數的穩定性？","answer":"多元共線性 (multicollinearity)。"},{"id":31,"question":"本研究數據集中，財務指標間最高成對相關係數是多少？","answer":"$0.36$ (存在於 EBITDA 利潤率與總資產週轉率之間)。"},{"id":32,"question":"本研究選擇哪種特定的梯度提升樹模型作為機器學習模型？","answer":"LightGBM (LGBM)。"},{"id":33,"question":"LightGBM 模型是由哪間研究機構在 2016 年開發的？","answer":"微軟研究中心 (Microsoft Research)。"},{"id":34,"question":"為了估計與評估模型，數據集通常被分為哪三個子集？","answer":"訓練集 (training)、驗證集 (validation) 與測試集 (test)。"},{"id":35,"question":"在 2 類分類問題中，本研究將評等分為哪兩個類別？","answer":"投資級 (IG) 與非投資級 (Non-IG)。"},{"id":36,"question":"序位邏輯迴歸假設解釋變數的權重不隨類別改變，此假設稱為什麼？","answer":"等斜率假設 (equal slopes assumption)。"},{"id":37,"question":"梯度提升樹模型中，每個後續決策樹的主要目標為何？","answer":"逐漸減少實際數據與先前樹預測值之間的殘差。"},{"id":38,"question":"在決策樹中，所有觀測值最終到達並分配預測值的末端節點稱為什麼？","answer":"葉節點 (terminal nodes 或 leaves)。"},{"id":39,"question":"模型過度擬合 (overfitting) 訓練集會導致什麼後果？","answer":"樣本外預測準確度極差。"},{"id":40,"question":"在 LGBM 模型的估計中，使用什麼損失函數？","answer":"對數損失 (log-loss)。"},{"id":41,"question":"為了降低過度擬合的風險，LGBM 在估計過程中採用了哪項技術？","answer":"早停法 (early-stopping)。"},{"id":42,"question":"信用評等機構在評等過程中，除了定量財務指標外，還會考慮什麼？","answer":"定性信息 (qualitative information)，如企業的業務環境和風險展望。"},{"id":43,"question":"準確度得分 (accuracy score) 的定義為何？","answer":"模型正確標記觀測值的百分比。"},{"id":44,"question":"在 5 類分類問題中，LGBM 的總準確度得分是多少？","answer":"$79.4\\%$"},{"id":45,"question":"在 5 類分類問題中，序位邏輯迴歸的總準確度得分是多少？","answer":"$43.1\\%$"},{"id":46,"question":"序位邏輯迴歸在 5 類分類中，哪兩個等級的準確度相對較高？","answer":"最高等級 (A 或以上) 與最低等級 (CCC 或以下)。"},{"id":47,"question":"AUC 是衡量分類模型性能的指標，它是指 _____ 下方的面積。","answer":"ROC 曲線 (Receiver Operating Characteristic curve)"},{"id":48,"question":"ROC 曲線的縱軸代表什麼？","answer":"真陽性率 (TPR)。"},{"id":49,"question":"ROC 曲線的橫軸代表什麼？","answer":"偽陽性率 (FPR)。"},{"id":50,"question":"對於完美預測的模型，其 AUC 值應等於多少？","answer":"$1$"},{"id":51,"question":"隨機預測模型的 AUC 值通常接近多少？","answer":"$0.5$"},{"id":52,"question":"在 2 類分類 (IG/Non-IG) 中，LGBM 的總準確度為何？","answer":"$89.6\\%$"},{"id":53,"question":"為什麼機器學習模型的預測準確度優於序位邏輯迴歸？","answer":"因為它能捕捉非線性影響及解釋變數變異數與評等間的相關性。"},{"id":54,"question":"以 ICR 為例，其對信用能力的非線性影響具體表現在哪裡？","answer":"當 ICR 從 $2$ 降至 $0$ 時，其對信用能力的打擊遠大於從 $10$ 降至 $8$。"},{"id":55,"question":"SHAP 值是基於博弈論中的哪一個概念？","answer":"Shapley 值。"},{"id":56,"question":"根據本研究的結果，對企業信用質量影響最顯著的財務指標有哪些？","answer":"總營收、總資產週轉率以及利息保障倍數 (ICR)。"},{"id":57,"question":"根據 PDP 分析，當 ICR 低於約多少數值時，企業信用質量會急劇下降？","answer":"$2$"},{"id":58,"question":"決策樹結構如何讓 LGBM 捕捉非線性關係？","answer":"透過在節點設置特定的切分條件 (如 $ICR < 2$)。"},{"id":59,"question":"在 2 類分類中，邏輯迴歸變成了哪種具體形式？","answer":"二項邏輯迴歸 (binomial logit)。"},{"id":60,"question":"本研究中「行業增長」類別使用的具體變數為何？","answer":"行業級營收增長率 (Sector-level Revenue Growth)。"},{"id":61,"question":"「格點搜索 (grid search)」在模型估計中的用途為何？","answer":"進行參數調優 (parameter tuning)。"},{"id":62,"question":"混淆矩陣 (confusion matrix) 的橫軸和縱軸分別代表什麼？","answer":"橫軸為預測評等，縱軸為實際評等。"},{"id":63,"question":"為何本研究在 IG/Non-IG 分類模型中沒有使用 SMOTE？","answer":"因為這兩個類別的企業數量幾乎相同 (約 $7.7$ 萬對 $8$ 萬)。"},{"id":64,"question":"LightGBM 的「Light」名稱含義為何？","answer":"它減少了調整參數所需的估計時間。"},{"id":65,"question":"本研究使用的行業分類標準是什麼？","answer":"標普全球行業分類標準 (GICS)。"},{"id":66,"question":"決策樹中，決定切分次數以控制模型複雜度的參數稱為 _____。","answer":"最大樹深 (maximum depth of tree)"},{"id":67,"question":"「OvR」在多類別分類評估中的全稱為何？","answer":"一對多 (One-versus-Rest)。"},{"id":68,"question":"如果邏輯迴歸要捕捉非線性關係，通常需要進行什麼操作？","answer":"變數轉換 (如增加平方項或交互作用項)。"},{"id":69,"question":"在決策樹圖示中，滿足切分條件的觀測值通常向哪一側移動？","answer":"左側。"},{"id":70,"question":"本研究測試集中 5 類分類的 LGBM 混淆矩陣中，「BBB」級的準確度是多少？","answer":"$80.4\\%$"},{"id":71,"question":"邏輯迴歸屬於哪一類統計模型？","answer":"廣義線性模型 (generalized linear models)。"},{"id":72,"question":"本研究中使用 SMOTE 構造模型後，所有類別的什麼會保持一致？","answer":"樣本量 (sample size)。"},{"id":73,"question":"哪一項財務指標在不同評等間的中位數差異最小，但變異數差異極大？","answer":"淨利潤增長率 (Net income growth)。"},{"id":74,"question":"根據圖 7，總營收與總資產週轉率的相關係數是多少？","answer":"$0.28$"},{"id":75,"question":"在 2 類分類中，TPR 是指將非投資級 (Non-IG) 企業正確標記為 Non-IG 的 _____。","answer":"百分比。"},{"id":76,"question":"雖然機器學習預測能力強，但在本研究中與實際評等仍有落差，其可能的主因為何？","answer":"模型未納入評等機構使用的定性信息。"},{"id":77,"question":"「早停法」停止估計的觸發條件為何？","answer":"當驗證集的損失函數不再下降時。"},{"id":78,"question":"「潛在變數 (latent variable) $y^*$」在序位邏輯迴歸中的定義為何？","answer":"解釋變數與其對應權重的加權線性組合。"},{"id":79,"question":"根據研究結論，理解 XAI 的什麼可以改善機器學習低可解釋性的問題？","answer":"其背後的基本假設 (underlying assumptions)。"},{"id":80,"question":"在 5 類分類中，ROC 曲線通常是如何計算得到的？","answer":"對每個類別基於 OvR 定義計算的 ROC 進行算術平均。"}];
    let currentData = [...RAW_DATA];
    let masteredSet = new Set(JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]"));
    let currentMode = 'list';
    let filterOnlyUnmastered = false;
    let isAllExpanded = false;
    let cardIndex = 0;

    function applyTheme(theme) {
      const normalizedTheme = theme === "dark" ? "dark" : "light";
      document.documentElement.dataset.theme = normalizedTheme;

      const btn = document.getElementById("themeToggleBtn");
      if (btn) {
        const isDark = normalizedTheme === "dark";
        btn.textContent = isDark ? "淺色模式" : "深色模式";
        btn.setAttribute("aria-label", isDark ? "切換為淺色模式" : "切換為深色模式");
      }
    }

    function initializeTheme() {
      const savedTheme = localStorage.getItem(THEME_STORAGE_KEY) || "light";
      applyTheme(savedTheme);
    }

    function toggleTheme() {
      const nextTheme = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
      localStorage.setItem(THEME_STORAGE_KEY, nextTheme);
      applyTheme(nextTheme);
    }

    initializeTheme();

    function saveMastered() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(Array.from(masteredSet)));
      updateStats();
    }

    function updateStats() {
      const total = RAW_DATA.length;
      const masteredCount = RAW_DATA.filter(item => masteredSet.has(item.id)).length;
      const pct = total === 0 ? 0 : Math.round((masteredCount / total) * 100);

      document.getElementById('statsCount').textContent = `顯示 ${currentData.length} / 共 ${total} 題`;
      document.getElementById('statsMastered').textContent = `已掌握 ${masteredCount} 題 (${pct}%)`;
      document.getElementById('progressFill').style.width = pct + '%';
    }

    function renderMath() {
      if (window.renderMathInElement) {
        renderMathInElement(document.body, {
          delimiters: [
            {left: '$$', right: '$$', display: true},
            {left: '$', right: '$', display: false}
          ],
          throwOnError: false
        });
      }
    }

    function renderList() {
      const container = document.getElementById('qaList');
      if (currentData.length === 0) {
        container.innerHTML = '<div class="empty-state">沒有符合條件的問答卡片</div>';
        return;
      }

      container.innerHTML = currentData.map(item => {
        const isMastered = masteredSet.has(item.id);
        return `
          <div class="qa-card ${isMastered ? 'mastered' : ''} ${isAllExpanded ? 'open' : ''}" id="card-${item.id}">
            <div class="qa-header" onclick="toggleItem(${item.id})">
              <span class="qa-id">#${item.id}</span>
              <span class="qa-question">${escapeHtml(item.question)}</span>
              <div class="qa-actions">
                <button class="master-btn ${isMastered ? 'is-mastered' : ''}"
                        onclick="toggleMaster(event, ${item.id})"
                        title="${isMastered ? '已掌握' : '標記掌握'}">★</button>
                <span class="expand-icon">▼</span>
              </div>
            </div>
            <div class="qa-answer">${escapeHtml(item.answer)}</div>
          </div>
        `;
      }).join('');

      renderMath();
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    function toggleItem(id) {
      const el = document.getElementById('card-' + id);
      if (el) {
        el.classList.toggle('open');
      }
    }

    function toggleMaster(event, id) {
      event.stopPropagation();
      if (masteredSet.has(id)) {
        masteredSet.delete(id);
      } else {
        masteredSet.add(id);
      }
      saveMastered();
      applyFilters();
    }

    function toggleExpandAll() {
      isAllExpanded = !isAllExpanded;
      document.getElementById('expandAllBtn').textContent = isAllExpanded ? "收合全部" : "展開全部";
      document.querySelectorAll('.qa-card').forEach(card => {
        if (isAllExpanded) {
          card.classList.add('open');
        } else {
          card.classList.remove('open');
        }
      });
    }

    function toggleFilterMastered() {
      filterOnlyUnmastered = !filterOnlyUnmastered;
      const btn = document.getElementById('filterMasteredBtn');
      btn.classList.toggle('active-filter', filterOnlyUnmastered);
      btn.textContent = filterOnlyUnmastered ? "✓ 僅顯示未掌握" : "⭐ 只看未掌握";
      applyFilters();
    }

    function handleSearch() {
      applyFilters();
    }

    function applyFilters() {
      const query = document.getElementById('searchInput').value.trim().toLowerCase();
      currentData = RAW_DATA.filter(item => {
        if (filterOnlyUnmastered && masteredSet.has(item.id)) {
          return false;
        }
        if (query) {
          const matchQ = item.question.toLowerCase().includes(query);
          const matchA = item.answer.toLowerCase().includes(query);
          return matchQ || matchA;
        }
        return true;
      });

      cardIndex = 0;
      if (currentMode === 'list') {
        renderList();
      } else {
        updateCardView();
      }
      updateStats();
    }

    function shuffleCards() {
      currentData.sort(() => Math.random() - 0.5);
      cardIndex = 0;
      if (currentMode === 'list') {
        renderList();
      } else {
        updateCardView();
      }
    }

    function resetOrder() {
      currentData.sort((a, b) => a.id - b.id);
      cardIndex = 0;
      if (currentMode === 'list') {
        renderList();
      } else {
        updateCardView();
      }
    }

    function switchMode(mode) {
      currentMode = mode;
      const listBtn = document.getElementById('listViewBtn');
      const cardBtn = document.getElementById('cardViewBtn');
      const qaList = document.getElementById('qaList');
      const flashcardContainer = document.getElementById('flashcardContainer');
      const expandAllBtn = document.getElementById('expandAllBtn');

      if (mode === 'list') {
        listBtn.classList.add('active');
        cardBtn.classList.remove('active');
        qaList.style.display = 'flex';
        flashcardContainer.style.display = 'none';
        expandAllBtn.style.display = 'inline-flex';
        renderList();
      } else {
        cardBtn.classList.add('active');
        listBtn.classList.remove('active');
        qaList.style.display = 'none';
        flashcardContainer.style.display = 'flex';
        expandAllBtn.style.display = 'none';
        updateCardView();
      }
    }

    /* Flashcard Functions */
    function flipCard() {
      const wrapper = document.getElementById('flashcardWrapper');
      wrapper.classList.toggle('flipped');
    }

    function updateCardView() {
      const wrapper = document.getElementById('flashcardWrapper');
      wrapper.classList.remove('flipped');

      if (currentData.length === 0) {
        document.getElementById('fcQuestion').textContent = '無卡片資料';
        document.getElementById('fcAnswer').textContent = '無卡片資料';
        document.getElementById('fcCardNumber').textContent = '0 / 0';
        document.getElementById('fcCardNumberBack').textContent = '0 / 0';
        return;
      }

      if (cardIndex < 0) cardIndex = 0;
      if (cardIndex >= currentData.length) cardIndex = currentData.length - 1;

      const item = currentData[cardIndex];
      const isMastered = masteredSet.has(item.id);

      document.getElementById('fcQuestion').textContent = item.question;
      document.getElementById('fcAnswer').textContent = item.answer;

      const cardNumText = `卡片 ${cardIndex + 1} / ${currentData.length} (#${item.id})`;
      document.getElementById('fcCardNumber').textContent = cardNumText;
      document.getElementById('fcCardNumberBack').textContent = cardNumText;

      const btn1 = document.getElementById('fcMasterBtn');
      const btn2 = document.getElementById('fcMasterBtnBack');
      btn1.classList.toggle('is-mastered', isMastered);
      btn2.classList.toggle('is-mastered', isMastered);

      renderMath();
    }

    function prevCard() {
      if (currentData.length === 0) return;
      cardIndex = (cardIndex - 1 + currentData.length) % currentData.length;
      updateCardView();
    }

    function nextCard() {
      if (currentData.length === 0) return;
      cardIndex = (cardIndex + 1) % currentData.length;
      updateCardView();
    }

    function toggleCardMaster(event) {
      event.stopPropagation();
      if (currentData.length === 0) return;
      const item = currentData[cardIndex];
      toggleMaster(event, item.id);
      updateCardView();
    }

    /* Keyboard Shortcuts */
    window.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT') return;
      if (currentMode === 'card') {
        if (e.code === 'Space') {
          e.preventDefault();
          flipCard();
        } else if (e.code === 'ArrowLeft') {
          e.preventDefault();
          prevCard();
        } else if (e.code === 'ArrowRight') {
          e.preventDefault();
          nextCard();
        } else if (e.code === 'KeyM') {
          e.preventDefault();
          toggleCardMaster(e);
        }
      }
    });

    // Init
    window.addEventListener('DOMContentLoaded', () => {
      updateStats();
      renderList();
      setTimeout(renderMath, 200);
    });
  </script>
</body>
</html>
