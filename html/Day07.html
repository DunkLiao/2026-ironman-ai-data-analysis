<!DOCTYPE html>
<html lang="zh-TW" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Day07 - 問答複習卡</title>
  <!-- KaTeX for LaTeX rendering -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
  <style>
    :root {
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --primary-light: #eff6ff;
      --border-color: #e2e8f0;
      --success: #10b981;
      --success-light: #ecfdf5;
      --accent: #f59e0b;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
      --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.08), 0 2px 4px -2px rgba(0,0,0,0.05);
      --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.1), 0 4px 6px -4px rgba(0,0,0,0.05);
      --radius: 12px;
    }

    html[data-theme="dark"] {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #60a5fa;
      --primary-hover: #3b82f6;
      --primary-light: #1e3a8a33;
      --border-color: #334155;
      --success: #34d399;
      --success-light: #064e3b33;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans TC", sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      line-height: 1.6;
      padding-bottom: 60px;
    }

    /* Navigation / Header */
    header {
      background: var(--card-bg);
      border-bottom: 1px solid var(--border-color);
      position: sticky;
      top: 0;
      z-index: 50;
      box-shadow: var(--shadow-sm);
    }

    .header-container {
      max-width: 900px;
      margin: 0 auto;
      padding: 14px 20px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .nav-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 8px;
      background: var(--primary-light);
      color: var(--primary);
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      transition: all 0.2s;
    }

    .back-btn:hover {
      background: var(--primary);
      color: #fff;
    }

    .page-title {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .view-toggles {
      display: flex;
      background: var(--bg-color);
      padding: 3px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
    }

    .header-actions {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: flex-end;
    }

    .toggle-btn {
      padding: 6px 14px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .toggle-btn.active {
      background: var(--card-bg);
      color: var(--primary);
      box-shadow: var(--shadow-sm);
    }

    .theme-toggle {
      padding: 7px 12px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      background: var(--card-bg);
      color: var(--text-main);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: var(--shadow-sm);
      transition: border-color 0.2s, color 0.2s, background 0.2s;
    }

    .theme-toggle:hover {
      border-color: var(--primary);
      color: var(--primary);
    }

    /* Main Container */
    main {
      max-width: 900px;
      margin: 24px auto;
      padding: 0 20px;
    }

    /* Toolbar */
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 20px;
      align-items: center;
      justify-content: space-between;
    }

    .search-box {
      flex: 1;
      min-width: 240px;
      position: relative;
    }

    .search-box input {
      width: 100%;
      padding: 10px 14px 10px 38px;
      border-radius: 10px;
      border: 1px solid var(--border-color);
      background: var(--card-bg);
      color: var(--text-main);
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-box input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-light);
    }

    .search-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 14px;
    }

    .action-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background: var(--card-bg);
      color: var(--text-main);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn:hover {
      background: var(--border-color);
    }

    .btn.active-filter {
      background: var(--primary-light);
      border-color: var(--primary);
      color: var(--primary);
    }

    /* Stats bar */
    .stats-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      font-size: 14px;
      color: var(--text-muted);
    }

    .progress-bar-container {
      flex: 1;
      height: 8px;
      background: var(--border-color);
      border-radius: 99px;
      margin: 0 16px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: var(--success);
      width: 0%;
      transition: width 0.3s ease;
    }

    /* List View Cards */
    .qa-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .qa-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      box-shadow: var(--shadow-sm);
      overflow: hidden;
      transition: box-shadow 0.2s, border-color 0.2s;
    }

    .qa-card:hover {
      box-shadow: var(--shadow-md);
      border-color: #cbd5e1;
    }

    .qa-card.mastered {
      border-left: 4px solid var(--success);
    }

    .qa-header {
      padding: 16px 20px;
      display: flex;
      align-items: flex-start;
      gap: 12px;
      cursor: pointer;
      user-select: none;
    }

    .qa-id {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 28px;
      height: 28px;
      background: var(--primary-light);
      color: var(--primary);
      border-radius: 6px;
      font-size: 13px;
      font-weight: 700;
      margin-top: 2px;
      flex-shrink: 0;
    }

    .qa-question {
      flex: 1;
      font-size: 15px;
      font-weight: 600;
      color: var(--text-main);
      padding-top: 2px;
    }

    .qa-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .master-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 18px;
      padding: 4px;
      border-radius: 6px;
      transition: transform 0.15s, color 0.15s;
    }

    .master-btn:hover {
      transform: scale(1.15);
    }

    .master-btn.is-mastered {
      color: var(--accent);
    }

    .expand-icon {
      color: var(--text-muted);
      font-size: 14px;
      transition: transform 0.2s ease;
    }

    .qa-card.open .expand-icon {
      transform: rotate(180deg);
    }

    .qa-answer {
      display: none;
      padding: 16px 20px 18px 60px;
      background: var(--bg-color);
      border-top: 1px dashed var(--border-color);
      font-size: 15px;
      color: var(--text-main);
      line-height: 1.7;
    }

    .qa-card.open .qa-answer {
      display: block;
      animation: fadeIn 0.2s ease-in;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Flashcard Mode */
    .flashcard-container {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      padding: 10px 0;
    }

    .flashcard-wrapper {
      perspective: 1000px;
      width: 100%;
      max-width: 640px;
      min-height: 340px;
      cursor: pointer;
    }

    .flashcard-inner {
      position: relative;
      width: 100%;
      height: 100%;
      min-height: 340px;
      text-align: center;
      transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
      transform-style: preserve-3d;
      border-radius: 16px;
      box-shadow: var(--shadow-lg);
    }

    .flashcard-wrapper.flipped .flashcard-inner {
      transform: rotateY(180deg);
    }

    .flashcard-face {
      position: absolute;
      width: 100%;
      height: 100%;
      min-height: 340px;
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 30px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      box-sizing: border-box;
    }

    .flashcard-back {
      transform: rotateY(180deg);
      background: var(--card-bg);
      border: 2px solid var(--primary);
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      color: var(--text-muted);
    }

    .card-badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 99px;
      font-weight: 600;
      font-size: 12px;
    }

    .badge-q {
      background: var(--primary-light);
      color: var(--primary);
    }

    .badge-a {
      background: var(--success-light);
      color: var(--success);
    }

    .card-body {
      margin: auto 0;
      padding: 20px 10px;
      font-size: 18px;
      font-weight: 600;
      line-height: 1.6;
    }

    .card-hint {
      font-size: 12px;
      color: var(--text-muted);
    }

    .flashcard-controls {
      display: flex;
      gap: 12px;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 640px;
    }

    .flashcard-controls .btn {
      padding: 10px 20px;
      font-size: 14px;
      font-weight: 600;
    }

    .btn-primary {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    .btn-primary:hover {
      background: var(--primary-hover);
    }

    .shortcuts-hint {
      font-size: 12px;
      color: var(--text-muted);
      text-align: center;
      margin-top: 8px;
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
      background: var(--card-bg);
      border-radius: var(--radius);
      border: 1px dashed var(--border-color);
    }
  </style>
</head>
<body>
  <header>
    <div class="header-container">
      <div class="nav-left">
        <a href="index.html" class="back-btn" title="回目錄">← 目錄</a>
        <h1 class="page-title">Day07 問答卡</h1>
      </div>
      <div class="header-actions">
        <button class="theme-toggle" id="themeToggleBtn" type="button" onclick="toggleTheme()" aria-label="切換為深色模式">深色模式</button>
        <div class="view-toggles">
          <button id="listViewBtn" class="toggle-btn active" onclick="switchMode('list')">📋 列表模式</button>
          <button id="cardViewBtn" class="toggle-btn" onclick="switchMode('card')">🎴 翻卡測驗</button>
        </div>
      </div>
    </div>
  </header>

  <main>
    <div class="toolbar">
      <div class="search-box">
        <span class="search-icon">🔍</span>
        <input type="text" id="searchInput" placeholder="搜尋問題或答案關鍵字..." oninput="handleSearch()">
      </div>
      <div class="action-buttons">
        <button class="btn" id="filterMasteredBtn" onclick="toggleFilterMastered()">⭐ 只看未掌握</button>
        <button class="btn" id="expandAllBtn" onclick="toggleExpandAll()">展開全部</button>
        <button class="btn" onclick="shuffleCards()">🔀 隨機洗牌</button>
        <button class="btn" onclick="resetOrder()">🔄 恢復順序</button>
      </div>
    </div>

    <div class="stats-bar">
      <span id="statsCount">總計 0 題</span>
      <div class="progress-bar-container">
        <div id="progressFill" class="progress-fill"></div>
      </div>
      <span id="statsMastered">掌握率 0%</span>
    </div>

    <!-- List View -->
    <div id="qaList" class="qa-list"></div>

    <!-- Flashcard Mode View -->
    <div id="flashcardContainer" class="flashcard-container">
      <div class="flashcard-wrapper" id="flashcardWrapper" onclick="flipCard()">
        <div class="flashcard-inner">
          <!-- Front Face -->
          <div class="flashcard-face flashcard-front">
            <div class="card-top">
              <span class="card-badge badge-q">問題</span>
              <span id="fcCardNumber">卡片 1 / 1</span>
              <button class="master-btn" id="fcMasterBtn" onclick="toggleCardMaster(event)" title="標記為已掌握">★</button>
            </div>
            <div class="card-body" id="fcQuestion">載入中...</div>
            <div class="card-hint">💡 點擊卡片或按空白鍵翻面看答案</div>
          </div>
          <!-- Back Face -->
          <div class="flashcard-face flashcard-back">
            <div class="card-top">
              <span class="card-badge badge-a">解答</span>
              <span id="fcCardNumberBack">卡片 1 / 1</span>
              <button class="master-btn" id="fcMasterBtnBack" onclick="toggleCardMaster(event)" title="標記為已掌握">★</button>
            </div>
            <div class="card-body" id="fcAnswer">載入中...</div>
            <div class="card-hint">💡 再次點擊卡片翻回正面</div>
          </div>
        </div>
      </div>

      <div class="flashcard-controls">
        <button class="btn" onclick="prevCard()">← 上一題</button>
        <button class="btn btn-primary" onclick="flipCard()">翻轉卡片</button>
        <button class="btn" onclick="nextCard()">下一題 →</button>
      </div>
      <div class="shortcuts-hint">鍵盤快速鍵：[←] 上一題 · [空白鍵] 翻面 · [→] 下一題 · [M] 標記掌握</div>
    </div>
  </main>

  <script>
    const THEME_STORAGE_KEY = "qa_theme";
    const STORAGE_KEY = "anki_mastered_" + "Day07";
    const RAW_DATA = [{"id":1,"question":"根據 CECL（當期預期信用損失）標準，銀行在估計預期信用損失時必須結合哪三項要素？","answer":"歷史經驗、當前狀況以及合理且具支撐性的預測。"},{"id":2,"question":"在 2026 年的 CECL 解決方案市場中，哪一類產品主要提供外部信用估計，用以校準或挑戰準備金假設？","answer":"信用風險數據與基準測試（Credit risk data and benchmarking）。"},{"id":3,"question":"CECL 解決方案堆棧中，負責計算、管理和報告準備金的「引擎」屬於哪一類別？","answer":"計算軟體（Calculation software）。"},{"id":4,"question":"在信用風險數據來源中，哪一種類型依賴參與銀行貢獻內部信用評估，以產生共識觀點？","answer":"財團與同業採購數據（Consortium and peer-sourced data）。"},{"id":5,"question":"傳統評級機構（如 S&P 或 Moody's）在 CECL 基準測試中的主要侷限性為何？","answer":"其覆蓋範圍通常不包括私人及未評級的商業借款人。"},{"id":6,"question":"Credit Benchmark 提供的共識違約概率（PD）基準與傳統評級有何主要區別？","answer":"其數據源自於超過 $40$ 家金融機構的內部信用評估，涵蓋了大量未評級實體。"},{"id":7,"question":"全球信用數據庫（Global Credit Data, GCD）對銀行的主要價值在於提供什麼類型的數據？","answer":"匯總的歷史違約、違約損失率（LGD）及違約風險敞口（EAD）經驗。"},{"id":8,"question":"當銀行使用 PD/LGD 方法進行 CECL 計算時，Credit Benchmark 的「遷移矩陣」扮演什麼角色？","answer":"協助建立和驗證用於生命週期預期損失計算的多年度 PD 曲線。"},{"id":9,"question":"哪種信用風險數據源最適合用於反映市場對借款人信用惡化的快速反應，但受限於工具的可觀察性？","answer":"市場隱含信用衡量指標（Market-implied credit measures），如 CDS 利差。"},{"id":10,"question":"Bloomberg DRSK 模型的產出主要依賴於哪些輸入參數？","answer":"上市公司的市場數據與財務報告數據。"},{"id":11,"question":"RapidRatings 在 CECL 團隊審查內部信用等級時，提供的主要參考點為何？","answer":"基於財務報表（資產負債表、損益表等）分析得出的財務健康評級。"},{"id":12,"question":"ICE 和 SOLVE 等提供商在信用風險領域的主要功能為何？","answer":"提供債券利差、CDS 定價和辛迪加貸款的市場報價數據。"},{"id":13,"question":"Abrigo 等計算軟體平台如何協助銀行提升 CECL 流程的審計性？","answer":"通過集成核心系統、存檔組合數據並生成預建的披露報告來實現自動化流程。"},{"id":14,"question":"SS&C EVOLV 平台與單純的計算工具相比，其核心優勢為何？","answer":"它提供端到端的預備金管理流程，強調風險與財務數據的譜系與控制。"},{"id":15,"question":"在 CECL 框架下，Oxford Economics 等提供商供應的典型宏觀經濟變量包括哪些？","answer":"國內生產總值（GDP）、失業率、利率、通貨膨脹率及房地產價格。"},{"id":16,"question":"宏觀經濟情境提供商通常會提供哪些類型的情境以滿足「合理且具支撐性」的要求？","answer":"基準（Baseline）、上行（Upside）及下行（Downside）情境。"},{"id":17,"question":"管理諮詢公司（如 PwC 或 Crowe）在銀行 CECL 週期中的主要貢獻為何？","answer":"進行獨立的模型驗證、缺口評估以及監管審查後的修復支持。"},{"id":18,"question":"資產金融（Asset Finance）在 CGAP 指南中是如何定義的？","answer":"指允許借款人在支付期間使用物理資產，並在支付完成後通常轉移所有權的貸款或租賃。"},{"id":19,"question":"信用風險（Credit Risk）在資產金融領域的基本定義為何？","answer":"一名或多名借款人未能向貸款人履行約定付款義務而導致的潛在損失。"},{"id":20,"question":"為何資產金融公司（AFCs）通常比銀行更直接地面臨低收入客戶的信用風險？","answer":"因為 AFCs 通常將銷售融資保留在自己的資產負債表上，而非依賴傳統金融機構。"},{"id":21,"question":"資產金融對供應商財務永續性的核心挑戰是什麼？","answer":"若無法將應收賬款轉化為實際現金，公司將面臨流動性不足甚至破產。"},{"id":22,"question":"所謂的「社會影響力信用陷阱」（Social impact credit trap）是指什麼現象？","answer":"在社會和財務激勵下，為了追求快速增長而放寬授信標準，導致不可持續的貸款擴張。"},{"id":23,"question":"在資產金融的組織結構中，「風險偏好聲明」（Risk Appetite Statement）的作用為何？","answer":"正式定義公司在追求其業務模型時願意接受或避免的風險類型與程度。"},{"id":24,"question":"風險偏好中的「風險容量」（Risk Capacity）具體指什麼？","answer":"組織在維持運作的前提下，能夠承擔的最高風險水平。"},{"id":25,"question":"在風險管理指標中，「風險限額」（Risk Limits）被觸發後通常會導致什麼結果？","answer":"觸發自動警告並要求管理層進行審查，例如召開執行信用委員會會議。"},{"id":26,"question":"什麼是「風險文化」（Risk Culture）？","answer":"整個組織（從領導層到基層）對風險的認知以及對管理風險的責任感。"},{"id":27,"question":"在金融服務的「三道防線」模型中，第一道防線由誰負責？","answer":"業務端的前線人員與管理層，負責在操作中直接控制風險。"},{"id":28,"question":"第二道防線（風險管理部門）的主要職責為何？","answer":"獨立分析第一道防線的決策，制定風險政策並監控關鍵風險指標。"},{"id":29,"question":"內部稽核（Internal Audit）作為第三道防線，其核心特徵是什麼？","answer":"它必須具備高度獨立性，直接向董事會報告，稽核前兩道防線的有效性。"},{"id":30,"question":"在資產金融中，管理資訊系統（MIS）扮演的「單一真相來源」是指什麼？","answer":"整合即時交易與投資組合資訊，為信用經理提供一致且可靠的決策基礎數據。"},{"id":31,"question":"信用風險政策手冊通常應包含哪些核心組成部分？","answer":"組織結構、產品類別、業務流程（評估、催收等）及組合管理標準。"},{"id":32,"question":"資產金融公司（AFC）為何需要針對前線人員實施交互式培訓？","answer":"因為基層員工通常不閱讀冗長的政策文件，透過角色扮演等方式能更有效傳達風險概念。"},{"id":33,"question":"「四眼原則」（Four Eyes Principle）在信用決策中如何運作？","answer":"要求任何具有一定風險特徵的活動都必須由第二名獨立且稱職的人員進行複核。"},{"id":34,"question":"「雙重控制」（Dual Control）與四眼原則有何不同？","answer":"它更為嚴格，要求兩個人必須同時在場才能執行某項敏感活動。"},{"id":35,"question":"在資產金融的產品設計中，為何物理產品的質量是信用風險的最大變量？","answer":"因為如果資產無法正常運作，客戶通常會直接停止付款，且缺乏其他還款激勵。"},{"id":36,"question":"定價（Pricing）作為風險管理工具的雙刃劍效應為何？","answer":"定價需覆蓋預期信用損失，但過高的定價會降低客戶負擔能力並增加違約風險。"},{"id":37,"question":"資產金融中的「鎖定技術」（Lockout technology）的主要功能為何？","answer":"在客戶未及時付款時遠程禁用資產，以此作為強制還款的手段。"},{"id":38,"question":"對於規模較小的 AFC（資產組合小於 $1000$ 萬美元），建議的內部稽核實施方式為何？","answer":"可以將內部稽核職能委外給外部稽核公司或諮詢機構。"},{"id":39,"question":"CECL 預期損失模型中的 PSI 分析（人口穩定性指數）有何用途？","answer":"識別信用風險分佈隨時間的變化，作為正式模型驗證週期之間的監控指標。"},{"id":40,"question":"在資產金融中，PAYGo 模式與租賃（Lease）模式的主要風險概況差異為何？","answer":"PAYGo 通常具有較高的違約水平，但透過靈活付款與鎖定技術來緩釋風險。"},{"id":41,"question":"資產金融公司的董事會應如何確保激勵機制與風險掛鉤？","answer":"監督補償體系，確保銷售獎金不會導致過度冒險（如包含資產質量掛鉤獎金）。"},{"id":42,"question":"風險管理單位（RMU）的獨立性意味著什麼？","answer":"風險人員不應受商業目標激勵，且不應從屬於其所監督的業務經理。"},{"id":43,"question":"當風險經理在信用決策中投下反對票，但業務經理堅持通過時，該如何處理？","answer":"應將其記錄為一項「例外情況」或「覆蓋」（Override），並由內部稽核追蹤後續結果。"},{"id":44,"question":"在員工職務說明書中加入風險管理責任的目的是什麼？","answer":"傳達「每個人都是風險管理者」的概念，讓非信用部門員工也了解其行為對風險的影響。"},{"id":45,"question":"資產金融中，長達 $36$ 到 $42$ 個月的貸款期限會帶來什麼信用隱患？","answer":"容易產生「支付疲勞」，且在合約結束前可能出現更先進的新產品使舊資產失去價值。"},{"id":46,"question":"行為準則（Code of Conduct）在防止「暴力催收」方面的作用為何？","answer":"建立明確的倫理標準與制裁機制，保護客戶免受非法或不當行為侵害。"},{"id":47,"question":"「風險容忍度」（Risk Tolerance）與「風險指標」（Risk Targets）有何區別？","answer":"容忍度是組織願意承受的最高水平，而指標則是組織主動追求的最優水平。"},{"id":48,"question":"在低收入市場，為何「集團責任」（Group liability）是 AFC 常借鑒的工具？","answer":"用以彌補非正式經濟中缺乏財務證明和傳統抵押品的問題。"},{"id":49,"question":"CECL 遷移矩陣（Transition Matrix）反映的是什麼資訊？","answer":"借款人在不同信用等級之間隨時間遷移的概率。"},{"id":50,"question":"為何說資產金融有助於推動「財務包容性」（Financial Inclusion）？","answer":"因為 AFC 往往為客戶建立首個正式財務關係，並為其獲取其他融資鋪平道路。"},{"id":51,"question":"當銀行使用 S&P 評級作為 CECL 基準時，為何需要額外的對應（Mapping）步驟？","answer":"因為 S&P 評級是排序性的（Ordinal），而非直接的違約概率（PD）。"},{"id":52,"question":"SAS 平台在 CECL 解決方案市場中的定位為何？","answer":"提供更廣泛的企業風險管理環境，結合數據管理、壓力測試與報告功能。"},{"id":53,"question":"Fitch Ratings 提供的「信用意見」（Credit Opinions）與正式評級有何不同？","answer":"提供信用觀點但不包含正式評級的所有特徵或完整流程。"},{"id":54,"question":"CreditEdge EDF 模型主要利用哪類數據來估計違約風險？","answer":"上市公司的市場相關資訊。"},{"id":55,"question":"根據 CGAP，為何對前線銷售人員實施「負向激勵」在某些情況下是必要的？","answer":"例如從逾期未繳的獎金中扣除，以防止其只顧銷售而忽視貸款質量。"},{"id":56,"question":"在資產金融公司中，誰負責制定和更新風險管理政策？","answer":"通常由風險管理部門主導，並由高級管理層或董事會批准。"},{"id":57,"question":"對於沒有正式收入證明的低收入借款人，AFC 通常如何進行能力評估？","answer":"透過實地訪談、參考人和保證人，以及詳細的現金流問卷調查。"},{"id":58,"question":"CECL 預備金計算中的 WARM 方法是指什麼？","answer":"加權平均剩餘到期法（Weighted-Average Remaining Maturity）。"},{"id":59,"question":"在資產金融中，逾期回收價值（Recovery Value）與什麼因素高度相關？","answer":"資產是否易於追踪、重置以及在二級市場的殘值。"},{"id":60,"question":"何謂「內部稽核自我評估」（Risk management self-evaluation）模式？","answer":"成長型公司可由不同國家的風險經理交叉審核，以在資源有限下實現獨立性。"},{"id":61,"question":"信用指數（Credit Indices）在 CECL 監控中的功能為何？","answer":"作為「常識檢查」（Sanity check），判斷投資組合的假設是否與行業大趨勢一致。"},{"id":62,"question":"為何 CECL 軟體本身無法解決「未評級借款人」的數據缺口？","answer":"因為軟體只是處理輸入的引擎，數據質量與外部基準支持需依賴數據源解決。"},{"id":63,"question":"在資產金融的早期階段，誰通常可以兼任第二道防線的職責？","answer":"財務長（CFO）。"},{"id":64,"question":"風險偏好聲明中的「風險指標」（Risk Targets）定義為何？","answer":"公司希望承擔的最優風險暴露水平。"},{"id":65,"question":"資產金融中的「數字支付」如何幫助降低風險管理成本？","answer":"自動化處理大量小額還款，減少人力操作並降低錯誤與欺詐機會。"},{"id":66,"question":"在 SunCulture 的案例中，除了銷售代理，還有誰參與了現場風險評估？","answer":"工程師（進行技術評估並確認客戶是否有實際使用需求）。"},{"id":67,"question":"當 CECL 模型驗證發現內部 PD 缺乏外部支持時，通常建議採取什麼行動？","answer":"尋找額外的外部數據源（如共識數據）來基準化內部估計。"},{"id":68,"question":"在 Tugende 的案例中，公司如何確保分支機構遵守信用政策？","answer":"設立風險主管職位並在分支機構層面實施第二級風險監督。"},{"id":69,"question":"什麼樣的「激勵扭曲」會導致客戶故意延後付款？","answer":"例如：如果催收人員在較晚階段（如 $90$ 天以上）的佣金高於早期催收佣金。"},{"id":70,"question":"宏觀經濟情境服務中的「嚴重下行情境」通常與什麼標準進行比較？","answer":"美聯儲的 CCAR 嚴重壓力情境。"},{"id":71,"question":"在資產金融中，維護人員（Service staff）為何也屬於第一道防線？","answer":"因為及時修復故障資產能維持客戶的付款意願，從而降低信用風險。"},{"id":72,"question":"為何資產金融公司應簽署類似 GOGLA 或 SMART 的客戶保護原則？","answer":"為了確保負責任的借貸行為，防止客戶過度負債並提升品牌信譽。"},{"id":73,"question":"CECL 規定下，「合理且具支撐性的預測」具體意味著什麼？","answer":"銀行必須證明其對未來經濟狀況的假設有可靠數據支持，而非憑空猜測。"},{"id":74,"question":"在信用評估中，為何需要對「非正式收入」進行多維度交叉核對？","answer":"因為借款人缺乏薪資單，必須通過詢問不同來源來驗證還款能力。"},{"id":75,"question":"若資產金融公司（AFC）的組合規模超過 $2500$ 萬美元，應具備什麼樣的風險治理架構？","answer":"具備完全獨立的風險管理職能與內部稽核職能，並向董事會報告。"},{"id":76,"question":"共識分析（Consensus Analytics）如何幫助銀行判斷基準的可靠性？","answer":"通過顯示各貢獻銀行觀點的分散程度（收斂或發散）。"},{"id":77,"question":"對於低收入客戶，資產金融與傳統銀行的核心區別在於何種抵押方式？","answer":"資產金融使用「資產本身」作為抵押，而非土地或房屋所有權證。"},{"id":78,"question":"在 2026 年，銀行使用多個 CECL 類別解決方案的常見方式為何？","answer":"結合外部數據進行基準測試、使用軟體運行計算、引入第三方情境並由諮詢公司驗證。"},{"id":79,"question":"「成本風險與緩釋成本平衡圖」傳達了什麼管理核心觀點？","answer":"在一定的風險水平下，風險成本與緩釋成本之和應達到最小化。"},{"id":80,"question":"根據 CGAP 指南，哪一種行為能最直接證明領導層對風險文化的重視？","answer":"為風險管理部門投入足夠的資源，並在政策執行上保持一致性。"}];
    let currentData = [...RAW_DATA];
    let masteredSet = new Set(JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]"));
    let currentMode = 'list';
    let filterOnlyUnmastered = false;
    let isAllExpanded = false;
    let cardIndex = 0;

    function applyTheme(theme) {
      const normalizedTheme = theme === "dark" ? "dark" : "light";
      document.documentElement.dataset.theme = normalizedTheme;

      const btn = document.getElementById("themeToggleBtn");
      if (btn) {
        const isDark = normalizedTheme === "dark";
        btn.textContent = isDark ? "淺色模式" : "深色模式";
        btn.setAttribute("aria-label", isDark ? "切換為淺色模式" : "切換為深色模式");
      }
    }

    function initializeTheme() {
      const savedTheme = localStorage.getItem(THEME_STORAGE_KEY) || "light";
      applyTheme(savedTheme);
    }

    function toggleTheme() {
      const nextTheme = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
      localStorage.setItem(THEME_STORAGE_KEY, nextTheme);
      applyTheme(nextTheme);
    }

    initializeTheme();

    function saveMastered() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(Array.from(masteredSet)));
      updateStats();
    }

    function updateStats() {
      const total = RAW_DATA.length;
      const masteredCount = RAW_DATA.filter(item => masteredSet.has(item.id)).length;
      const pct = total === 0 ? 0 : Math.round((masteredCount / total) * 100);

      document.getElementById('statsCount').textContent = `顯示 ${currentData.length} / 共 ${total} 題`;
      document.getElementById('statsMastered').textContent = `已掌握 ${masteredCount} 題 (${pct}%)`;
      document.getElementById('progressFill').style.width = pct + '%';
    }

    function renderMath() {
      if (window.renderMathInElement) {
        renderMathInElement(document.body, {
          delimiters: [
            {left: '$$', right: '$$', display: true},
            {left: '$', right: '$', display: false}
          ],
          throwOnError: false
        });
      }
    }

    function renderList() {
      const container = document.getElementById('qaList');
      if (currentData.length === 0) {
        container.innerHTML = '<div class="empty-state">沒有符合條件的問答卡片</div>';
        return;
      }

      container.innerHTML = currentData.map(item => {
        const isMastered = masteredSet.has(item.id);
        return `
          <div class="qa-card ${isMastered ? 'mastered' : ''} ${isAllExpanded ? 'open' : ''}" id="card-${item.id}">
            <div class="qa-header" onclick="toggleItem(${item.id})">
              <span class="qa-id">#${item.id}</span>
              <span class="qa-question">${escapeHtml(item.question)}</span>
              <div class="qa-actions">
                <button class="master-btn ${isMastered ? 'is-mastered' : ''}"
                        onclick="toggleMaster(event, ${item.id})"
                        title="${isMastered ? '已掌握' : '標記掌握'}">★</button>
                <span class="expand-icon">▼</span>
              </div>
            </div>
            <div class="qa-answer">${escapeHtml(item.answer)}</div>
          </div>
        `;
      }).join('');

      renderMath();
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    function toggleItem(id) {
      const el = document.getElementById('card-' + id);
      if (el) {
        el.classList.toggle('open');
      }
    }

    function toggleMaster(event, id) {
      event.stopPropagation();
      if (masteredSet.has(id)) {
        masteredSet.delete(id);
      } else {
        masteredSet.add(id);
      }
      saveMastered();
      applyFilters();
    }

    function toggleExpandAll() {
      isAllExpanded = !isAllExpanded;
      document.getElementById('expandAllBtn').textContent = isAllExpanded ? "收合全部" : "展開全部";
      document.querySelectorAll('.qa-card').forEach(card => {
        if (isAllExpanded) {
          card.classList.add('open');
        } else {
          card.classList.remove('open');
        }
      });
    }

    function toggleFilterMastered() {
      filterOnlyUnmastered = !filterOnlyUnmastered;
      const btn = document.getElementById('filterMasteredBtn');
      btn.classList.toggle('active-filter', filterOnlyUnmastered);
      btn.textContent = filterOnlyUnmastered ? "✓ 僅顯示未掌握" : "⭐ 只看未掌握";
      applyFilters();
    }

    function handleSearch() {
      applyFilters();
    }

    function applyFilters() {
      const query = document.getElementById('searchInput').value.trim().toLowerCase();
      currentData = RAW_DATA.filter(item => {
        if (filterOnlyUnmastered && masteredSet.has(item.id)) {
          return false;
        }
        if (query) {
          const matchQ = item.question.toLowerCase().includes(query);
          const matchA = item.answer.toLowerCase().includes(query);
          return matchQ || matchA;
        }
        return true;
      });

      cardIndex = 0;
      if (currentMode === 'list') {
        renderList();
      } else {
        updateCardView();
      }
      updateStats();
    }

    function shuffleCards() {
      currentData.sort(() => Math.random() - 0.5);
      cardIndex = 0;
      if (currentMode === 'list') {
        renderList();
      } else {
        updateCardView();
      }
    }

    function resetOrder() {
      currentData.sort((a, b) => a.id - b.id);
      cardIndex = 0;
      if (currentMode === 'list') {
        renderList();
      } else {
        updateCardView();
      }
    }

    function switchMode(mode) {
      currentMode = mode;
      const listBtn = document.getElementById('listViewBtn');
      const cardBtn = document.getElementById('cardViewBtn');
      const qaList = document.getElementById('qaList');
      const flashcardContainer = document.getElementById('flashcardContainer');
      const expandAllBtn = document.getElementById('expandAllBtn');

      if (mode === 'list') {
        listBtn.classList.add('active');
        cardBtn.classList.remove('active');
        qaList.style.display = 'flex';
        flashcardContainer.style.display = 'none';
        expandAllBtn.style.display = 'inline-flex';
        renderList();
      } else {
        cardBtn.classList.add('active');
        listBtn.classList.remove('active');
        qaList.style.display = 'none';
        flashcardContainer.style.display = 'flex';
        expandAllBtn.style.display = 'none';
        updateCardView();
      }
    }

    /* Flashcard Functions */
    function flipCard() {
      const wrapper = document.getElementById('flashcardWrapper');
      wrapper.classList.toggle('flipped');
    }

    function updateCardView() {
      const wrapper = document.getElementById('flashcardWrapper');
      wrapper.classList.remove('flipped');

      if (currentData.length === 0) {
        document.getElementById('fcQuestion').textContent = '無卡片資料';
        document.getElementById('fcAnswer').textContent = '無卡片資料';
        document.getElementById('fcCardNumber').textContent = '0 / 0';
        document.getElementById('fcCardNumberBack').textContent = '0 / 0';
        return;
      }

      if (cardIndex < 0) cardIndex = 0;
      if (cardIndex >= currentData.length) cardIndex = currentData.length - 1;

      const item = currentData[cardIndex];
      const isMastered = masteredSet.has(item.id);

      document.getElementById('fcQuestion').textContent = item.question;
      document.getElementById('fcAnswer').textContent = item.answer;

      const cardNumText = `卡片 ${cardIndex + 1} / ${currentData.length} (#${item.id})`;
      document.getElementById('fcCardNumber').textContent = cardNumText;
      document.getElementById('fcCardNumberBack').textContent = cardNumText;

      const btn1 = document.getElementById('fcMasterBtn');
      const btn2 = document.getElementById('fcMasterBtnBack');
      btn1.classList.toggle('is-mastered', isMastered);
      btn2.classList.toggle('is-mastered', isMastered);

      renderMath();
    }

    function prevCard() {
      if (currentData.length === 0) return;
      cardIndex = (cardIndex - 1 + currentData.length) % currentData.length;
      updateCardView();
    }

    function nextCard() {
      if (currentData.length === 0) return;
      cardIndex = (cardIndex + 1) % currentData.length;
      updateCardView();
    }

    function toggleCardMaster(event) {
      event.stopPropagation();
      if (currentData.length === 0) return;
      const item = currentData[cardIndex];
      toggleMaster(event, item.id);
      updateCardView();
    }

    /* Keyboard Shortcuts */
    window.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT') return;
      if (currentMode === 'card') {
        if (e.code === 'Space') {
          e.preventDefault();
          flipCard();
        } else if (e.code === 'ArrowLeft') {
          e.preventDefault();
          prevCard();
        } else if (e.code === 'ArrowRight') {
          e.preventDefault();
          nextCard();
        } else if (e.code === 'KeyM') {
          e.preventDefault();
          toggleCardMaster(e);
        }
      }
    });

    // Init
    window.addEventListener('DOMContentLoaded', () => {
      updateStats();
      renderList();
      setTimeout(renderMath, 200);
    });
  </script>
</body>
</html>
