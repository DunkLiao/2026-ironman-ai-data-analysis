<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Day5 - 問答複習卡</title>
  <!-- KaTeX for LaTeX rendering -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
  <style>
    :root {
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --primary-light: #eff6ff;
      --border-color: #e2e8f0;
      --success: #10b981;
      --success-light: #ecfdf5;
      --accent: #f59e0b;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
      --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.08), 0 2px 4px -2px rgba(0,0,0,0.05);
      --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.1), 0 4px 6px -4px rgba(0,0,0,0.05);
      --radius: 12px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg-color: #0f172a;
        --card-bg: #1e293b;
        --text-main: #f8fafc;
        --text-muted: #94a3b8;
        --primary: #60a5fa;
        --primary-hover: #3b82f6;
        --primary-light: #1e3a8a33;
        --border-color: #334155;
        --success: #34d399;
        --success-light: #064e3b33;
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans TC", sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      line-height: 1.6;
      padding-bottom: 60px;
    }

    /* Navigation / Header */
    header {
      background: var(--card-bg);
      border-bottom: 1px solid var(--border-color);
      position: sticky;
      top: 0;
      z-index: 50;
      box-shadow: var(--shadow-sm);
    }

    .header-container {
      max-width: 900px;
      margin: 0 auto;
      padding: 14px 20px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .nav-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 8px;
      background: var(--primary-light);
      color: var(--primary);
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      transition: all 0.2s;
    }

    .back-btn:hover {
      background: var(--primary);
      color: #fff;
    }

    .page-title {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .view-toggles {
      display: flex;
      background: var(--bg-color);
      padding: 3px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
    }

    .toggle-btn {
      padding: 6px 14px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .toggle-btn.active {
      background: var(--card-bg);
      color: var(--primary);
      box-shadow: var(--shadow-sm);
    }

    /* Main Container */
    main {
      max-width: 900px;
      margin: 24px auto;
      padding: 0 20px;
    }

    /* Toolbar */
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 20px;
      align-items: center;
      justify-content: space-between;
    }

    .search-box {
      flex: 1;
      min-width: 240px;
      position: relative;
    }

    .search-box input {
      width: 100%;
      padding: 10px 14px 10px 38px;
      border-radius: 10px;
      border: 1px solid var(--border-color);
      background: var(--card-bg);
      color: var(--text-main);
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-box input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-light);
    }

    .search-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 14px;
    }

    .action-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background: var(--card-bg);
      color: var(--text-main);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn:hover {
      background: var(--border-color);
    }

    .btn.active-filter {
      background: var(--primary-light);
      border-color: var(--primary);
      color: var(--primary);
    }

    /* Stats bar */
    .stats-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      font-size: 14px;
      color: var(--text-muted);
    }

    .progress-bar-container {
      flex: 1;
      height: 8px;
      background: var(--border-color);
      border-radius: 99px;
      margin: 0 16px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: var(--success);
      width: 0%;
      transition: width 0.3s ease;
    }

    /* List View Cards */
    .qa-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .qa-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      box-shadow: var(--shadow-sm);
      overflow: hidden;
      transition: box-shadow 0.2s, border-color 0.2s;
    }

    .qa-card:hover {
      box-shadow: var(--shadow-md);
      border-color: #cbd5e1;
    }

    .qa-card.mastered {
      border-left: 4px solid var(--success);
    }

    .qa-header {
      padding: 16px 20px;
      display: flex;
      align-items: flex-start;
      gap: 12px;
      cursor: pointer;
      user-select: none;
    }

    .qa-id {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 28px;
      height: 28px;
      background: var(--primary-light);
      color: var(--primary);
      border-radius: 6px;
      font-size: 13px;
      font-weight: 700;
      margin-top: 2px;
      flex-shrink: 0;
    }

    .qa-question {
      flex: 1;
      font-size: 15px;
      font-weight: 600;
      color: var(--text-main);
      padding-top: 2px;
    }

    .qa-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .master-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 18px;
      padding: 4px;
      border-radius: 6px;
      transition: transform 0.15s, color 0.15s;
    }

    .master-btn:hover {
      transform: scale(1.15);
    }

    .master-btn.is-mastered {
      color: var(--accent);
    }

    .expand-icon {
      color: var(--text-muted);
      font-size: 14px;
      transition: transform 0.2s ease;
    }

    .qa-card.open .expand-icon {
      transform: rotate(180deg);
    }

    .qa-answer {
      display: none;
      padding: 16px 20px 18px 60px;
      background: var(--bg-color);
      border-top: 1px dashed var(--border-color);
      font-size: 15px;
      color: var(--text-main);
      line-height: 1.7;
    }

    .qa-card.open .qa-answer {
      display: block;
      animation: fadeIn 0.2s ease-in;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Flashcard Mode */
    .flashcard-container {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      padding: 10px 0;
    }

    .flashcard-wrapper {
      perspective: 1000px;
      width: 100%;
      max-width: 640px;
      min-height: 340px;
      cursor: pointer;
    }

    .flashcard-inner {
      position: relative;
      width: 100%;
      height: 100%;
      min-height: 340px;
      text-align: center;
      transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
      transform-style: preserve-3d;
      border-radius: 16px;
      box-shadow: var(--shadow-lg);
    }

    .flashcard-wrapper.flipped .flashcard-inner {
      transform: rotateY(180deg);
    }

    .flashcard-face {
      position: absolute;
      width: 100%;
      height: 100%;
      min-height: 340px;
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 30px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      box-sizing: border-box;
    }

    .flashcard-back {
      transform: rotateY(180deg);
      background: var(--card-bg);
      border: 2px solid var(--primary);
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      color: var(--text-muted);
    }

    .card-badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 99px;
      font-weight: 600;
      font-size: 12px;
    }

    .badge-q {
      background: var(--primary-light);
      color: var(--primary);
    }

    .badge-a {
      background: var(--success-light);
      color: var(--success);
    }

    .card-body {
      margin: auto 0;
      padding: 20px 10px;
      font-size: 18px;
      font-weight: 600;
      line-height: 1.6;
    }

    .card-hint {
      font-size: 12px;
      color: var(--text-muted);
    }

    .flashcard-controls {
      display: flex;
      gap: 12px;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 640px;
    }

    .flashcard-controls .btn {
      padding: 10px 20px;
      font-size: 14px;
      font-weight: 600;
    }

    .btn-primary {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    .btn-primary:hover {
      background: var(--primary-hover);
    }

    .shortcuts-hint {
      font-size: 12px;
      color: var(--text-muted);
      text-align: center;
      margin-top: 8px;
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
      background: var(--card-bg);
      border-radius: var(--radius);
      border: 1px dashed var(--border-color);
    }
  </style>
</head>
<body>
  <header>
    <div class="header-container">
      <div class="nav-left">
        <a href="../index.html" class="back-btn" title="回目錄">← 目錄</a>
        <h1 class="page-title">Day5 問答卡</h1>
      </div>
      <div class="view-toggles">
        <button id="listViewBtn" class="toggle-btn active" onclick="switchMode('list')">📋 列表模式</button>
        <button id="cardViewBtn" class="toggle-btn" onclick="switchMode('card')">🎴 翻卡測驗</button>
      </div>
    </div>
  </header>

  <main>
    <div class="toolbar">
      <div class="search-box">
        <span class="search-icon">🔍</span>
        <input type="text" id="searchInput" placeholder="搜尋問題或答案關鍵字..." oninput="handleSearch()">
      </div>
      <div class="action-buttons">
        <button class="btn" id="filterMasteredBtn" onclick="toggleFilterMastered()">⭐ 只看未掌握</button>
        <button class="btn" id="expandAllBtn" onclick="toggleExpandAll()">展開全部</button>
        <button class="btn" onclick="shuffleCards()">🔀 隨機洗牌</button>
        <button class="btn" onclick="resetOrder()">🔄 恢復順序</button>
      </div>
    </div>

    <div class="stats-bar">
      <span id="statsCount">總計 0 題</span>
      <div class="progress-bar-container">
        <div id="progressFill" class="progress-fill"></div>
      </div>
      <span id="statsMastered">掌握率 0%</span>
    </div>

    <!-- List View -->
    <div id="qaList" class="qa-list"></div>

    <!-- Flashcard Mode View -->
    <div id="flashcardContainer" class="flashcard-container">
      <div class="flashcard-wrapper" id="flashcardWrapper" onclick="flipCard()">
        <div class="flashcard-inner">
          <!-- Front Face -->
          <div class="flashcard-face flashcard-front">
            <div class="card-top">
              <span class="card-badge badge-q">問題</span>
              <span id="fcCardNumber">卡片 1 / 1</span>
              <button class="master-btn" id="fcMasterBtn" onclick="toggleCardMaster(event)" title="標記為已掌握">★</button>
            </div>
            <div class="card-body" id="fcQuestion">載入中...</div>
            <div class="card-hint">💡 點擊卡片或按空白鍵翻面看答案</div>
          </div>
          <!-- Back Face -->
          <div class="flashcard-face flashcard-back">
            <div class="card-top">
              <span class="card-badge badge-a">解答</span>
              <span id="fcCardNumberBack">卡片 1 / 1</span>
              <button class="master-btn" id="fcMasterBtnBack" onclick="toggleCardMaster(event)" title="標記為已掌握">★</button>
            </div>
            <div class="card-body" id="fcAnswer">載入中...</div>
            <div class="card-hint">💡 再次點擊卡片翻回正面</div>
          </div>
        </div>
      </div>

      <div class="flashcard-controls">
        <button class="btn" onclick="prevCard()">← 上一題</button>
        <button class="btn btn-primary" onclick="flipCard()">翻轉卡片</button>
        <button class="btn" onclick="nextCard()">下一題 →</button>
      </div>
      <div class="shortcuts-hint">鍵盤快速鍵：[←] 上一題 · [空白鍵] 翻面 · [→] 下一題 · [M] 標記掌握</div>
    </div>
  </main>

  <script>
    const STORAGE_KEY = "anki_mastered_" + "Day5";
    const RAW_DATA = [{"id":1,"question":"根據 Gartner 的四大數據分析框架，「描述性分析」主要關注哪一個核心問題？","answer":"發生了什麼事？（What happened?）"},{"id":2,"question":"根據 Gartner 的四大數據分析框架，「診斷性分析」主要關注哪一個核心問題？","answer":"為何會發生？（Why did it happen?）"},{"id":3,"question":"在數據分析的階段中，哪一種分析類型能提供「事後覺察」（Hindsight）？","answer":"描述性分析。"},{"id":4,"question":"在數據分析的階段中，哪一種分析類型能提供「洞見」（Insight）？","answer":"診斷性分析。"},{"id":5,"question":"「預測性分析」在數據分析框架中主要探討什麼問題？","answer":"將來會發生什麼？（What will happen?）"},{"id":6,"question":"「處方性分析」的最終目標是什麼？","answer":"研究我們可以做什麼來讓未來更符合期待。"},{"id":7,"question":"描述性分析與診斷性分析在邏輯順序上有何關係？","answer":"描述性分析通常是第一步，診斷性分析則是針對觀察到的現象進一步追查原因。"},{"id":8,"question":"診斷性分析中常用來尋找根本原因的思考方法為何？","answer":"假說思考法。"},{"id":9,"question":"描述性分析常用的客觀數據指標包含哪些？","answer":"平均數、總計、最大值、最小值等統計數值。"},{"id":10,"question":"診斷性分析與資料科學領域（如建模）的主要區別為何？","answer":"診斷性分析偏重探討原因（Why），資料科學則更進一步處理預測與處方性分析。"},{"id":11,"question":"請定義數據分析中的「假說思考法」。","answer":"根據過去經驗或目前資訊，提出最接近根本原因的猜想與假說。"},{"id":12,"question":"描述性分析的典型應用案例為何？","answer":"觀測上個月網站的訪客數、點擊率或營收總額。"},{"id":13,"question":"診斷性分析的典型應用案例為何？","answer":"分析為何第二週的網站訪客人數會突然成長 15%。"},{"id":14,"question":"在診斷性分析表（Diagnostic Table）中，除了提出「假設」與「理由」，還需具備哪項要素？","answer":"檢驗方式（驗證假設的方法）。"},{"id":15,"question":"描述性分析的主要目的是讓決策者對資料產生何種認知？","answer":"了解資料的現況與「長相」。"},{"id":16,"question":"診斷性分析常遇到的挑戰之一是無法僅從數據得出結論，這時需要加入什麼？","answer":"領域知識（Domain Knowledge）或業務經驗。"},{"id":17,"question":"在數據視覺化中，「維度」（Dimension）通常是指哪種類型的資料？","answer":"類別型資料，如名稱、日期或地理位置。"},{"id":18,"question":"在視覺化工具中，「量值」（Measure）通常是指哪種類型的資料？","answer":"數值型資料，可以進行加總、平均等運算。"},{"id":19,"question":"商業智慧工具（BI）的主要用途為何？","answer":"追蹤固定關鍵指標（KPI）與產出標準化報表。"},{"id":20,"question":"AI 在現代數據分析中扮演的主要角色為何？","answer":"輔助分析非結構化資料，並提供彈性且個人化的分析建議。"},{"id":21,"question":"為什麼在視覺化圖表中，灰色通常被建議作為次要資訊的顏色？","answer":"灰色具有將資訊推向背景的效果，能減少視覺負擔並凸顯主色。"},{"id":22,"question":"為什麼視覺化專家通常不推薦使用 3D 圓餅圖？","answer":"3D 效果會產生視覺偏差，讓人難以精確比較各個區塊的實際面積比例。"},{"id":23,"question":"長條圖（Bar Chart）在比較數據時，最重要的視覺基準點是什麼？","answer":"數值起點應從 0 開始，以確保視覺上的長度與實際數值比例一致。"},{"id":24,"question":"若數據間落差極大導致難以在同一座標軸呈現，可採取哪種數學處理方式？","answer":"取對數（Log）轉換。"},{"id":25,"question":"在視覺化原則中，為什麼要避免在圓餅圖中使用過多的分類？","answer":"分類過多會使各塊面積難以區分，導致讀者無法有效率地進行數據溝通。"},{"id":26,"question":"Tableau 的「標記」（Marks）窗格主要功能為何？","answer":"設定圖表的顏色、大小、標籤、詳細資料等視覺特徵。"},{"id":27,"question":"Tableau 中「離散」（Discrete）資料通常以什麼顏色顯示？","answer":"藍色。"},{"id":28,"question":"Tableau 中「連續」（Continuous）資料通常以什麼顏色顯示？","answer":"綠色。"},{"id":29,"question":"在數據處理流程中，「Garbage in, garbage out」這句話強調了什麼？","answer":"強調資料清洗（Data Cleaning）與品質的重要性，錯誤的原始資料會導致無意義的分析結果。"},{"id":30,"question":"Google 提出的數據分析六大流程，起始步驟為何？","answer":"提問（Ask），即定義要解決的問題。"},{"id":31,"question":"何謂「非結構化資料」？","answer":"沒有固定格式的資料，例如對話文字、圖片、影片或手寫記錄。"},{"id":32,"question":"樞紐分析表（Pivot Table）的三大核心元素為何？","answer":"列（Rows）、欄（Columns）、值（Values）。"},{"id":33,"question":"在 Tableau 中，若想將圖表進一步切割成更細的層級，應將欄位拖曳至哪個位置？","answer":"詳細資料（Detail）。"},{"id":34,"question":"當進行診斷性分析時，若 AI 提供了 20 個潛在原因，分析師應如何過濾？","answer":"利用業務經驗判斷可能性，並逐一設計檢驗方式來驗證。"},{"id":35,"question":"為何「散佈圖」（Scatter Plot）常用於關聯性分析？","answer":"它能呈現兩個量值（x 軸與 y 軸）之間的關係與分布趨勢。"},{"id":36,"question":"在視覺化溝通中，何謂「前注意力特徵」（Pre-attentive attributes）？","answer":"大腦在意識思考前，會優先關注的視覺特徵，如顏色對比、形狀、大小或方向。"},{"id":37,"question":"「樹狀圖」（Treemap）與圓餅圖有何相似之處？","answer":"兩者皆利用「面積」來呈現部分對整體的占比關係。"},{"id":38,"question":"數據分析中的「資料品質」主要衡量哪些面向？","answer":"完整度、正確性、即時性與一致性。"},{"id":39,"question":"在 Tableau 中，若要針對特定範圍的資料進行觀察，應使用哪項功能？","answer":"篩選器（Filter）。"},{"id":40,"question":"如何優化數據分析簡報的讀取效率？","answer":"運用色彩對比凸顯關鍵數字，並在標題直接點出分析結論。"},{"id":41,"question":"描述性分析的結論通常以什麼方式呈現？","answer":"事實陳述，例如：「高雄市是 A1 事故件數最多的縣市」。"},{"id":42,"question":"診斷性分析的結論通常以什麼方式呈現？","answer":"假說驗證的結果，例如：「二月事故較多可能與農曆年人潮增加有關」。"},{"id":43,"question":"在 Excel 樞紐分析中，「值」區域通常預設進行什麼運算？","answer":"加總（Sum）或計數（Count）。"},{"id":44,"question":"為何數據視覺化被視為「數據溝通」的重要環節？","answer":"因為圖表能將枯燥且龐大的數據轉化為易於理解的模式與洞察。"},{"id":45,"question":"在診斷性分析的過程中，若假說被驗證為偽，下一步應如何處理？","answer":"重新提出新的假說並進行新一輪的數據驗證（迭代過程）。"},{"id":46,"question":"描述性分析可以幫助我們回答「目標達成率為何」，那診斷性分析則幫助我們回答？","answer":"「目標未達成的原因為何」。"},{"id":47,"question":"在 Tableau 中，自動生成的「緯度」與「經度」欄位主要用於產生何種圖表？","answer":"地圖（Map）。"},{"id":48,"question":"「堆疊長條圖」的視覺限制為何？","answer":"除了底部的分類，中段與上段的分類因起點不同，難以直接精確比較長度。"},{"id":49,"question":"在進行數據分析提問時，為何要強調「量化指標」？","answer":"量化指標能讓問題變得可測量、可觀察，進而找出改善的行動方案。"},{"id":50,"question":"AI 工具在診斷性分析中如何輔助「追問」？","answer":"利用上下文記憶，針對描述性分析的初步發現，提出多個可能的因果假設。"},{"id":51,"question":"在分析 A1 交通事故資料時，若僅觀察總件數而未考慮人口比例，這屬於何種分析誤區？","answer":"數據誤導（未標準化），無法推論真實風險高低。"},{"id":52,"question":"數據視覺化工具中的「計算欄位」通常用於什麼目的？","answer":"根據原始資料定義新的邏輯或公式，例如計算「利潤率」。"},{"id":53,"question":"在 Tableau 中，若要將不同年度的同一月份數據合併觀察，應選取哪種日期顯示方式？","answer":"離散日期（Discrete Date）或上方的日期層級。"},{"id":54,"question":"數據分析流程中，「行動」（Action）階段的目的是什麼？","answer":"解決最初提出的問題或達成商業目標。"},{"id":55,"question":"在視覺化設計中，「高亮顯示」（Highlighting）的主要功用是什麼？","answer":"引導讀者的目光停留在最重要的數據點或異常值上。"},{"id":56,"question":"描述性分析中的「描述性統計」與「視覺化描述」有何共通點？","answer":"兩者皆是為了客觀地呈現歷史資料的現況。"},{"id":57,"question":"診斷性分析的「假說」通常來源於何處？","answer":"目前的資訊觀察、過去的經驗或者是對商業流程的理解。"},{"id":58,"question":"使用 AI 輔助數據清洗時，為什麼需要提供「範例資料」？","answer":"讓 AI 學習資料的長相與結構，以產出正確的清洗邏輯或公式。"},{"id":59,"question":"在 Tableau 中，將 Measure 選項改為「平均值」而非「加總」，屬於哪一類分析動作？","answer":"描述性分析。"},{"id":60,"question":"針對「為什麼營收下滑」進行的跨部門會議，本質上是在進行哪一類分析？","answer":"診斷性分析。"},{"id":61,"question":"在處理個人隱私資料時，提供給 AI 前應進行什麼動作？","answer":"去識別化（De-identification），如遮蔽姓名或 Email。"},{"id":62,"question":"分析圖表選用中，若要觀察時間序列的變化趨勢，哪種圖表最合適？","answer":"線圖（Line Chart）。"},{"id":63,"question":"「診斷性分析」對於企業決策的重要性為何？","answer":"它能找出成功或失敗的關鍵因子，作為優化營運的依據。"},{"id":64,"question":"在描述性分析中，如何發現資料中的「缺漏值」？","answer":"透過完整展開的時間軸或分布圖，觀察是否有不尋常的數據空白處。"},{"id":65,"question":"描述性分析專注於「過去」，預測性分析專注於「未來」，那診斷性分析專注於？","answer":"連結過去現象與未來改進的「因果橋樑」。"}];
    let currentData = [...RAW_DATA];
    let masteredSet = new Set(JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]"));
    let currentMode = 'list';
    let filterOnlyUnmastered = false;
    let isAllExpanded = false;
    let cardIndex = 0;

    function saveMastered() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(Array.from(masteredSet)));
      updateStats();
    }

    function updateStats() {
      const total = RAW_DATA.length;
      const masteredCount = RAW_DATA.filter(item => masteredSet.has(item.id)).length;
      const pct = total === 0 ? 0 : Math.round((masteredCount / total) * 100);

      document.getElementById('statsCount').textContent = `顯示 ${currentData.length} / 共 ${total} 題`;
      document.getElementById('statsMastered').textContent = `已掌握 ${masteredCount} 題 (${pct}%)`;
      document.getElementById('progressFill').style.width = pct + '%';
    }

    function renderMath() {
      if (window.renderMathInElement) {
        renderMathInElement(document.body, {
          delimiters: [
            {left: '$$', right: '$$', display: true},
            {left: '$', right: '$', display: false}
          ],
          throwOnError: false
        });
      }
    }

    function renderList() {
      const container = document.getElementById('qaList');
      if (currentData.length === 0) {
        container.innerHTML = '<div class="empty-state">沒有符合條件的問答卡片</div>';
        return;
      }

      container.innerHTML = currentData.map(item => {
        const isMastered = masteredSet.has(item.id);
        return `
          <div class="qa-card ${isMastered ? 'mastered' : ''} ${isAllExpanded ? 'open' : ''}" id="card-${item.id}">
            <div class="qa-header" onclick="toggleItem(${item.id})">
              <span class="qa-id">#${item.id}</span>
              <span class="qa-question">${escapeHtml(item.question)}</span>
              <div class="qa-actions">
                <button class="master-btn ${isMastered ? 'is-mastered' : ''}"
                        onclick="toggleMaster(event, ${item.id})"
                        title="${isMastered ? '已掌握' : '標記掌握'}">★</button>
                <span class="expand-icon">▼</span>
              </div>
            </div>
            <div class="qa-answer">${escapeHtml(item.answer)}</div>
          </div>
        `;
      }).join('');

      renderMath();
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    function toggleItem(id) {
      const el = document.getElementById('card-' + id);
      if (el) {
        el.classList.toggle('open');
      }
    }

    function toggleMaster(event, id) {
      event.stopPropagation();
      if (masteredSet.has(id)) {
        masteredSet.delete(id);
      } else {
        masteredSet.add(id);
      }
      saveMastered();
      applyFilters();
    }

    function toggleExpandAll() {
      isAllExpanded = !isAllExpanded;
      document.getElementById('expandAllBtn').textContent = isAllExpanded ? "收合全部" : "展開全部";
      document.querySelectorAll('.qa-card').forEach(card => {
        if (isAllExpanded) {
          card.classList.add('open');
        } else {
          card.classList.remove('open');
        }
      });
    }

    function toggleFilterMastered() {
      filterOnlyUnmastered = !filterOnlyUnmastered;
      const btn = document.getElementById('filterMasteredBtn');
      btn.classList.toggle('active-filter', filterOnlyUnmastered);
      btn.textContent = filterOnlyUnmastered ? "✓ 僅顯示未掌握" : "⭐ 只看未掌握";
      applyFilters();
    }

    function handleSearch() {
      applyFilters();
    }

    function applyFilters() {
      const query = document.getElementById('searchInput').value.trim().toLowerCase();
      currentData = RAW_DATA.filter(item => {
        if (filterOnlyUnmastered && masteredSet.has(item.id)) {
          return false;
        }
        if (query) {
          const matchQ = item.question.toLowerCase().includes(query);
          const matchA = item.answer.toLowerCase().includes(query);
          return matchQ || matchA;
        }
        return true;
      });

      cardIndex = 0;
      if (currentMode === 'list') {
        renderList();
      } else {
        updateCardView();
      }
      updateStats();
    }

    function shuffleCards() {
      currentData.sort(() => Math.random() - 0.5);
      cardIndex = 0;
      if (currentMode === 'list') {
        renderList();
      } else {
        updateCardView();
      }
    }

    function resetOrder() {
      currentData.sort((a, b) => a.id - b.id);
      cardIndex = 0;
      if (currentMode === 'list') {
        renderList();
      } else {
        updateCardView();
      }
    }

    function switchMode(mode) {
      currentMode = mode;
      const listBtn = document.getElementById('listViewBtn');
      const cardBtn = document.getElementById('cardViewBtn');
      const qaList = document.getElementById('qaList');
      const flashcardContainer = document.getElementById('flashcardContainer');
      const expandAllBtn = document.getElementById('expandAllBtn');

      if (mode === 'list') {
        listBtn.classList.add('active');
        cardBtn.classList.remove('active');
        qaList.style.display = 'flex';
        flashcardContainer.style.display = 'none';
        expandAllBtn.style.display = 'inline-flex';
        renderList();
      } else {
        cardBtn.classList.add('active');
        listBtn.classList.remove('active');
        qaList.style.display = 'none';
        flashcardContainer.style.display = 'flex';
        expandAllBtn.style.display = 'none';
        updateCardView();
      }
    }

    /* Flashcard Functions */
    function flipCard() {
      const wrapper = document.getElementById('flashcardWrapper');
      wrapper.classList.toggle('flipped');
    }

    function updateCardView() {
      const wrapper = document.getElementById('flashcardWrapper');
      wrapper.classList.remove('flipped');

      if (currentData.length === 0) {
        document.getElementById('fcQuestion').textContent = '無卡片資料';
        document.getElementById('fcAnswer').textContent = '無卡片資料';
        document.getElementById('fcCardNumber').textContent = '0 / 0';
        document.getElementById('fcCardNumberBack').textContent = '0 / 0';
        return;
      }

      if (cardIndex < 0) cardIndex = 0;
      if (cardIndex >= currentData.length) cardIndex = currentData.length - 1;

      const item = currentData[cardIndex];
      const isMastered = masteredSet.has(item.id);

      document.getElementById('fcQuestion').textContent = item.question;
      document.getElementById('fcAnswer').textContent = item.answer;

      const cardNumText = `卡片 ${cardIndex + 1} / ${currentData.length} (#${item.id})`;
      document.getElementById('fcCardNumber').textContent = cardNumText;
      document.getElementById('fcCardNumberBack').textContent = cardNumText;

      const btn1 = document.getElementById('fcMasterBtn');
      const btn2 = document.getElementById('fcMasterBtnBack');
      btn1.classList.toggle('is-mastered', isMastered);
      btn2.classList.toggle('is-mastered', isMastered);

      renderMath();
    }

    function prevCard() {
      if (currentData.length === 0) return;
      cardIndex = (cardIndex - 1 + currentData.length) % currentData.length;
      updateCardView();
    }

    function nextCard() {
      if (currentData.length === 0) return;
      cardIndex = (cardIndex + 1) % currentData.length;
      updateCardView();
    }

    function toggleCardMaster(event) {
      event.stopPropagation();
      if (currentData.length === 0) return;
      const item = currentData[cardIndex];
      toggleMaster(event, item.id);
      updateCardView();
    }

    /* Keyboard Shortcuts */
    window.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT') return;
      if (currentMode === 'card') {
        if (e.code === 'Space') {
          e.preventDefault();
          flipCard();
        } else if (e.code === 'ArrowLeft') {
          e.preventDefault();
          prevCard();
        } else if (e.code === 'ArrowRight') {
          e.preventDefault();
          nextCard();
        } else if (e.code === 'KeyM') {
          e.preventDefault();
          toggleCardMaster(e);
        }
      }
    });

    // Init
    window.addEventListener('DOMContentLoaded', () => {
      updateStats();
      renderList();
      setTimeout(renderMath, 200);
    });
  </script>
</body>
</html>
