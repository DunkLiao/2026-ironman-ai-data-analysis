<!DOCTYPE html>
<html lang="zh-TW" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Day5 - 問答複習卡</title>
  <!-- KaTeX for LaTeX rendering -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
  <style>
    :root {
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --primary-light: #eff6ff;
      --border-color: #e2e8f0;
      --success: #10b981;
      --success-light: #ecfdf5;
      --accent: #f59e0b;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
      --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.08), 0 2px 4px -2px rgba(0,0,0,0.05);
      --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.1), 0 4px 6px -4px rgba(0,0,0,0.05);
      --radius: 12px;
    }

    html[data-theme="dark"] {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #60a5fa;
      --primary-hover: #3b82f6;
      --primary-light: #1e3a8a33;
      --border-color: #334155;
      --success: #34d399;
      --success-light: #064e3b33;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans TC", sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      line-height: 1.6;
      padding-bottom: 60px;
    }

    /* Navigation / Header */
    header {
      background: var(--card-bg);
      border-bottom: 1px solid var(--border-color);
      position: sticky;
      top: 0;
      z-index: 50;
      box-shadow: var(--shadow-sm);
    }

    .header-container {
      max-width: 900px;
      margin: 0 auto;
      padding: 14px 20px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .nav-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 8px;
      background: var(--primary-light);
      color: var(--primary);
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      transition: all 0.2s;
    }

    .back-btn:hover {
      background: var(--primary);
      color: #fff;
    }

    .page-title {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .view-toggles {
      display: flex;
      background: var(--bg-color);
      padding: 3px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
    }

    .header-actions {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: flex-end;
    }

    .toggle-btn {
      padding: 6px 14px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .toggle-btn.active {
      background: var(--card-bg);
      color: var(--primary);
      box-shadow: var(--shadow-sm);
    }

    .theme-toggle {
      padding: 7px 12px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      background: var(--card-bg);
      color: var(--text-main);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: var(--shadow-sm);
      transition: border-color 0.2s, color 0.2s, background 0.2s;
    }

    .theme-toggle:hover {
      border-color: var(--primary);
      color: var(--primary);
    }

    /* Main Container */
    main {
      max-width: 900px;
      margin: 24px auto;
      padding: 0 20px;
    }

    /* Toolbar */
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 20px;
      align-items: center;
      justify-content: space-between;
    }

    .search-box {
      flex: 1;
      min-width: 240px;
      position: relative;
    }

    .search-box input {
      width: 100%;
      padding: 10px 14px 10px 38px;
      border-radius: 10px;
      border: 1px solid var(--border-color);
      background: var(--card-bg);
      color: var(--text-main);
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-box input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-light);
    }

    .search-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 14px;
    }

    .action-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background: var(--card-bg);
      color: var(--text-main);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn:hover {
      background: var(--border-color);
    }

    .btn.active-filter {
      background: var(--primary-light);
      border-color: var(--primary);
      color: var(--primary);
    }

    /* Stats bar */
    .stats-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      font-size: 14px;
      color: var(--text-muted);
    }

    .progress-bar-container {
      flex: 1;
      height: 8px;
      background: var(--border-color);
      border-radius: 99px;
      margin: 0 16px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: var(--success);
      width: 0%;
      transition: width 0.3s ease;
    }

    /* List View Cards */
    .qa-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .qa-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      box-shadow: var(--shadow-sm);
      overflow: hidden;
      transition: box-shadow 0.2s, border-color 0.2s;
    }

    .qa-card:hover {
      box-shadow: var(--shadow-md);
      border-color: #cbd5e1;
    }

    .qa-card.mastered {
      border-left: 4px solid var(--success);
    }

    .qa-header {
      padding: 16px 20px;
      display: flex;
      align-items: flex-start;
      gap: 12px;
      cursor: pointer;
      user-select: none;
    }

    .qa-id {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 28px;
      height: 28px;
      background: var(--primary-light);
      color: var(--primary);
      border-radius: 6px;
      font-size: 13px;
      font-weight: 700;
      margin-top: 2px;
      flex-shrink: 0;
    }

    .qa-question {
      flex: 1;
      font-size: 15px;
      font-weight: 600;
      color: var(--text-main);
      padding-top: 2px;
    }

    .qa-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .master-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 18px;
      padding: 4px;
      border-radius: 6px;
      transition: transform 0.15s, color 0.15s;
    }

    .master-btn:hover {
      transform: scale(1.15);
    }

    .master-btn.is-mastered {
      color: var(--accent);
    }

    .expand-icon {
      color: var(--text-muted);
      font-size: 14px;
      transition: transform 0.2s ease;
    }

    .qa-card.open .expand-icon {
      transform: rotate(180deg);
    }

    .qa-answer {
      display: none;
      padding: 16px 20px 18px 60px;
      background: var(--bg-color);
      border-top: 1px dashed var(--border-color);
      font-size: 15px;
      color: var(--text-main);
      line-height: 1.7;
    }

    .qa-card.open .qa-answer {
      display: block;
      animation: fadeIn 0.2s ease-in;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Flashcard Mode */
    .flashcard-container {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      padding: 10px 0;
    }

    .flashcard-wrapper {
      perspective: 1000px;
      width: 100%;
      max-width: 640px;
      min-height: 340px;
      cursor: pointer;
    }

    .flashcard-inner {
      position: relative;
      width: 100%;
      height: 100%;
      min-height: 340px;
      text-align: center;
      transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
      transform-style: preserve-3d;
      border-radius: 16px;
      box-shadow: var(--shadow-lg);
    }

    .flashcard-wrapper.flipped .flashcard-inner {
      transform: rotateY(180deg);
    }

    .flashcard-face {
      position: absolute;
      width: 100%;
      height: 100%;
      min-height: 340px;
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 30px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      box-sizing: border-box;
    }

    .flashcard-back {
      transform: rotateY(180deg);
      background: var(--card-bg);
      border: 2px solid var(--primary);
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      color: var(--text-muted);
    }

    .card-badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 99px;
      font-weight: 600;
      font-size: 12px;
    }

    .badge-q {
      background: var(--primary-light);
      color: var(--primary);
    }

    .badge-a {
      background: var(--success-light);
      color: var(--success);
    }

    .card-body {
      margin: auto 0;
      padding: 20px 10px;
      font-size: 18px;
      font-weight: 600;
      line-height: 1.6;
    }

    .card-hint {
      font-size: 12px;
      color: var(--text-muted);
    }

    .flashcard-controls {
      display: flex;
      gap: 12px;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 640px;
    }

    .flashcard-controls .btn {
      padding: 10px 20px;
      font-size: 14px;
      font-weight: 600;
    }

    .btn-primary {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    .btn-primary:hover {
      background: var(--primary-hover);
    }

    .shortcuts-hint {
      font-size: 12px;
      color: var(--text-muted);
      text-align: center;
      margin-top: 8px;
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
      background: var(--card-bg);
      border-radius: var(--radius);
      border: 1px dashed var(--border-color);
    }
  </style>
</head>
<body>
  <header>
    <div class="header-container">
      <div class="nav-left">
        <a href="index.html" class="back-btn" title="回目錄">← 目錄</a>
        <h1 class="page-title">Day5 問答卡</h1>
      </div>
      <div class="header-actions">
        <button class="theme-toggle" id="themeToggleBtn" type="button" onclick="toggleTheme()" aria-label="切換為深色模式">深色模式</button>
        <div class="view-toggles">
          <button id="listViewBtn" class="toggle-btn active" onclick="switchMode('list')">📋 列表模式</button>
          <button id="cardViewBtn" class="toggle-btn" onclick="switchMode('card')">🎴 翻卡測驗</button>
        </div>
      </div>
    </div>
  </header>

  <main>
    <div class="toolbar">
      <div class="search-box">
        <span class="search-icon">🔍</span>
        <input type="text" id="searchInput" placeholder="搜尋問題或答案關鍵字..." oninput="handleSearch()">
      </div>
      <div class="action-buttons">
        <button class="btn" id="filterMasteredBtn" onclick="toggleFilterMastered()">⭐ 只看未掌握</button>
        <button class="btn" id="expandAllBtn" onclick="toggleExpandAll()">展開全部</button>
        <button class="btn" onclick="shuffleCards()">🔀 隨機洗牌</button>
        <button class="btn" onclick="resetOrder()">🔄 恢復順序</button>
      </div>
    </div>

    <div class="stats-bar">
      <span id="statsCount">總計 0 題</span>
      <div class="progress-bar-container">
        <div id="progressFill" class="progress-fill"></div>
      </div>
      <span id="statsMastered">掌握率 0%</span>
    </div>

    <!-- List View -->
    <div id="qaList" class="qa-list"></div>

    <!-- Flashcard Mode View -->
    <div id="flashcardContainer" class="flashcard-container">
      <div class="flashcard-wrapper" id="flashcardWrapper" onclick="flipCard()">
        <div class="flashcard-inner">
          <!-- Front Face -->
          <div class="flashcard-face flashcard-front">
            <div class="card-top">
              <span class="card-badge badge-q">問題</span>
              <span id="fcCardNumber">卡片 1 / 1</span>
              <button class="master-btn" id="fcMasterBtn" onclick="toggleCardMaster(event)" title="標記為已掌握">★</button>
            </div>
            <div class="card-body" id="fcQuestion">載入中...</div>
            <div class="card-hint">💡 點擊卡片或按空白鍵翻面看答案</div>
          </div>
          <!-- Back Face -->
          <div class="flashcard-face flashcard-back">
            <div class="card-top">
              <span class="card-badge badge-a">解答</span>
              <span id="fcCardNumberBack">卡片 1 / 1</span>
              <button class="master-btn" id="fcMasterBtnBack" onclick="toggleCardMaster(event)" title="標記為已掌握">★</button>
            </div>
            <div class="card-body" id="fcAnswer">載入中...</div>
            <div class="card-hint">💡 再次點擊卡片翻回正面</div>
          </div>
        </div>
      </div>

      <div class="flashcard-controls">
        <button class="btn" onclick="prevCard()">← 上一題</button>
        <button class="btn btn-primary" onclick="flipCard()">翻轉卡片</button>
        <button class="btn" onclick="nextCard()">下一題 →</button>
      </div>
      <div class="shortcuts-hint">鍵盤快速鍵：[←] 上一題 · [空白鍵] 翻面 · [→] 下一題 · [M] 標記掌握</div>
    </div>
  </main>

  <script>
    const THEME_STORAGE_KEY = "qa_theme";
    const STORAGE_KEY = "anki_mastered_" + "Day5";
    const RAW_DATA = [{"id":1,"question":"預計到 $2025$ 年底，金融機構大規模利用人工智慧（AI）的比例將從 $2023$ 年的 $30\\%$ 上升至多少？","answer":"超過 $70\\%$。"},{"id":2,"question":"根據 Deloitte $2024$ 年的報告，金融業中符合或超過投資報酬率（ROI）預期的 AI 專案比例為何？","answer":"僅有 $38\\%$。"},{"id":3,"question":"Caspian One 認為金融機構 AI 專案停滯不前的核心原因為何？","answer":"人才缺口（特別是具備金融領域知識的人才），而非技術本身。"},{"id":4,"question":"金融機構聘請來自大型科技公司的「一般型」機器學習工程師，常面臨的主要問題是什麼？","answer":"缺乏對金融系統、合規指令或操作限制的理解。"},{"id":5,"question":"根據 Goldman Sachs $2024$ 年的數據，具備金融領域經驗的 AI 專家，其實現專案速度比一般通才快多少？","answer":"快將近 $80\\%$。"},{"id":6,"question":"金融服務業規模化 AI 應用的三大核心障礙為何？","answer":"專業人才短缺、合規與監管複雜性、遺留基礎設施與技術債。"},{"id":7,"question":"在金融 AI 團隊中，「機器學習工程師」（ML Engineers）必須具備哪種技術能力的流利度？","answer":"建構低延遲、高吞吐量且能在實時環境運行的模型。"},{"id":8,"question":"「AI 量化專家」（AI Quantitative Specialists）在金融 AI 專案中的主要職責為何？","answer":"設計並改進用於預測分析、投資組合優化和生成超額收益（Alpha）的模型。"},{"id":9,"question":"金融業中的「MLOps 專家」如何確保模型的治理合規？","answer":"確保模型表現一致、不發生漂移（Drift），並符合內部與外部控制。"},{"id":10,"question":"「自然語言處理（NLP）專家」在金融服務中的一個關鍵應用領域為何？","answer":"監管合規自動化、契約分析或市場情緒分析。"},{"id":11,"question":"預計於 $2025$ 年實施的歐盟《人工智慧法案》（EU AI Act）對金融服務的主要影響為何？","answer":"部署高風險系統（如信用評分、欺詐檢測）的企業必須遵守嚴格的透明度、風險緩解和人工監督義務。"},{"id":12,"question":"違反歐盟《人工智慧法案》可能面臨的最高處罰金額為何？","answer":"全球年度總營業額的 $6\\%$。"},{"id":13,"question":"金融監管機構對 AI 決策系統的基本要求包括透明度、可審計性、無偏見以及什麼？","answer":"可追溯性與問責制（Traceability & Accountability）。"},{"id":14,"question":"根據 EY 的調查，有多少百分比的金融業技術長（CTO）將「遺留系統」視為 AI 採用的最大障礙？","answer":"$68\\%$。"},{"id":15,"question":"金融機構為解決遺留基礎設施挑戰而採取的「現代化而不中斷」策略之一為何？","answer":"在容器化或混合雲環境中部署 AI 解決方案。"},{"id":16,"question":"金融服務組織報告的 AI 投資平均投資報酬率（ROI）為何？","answer":"$180\\%$。"},{"id":17,"question":"在金融 AI 用例評估框架中，哪三個軸線被用於評分優先順序？","answer":"業務影響力 ($40\\%$)、技術可行性 ($35\\%$)、實施速度 ($25\\%$)。"},{"id":18,"question":"根據 $2026$ 年指南，金融機構中排名第一、應優先部署的 AI 用例為何？","answer":"實時欺詐檢測（Real-time fraud detection）。"},{"id":19,"question":"為什麼「信用評分 AI」被歸類為高風險用例？","answer":"因為它直接影響個人的金融權利，需符合歐盟 AI 法案的偏差測試與可解釋性要求。"},{"id":20,"question":"處於「第二階段成熟度」（Stage 2）的金融機構，應同時運行多少個 AI 用例？","answer":"$3$ 至 $5$ 個。"},{"id":21,"question":"「實時欺詐檢測」用例從投資到產生回報（Time to ROI）通常需要多久？","answer":"$6$ 至 $9$ 個月。"},{"id":22,"question":"Arrow Risk Management 使用哪種工具來解決數據分散與手動報告的問題？","answer":"Zoho Analytics。"},{"id":23,"question":"Zoho Analytics 如何確保 Arrow Risk Management 的多幣種報告一致性？","answer":"連接 FloatRates.com 的實時匯率數據，並通過 SQL 查詢將貨幣轉換為英鎊與美元。"},{"id":24,"question":"商業智慧（BI）與傳統財務報告在「速度」上有何主要差異？","answer":"傳統報告通常是每月或每季，BI 則提供每日、盤中或實時數據。"},{"id":25,"question":"在保險業中，哪種報告層級有助於將技術準備金溯源至原始數據？","answer":"償付能力二號（Solvency II）報告層。"},{"id":26,"question":"根據 Microsoft 的研究，Power BI 每年可為每位使用者平均節省多少小時？","answer":"$125$ 小時。"},{"id":27,"question":"金融業中 BI 工具選擇的關鍵標準除了視覺化外，還包括什麼？","answer":"基於角色的存取控制（RBAC）、資料連結、審計追蹤與資料血緣。"},{"id":28,"question":"什麼是「資料血緣」（Data Lineage）？","answer":"了解數據的來源、用途以及在使用前如何發生變化的完整紀錄。"},{"id":29,"question":"「BCBS 239」法規對金融機構的資料血緣提出了哪三個具體要求？","answer":"必須具備資料血緣、血緣必須「完整」（覆蓋所有系統）、且必須達到「屬性」（Attribute）級別。"},{"id":30,"question":"《數位營運韌性法案》（DORA）對金融企業的主要要求為何？","answer":"增強抗風險能力，減少網路攻擊造成的中斷並縮短恢復時間。"},{"id":31,"question":"在 AI 監管環境下，組織必須對用戶披露什麼？","answer":"內容是由 AI 生成或修改的。"},{"id":32,"question":"「環境、社會和治理」（ESG）數據合規中，資料血緣的作用為何？","answer":"將評估指標與公司內部的數據流聯繫起來，為評估機構提供完整的證明。"},{"id":33,"question":"Monocle 為大型銀行進行的 PoC 顯示，GenAI 可減少多少比例的常規財務報告評論工作時間？","answer":"約總月度報告時間的 $15\\%$。"},{"id":34,"question":"「生成式商業智慧」（GenBI）與傳統 BI 的根本區別在於什麼？","answer":"GenBI 使用自然語言與主動工作流，能預測未來結果並自動調整數據模型。"},{"id":35,"question":"GenBI 的「語義層」（Semantic Layer）或「上下文層」有何作用？","answer":"它將技術術語與業務邏輯編織在一起，使系統能理解如「哪個客戶群帶動增長」等自然語言查詢。"},{"id":36,"question":"GenBI 系統中的「代理工作流」（Agentic Workflow）如何處理模稜兩可的查詢？","answer":"它會像人類同事一樣主動提出澄清問題。"},{"id":37,"question":"「人機協作」（Human-in-the-loop）在 GenBI 中的必要性為何？","answer":"人類能理解 AI 可能忽略的行業微妙細微差別，並進行品質保證與倫理裁決。"},{"id":38,"question":"The Data Institute 提出的 GenBI 實施五階段路徑為何？","answer":"數據審計、策略開發、架構設計、解決方案實施、變革管理。"},{"id":39,"question":"在實施 GenBI 時，「變革管理」階段的核心任務為何？","answer":"轉變企業文化，賦予員工數據素養並建立分析卓越中心（CoE）。"},{"id":40,"question":"「數據目錄」（Data Catalog）如何解決 AI 採用的整合挑戰？","answer":"提供公司所有數據的中央目錄，提高可發現性與管理效率。"},{"id":41,"question":"為什麼「垃圾進，垃圾出」（Garbage In, Garbage Out）在 AI 時代更具威脅？","answer":"因為生成式 AI 產生的錯誤描述可能非常具有權威感，難以被決策者察覺。"},{"id":42,"question":"LatentView 報告中，部署對話式 BI 接口後，手動數據請求減少了多少比例？","answer":"$60\\%$。"},{"id":43,"question":"什麼是「檢索增強生成」（RAG）在 GenBI 中的作用？","answer":"將當前知識與事實來源整合，使 AI 答案具有來源證明（Grounding）。"},{"id":44,"question":"金融機構在進行 AI 基礎設施現代化時，通常優先考慮哪種架構？","answer":"雲端原生（Cloud-native）架構。"},{"id":45,"question":"在「代理式 AI」系統中，存取控制（Access Control）應在哪一層應用？","answer":"檢索層（Retrieval layer），而非僅在呈現層。"},{"id":46,"question":"「遺留數據孤島」（Legacy Data Silos）如何影響 AI 模型的訓練？","answer":"它限制了獲取乾淨、結構化且相關數據的機會，導致模型精度下降。"},{"id":47,"question":"保險業如何利用 GenAI 提升理賠效率？","answer":"透過自動化理賠處理（Claims processing automation），縮短處理週期並降低成本。"},{"id":48,"question":"「雙時態視圖」（Bi-temporal views）在合規審計中的功能為何？","answer":"允許用戶在任何時間點快照其數據資產模型，以向監管機構證明變更細節。"},{"id":49,"question":"傳統 BI 的一個主要缺點是「非專家的複雜性」，這具體指什麼？","answer":"並非所有人都有技能去構建或解釋複雜的儀表板報告。"},{"id":50,"question":"一個成功的金融 AI 團隊應由哪三種專業背景的人員組成？","answer":"金融 AI 工程師、MLOps & 基礎設施專家、AI 治理與合規專家。"},{"id":51,"question":"在零售銀行中，BI 如何協助風險管理？","answer":"監測早期預警指標，如逾期增加、風險集中度或抵押品價值惡化。"},{"id":52,"question":"「自然語言生成」（NLG）如何輔助非技術利害關係人？","answer":"將數據輸出轉化為簡明易懂的敘述，解釋指標變動的原因。"},{"id":53,"question":"為什麼「數據質量」是 GenAI BI 部署中最常見的失敗模式？","answer":"因為流利的生成文本可能掩蓋潛在的數據分析錯誤，誤導決策。"},{"id":54,"question":"金融服務業 AI 市場預計到 $2030$ 年將增長至多少規模？","answer":"約 $1435.6$ 億英鎊。"},{"id":55,"question":"生成式 AI（Generative AI）子集的複合年增長率（CAGR）預計為何？","answer":"$39.1\\%$。"},{"id":56,"question":"金融 AI 專案成功與否的「差異化因素」是什麼？","answer":"嵌入在倡議中的人才類型（特別是具備金融領域知識的專家）。"},{"id":57,"question":"為什麼 AI 治理（AI Governance）人才被視為與基礎設施同樣重要的障礙？","answer":"缺乏能使創新符合監管預期的專業人員，會導致專案無法實現或不合規。"},{"id":58,"question":"遺留系統帶來的「技術債」如何延遲 AI 專案？","answer":"由於與現有基礎設施的兼容性挑戰，實施延遲平均達 $12$ 至 $18$ 個月。"},{"id":59,"question":"在「場景預測」中，GenAI 相對於傳統 BI 的優勢為何？","answer":"能利用歷史數據快速進行大規模的場景探索與預測，而非勞動力密集的計算。"},{"id":60,"question":"資產管理公司如何利用 BI 進行「績效歸因」（Performance Attribution）？","answer":"將每一筆向客戶展示的數據，追溯至官方紀錄簿並進行解釋。"},{"id":61,"question":"對小規模金融科技公司而言，選擇 BI 工具應優先考慮什麼？","answer":"雲端原生、強大的 API、嵌入式分析功能以及可預測的成本。"},{"id":62,"question":"「合成數據生成」（Synthetic Data Generation）如何解決信用建模中的數據稀缺問題？","answer":"生成保留統計特性但去除個人資訊的數據集，在不違反 GDPR 的情況下訓練模型。"},{"id":63,"question":"金融服務領導者認為 AI 人才短缺是關鍵障礙的比例是多少？","answer":"$73\\%$。"},{"id":64,"question":"「代理式 AI」如何協助監管報告（如 MiFID II）？","answer":"自動識別報告錯誤，並大幅減少合規團隊的手動審查工作量。"},{"id":65,"question":"數據科學家、業務分析師、開發人員在 AI 專案中應如何協作？","answer":"跨職能協作，從概念驗證（PoC）一路執行到系統嵌入。"},{"id":66,"question":"「知識圖譜」（Knowledge Graph）在欺詐檢測中的作用為何？","answer":"透過分析交易之間的網絡關係，減少誤報並識別異常行為。"},{"id":67,"question":"傳統 BI 系統的「靜態性」如何限制企業對市場變化的反應？","answer":"構建新報告或更新儀表板可能需要數天甚至數週的時間。"},{"id":68,"question":"「上下文層」學習能力對 GenBI 有何長期好處？","answer":"每次用戶互動都會改進知識庫，使未來的查詢結果越來越精確。"},{"id":69,"question":"金融機構應如何衡量 BI 投資的 ROI？","answer":"透過節省的時間、報告質量、決策速度、風險降低及採用率來衡量。"},{"id":70,"question":"為什麼「早期合規專家參與」能降低監管違規風險？","answer":"預計可降低超過 $70\\%$ 的違規可能性，因為合規性從設計階段就已嵌入。"},{"id":71,"question":"數據治理中的「角色基礎存取控制」（RBAC）在 BI 儀表板中的作用為何？","answer":"確保敏感數據（如客戶個人資訊）僅由授權人員查看。"},{"id":72,"question":"什麼是「數據湖倉」（Data Lakehouse）？","answer":"結合了數據倉庫的結構化報告能力與數據湖處理日誌、事件與 ML 特徵的靈活性。"},{"id":73,"question":"金融 AI 決策系統中的「黑色盒子」（Black-box）模型為何面臨困境？","answer":"因為在高風險背景下，缺乏透明度的決策邏輯越來越難以被監管機構接受。"},{"id":74,"question":"在實施 BI 解決方案時，為什麼 FP&A（財務規劃與分析）常被選為試點項目？","answer":"因為它直接聯繫到報告成本、預測準確性以及高管的可見性。"},{"id":75,"question":"根據 $2026$ 年趨勢，對話式 AI 如何改變結構化金融分析？","answer":"無需技術專長，即可透過自然語言將複雜數據轉化為即時、可操作的見解。"},{"id":76,"question":"「資料映射」（Data Mapping）在處理客戶數據刪除請求（GDPR）時的作用為何？","answer":"幫助視覺化敏感數據在電子郵件、交易系統等多個系統間的流動，確保刪除完全。"},{"id":77,"question":"什麼是「莫拉維克悖論」（Moravec's Paradox）在 AI 討論中的含義？","answer":"高層次推理所需的計算資源相對較少，但低層次感知動作技能卻需要巨大的資源（暗示 AI 在判斷力上仍需人類輔助）。"},{"id":78,"question":"金融機構如何在不重建整個系統的情況下應對遺留挑戰？","answer":"使用中間件（Middleware）與編排工具來橋接新舊系統。"},{"id":79,"question":"「資料溯源」如何協助 IFRS 17 規定的保險公司利潤與負債報告？","answer":"提供可核實的數據流程，確保報告的數據來源透明且符合會計準則。"}];
    let currentData = [...RAW_DATA];
    let masteredSet = new Set(JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]"));
    let currentMode = 'list';
    let filterOnlyUnmastered = false;
    let isAllExpanded = false;
    let cardIndex = 0;

    function applyTheme(theme) {
      const normalizedTheme = theme === "dark" ? "dark" : "light";
      document.documentElement.dataset.theme = normalizedTheme;

      const btn = document.getElementById("themeToggleBtn");
      if (btn) {
        const isDark = normalizedTheme === "dark";
        btn.textContent = isDark ? "淺色模式" : "深色模式";
        btn.setAttribute("aria-label", isDark ? "切換為淺色模式" : "切換為深色模式");
      }
    }

    function initializeTheme() {
      const savedTheme = localStorage.getItem(THEME_STORAGE_KEY) || "light";
      applyTheme(savedTheme);
    }

    function toggleTheme() {
      const nextTheme = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
      localStorage.setItem(THEME_STORAGE_KEY, nextTheme);
      applyTheme(nextTheme);
    }

    initializeTheme();

    function saveMastered() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(Array.from(masteredSet)));
      updateStats();
    }

    function updateStats() {
      const total = RAW_DATA.length;
      const masteredCount = RAW_DATA.filter(item => masteredSet.has(item.id)).length;
      const pct = total === 0 ? 0 : Math.round((masteredCount / total) * 100);

      document.getElementById('statsCount').textContent = `顯示 ${currentData.length} / 共 ${total} 題`;
      document.getElementById('statsMastered').textContent = `已掌握 ${masteredCount} 題 (${pct}%)`;
      document.getElementById('progressFill').style.width = pct + '%';
    }

    function renderMath() {
      if (window.renderMathInElement) {
        renderMathInElement(document.body, {
          delimiters: [
            {left: '$$', right: '$$', display: true},
            {left: '$', right: '$', display: false}
          ],
          throwOnError: false
        });
      }
    }

    function renderList() {
      const container = document.getElementById('qaList');
      if (currentData.length === 0) {
        container.innerHTML = '<div class="empty-state">沒有符合條件的問答卡片</div>';
        return;
      }

      container.innerHTML = currentData.map(item => {
        const isMastered = masteredSet.has(item.id);
        return `
          <div class="qa-card ${isMastered ? 'mastered' : ''} ${isAllExpanded ? 'open' : ''}" id="card-${item.id}">
            <div class="qa-header" onclick="toggleItem(${item.id})">
              <span class="qa-id">#${item.id}</span>
              <span class="qa-question">${escapeHtml(item.question)}</span>
              <div class="qa-actions">
                <button class="master-btn ${isMastered ? 'is-mastered' : ''}"
                        onclick="toggleMaster(event, ${item.id})"
                        title="${isMastered ? '已掌握' : '標記掌握'}">★</button>
                <span class="expand-icon">▼</span>
              </div>
            </div>
            <div class="qa-answer">${escapeHtml(item.answer)}</div>
          </div>
        `;
      }).join('');

      renderMath();
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    function toggleItem(id) {
      const el = document.getElementById('card-' + id);
      if (el) {
        el.classList.toggle('open');
      }
    }

    function toggleMaster(event, id) {
      event.stopPropagation();
      if (masteredSet.has(id)) {
        masteredSet.delete(id);
      } else {
        masteredSet.add(id);
      }
      saveMastered();
      applyFilters();
    }

    function toggleExpandAll() {
      isAllExpanded = !isAllExpanded;
      document.getElementById('expandAllBtn').textContent = isAllExpanded ? "收合全部" : "展開全部";
      document.querySelectorAll('.qa-card').forEach(card => {
        if (isAllExpanded) {
          card.classList.add('open');
        } else {
          card.classList.remove('open');
        }
      });
    }

    function toggleFilterMastered() {
      filterOnlyUnmastered = !filterOnlyUnmastered;
      const btn = document.getElementById('filterMasteredBtn');
      btn.classList.toggle('active-filter', filterOnlyUnmastered);
      btn.textContent = filterOnlyUnmastered ? "✓ 僅顯示未掌握" : "⭐ 只看未掌握";
      applyFilters();
    }

    function handleSearch() {
      applyFilters();
    }

    function applyFilters() {
      const query = document.getElementById('searchInput').value.trim().toLowerCase();
      currentData = RAW_DATA.filter(item => {
        if (filterOnlyUnmastered && masteredSet.has(item.id)) {
          return false;
        }
        if (query) {
          const matchQ = item.question.toLowerCase().includes(query);
          const matchA = item.answer.toLowerCase().includes(query);
          return matchQ || matchA;
        }
        return true;
      });

      cardIndex = 0;
      if (currentMode === 'list') {
        renderList();
      } else {
        updateCardView();
      }
      updateStats();
    }

    function shuffleCards() {
      currentData.sort(() => Math.random() - 0.5);
      cardIndex = 0;
      if (currentMode === 'list') {
        renderList();
      } else {
        updateCardView();
      }
    }

    function resetOrder() {
      currentData.sort((a, b) => a.id - b.id);
      cardIndex = 0;
      if (currentMode === 'list') {
        renderList();
      } else {
        updateCardView();
      }
    }

    function switchMode(mode) {
      currentMode = mode;
      const listBtn = document.getElementById('listViewBtn');
      const cardBtn = document.getElementById('cardViewBtn');
      const qaList = document.getElementById('qaList');
      const flashcardContainer = document.getElementById('flashcardContainer');
      const expandAllBtn = document.getElementById('expandAllBtn');

      if (mode === 'list') {
        listBtn.classList.add('active');
        cardBtn.classList.remove('active');
        qaList.style.display = 'flex';
        flashcardContainer.style.display = 'none';
        expandAllBtn.style.display = 'inline-flex';
        renderList();
      } else {
        cardBtn.classList.add('active');
        listBtn.classList.remove('active');
        qaList.style.display = 'none';
        flashcardContainer.style.display = 'flex';
        expandAllBtn.style.display = 'none';
        updateCardView();
      }
    }

    /* Flashcard Functions */
    function flipCard() {
      const wrapper = document.getElementById('flashcardWrapper');
      wrapper.classList.toggle('flipped');
    }

    function updateCardView() {
      const wrapper = document.getElementById('flashcardWrapper');
      wrapper.classList.remove('flipped');

      if (currentData.length === 0) {
        document.getElementById('fcQuestion').textContent = '無卡片資料';
        document.getElementById('fcAnswer').textContent = '無卡片資料';
        document.getElementById('fcCardNumber').textContent = '0 / 0';
        document.getElementById('fcCardNumberBack').textContent = '0 / 0';
        return;
      }

      if (cardIndex < 0) cardIndex = 0;
      if (cardIndex >= currentData.length) cardIndex = currentData.length - 1;

      const item = currentData[cardIndex];
      const isMastered = masteredSet.has(item.id);

      document.getElementById('fcQuestion').textContent = item.question;
      document.getElementById('fcAnswer').textContent = item.answer;

      const cardNumText = `卡片 ${cardIndex + 1} / ${currentData.length} (#${item.id})`;
      document.getElementById('fcCardNumber').textContent = cardNumText;
      document.getElementById('fcCardNumberBack').textContent = cardNumText;

      const btn1 = document.getElementById('fcMasterBtn');
      const btn2 = document.getElementById('fcMasterBtnBack');
      btn1.classList.toggle('is-mastered', isMastered);
      btn2.classList.toggle('is-mastered', isMastered);

      renderMath();
    }

    function prevCard() {
      if (currentData.length === 0) return;
      cardIndex = (cardIndex - 1 + currentData.length) % currentData.length;
      updateCardView();
    }

    function nextCard() {
      if (currentData.length === 0) return;
      cardIndex = (cardIndex + 1) % currentData.length;
      updateCardView();
    }

    function toggleCardMaster(event) {
      event.stopPropagation();
      if (currentData.length === 0) return;
      const item = currentData[cardIndex];
      toggleMaster(event, item.id);
      updateCardView();
    }

    /* Keyboard Shortcuts */
    window.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT') return;
      if (currentMode === 'card') {
        if (e.code === 'Space') {
          e.preventDefault();
          flipCard();
        } else if (e.code === 'ArrowLeft') {
          e.preventDefault();
          prevCard();
        } else if (e.code === 'ArrowRight') {
          e.preventDefault();
          nextCard();
        } else if (e.code === 'KeyM') {
          e.preventDefault();
          toggleCardMaster(e);
        }
      }
    });

    // Init
    window.addEventListener('DOMContentLoaded', () => {
      updateStats();
      renderList();
      setTimeout(renderMath, 200);
    });
  </script>
</body>
</html>
