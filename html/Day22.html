<!DOCTYPE html>
<html lang="zh-TW" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Day22 - 問答複習卡</title>
  <!-- KaTeX for LaTeX rendering -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
  <style>
    :root {
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --primary-light: #eff6ff;
      --border-color: #e2e8f0;
      --success: #10b981;
      --success-light: #ecfdf5;
      --accent: #f59e0b;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
      --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.08), 0 2px 4px -2px rgba(0,0,0,0.05);
      --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.1), 0 4px 6px -4px rgba(0,0,0,0.05);
      --radius: 12px;
    }

    html[data-theme="dark"] {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #60a5fa;
      --primary-hover: #3b82f6;
      --primary-light: #1e3a8a33;
      --border-color: #334155;
      --success: #34d399;
      --success-light: #064e3b33;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans TC", sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      line-height: 1.6;
      padding-bottom: 60px;
    }

    /* Navigation / Header */
    header {
      background: var(--card-bg);
      border-bottom: 1px solid var(--border-color);
      position: sticky;
      top: 0;
      z-index: 50;
      box-shadow: var(--shadow-sm);
    }

    .header-container {
      max-width: 900px;
      margin: 0 auto;
      padding: 14px 20px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .nav-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 8px;
      background: var(--primary-light);
      color: var(--primary);
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      transition: all 0.2s;
    }

    .back-btn:hover {
      background: var(--primary);
      color: #fff;
    }

    .page-title {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .view-toggles {
      display: flex;
      background: var(--bg-color);
      padding: 3px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
    }

    .header-actions {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: flex-end;
    }

    .toggle-btn {
      padding: 6px 14px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .toggle-btn.active {
      background: var(--card-bg);
      color: var(--primary);
      box-shadow: var(--shadow-sm);
    }

    .theme-toggle {
      padding: 7px 12px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      background: var(--card-bg);
      color: var(--text-main);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: var(--shadow-sm);
      transition: border-color 0.2s, color 0.2s, background 0.2s;
    }

    .theme-toggle:hover {
      border-color: var(--primary);
      color: var(--primary);
    }

    /* Main Container */
    main {
      max-width: 900px;
      margin: 24px auto;
      padding: 0 20px;
    }

    /* Toolbar */
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 20px;
      align-items: center;
      justify-content: space-between;
    }

    .search-box {
      flex: 1;
      min-width: 240px;
      position: relative;
    }

    .search-box input {
      width: 100%;
      padding: 10px 14px 10px 38px;
      border-radius: 10px;
      border: 1px solid var(--border-color);
      background: var(--card-bg);
      color: var(--text-main);
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-box input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-light);
    }

    .search-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 14px;
    }

    .action-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background: var(--card-bg);
      color: var(--text-main);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn:hover {
      background: var(--border-color);
    }

    .btn.active-filter {
      background: var(--primary-light);
      border-color: var(--primary);
      color: var(--primary);
    }

    /* Stats bar */
    .stats-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      font-size: 14px;
      color: var(--text-muted);
    }

    .progress-bar-container {
      flex: 1;
      height: 8px;
      background: var(--border-color);
      border-radius: 99px;
      margin: 0 16px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: var(--success);
      width: 0%;
      transition: width 0.3s ease;
    }

    /* List View Cards */
    .qa-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .qa-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      box-shadow: var(--shadow-sm);
      overflow: hidden;
      transition: box-shadow 0.2s, border-color 0.2s;
    }

    .qa-card:hover {
      box-shadow: var(--shadow-md);
      border-color: #cbd5e1;
    }

    .qa-card.mastered {
      border-left: 4px solid var(--success);
    }

    .qa-header {
      padding: 16px 20px;
      display: flex;
      align-items: flex-start;
      gap: 12px;
      cursor: pointer;
      user-select: none;
    }

    .qa-id {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 28px;
      height: 28px;
      background: var(--primary-light);
      color: var(--primary);
      border-radius: 6px;
      font-size: 13px;
      font-weight: 700;
      margin-top: 2px;
      flex-shrink: 0;
    }

    .qa-question {
      flex: 1;
      font-size: 15px;
      font-weight: 600;
      color: var(--text-main);
      padding-top: 2px;
    }

    .qa-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .master-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 18px;
      padding: 4px;
      border-radius: 6px;
      transition: transform 0.15s, color 0.15s;
    }

    .master-btn:hover {
      transform: scale(1.15);
    }

    .master-btn.is-mastered {
      color: var(--accent);
    }

    .expand-icon {
      color: var(--text-muted);
      font-size: 14px;
      transition: transform 0.2s ease;
    }

    .qa-card.open .expand-icon {
      transform: rotate(180deg);
    }

    .qa-answer {
      display: none;
      padding: 16px 20px 18px 60px;
      background: var(--bg-color);
      border-top: 1px dashed var(--border-color);
      font-size: 15px;
      color: var(--text-main);
      line-height: 1.7;
    }

    .qa-card.open .qa-answer {
      display: block;
      animation: fadeIn 0.2s ease-in;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Flashcard Mode */
    .flashcard-container {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      padding: 10px 0;
    }

    .flashcard-wrapper {
      perspective: 1000px;
      width: 100%;
      max-width: 640px;
      min-height: 340px;
      cursor: pointer;
    }

    .flashcard-inner {
      position: relative;
      width: 100%;
      height: 100%;
      min-height: 340px;
      text-align: center;
      transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
      transform-style: preserve-3d;
      border-radius: 16px;
      box-shadow: var(--shadow-lg);
    }

    .flashcard-wrapper.flipped .flashcard-inner {
      transform: rotateY(180deg);
    }

    .flashcard-face {
      position: absolute;
      width: 100%;
      height: 100%;
      min-height: 340px;
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 30px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      box-sizing: border-box;
    }

    .flashcard-back {
      transform: rotateY(180deg);
      background: var(--card-bg);
      border: 2px solid var(--primary);
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      color: var(--text-muted);
    }

    .card-badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 99px;
      font-weight: 600;
      font-size: 12px;
    }

    .badge-q {
      background: var(--primary-light);
      color: var(--primary);
    }

    .badge-a {
      background: var(--success-light);
      color: var(--success);
    }

    .card-body {
      margin: auto 0;
      padding: 20px 10px;
      font-size: 18px;
      font-weight: 600;
      line-height: 1.6;
    }

    .card-hint {
      font-size: 12px;
      color: var(--text-muted);
    }

    .flashcard-controls {
      display: flex;
      gap: 12px;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 640px;
    }

    .flashcard-controls .btn {
      padding: 10px 20px;
      font-size: 14px;
      font-weight: 600;
    }

    .btn-primary {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    .btn-primary:hover {
      background: var(--primary-hover);
    }

    .shortcuts-hint {
      font-size: 12px;
      color: var(--text-muted);
      text-align: center;
      margin-top: 8px;
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
      background: var(--card-bg);
      border-radius: var(--radius);
      border: 1px dashed var(--border-color);
    }
  </style>
</head>
<body>
  <header>
    <div class="header-container">
      <div class="nav-left">
        <a href="index.html" class="back-btn" title="回目錄">← 目錄</a>
        <h1 class="page-title">Day22 問答卡</h1>
      </div>
      <div class="header-actions">
        <button class="theme-toggle" id="themeToggleBtn" type="button" onclick="toggleTheme()" aria-label="切換為深色模式">深色模式</button>
        <div class="view-toggles">
          <button id="listViewBtn" class="toggle-btn active" onclick="switchMode('list')">📋 列表模式</button>
          <button id="cardViewBtn" class="toggle-btn" onclick="switchMode('card')">🎴 翻卡測驗</button>
        </div>
      </div>
    </div>
  </header>

  <main>
    <div class="toolbar">
      <div class="search-box">
        <span class="search-icon">🔍</span>
        <input type="text" id="searchInput" placeholder="搜尋問題或答案關鍵字..." oninput="handleSearch()">
      </div>
      <div class="action-buttons">
        <button class="btn" id="filterMasteredBtn" onclick="toggleFilterMastered()">⭐ 只看未掌握</button>
        <button class="btn" id="expandAllBtn" onclick="toggleExpandAll()">展開全部</button>
        <button class="btn" onclick="shuffleCards()">🔀 隨機洗牌</button>
        <button class="btn" onclick="resetOrder()">🔄 恢復順序</button>
      </div>
    </div>

    <div class="stats-bar">
      <span id="statsCount">總計 0 題</span>
      <div class="progress-bar-container">
        <div id="progressFill" class="progress-fill"></div>
      </div>
      <span id="statsMastered">掌握率 0%</span>
    </div>

    <!-- List View -->
    <div id="qaList" class="qa-list"></div>

    <!-- Flashcard Mode View -->
    <div id="flashcardContainer" class="flashcard-container">
      <div class="flashcard-wrapper" id="flashcardWrapper" onclick="flipCard()">
        <div class="flashcard-inner">
          <!-- Front Face -->
          <div class="flashcard-face flashcard-front">
            <div class="card-top">
              <span class="card-badge badge-q">問題</span>
              <span id="fcCardNumber">卡片 1 / 1</span>
              <button class="master-btn" id="fcMasterBtn" onclick="toggleCardMaster(event)" title="標記為已掌握">★</button>
            </div>
            <div class="card-body" id="fcQuestion">載入中...</div>
            <div class="card-hint">💡 點擊卡片或按空白鍵翻面看答案</div>
          </div>
          <!-- Back Face -->
          <div class="flashcard-face flashcard-back">
            <div class="card-top">
              <span class="card-badge badge-a">解答</span>
              <span id="fcCardNumberBack">卡片 1 / 1</span>
              <button class="master-btn" id="fcMasterBtnBack" onclick="toggleCardMaster(event)" title="標記為已掌握">★</button>
            </div>
            <div class="card-body" id="fcAnswer">載入中...</div>
            <div class="card-hint">💡 再次點擊卡片翻回正面</div>
          </div>
        </div>
      </div>

      <div class="flashcard-controls">
        <button class="btn" onclick="prevCard()">← 上一題</button>
        <button class="btn btn-primary" onclick="flipCard()">翻轉卡片</button>
        <button class="btn" onclick="nextCard()">下一題 →</button>
      </div>
      <div class="shortcuts-hint">鍵盤快速鍵：[←] 上一題 · [空白鍵] 翻面 · [→] 下一題 · [M] 標記掌握</div>
    </div>
  </main>

  <script>
    const THEME_STORAGE_KEY = "qa_theme";
    const STORAGE_KEY = "anki_mastered_" + "Day22";
    const RAW_DATA = [{"id":1,"question":"在電腦運算中，哪種數據處理技術透過消除重複出現的冗餘數據複本來提高存儲利用率？","answer":"數據去重（Data deduplication）。"},{"id":2,"question":"數據去重過程中，系統會識別並存儲唯一的、連續的數據塊，這些數據塊又被稱為什麼？","answer":"數據塊（Chunks）或位元組模式（Byte patterns）。"},{"id":3,"question":"數據去重與單一實例存儲（SIS）的主要區別在於去重可以操作在什麼層級？","answer":"段（Segment）或子塊（Sub-block）層級。"},{"id":4,"question":"壓縮算法主要識別單個文件內部的冗餘，而數據去重的主要意圖是什麼？","answer":"檢查大量數據以識別相同的文件或文件中的大型片段。"},{"id":5,"question":"當數據在流動過程中即時進行雜湊計算並排除重複項的去重方式稱為什麼？","answer":"在線去重（In-line deduplication）。"},{"id":6,"question":"在線去重的一個主要缺點是由於雜湊計算量大，可能會降低什麼性能？","answer":"存儲吞吐量（Storage throughput）。"},{"id":7,"question":"數據先寫入存儲設備，隨後再由後台程序分析重複項的去重方法稱為什麼？","answer":"後處理去重（Post-process deduplication）。"},{"id":8,"question":"與在線去重相比，後處理去重的一個潛在風險是什麼？","answer":"在去重完成前，重複數據可能會暫時佔滿系統容量。"},{"id":9,"question":"發生在數據產生位置附近的數據去重技術稱為什麼？","answer":"來源去重（Source deduplication）。"},{"id":10,"question":"在來源去重中，當文件被修改時，系統會使用哪種機制來創建變更後的副本？","answer":"寫入時複製（Copy-on-write）。"},{"id":11,"question":"在 Linux 等系統中，允許多個文件信息條目共享數據且行為類似硬連結的技術稱為什麼？","answer":"引用計數鏈接（Reference-counted link，簡稱 reflink）。"},{"id":12,"question":"去重發生在數據存儲端（如 SAN/NAS 或備份庫）而非產生端的情況稱為什麼？","answer":"目標去重（Target deduplication）。"},{"id":13,"question":"為什麼雜湊標識相同不能在邏輯上 $100\\%$ 保證數據絕對相同？","answer":"根據鴿巢原理（Pigeonhole principle），不同的數據塊可能產生相同的雜湊值。"},{"id":14,"question":"哪種去重方法使用通過文件流的窗口來尋找自然發生的內部邊界？","answer":"滑動塊或內容定義切分（Content-defined chunking）。"},{"id":15,"question":"對於難以去重的加密數據，數據去重的常見障礙是什麼？","answer":"加密會消除數據中可識別的模式，使其看起來都是隨機且唯一的。"},{"id":16,"question":"什麼是交易對手信用風險（CCR）？","answer":"對手方在交易具有正價值（In-the-money）時違約的可能性。"},{"id":17,"question":"歐洲中央銀行發布的 EGAM 文件主要針對哪種風險計算方法提供評估準則？","answer":"計算對手方信用風險曝險的內部模型法（IMM）。"},{"id":18,"question":"在 IMM 模擬中，符號 $t_0$ 代表什麼含義？","answer":"模擬時間網格的第一個日期，即計算有效預期正曝險的報告日期。"},{"id":19,"question":"證券融資交易（SFTs）除了回購協議外，還包含哪些業務類型？","answer":"保證金貸款/借貸以及證券/大宗商品借貸。"},{"id":20,"question":"在 CCR 監管中，標竿系統（Benchmarking systems）的值通常是指經過哪項程序後的值？","answer":"獨立價格驗證（Independent price verification）。"},{"id":21,"question":"若某模型實施在幾乎所有情況下都導致過低的曝險值，這被稱為什麼？","answer":"系統性低估曝險（Systematically underestimated exposures）。"},{"id":22,"question":"「定價模型」與「定價函數」的區別在於定價函數考慮了具體的什麼？","answer":"實施細節，包含輸入數據、參數化和具體的數值方法。"},{"id":23,"question":"在對手方違約後，機構停止支付現金流之前所採取的所有法律和營運行動稱為什麼？","answer":"違約管理程序（DMP）。"},{"id":24,"question":"根據 EGAM，IMM 初始核准時應涵蓋至少多少比例的風險加權資產（RWA）？","answer":"$50\\%$。"},{"id":25,"question":"根據 EGAM 的要求，回測（Back-testing）的最低執行頻率是多少？","answer":"每年至少一次。"},{"id":26,"question":"在 IMM 校準中，哪種校準方法利用時間序列分析來處理隨機風險因子？","answer":"歷史校準（Historical calibration）。"},{"id":27,"question":"在保證金交易建模中，MPOR 的全稱及其含義是什麼？","answer":"保證金風險期間（Margin period of risk），指違約到風險被對沖或清算的時間段。"},{"id":28,"question":"保證金餘額中的 MTA 縮寫代表什麼？","answer":"最低轉帳金額（Minimum transfer amount）。"},{"id":29,"question":"錯誤方向風險（Wrong-way risk）在監管上通常被分為哪兩大類？","answer":"特定錯誤方向風險（SWWR）和一般錯誤方向風險（GWWR）。"},{"id":30,"question":"在模型驗證中，為什麼需要在市場價值層級進行回測？","answer":"它可以揭示可能被曝險層級地板價（Flooring）遮掩的模型價格預測缺陷。"},{"id":31,"question":"對於專家設置參數（Expert-set parameters），除了回測外還需進行什麼檢查？","answer":"合理性檢查和敏感度分析。"},{"id":32,"question":"機構若要修改 IMM 的序列實施計劃，必須證明發生了什麼樣的重大變化？","answer":"策略變動、合併或收購等商業環境的重大變化。"},{"id":33,"question":"機構在實施 IMM 時應優先處理哪類交易？","answer":"與核心業務相關的交易類型。"},{"id":34,"question":"為了保證驗證職能的獨立性，驗證人員的薪酬不應與什麼掛鉤？","answer":"模型開發相關任務的績效。"},{"id":35,"question":"模型文檔的詳細程度必須達到什麼標準才算具備可審計性？","answer":"第三方應能夠理解其設計推理並複製計算出的風險衡量值。"},{"id":36,"question":"如果機構將模型開發外包給第三方，這是否免除了其遵守 CRR 監管的責任？","answer":"否，外包不免除合規責任。"},{"id":37,"question":"當機構暫時不符合 IMM 要求時，必須向監管機構提交什麼樣的計劃？","answer":"恢復及時合規的計劃。"},{"id":38,"question":"掉期券（Swap coupons）或到期結算屬於哪一類現金流？","answer":"交易相關現金流（Trade-related cash flows）。"},{"id":39,"question":"用於支付變動保證金和初始保證金呼叫的款項稱為什麼？","answer":"保證金相關現金流（Margin-related cash flows）。"},{"id":40,"question":"為什麼雜湊衝突會威脅數據完整性？","answer":"因為系統可能會錯誤地認為兩段不同的數據是相同的，從而導致數據損壞。"},{"id":41,"question":"在代碼層面，使用 CSS 類來代表重複樣式信息屬於哪種去重形式？","answer":"代碼去重（Deduplication in computer code）。"},{"id":42,"question":"與硬連結不同，數據去重可以在文件的什麼層次上運行？","answer":"子文件或塊層次（Sub-file or block level）。"},{"id":43,"question":"數據去重如何幫助降低企業的資本支出（CapEx）？","answer":"透過減少滿足容量需求所需的存儲媒體總量。"},{"id":44,"question":"為什麼硬連結無法節省僅發生小幅變化的電子郵件數據庫空間？","answer":"因為硬連結要求整個文件必須完全相同。"},{"id":45,"question":"後處理去重技術賦予用戶延遲優化的能力，這通常針對哪類文件？","answer":"處於「活動」狀態的文件。"},{"id":46,"question":"為什麼虛擬桌面（VDI）環境非常適合使用數據去重？","answer":"因為不同虛擬機之間的系統文件高度重複。"},{"id":47,"question":"客戶端備份去重（Client backup deduplication）如何減少網絡流量？","answer":"雜湊計算在源端完成，僅發送目標設備尚未擁有的數據。"},{"id":48,"question":"主存儲系統相較於二級存儲，為什麼較少使用去重技術？","answer":"主存儲對性能下降的容忍度低，且數據重複率通常低於備份數據。"},{"id":49,"question":"單一實例存儲（SIS）通常在哪個層級消除冗餘？","answer":"整個文件或電子郵件等對象層級。"},{"id":50,"question":"雜湊函數衝突的可能性主要取決於什麼因素？","answer":"雜湊長度（Hash length）。"},{"id":51,"question":"弱雜湊（Weak hashes）在系統中的作用是什麼？","answer":"快速篩選可能重複的數據以提高性能。"},{"id":52,"question":"為什麼對數據庫進行數據去重比文件系統去重更複雜？","answer":"數據庫內部的微小變化會影響整個文件的雜湊值，需要更細粒度的塊級去重。"},{"id":53,"question":"在金融監管中，CRR 的全稱是什麼？","answer":"資本要求條例（Capital Requirements Regulation）。"},{"id":54,"question":"IMM 實施三年內，涵蓋的交易數量比例應達到多少？","answer":"大於 $70\\%$。"},{"id":55,"question":"如果 IMM 涵蓋範圍之外的 RWA 超過 $35\\%$，機構必須證明什麼？","answer":"剩餘交易因缺乏校準數據而無法建模，或非 IMM 方法已足夠保守。"},{"id":56,"question":"驗證職能必須對什麼樣的建模假設進行獨立評估？","answer":"所有關鍵建模假設（Key modelling hypotheses）。"},{"id":57,"question":"高級管理層在 IMM 管理中的職責包括批准所有的什麼？","answer":"IMM 的所有重要方面以及正式的決策結構。"},{"id":58,"question":"在 CCR 風險控制中，獨立的風險控制單元應與什麼部門分離？","answer":"負責發起、續約或交易衍生性商品的部門。"},{"id":59,"question":"為什麼在使用 IMM 之前需要進行「經驗測試」？","answer":"以證明機構在正式獲得核准前已實際使用該模型進行風險管理。"},{"id":60,"question":"在保證金餘額建模中，如果機構不進行持續模擬，則需在什麼情況下採取保守處理？","answer":"建模 MTA（最低轉帳金額）的影響時。"},{"id":61,"question":"定價模型舉例：用於確定掉期期權市值的 Black 76 模型屬於哪類？","answer":"定價模型（Pricing model）。"},{"id":62,"question":"若某模型實施始終使用期權的內含價值來近似真實價值，這是一種什麼樣的建模行為？","answer":"系統性低估曝險（因為期權價值始終大於或等於內含價值）。"},{"id":63,"question":"哪類子組合需要具有代表性的交易類型、風險因子和保證金協議特徵？","answer":"代表性子組合（Representative sub-portfolios）。"},{"id":64,"question":"針對 IMM 模型發現的補救措施必須在什麼樣的時間範圍內實施？","answer":"及時（Timely manner）。"},{"id":65,"question":"在二類公司治理結構中，管理主體的監督職能對應的是哪個部分？","answer":"監事會（Supervisory board）。"},{"id":66,"question":"為什麼加密雜湊函數在去重中常被稱為「指紋」？","answer":"因為它為特定的數據塊提供了高度唯一且固定的縮減表示。"},{"id":67,"question":"在代碼去重中，MediaWiki 的具名引用如何體現去重原則？","answer":"透過在中心引用位置定義一次信息，並在多處引用。"},{"id":68,"question":"數據去重與 LZ77 算法的根本區別是什麼？","answer":"LZ77 在單個文件內工作，而去重旨在跨大量數據識別相同文件或大型塊。"},{"id":69,"question":"數據備份中，大多數數據與前一次備份相比有何特徵？","answer":"保持不變（Unchanged）。"},{"id":70,"question":"後處理去重對「活動」文件進行延遲處理的主要目的是什麼？","answer":"避免在文件仍被頻繁讀寫時消耗雜湊計算資源。"},{"id":71,"question":"什麼樣的數據去重方法需要對特定應用程序的數據格式有深入了解？","answer":"內容感知去重（Content-aware deduplication）。"},{"id":72,"question":"在 Windows 服務器上，數據去重作為哪種角色的服務可用？","answer":"NTFS 和 ReFS 上的文件服務。"},{"id":73,"question":"為什麼雜湊衝突會引發對數據損壞的擔憂？","answer":"因為兩段不同的數據會被系統當作同一段處理，導致其中一段遺失且無法恢復。"},{"id":74,"question":"單一實例存儲（SIS）通常應用於哪些計算機軟件中？","answer":"文件系統、電子郵件服務器、數據備份軟件。"},{"id":75,"question":"去重系統中的「強雜湊（Strong hashes）」通常是指什麼？","answer":"具有極低衝突概率的算法（如 SHA-256），用作重複性的決定性因素。"},{"id":76,"question":"在雲端去重攻擊中，攻擊者如何利用雜湊值竊取他人文件？","answer":"通過猜測文件的雜湊值並嘗試下載，如果雲端已存儲該雜湊，則可能直接獲取訪問權。"},{"id":77,"question":"在 IMM 的情境下，「陽春型（Plain vanilla）」交易主要指什麼？","answer":"簡單的利率和外匯衍生性商品。"},{"id":78,"question":"ECB 期望機構在回測時，其統計組件應包含什麼樣的門檻值？","answer":"回測交通燈門檻值（Back-testing traffic lights thresholds）。"},{"id":79,"question":"在模型校準中，除了標準校準外，IMM 還需要哪種校準以應對市場極端情況？","answer":"壓力校準（Stressed calibration）。"},{"id":80,"question":"在委託第三方進行模型驗證時，機構應定期審查什麼標準？","answer":"EBA 外包安排準則中的監管條件。"}];
    let currentData = [...RAW_DATA];
    let masteredSet = new Set(JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]"));
    let currentMode = 'list';
    let filterOnlyUnmastered = false;
    let isAllExpanded = false;
    let cardIndex = 0;

    function applyTheme(theme) {
      const normalizedTheme = theme === "dark" ? "dark" : "light";
      document.documentElement.dataset.theme = normalizedTheme;

      const btn = document.getElementById("themeToggleBtn");
      if (btn) {
        const isDark = normalizedTheme === "dark";
        btn.textContent = isDark ? "淺色模式" : "深色模式";
        btn.setAttribute("aria-label", isDark ? "切換為淺色模式" : "切換為深色模式");
      }
    }

    function initializeTheme() {
      const savedTheme = localStorage.getItem(THEME_STORAGE_KEY) || "light";
      applyTheme(savedTheme);
    }

    function toggleTheme() {
      const nextTheme = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
      localStorage.setItem(THEME_STORAGE_KEY, nextTheme);
      applyTheme(nextTheme);
    }

    initializeTheme();

    function saveMastered() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(Array.from(masteredSet)));
      updateStats();
    }

    function updateStats() {
      const total = RAW_DATA.length;
      const masteredCount = RAW_DATA.filter(item => masteredSet.has(item.id)).length;
      const pct = total === 0 ? 0 : Math.round((masteredCount / total) * 100);

      document.getElementById('statsCount').textContent = `顯示 ${currentData.length} / 共 ${total} 題`;
      document.getElementById('statsMastered').textContent = `已掌握 ${masteredCount} 題 (${pct}%)`;
      document.getElementById('progressFill').style.width = pct + '%';
    }

    function renderMath() {
      if (window.renderMathInElement) {
        renderMathInElement(document.body, {
          delimiters: [
            {left: '$$', right: '$$', display: true},
            {left: '$', right: '$', display: false}
          ],
          throwOnError: false
        });
      }
    }

    function renderList() {
      const container = document.getElementById('qaList');
      if (currentData.length === 0) {
        container.innerHTML = '<div class="empty-state">沒有符合條件的問答卡片</div>';
        return;
      }

      container.innerHTML = currentData.map(item => {
        const isMastered = masteredSet.has(item.id);
        return `
          <div class="qa-card ${isMastered ? 'mastered' : ''} ${isAllExpanded ? 'open' : ''}" id="card-${item.id}">
            <div class="qa-header" onclick="toggleItem(${item.id})">
              <span class="qa-id">#${item.id}</span>
              <span class="qa-question">${escapeHtml(item.question)}</span>
              <div class="qa-actions">
                <button class="master-btn ${isMastered ? 'is-mastered' : ''}"
                        onclick="toggleMaster(event, ${item.id})"
                        title="${isMastered ? '已掌握' : '標記掌握'}">★</button>
                <span class="expand-icon">▼</span>
              </div>
            </div>
            <div class="qa-answer">${escapeHtml(item.answer)}</div>
          </div>
        `;
      }).join('');

      renderMath();
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    function toggleItem(id) {
      const el = document.getElementById('card-' + id);
      if (el) {
        el.classList.toggle('open');
      }
    }

    function toggleMaster(event, id) {
      event.stopPropagation();
      if (masteredSet.has(id)) {
        masteredSet.delete(id);
      } else {
        masteredSet.add(id);
      }
      saveMastered();
      applyFilters();
    }

    function toggleExpandAll() {
      isAllExpanded = !isAllExpanded;
      document.getElementById('expandAllBtn').textContent = isAllExpanded ? "收合全部" : "展開全部";
      document.querySelectorAll('.qa-card').forEach(card => {
        if (isAllExpanded) {
          card.classList.add('open');
        } else {
          card.classList.remove('open');
        }
      });
    }

    function toggleFilterMastered() {
      filterOnlyUnmastered = !filterOnlyUnmastered;
      const btn = document.getElementById('filterMasteredBtn');
      btn.classList.toggle('active-filter', filterOnlyUnmastered);
      btn.textContent = filterOnlyUnmastered ? "✓ 僅顯示未掌握" : "⭐ 只看未掌握";
      applyFilters();
    }

    function handleSearch() {
      applyFilters();
    }

    function applyFilters() {
      const query = document.getElementById('searchInput').value.trim().toLowerCase();
      currentData = RAW_DATA.filter(item => {
        if (filterOnlyUnmastered && masteredSet.has(item.id)) {
          return false;
        }
        if (query) {
          const matchQ = item.question.toLowerCase().includes(query);
          const matchA = item.answer.toLowerCase().includes(query);
          return matchQ || matchA;
        }
        return true;
      });

      cardIndex = 0;
      if (currentMode === 'list') {
        renderList();
      } else {
        updateCardView();
      }
      updateStats();
    }

    function shuffleCards() {
      currentData.sort(() => Math.random() - 0.5);
      cardIndex = 0;
      if (currentMode === 'list') {
        renderList();
      } else {
        updateCardView();
      }
    }

    function resetOrder() {
      currentData.sort((a, b) => a.id - b.id);
      cardIndex = 0;
      if (currentMode === 'list') {
        renderList();
      } else {
        updateCardView();
      }
    }

    function switchMode(mode) {
      currentMode = mode;
      const listBtn = document.getElementById('listViewBtn');
      const cardBtn = document.getElementById('cardViewBtn');
      const qaList = document.getElementById('qaList');
      const flashcardContainer = document.getElementById('flashcardContainer');
      const expandAllBtn = document.getElementById('expandAllBtn');

      if (mode === 'list') {
        listBtn.classList.add('active');
        cardBtn.classList.remove('active');
        qaList.style.display = 'flex';
        flashcardContainer.style.display = 'none';
        expandAllBtn.style.display = 'inline-flex';
        renderList();
      } else {
        cardBtn.classList.add('active');
        listBtn.classList.remove('active');
        qaList.style.display = 'none';
        flashcardContainer.style.display = 'flex';
        expandAllBtn.style.display = 'none';
        updateCardView();
      }
    }

    /* Flashcard Functions */
    function flipCard() {
      const wrapper = document.getElementById('flashcardWrapper');
      wrapper.classList.toggle('flipped');
    }

    function updateCardView() {
      const wrapper = document.getElementById('flashcardWrapper');
      wrapper.classList.remove('flipped');

      if (currentData.length === 0) {
        document.getElementById('fcQuestion').textContent = '無卡片資料';
        document.getElementById('fcAnswer').textContent = '無卡片資料';
        document.getElementById('fcCardNumber').textContent = '0 / 0';
        document.getElementById('fcCardNumberBack').textContent = '0 / 0';
        return;
      }

      if (cardIndex < 0) cardIndex = 0;
      if (cardIndex >= currentData.length) cardIndex = currentData.length - 1;

      const item = currentData[cardIndex];
      const isMastered = masteredSet.has(item.id);

      document.getElementById('fcQuestion').textContent = item.question;
      document.getElementById('fcAnswer').textContent = item.answer;

      const cardNumText = `卡片 ${cardIndex + 1} / ${currentData.length} (#${item.id})`;
      document.getElementById('fcCardNumber').textContent = cardNumText;
      document.getElementById('fcCardNumberBack').textContent = cardNumText;

      const btn1 = document.getElementById('fcMasterBtn');
      const btn2 = document.getElementById('fcMasterBtnBack');
      btn1.classList.toggle('is-mastered', isMastered);
      btn2.classList.toggle('is-mastered', isMastered);

      renderMath();
    }

    function prevCard() {
      if (currentData.length === 0) return;
      cardIndex = (cardIndex - 1 + currentData.length) % currentData.length;
      updateCardView();
    }

    function nextCard() {
      if (currentData.length === 0) return;
      cardIndex = (cardIndex + 1) % currentData.length;
      updateCardView();
    }

    function toggleCardMaster(event) {
      event.stopPropagation();
      if (currentData.length === 0) return;
      const item = currentData[cardIndex];
      toggleMaster(event, item.id);
      updateCardView();
    }

    /* Keyboard Shortcuts */
    window.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT') return;
      if (currentMode === 'card') {
        if (e.code === 'Space') {
          e.preventDefault();
          flipCard();
        } else if (e.code === 'ArrowLeft') {
          e.preventDefault();
          prevCard();
        } else if (e.code === 'ArrowRight') {
          e.preventDefault();
          nextCard();
        } else if (e.code === 'KeyM') {
          e.preventDefault();
          toggleCardMaster(e);
        }
      }
    });

    // Init
    window.addEventListener('DOMContentLoaded', () => {
      updateStats();
      renderList();
      setTimeout(renderMath, 200);
    });
  </script>
</body>
</html>
