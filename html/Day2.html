<!DOCTYPE html>
<html lang="zh-TW" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Day2 - 問答複習卡</title>
  <!-- KaTeX for LaTeX rendering -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
  <style>
    :root {
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --primary-light: #eff6ff;
      --border-color: #e2e8f0;
      --success: #10b981;
      --success-light: #ecfdf5;
      --accent: #f59e0b;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
      --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.08), 0 2px 4px -2px rgba(0,0,0,0.05);
      --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.1), 0 4px 6px -4px rgba(0,0,0,0.05);
      --radius: 12px;
    }

    html[data-theme="dark"] {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #60a5fa;
      --primary-hover: #3b82f6;
      --primary-light: #1e3a8a33;
      --border-color: #334155;
      --success: #34d399;
      --success-light: #064e3b33;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans TC", sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      line-height: 1.6;
      padding-bottom: 60px;
    }

    /* Navigation / Header */
    header {
      background: var(--card-bg);
      border-bottom: 1px solid var(--border-color);
      position: sticky;
      top: 0;
      z-index: 50;
      box-shadow: var(--shadow-sm);
    }

    .header-container {
      max-width: 900px;
      margin: 0 auto;
      padding: 14px 20px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .nav-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 8px;
      background: var(--primary-light);
      color: var(--primary);
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      transition: all 0.2s;
    }

    .back-btn:hover {
      background: var(--primary);
      color: #fff;
    }

    .page-title {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .view-toggles {
      display: flex;
      background: var(--bg-color);
      padding: 3px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
    }

    .header-actions {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: flex-end;
    }

    .toggle-btn {
      padding: 6px 14px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .toggle-btn.active {
      background: var(--card-bg);
      color: var(--primary);
      box-shadow: var(--shadow-sm);
    }

    .theme-toggle {
      padding: 7px 12px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      background: var(--card-bg);
      color: var(--text-main);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: var(--shadow-sm);
      transition: border-color 0.2s, color 0.2s, background 0.2s;
    }

    .theme-toggle:hover {
      border-color: var(--primary);
      color: var(--primary);
    }

    /* Main Container */
    main {
      max-width: 900px;
      margin: 24px auto;
      padding: 0 20px;
    }

    /* Toolbar */
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 20px;
      align-items: center;
      justify-content: space-between;
    }

    .search-box {
      flex: 1;
      min-width: 240px;
      position: relative;
    }

    .search-box input {
      width: 100%;
      padding: 10px 14px 10px 38px;
      border-radius: 10px;
      border: 1px solid var(--border-color);
      background: var(--card-bg);
      color: var(--text-main);
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-box input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-light);
    }

    .search-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 14px;
    }

    .action-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background: var(--card-bg);
      color: var(--text-main);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn:hover {
      background: var(--border-color);
    }

    .btn.active-filter {
      background: var(--primary-light);
      border-color: var(--primary);
      color: var(--primary);
    }

    /* Stats bar */
    .stats-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      font-size: 14px;
      color: var(--text-muted);
    }

    .progress-bar-container {
      flex: 1;
      height: 8px;
      background: var(--border-color);
      border-radius: 99px;
      margin: 0 16px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: var(--success);
      width: 0%;
      transition: width 0.3s ease;
    }

    /* List View Cards */
    .qa-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .qa-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      box-shadow: var(--shadow-sm);
      overflow: hidden;
      transition: box-shadow 0.2s, border-color 0.2s;
    }

    .qa-card:hover {
      box-shadow: var(--shadow-md);
      border-color: #cbd5e1;
    }

    .qa-card.mastered {
      border-left: 4px solid var(--success);
    }

    .qa-header {
      padding: 16px 20px;
      display: flex;
      align-items: flex-start;
      gap: 12px;
      cursor: pointer;
      user-select: none;
    }

    .qa-id {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 28px;
      height: 28px;
      background: var(--primary-light);
      color: var(--primary);
      border-radius: 6px;
      font-size: 13px;
      font-weight: 700;
      margin-top: 2px;
      flex-shrink: 0;
    }

    .qa-question {
      flex: 1;
      font-size: 15px;
      font-weight: 600;
      color: var(--text-main);
      padding-top: 2px;
    }

    .qa-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .master-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 18px;
      padding: 4px;
      border-radius: 6px;
      transition: transform 0.15s, color 0.15s;
    }

    .master-btn:hover {
      transform: scale(1.15);
    }

    .master-btn.is-mastered {
      color: var(--accent);
    }

    .expand-icon {
      color: var(--text-muted);
      font-size: 14px;
      transition: transform 0.2s ease;
    }

    .qa-card.open .expand-icon {
      transform: rotate(180deg);
    }

    .qa-answer {
      display: none;
      padding: 16px 20px 18px 60px;
      background: var(--bg-color);
      border-top: 1px dashed var(--border-color);
      font-size: 15px;
      color: var(--text-main);
      line-height: 1.7;
    }

    .qa-card.open .qa-answer {
      display: block;
      animation: fadeIn 0.2s ease-in;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Flashcard Mode */
    .flashcard-container {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      padding: 10px 0;
    }

    .flashcard-wrapper {
      perspective: 1000px;
      width: 100%;
      max-width: 640px;
      min-height: 340px;
      cursor: pointer;
    }

    .flashcard-inner {
      position: relative;
      width: 100%;
      height: 100%;
      min-height: 340px;
      text-align: center;
      transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
      transform-style: preserve-3d;
      border-radius: 16px;
      box-shadow: var(--shadow-lg);
    }

    .flashcard-wrapper.flipped .flashcard-inner {
      transform: rotateY(180deg);
    }

    .flashcard-face {
      position: absolute;
      width: 100%;
      height: 100%;
      min-height: 340px;
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 30px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      box-sizing: border-box;
    }

    .flashcard-back {
      transform: rotateY(180deg);
      background: var(--card-bg);
      border: 2px solid var(--primary);
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      color: var(--text-muted);
    }

    .card-badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 99px;
      font-weight: 600;
      font-size: 12px;
    }

    .badge-q {
      background: var(--primary-light);
      color: var(--primary);
    }

    .badge-a {
      background: var(--success-light);
      color: var(--success);
    }

    .card-body {
      margin: auto 0;
      padding: 20px 10px;
      font-size: 18px;
      font-weight: 600;
      line-height: 1.6;
    }

    .card-hint {
      font-size: 12px;
      color: var(--text-muted);
    }

    .flashcard-controls {
      display: flex;
      gap: 12px;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 640px;
    }

    .flashcard-controls .btn {
      padding: 10px 20px;
      font-size: 14px;
      font-weight: 600;
    }

    .btn-primary {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    .btn-primary:hover {
      background: var(--primary-hover);
    }

    .shortcuts-hint {
      font-size: 12px;
      color: var(--text-muted);
      text-align: center;
      margin-top: 8px;
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
      background: var(--card-bg);
      border-radius: var(--radius);
      border: 1px dashed var(--border-color);
    }
  </style>
</head>
<body>
  <header>
    <div class="header-container">
      <div class="nav-left">
        <a href="index.html" class="back-btn" title="回目錄">← 目錄</a>
        <h1 class="page-title">Day2 問答卡</h1>
      </div>
      <div class="header-actions">
        <button class="theme-toggle" id="themeToggleBtn" type="button" onclick="toggleTheme()" aria-label="切換為深色模式">深色模式</button>
        <div class="view-toggles">
          <button id="listViewBtn" class="toggle-btn active" onclick="switchMode('list')">📋 列表模式</button>
          <button id="cardViewBtn" class="toggle-btn" onclick="switchMode('card')">🎴 翻卡測驗</button>
        </div>
      </div>
    </div>
  </header>

  <main>
    <div class="toolbar">
      <div class="search-box">
        <span class="search-icon">🔍</span>
        <input type="text" id="searchInput" placeholder="搜尋問題或答案關鍵字..." oninput="handleSearch()">
      </div>
      <div class="action-buttons">
        <button class="btn" id="filterMasteredBtn" onclick="toggleFilterMastered()">⭐ 只看未掌握</button>
        <button class="btn" id="expandAllBtn" onclick="toggleExpandAll()">展開全部</button>
        <button class="btn" onclick="shuffleCards()">🔀 隨機洗牌</button>
        <button class="btn" onclick="resetOrder()">🔄 恢復順序</button>
      </div>
    </div>

    <div class="stats-bar">
      <span id="statsCount">總計 0 題</span>
      <div class="progress-bar-container">
        <div id="progressFill" class="progress-fill"></div>
      </div>
      <span id="statsMastered">掌握率 0%</span>
    </div>

    <!-- List View -->
    <div id="qaList" class="qa-list"></div>

    <!-- Flashcard Mode View -->
    <div id="flashcardContainer" class="flashcard-container">
      <div class="flashcard-wrapper" id="flashcardWrapper" onclick="flipCard()">
        <div class="flashcard-inner">
          <!-- Front Face -->
          <div class="flashcard-face flashcard-front">
            <div class="card-top">
              <span class="card-badge badge-q">問題</span>
              <span id="fcCardNumber">卡片 1 / 1</span>
              <button class="master-btn" id="fcMasterBtn" onclick="toggleCardMaster(event)" title="標記為已掌握">★</button>
            </div>
            <div class="card-body" id="fcQuestion">載入中...</div>
            <div class="card-hint">💡 點擊卡片或按空白鍵翻面看答案</div>
          </div>
          <!-- Back Face -->
          <div class="flashcard-face flashcard-back">
            <div class="card-top">
              <span class="card-badge badge-a">解答</span>
              <span id="fcCardNumberBack">卡片 1 / 1</span>
              <button class="master-btn" id="fcMasterBtnBack" onclick="toggleCardMaster(event)" title="標記為已掌握">★</button>
            </div>
            <div class="card-body" id="fcAnswer">載入中...</div>
            <div class="card-hint">💡 再次點擊卡片翻回正面</div>
          </div>
        </div>
      </div>

      <div class="flashcard-controls">
        <button class="btn" onclick="prevCard()">← 上一題</button>
        <button class="btn btn-primary" onclick="flipCard()">翻轉卡片</button>
        <button class="btn" onclick="nextCard()">下一題 →</button>
      </div>
      <div class="shortcuts-hint">鍵盤快速鍵：[←] 上一題 · [空白鍵] 翻面 · [→] 下一題 · [M] 標記掌握</div>
    </div>
  </main>

  <script>
    const THEME_STORAGE_KEY = "qa_theme";
    const STORAGE_KEY = "anki_mastered_" + "Day2";
    const RAW_DATA = [{"id":1,"question":"根據 Federal Reserve 的 SR 11-7，模型（Model）的定義為何？","answer":"模型是應用統計、經濟、金融或數學理論、技術與假設，將輸入數據處理為定量估計的定量方法、系統或途徑。"},{"id":2,"question":"SR 11-7 框架在應用於 AI 時，關於「不透明性（Opacity）」的主要挑戰為何？","answer":"許多機器學習模型使用無法完全檢查的專有演算法（如神經網絡），導致傳統的數學結構驗證方法失效。"},{"id":3,"question":"機器學習模型中，「概念漂移（Concept drift）」是指什麼現象？","answer":"是指機器學習模型會隨著現實世界數據分佈與訓練數據的偏離，而發生性能靜默下降的現象。"},{"id":4,"question":"為何大型語言模型（LLM）的輸出具有「非確定性（Non-deterministic）」？","answer":"因為相同的提示語（Prompt）在連續執行時可能會產生不同的答案。"},{"id":5,"question":"在 AI 模型風險管理（MRM）中，SR 11-7 對於「重大性（Materiality）」的概念在 AI 環境下有何轉變？","answer":"從原本針對單一重大決策（如信貸限額）的校準，轉向同時影響數千個微觀決策的模型校準。"},{"id":6,"question":"建立 AI 模型清單時，除了模型名稱和所有者外，還必須記錄哪一項關鍵數據來源資訊？","answer":"必須記錄數據輸入和訓練數據的來源（Provenance）。"},{"id":7,"question":"金融機構 AI 模型分類框架中，「第一層級（Tier 1, High）」的分類標準為何？","answer":"直接影響信貸決策、洗錢防制警示、資本計算或監管報告，且具備重大財務影響或面向消費者的不利行動。"},{"id":8,"question":"金融機構 AI 模型分類框架中，「第二層級（Tier 2, Medium）」通常指何種用途？","answer":"輔助而非最終決策的模型、內部分析，且具備中等程度的財務影響。"},{"id":9,"question":"金融機構 AI 模型分類框架中，「第三層級（Tier 3, Low）」的治理方式為何？","answer":"較輕的治理，包括記錄使用案例、基本測試和年度審查。"},{"id":10,"question":"什麼技術被用於識別驅動機器學習模型個別輸出的輸入特徵（即解釋性分析）？","answer":"SHAP (SHapley Additive exPlanations) 或 LIME (Local Interpretable Model-agnostic Explanations)。"},{"id":11,"question":"根據 CFPB 2023 年指南，對於信貸否決模型，銀行不能使用什麼理由作為「不利行動」的解釋？","answer":"不能僅使用「模型說不（The model said no）」作為理由，必須傳達驅動決策的特定因素。"},{"id":12,"question":"AI 模型驗證中的「對抗性測試（Adversarial testing）」目的是什麼？","answer":"使用邊緣案例和分佈外（Out-of-distribution）輸入進行壓力測試，以識別標準性能指標遺漏的失效模式。"},{"id":13,"question":"針對生成式 AI（GenAI）的「紅隊測試（Red-teaming）」主要探測哪些漏洞？","answer":"幻覺（Hallucination）、提示詞注入漏洞（Prompt injection）以及違反監管要求的輸出。"},{"id":14,"question":"對於第三方 AI 供應商的模型，若供應商拒絕共享源代碼，機構應至少獲取何種程度的資訊？","answer":"獲取足夠的技術文件，以理解模型架構、訓練數據特徵、關鍵假設和已知局限性。"},{"id":15,"question":"在 2021 年跨機構聲明中，監管機構對第三方模型風險管理的立場為何？","answer":"銀行最終仍需負責遵守 BSA/AML 要求，即使使用的是第三方模型。"},{"id":16,"question":"持續監控程式中，「特徵漂移（Feature drift）」監控的對象為何？","answer":"監控輸入數據的分佈情況。"},{"id":17,"question":"持續監控程式中，「預測漂移（Prediction drift）」監控的對象為何？","answer":"監控模型輸出的分佈情況。"},{"id":18,"question":"AI MRM 三道防線模型中，第二道防線（風險/驗證）需要具備哪些專業技能？","answer":"除了傳統統計專業知識外，還需要數據科學和機器學習技能。"},{"id":19,"question":"歐盟 AI 法案（Regulation 2024/1689）針對高風險 AI 系統的主要合規截止日期為何？","answer":"2026 年 8 月 2 日（部分附件條款可能延長至 2027 年）。"},{"id":20,"question":"歐盟 AI 法案附件三（Annex III）將哪些金融用途歸類為「高風險」？","answer":"信貸評分（Creditworthiness assessment）與保險風險評估及定價。"},{"id":21,"question":"哪一類 AI 用途在金融服務中被明確排除在歐盟 AI 法案「高風險」之外？","answer":"專門用於金融欺詐檢測（Fraud detection）與洗錢防制（AML）的系統。"},{"id":22,"question":"歐盟 AI 法案對「高風險」AI 系統的「人類監督（Human oversight）」要求為何？","answer":"必須確保人類能夠介入或撤銷（Override）AI 的決策。"},{"id":23,"question":"NIST AI RMF 1.0 治理框架中的四個核心功能為何？","answer":"治理（GOVERN）、映射（MAP）、測量（MEASURE）、管理（MANAGE）。"},{"id":24,"question":"NIST AI RMF 中的哪一項功能有助於解決 SR 11-7 缺少的「數據來源」與「依賴關係」框架？","answer":"映射（MAP）功能。"},{"id":25,"question":"根據歐盟 AI 法案第 99 條，違反高風險 AI 系統規定的最高罰款為何？","answer":"最高 3,000 萬歐元或全球年度營業額的 $6\\%$，以較高者為準。"},{"id":26,"question":"何謂「AI 供應商（Provider）」與「AI 部署者（Deployer）」？","answer":"供應商是開發並投放 AI 系統者；部署者是在其授權下使用 AI 系統的實體（如銀行）。"},{"id":27,"question":"歐盟 AI 法案第 12 條對於高風險 AI 系統的日誌記錄（Logging）要求為何？","answer":"必須允許自動記錄系統生命週期內的事件，以識別風險狀況並促進市場後監測。"},{"id":28,"question":"金融機構中，AI 模型風險管理與 DORA（數位營運韌性法案）的重疊點在哪裡？","answer":"兩者均要求記錄風險識別、控制設計、持續監控以及第三方 ICT 風險管理。"},{"id":29,"question":"研究顯示，LLM 在處理混合表格與文字的財務文件問答時，主要的錯誤類別為何？","answer":"提取錯誤（Incorrect Extraction），包括遺漏證據或提取錯誤數值。"},{"id":30,"question":"在金融風險建模中，VaR 代表什麼？","answer":"風險價值（Value at Risk），代表特定概率下在一定期間內的最大可能損失。"},{"id":31,"question":"計算 VaR 的公式中，$Z_{\\alpha}$ 代表什麼？","answer":"特定置信水平（Confidence level）下的標準正態分佈臨界值。"},{"id":32,"question":"在因素模型（Factor Model）中，總變異數（Total Variance）是由哪兩部分組成的？","answer":"系統性風險（Systemic Risk）與特有風險（Idiosyncratic Risk）。"},{"id":33,"question":"如何使用 Python 計算投資組合的歷史風險（Variance）？","answer":"使用權重向量 $W$、回報率的協方差矩陣 $COV$ 與權重轉置 $W^{T}$ 進行矩陣相乘：$W \\cdot COV \\cdot W^{T}$。"},{"id":34,"question":"對於生成式 AI 模型的驗證，為什麼「單點準確性」指標不再足夠？","answer":"因為 GenAI 的輸出具有隨機性，需要轉向分佈式和行為測試。"},{"id":35,"question":"SR 11-7 的三大支柱（Pillars）為何？","answer":"1. 開發、實施與使用；2. 模型驗證；3. 治理、政策與控制。"},{"id":36,"question":"在 AI 背景下，「有效挑戰（Effective challenge）」的含義為何？","answer":"由具備能力且獨立的各方對模型的設計、假設和性能進行批判性審查。"},{"id":37,"question":"歐盟 AI 法案第 5 條禁止的 AI 實踐有哪些？","answer":"包括社會評分（Social scoring）、潛意識操控及（有窄微例外的）公共空間實時生物識別。"},{"id":38,"question":"針對信貸評分的 AI 部署， Article 12 的日誌必須保留多久？","answer":"除非其他聯盟或國家法律有更長要求，否則至少保留 6 個月。"},{"id":39,"question":"為什麼應用層控制的審計日誌（Audit logs）在合規性檢查中可能失敗？","answer":"因為日誌可能被應用程序選擇性寫入、修改或在崩潰時遺失，缺乏可追溯性。"},{"id":40,"question":"模型風險管理中，「回溯測試（Backtesting）」的作用為何？","answer":"將模型的預測結果與實際觀測到的結果進行對比，以評估模型的預測能力。"},{"id":41,"question":"生成式 AI 模型中的「幻覺（Hallucination）」定義為何？","answer":"模型產生出聽起來合理但事實上不正確或與提供上下文無關的資訊。"},{"id":42,"question":"在處理第三方 AI 模型時，若發生重大模型變更（如重新訓練），機構應如何應對？","answer":"合同應約定供應商必須提前通知，並允許機構在更新上線前進行重新驗證。"},{"id":43,"question":"根據 PRA SS1/23，金融機構應多久向董事會報告一次模型風險？","answer":"至少每年一次。"},{"id":44,"question":"AI 系統在信貸決策中如果出現「自動化偏見（Automation bias）」，這意味著什麼？","answer":"人類監督者過度依賴 AI 輸出而忽視其錯誤或局限性的傾向。"},{"id":45,"question":"歐盟 AI 法案中的「一般用途 AI 模型（GPAI）」與「高風險 AI 系統」有何區別？","answer":"GPAI 是指具有廣泛用途的基礎模型（如 GPT-4）；高風險系統是基於特定用途（如信貸）定義的系統。"},{"id":46,"question":"針對金融數據問答的 EEDP 提示技術是指什麼？","answer":"一種專為半結構化文檔量身定制的改進型提示方法，旨在提高模型提取數據的準確性。"},{"id":47,"question":"什麼情況下「重新訓練」AI 模型會被視為「重大變更（Substantial modification）」？","answer":"當重新訓練導致模型的風險分類改變或影響其對原定義合規要求的符合性時。"},{"id":48,"question":"在 Python 中計算 VaR 時，`norm.ppf(0.01)` 的作用為何？","answer":"計算標準正態分佈下對應 $1\\%$ 累積分佈的百分位點（用於 $99\\%$ 置信水平的 VaR）。"},{"id":49,"question":"什麼是「基本權利影響評估（FRIA）」？","answer":"歐盟 AI 法案要求特定實體在部署高風險 AI 之前，評估該系統對自然人基本權利的潛在影響。"},{"id":50,"question":"金融機構如何證明其 AI 訓練數據集是「無偏見的」？","answer":"通過跨受保護類別（Protected classes）測試模型輸出，確保沒有差別影響（Disparate impact）。"},{"id":51,"question":"機器學習模型的「黑盒測試」與「白盒測試」有何區別？","answer":"黑盒測試關注輸入與輸出關係；白盒測試則涉及檢查模型內部的數學結構與代碼。"},{"id":52,"question":"為什麼第三方 AI 供應商應提供「使用說明書」？","answer":"以確保部署者（如銀行）能按預期用途操作、了解局限性並實施正確的人類監督。"},{"id":53,"question":"在 VaR 計算中，`math.sqrt(numMonths)` 的目的是什麼？","answer":"根據「平方根時間法則」，將單期波動率擴展到多個期間（如將月度 VaR 擴展至年度）。"},{"id":54,"question":"哪一個監管文件明確將 SR 11-7 的義務擴展到 BSA/AML 合規中使用的 AI 模型？","answer":"2021 年 4 月的跨機構聲明（Interagency Statement）。"},{"id":55,"question":"AI 模型風險管理中的「三線防線」中，第三線（內部審計）的角色為何？","answer":"評估 AI 特定控制的充分性，測試監控閾值是否適當，並審計機器學習管道。"},{"id":56,"question":"歐盟 AI 法案中的「合規評估（Conformity assessment）」何時需要第三方機構參與？","answer":"對於金融服務的高風險用途（如信貸評分），目前允許進行內部自我評估，無需第三方機構。"},{"id":57,"question":"金融機構 AI 模型庫（Inventory）為什麼容易發生「蔓延（Sprawl）」？","answer":"因為 AI 模型常嵌入在第三方軟體中，或由業務部門在 IT 職能之外自行構建。"},{"id":58,"question":"在因素模型中，`ResidualVol`（殘餘波動率）代表什麼風險？","answer":"特有風險（Idiosyncratic Risk），即無法由市場因素解釋的特定資產風險。"},{"id":59,"question":"什麼是「數據溯源（Data provenance）」？","answer":"指數據從原始來源到最終用於模型訓練或推斷的完整歷史記錄與譜系。"},{"id":60,"question":"金融機構為何需要將 AI 治理納入現有的 MRM 框架而非並行？","answer":"為了維持成本效益與公信力，且監管機構希望在既有的風險學科內看到 AI 風險管理。"}];
    let currentData = [...RAW_DATA];
    let masteredSet = new Set(JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]"));
    let currentMode = 'list';
    let filterOnlyUnmastered = false;
    let isAllExpanded = false;
    let cardIndex = 0;

    function applyTheme(theme) {
      const normalizedTheme = theme === "dark" ? "dark" : "light";
      document.documentElement.dataset.theme = normalizedTheme;

      const btn = document.getElementById("themeToggleBtn");
      if (btn) {
        const isDark = normalizedTheme === "dark";
        btn.textContent = isDark ? "淺色模式" : "深色模式";
        btn.setAttribute("aria-label", isDark ? "切換為淺色模式" : "切換為深色模式");
      }
    }

    function initializeTheme() {
      const savedTheme = localStorage.getItem(THEME_STORAGE_KEY) || "light";
      applyTheme(savedTheme);
    }

    function toggleTheme() {
      const nextTheme = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
      localStorage.setItem(THEME_STORAGE_KEY, nextTheme);
      applyTheme(nextTheme);
    }

    initializeTheme();

    function saveMastered() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(Array.from(masteredSet)));
      updateStats();
    }

    function updateStats() {
      const total = RAW_DATA.length;
      const masteredCount = RAW_DATA.filter(item => masteredSet.has(item.id)).length;
      const pct = total === 0 ? 0 : Math.round((masteredCount / total) * 100);

      document.getElementById('statsCount').textContent = `顯示 ${currentData.length} / 共 ${total} 題`;
      document.getElementById('statsMastered').textContent = `已掌握 ${masteredCount} 題 (${pct}%)`;
      document.getElementById('progressFill').style.width = pct + '%';
    }

    function renderMath() {
      if (window.renderMathInElement) {
        renderMathInElement(document.body, {
          delimiters: [
            {left: '$$', right: '$$', display: true},
            {left: '$', right: '$', display: false}
          ],
          throwOnError: false
        });
      }
    }

    function renderList() {
      const container = document.getElementById('qaList');
      if (currentData.length === 0) {
        container.innerHTML = '<div class="empty-state">沒有符合條件的問答卡片</div>';
        return;
      }

      container.innerHTML = currentData.map(item => {
        const isMastered = masteredSet.has(item.id);
        return `
          <div class="qa-card ${isMastered ? 'mastered' : ''} ${isAllExpanded ? 'open' : ''}" id="card-${item.id}">
            <div class="qa-header" onclick="toggleItem(${item.id})">
              <span class="qa-id">#${item.id}</span>
              <span class="qa-question">${escapeHtml(item.question)}</span>
              <div class="qa-actions">
                <button class="master-btn ${isMastered ? 'is-mastered' : ''}"
                        onclick="toggleMaster(event, ${item.id})"
                        title="${isMastered ? '已掌握' : '標記掌握'}">★</button>
                <span class="expand-icon">▼</span>
              </div>
            </div>
            <div class="qa-answer">${escapeHtml(item.answer)}</div>
          </div>
        `;
      }).join('');

      renderMath();
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    function toggleItem(id) {
      const el = document.getElementById('card-' + id);
      if (el) {
        el.classList.toggle('open');
      }
    }

    function toggleMaster(event, id) {
      event.stopPropagation();
      if (masteredSet.has(id)) {
        masteredSet.delete(id);
      } else {
        masteredSet.add(id);
      }
      saveMastered();
      applyFilters();
    }

    function toggleExpandAll() {
      isAllExpanded = !isAllExpanded;
      document.getElementById('expandAllBtn').textContent = isAllExpanded ? "收合全部" : "展開全部";
      document.querySelectorAll('.qa-card').forEach(card => {
        if (isAllExpanded) {
          card.classList.add('open');
        } else {
          card.classList.remove('open');
        }
      });
    }

    function toggleFilterMastered() {
      filterOnlyUnmastered = !filterOnlyUnmastered;
      const btn = document.getElementById('filterMasteredBtn');
      btn.classList.toggle('active-filter', filterOnlyUnmastered);
      btn.textContent = filterOnlyUnmastered ? "✓ 僅顯示未掌握" : "⭐ 只看未掌握";
      applyFilters();
    }

    function handleSearch() {
      applyFilters();
    }

    function applyFilters() {
      const query = document.getElementById('searchInput').value.trim().toLowerCase();
      currentData = RAW_DATA.filter(item => {
        if (filterOnlyUnmastered && masteredSet.has(item.id)) {
          return false;
        }
        if (query) {
          const matchQ = item.question.toLowerCase().includes(query);
          const matchA = item.answer.toLowerCase().includes(query);
          return matchQ || matchA;
        }
        return true;
      });

      cardIndex = 0;
      if (currentMode === 'list') {
        renderList();
      } else {
        updateCardView();
      }
      updateStats();
    }

    function shuffleCards() {
      currentData.sort(() => Math.random() - 0.5);
      cardIndex = 0;
      if (currentMode === 'list') {
        renderList();
      } else {
        updateCardView();
      }
    }

    function resetOrder() {
      currentData.sort((a, b) => a.id - b.id);
      cardIndex = 0;
      if (currentMode === 'list') {
        renderList();
      } else {
        updateCardView();
      }
    }

    function switchMode(mode) {
      currentMode = mode;
      const listBtn = document.getElementById('listViewBtn');
      const cardBtn = document.getElementById('cardViewBtn');
      const qaList = document.getElementById('qaList');
      const flashcardContainer = document.getElementById('flashcardContainer');
      const expandAllBtn = document.getElementById('expandAllBtn');

      if (mode === 'list') {
        listBtn.classList.add('active');
        cardBtn.classList.remove('active');
        qaList.style.display = 'flex';
        flashcardContainer.style.display = 'none';
        expandAllBtn.style.display = 'inline-flex';
        renderList();
      } else {
        cardBtn.classList.add('active');
        listBtn.classList.remove('active');
        qaList.style.display = 'none';
        flashcardContainer.style.display = 'flex';
        expandAllBtn.style.display = 'none';
        updateCardView();
      }
    }

    /* Flashcard Functions */
    function flipCard() {
      const wrapper = document.getElementById('flashcardWrapper');
      wrapper.classList.toggle('flipped');
    }

    function updateCardView() {
      const wrapper = document.getElementById('flashcardWrapper');
      wrapper.classList.remove('flipped');

      if (currentData.length === 0) {
        document.getElementById('fcQuestion').textContent = '無卡片資料';
        document.getElementById('fcAnswer').textContent = '無卡片資料';
        document.getElementById('fcCardNumber').textContent = '0 / 0';
        document.getElementById('fcCardNumberBack').textContent = '0 / 0';
        return;
      }

      if (cardIndex < 0) cardIndex = 0;
      if (cardIndex >= currentData.length) cardIndex = currentData.length - 1;

      const item = currentData[cardIndex];
      const isMastered = masteredSet.has(item.id);

      document.getElementById('fcQuestion').textContent = item.question;
      document.getElementById('fcAnswer').textContent = item.answer;

      const cardNumText = `卡片 ${cardIndex + 1} / ${currentData.length} (#${item.id})`;
      document.getElementById('fcCardNumber').textContent = cardNumText;
      document.getElementById('fcCardNumberBack').textContent = cardNumText;

      const btn1 = document.getElementById('fcMasterBtn');
      const btn2 = document.getElementById('fcMasterBtnBack');
      btn1.classList.toggle('is-mastered', isMastered);
      btn2.classList.toggle('is-mastered', isMastered);

      renderMath();
    }

    function prevCard() {
      if (currentData.length === 0) return;
      cardIndex = (cardIndex - 1 + currentData.length) % currentData.length;
      updateCardView();
    }

    function nextCard() {
      if (currentData.length === 0) return;
      cardIndex = (cardIndex + 1) % currentData.length;
      updateCardView();
    }

    function toggleCardMaster(event) {
      event.stopPropagation();
      if (currentData.length === 0) return;
      const item = currentData[cardIndex];
      toggleMaster(event, item.id);
      updateCardView();
    }

    /* Keyboard Shortcuts */
    window.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT') return;
      if (currentMode === 'card') {
        if (e.code === 'Space') {
          e.preventDefault();
          flipCard();
        } else if (e.code === 'ArrowLeft') {
          e.preventDefault();
          prevCard();
        } else if (e.code === 'ArrowRight') {
          e.preventDefault();
          nextCard();
        } else if (e.code === 'KeyM') {
          e.preventDefault();
          toggleCardMaster(e);
        }
      }
    });

    // Init
    window.addEventListener('DOMContentLoaded', () => {
      updateStats();
      renderList();
      setTimeout(renderMath, 200);
    });
  </script>
</body>
</html>
