<!DOCTYPE html>
<html lang="zh-TW" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>30天數據思維實戰問答總目錄</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg-color: #f8fafc;
      --text-main: #0f172a;
      --text-muted: #475569;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --border-color: #cbd5e1;
      --button-text: #ffffff;
      --shadow: 0 8px 18px rgba(37, 99, 235, 0.22);
      --shadow-hover: 0 10px 22px rgba(37, 99, 235, 0.28);
    }

    html[data-theme="dark"] {
      --bg-color: #0f172a;
      --text-main: #f8fafc;
      --text-muted: #cbd5e1;
      --primary: #60a5fa;
      --primary-hover: #3b82f6;
      --border-color: #334155;
      --button-text: #0f172a;
      --shadow: 0 8px 18px rgba(96, 165, 250, 0.18);
      --shadow-hover: 0 10px 22px rgba(96, 165, 250, 0.24);
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans TC", sans-serif;
      background: var(--bg-color);
      color: var(--text-main);
      line-height: 1.6;
    }

    main {
      width: min(100%, 680px);
      text-align: center;
    }

    .top-actions {
      position: fixed;
      top: 18px;
      right: 18px;
    }

    .theme-toggle {
      padding: 7px 12px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      background: var(--bg-color);
      color: var(--text-main);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: border-color 0.2s, color 0.2s, background 0.2s;
    }

    .theme-toggle:hover {
      border-color: var(--primary);
      color: var(--primary);
    }

    .eyebrow {
      margin-bottom: 12px;
      color: var(--primary);
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0;
    }

    h1 {
      margin-bottom: 14px;
      font-size: clamp(2rem, 8vw, 3.5rem);
      line-height: 1.15;
      font-weight: 800;
    }

    p {
      margin: 0 auto 28px;
      max-width: 520px;
      color: var(--text-muted);
      font-size: 1.05rem;
    }

    a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      padding: 12px 20px;
      border-radius: 8px;
      background: var(--primary);
      color: var(--button-text);
      font-weight: 700;
      text-decoration: none;
      box-shadow: var(--shadow);
      transition: background 0.2s, transform 0.2s, box-shadow 0.2s;
    }

    a:hover {
      background: var(--primary-hover);
      transform: translateY(-1px);
      box-shadow: var(--shadow-hover);
    }

    @media (max-width: 640px) {
      body {
        padding-top: 84px;
      }

      .top-actions {
        top: 16px;
        right: 16px;
      }
    }
  </style>
</head>
<body>
  <div class="top-actions">
    <button class="theme-toggle" id="themeToggleBtn" type="button" onclick="toggleTheme()" aria-label="切換為深色模式">深色模式</button>
  </div>
  <main>
    <div class="eyebrow">互動式問答卡</div>
    <h1>❤️ 30天數據思維實戰問答總目錄</h1>
    <p>請由總目錄選擇學習單元，進入列表複習或翻卡測驗。</p>
    <a href="html/index.html">開啟問答總目錄</a>
  </main>
  <script>
    const THEME_STORAGE_KEY = "qa_theme";

    function applyTheme(theme) {
      const normalizedTheme = theme === "dark" ? "dark" : "light";
      document.documentElement.dataset.theme = normalizedTheme;

      const btn = document.getElementById("themeToggleBtn");
      if (btn) {
        const isDark = normalizedTheme === "dark";
        btn.textContent = isDark ? "淺色模式" : "深色模式";
        btn.setAttribute("aria-label", isDark ? "切換為淺色模式" : "切換為深色模式");
      }
    }

    function initializeTheme() {
      const savedTheme = localStorage.getItem(THEME_STORAGE_KEY) || "light";
      applyTheme(savedTheme);
    }

    function toggleTheme() {
      const nextTheme = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
      localStorage.setItem(THEME_STORAGE_KEY, nextTheme);
      applyTheme(nextTheme);
    }

    initializeTheme();
  </script>
</body>
</html>
